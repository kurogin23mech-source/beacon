<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon — AI-driven project monitoring tool</title>
<meta name="description" content="Beacon is an AI-driven project monitoring tool. Track milestones, tasks, and commits in real time. Designed for collaboration between humans and AI agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ================================================================
   BEACON — Terminal Noir Milestones v3
   ================================================================ */

:root {
  --bg-void: #0a0a0c;
  --bg-surface: #111114;
  --bg-raised: #18181c;
  --bg-hover: #1f1f24;
  --border: #2a2a30;
  --border-subtle: #1e1e24;
  --text-primary: #e4e4e8;
  --text-secondary: #a1a1aa;
  --text-dim: #71717a;
  --accent: #4ade80;
  --accent-dim: #166534;
  --accent-glow: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --info: #60a5fa;
  --done: #4ade80;
  --in-progress: #60a5fa;
  --observing: #a78bfa;
  --todo: #71717a;
  --waiting: #f97316;
  --cancelled: #ef4444;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
  --scanline-opacity: 0.03;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ---- Layout ---- */

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---- Header ---- */

.header {
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.header::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 120px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}

.project-name {
  font-family: var(--font-mono);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.header-tag {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.connection-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.offline {
  background: var(--cancelled);
  box-shadow: 0 0 6px var(--cancelled);
  animation: none;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---- Hamburger Menu ---- */

.hamburger-btn {
  background: none;
  border: 1px solid transparent;
  border-radius: 3px;
  cursor: pointer;
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color 0.2s;
}

.hamburger-btn:hover {
  border-color: var(--border);
}

.hamburger-btn span {
  display: block;
  width: 16px;
  height: 1.5px;
  background: var(--text-dim);
  transition: background 0.2s;
}

.hamburger-btn:hover span {
  background: var(--text-secondary);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  animation: fade-overlay 0.15s ease;
}

@keyframes fade-overlay {
  from { opacity: 0; }
  to { opacity: 1; }
}

.menu-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  max-width: 80vw;
  height: 100vh;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  z-index: 1001;
  padding: 24px;
  overflow-y: auto;
  animation: slide-in 0.2s ease;
}

@keyframes slide-in {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

.menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}

.menu-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.menu-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
}

.menu-close:hover {
  color: var(--text-primary);
}

.menu-section {
  margin-bottom: 20px;
}

.menu-section-title {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.menu-item {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 4px;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.85rem;
  text-align: left;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}

.menu-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
  color: var(--text-primary);
}

.menu-item.current {
  border-color: var(--accent-dim);
  color: var(--accent);
}

.menu-item-sub {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.menu-user {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  word-break: break-all;
}

/* ---- Project Info Block ---- */

.project-info {
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.project-info-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.project-info-label {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.project-info-value {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.project-info-item.review-due .project-info-label {
  color: var(--warning);
}

.project-info-item.review-due .project-info-value {
  color: var(--warning);
  font-weight: 500;
}

/* ---- Summary Block ---- */

.summary-block {
  padding: 20px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.summary-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.summary-text {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.7;
}

/* ---- Filter Bar ---- */

.filter-bar {
  display: flex;
  gap: 6px;
  padding: 16px 0 0;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
}

/* Active (visible) state — colored per status */
.filter-btn.on {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

.filter-btn.on.f-todo { color: var(--todo); border-color: var(--todo); background: rgba(113,113,122,0.08); }
.filter-btn.on.f-active { color: var(--in-progress); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.08); }
.filter-btn.on.f-observing { color: var(--observing); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
.filter-btn.on.f-done { color: var(--done); border-color: var(--accent-dim); background: var(--accent-glow); }

/* Off (hidden) state */
.filter-btn.off {
  color: var(--text-dim);
  opacity: 0.4;
  border-color: var(--border-subtle);
  background: transparent;
}

.filter-btn.off:hover {
  opacity: 0.7;
}

.filter-btn.f-all {
  color: var(--text-dim);
  border-color: var(--border-subtle);
}

.filter-btn.f-all:hover {
  color: var(--text-secondary);
  border-color: var(--border);
}

/* ---- Sort Toggle ---- */

.sort-toggle {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
  margin-left: auto;
}

.sort-toggle:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

/* ---- Milestone List ---- */

.milestones {
  padding: 24px 0;
}

.milestones-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}

.milestones-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.milestones-count {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ---- Milestone Card ---- */

.ms-card {
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 8px;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
}

.ms-card:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.ms-card.active {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.ms-card-header {
  padding: 12px 16px;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}

.ms-status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.ms-status-icon {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ms-status-icon.done { background: var(--done); box-shadow: 0 0 4px rgba(74, 222, 128, 0.3); }
.ms-status-icon.in_progress { background: var(--in-progress); box-shadow: 0 0 4px rgba(96, 165, 250, 0.3); animation: pulse-dot 2s ease-in-out infinite; }
.ms-status-icon.observing { background: var(--observing); box-shadow: 0 0 4px rgba(167, 139, 250, 0.3); }
.ms-status-icon.todo { background: var(--todo); }
.ms-status-icon.waiting { background: var(--waiting); }
.ms-status-icon.cancelled { background: var(--cancelled); }

.ms-status-text {
  font-size: 0.65rem;
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 500;
}

.ms-status-text.done { color: var(--done); }
.ms-status-text.in_progress { color: var(--in-progress); }
.ms-status-text.observing { color: var(--observing); }
.ms-status-text.todo { color: var(--todo); }
.ms-status-text.waiting { color: var(--waiting); }
.ms-status-text.cancelled { color: var(--cancelled); }

.ms-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.ms-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ms-title {
  font-size: 0.9rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ms-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.ms-progress-bar {
  width: 80px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.ms-progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.ms-progress-fill.done { background: var(--done); }
.ms-progress-fill.in_progress { background: var(--in-progress); }
.ms-progress-fill.observing { background: var(--observing); }
.ms-progress-fill.todo { background: var(--todo); }

.ms-progress-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ms-expand-hint {
  font-size: 0.65rem;
  color: var(--text-dim);
  transition: transform 0.2s;
}

.ms-card.expanded .ms-expand-hint {
  transform: rotate(180deg);
}

.ms-tasks-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ---- Milestone Expanded ---- */

.ms-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.ms-card.expanded .ms-body {
  max-height: 8000px;
}

.ms-entries {
  padding: 0 16px 12px;
  border-top: 1px solid var(--border-subtle);
}

.ms-entries-toolbar {
  display: flex;
  align-items: center;
  padding: 8px 0 4px;
  gap: 8px;
}

.entry-filter-btn {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 8px;
  border: 1px solid var(--border-subtle);
  border-radius: 2px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}

.entry-filter-btn:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

.entry-filter-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

.ms-description {
  padding: 8px 0 4px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-style: italic;
}

/* ---- Entry Row ---- */

.entry {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 8px;
  padding: 6px 0;
  align-items: start;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.85rem;
}

.entry:last-child { border-bottom: none; }

.entry-type-badge {
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 1px 5px;
  border-radius: 2px;
  line-height: 1.8;
  white-space: nowrap;
}

.entry-type-badge.commit {
  color: var(--accent);
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.15);
}

.entry-type-badge.task {
  color: var(--info);
  background: rgba(96, 165, 250, 0.1);
  border: 1px solid rgba(96, 165, 250, 0.15);
}

.entry-type-badge.note {
  color: var(--warning);
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.15);
}

.entry-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
}

.entry-desc {
  color: #f4f4f5;
  line-height: 1.6;
}

.entry.done .entry-desc {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--border);
}

.entry-status-text {
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-left: 4px;
}

.entry-status-text.done { color: var(--done); }
.entry-status-text.todo { color: var(--todo); }
.entry-status-text.in_progress { color: var(--in-progress); }

.entry-date {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
  white-space: nowrap;
}

.entry-hash {
  font-size: 0.7rem;
  color: var(--accent-dim);
  margin-left: 4px;
}

/* ---- Entry Toggle (collapsible children) ---- */

.entry-toggle {
  cursor: pointer;
  user-select: none;
}

.entry-toggle .entry-desc::before {
  content: '\u25BC ';
  font-size: 0.6rem;
  color: var(--text-dim);
  display: inline-block;
}

.entry-toggle.collapsed .entry-desc::before {
  content: '\u25B6 ';
}

.entry-child-count {
  font-size: 0.65rem;
  color: var(--accent);
  margin-left: 6px;
  padding: 1px 5px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 3px;
  font-weight: 500;
}

/* ---- Entry Detail ---- */

.entry-detail {
  grid-column: 3 / -1;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 0 2px;
  line-height: 1.5;
  border-left: 2px solid var(--border-subtle);
  padding-left: 10px;
  margin-top: 2px;
}

/* ---- Nested entries (under task) ---- */

.entry-children {
  grid-column: 1 / -1;
  padding-left: 18px;
}

.entry-children.hidden {
  display: none;
}

.entry-children .entry {
  border-bottom-color: transparent;
  padding: 3px 0;
}

/* ---- Tabs (Milestones / Reviews) ---- */

.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border-subtle);
}

.tab-btn {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}

.tab-btn:hover {
  color: var(--text-secondary);
}

.tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}

/* ---- Retro Viewer ---- */

.retro-section {
  padding: 24px 0;
}

.retro-list {
  list-style: none;
}

.retro-item {
  padding: 10px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.retro-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.retro-item-week {
  font-size: 0.9rem;
  color: var(--text-primary);
}

.retro-item-date {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.retro-content {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 20px;
  white-space: pre-wrap;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--text-secondary);
  max-height: 70vh;
  overflow-y: auto;
}

.retro-back {
  font-size: 0.8rem;
  color: var(--text-dim);
  cursor: pointer;
  margin-bottom: 12px;
  display: inline-block;
  transition: color 0.2s;
}

.retro-back:hover {
  color: var(--text-secondary);
}

.retro-empty {
  text-align: center;
  padding: 40px 0;
  color: var(--text-dim);
  font-size: 0.85rem;
}

/* ---- Footer ---- */

.footer {
  padding: 24px 0 40px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.footer-tagline {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-style: italic;
  letter-spacing: 0.03em;
}

.footer-right {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ---- Loading State ---- */

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  flex-direction: column;
  gap: 16px;
}

.loading-bar {
  width: 120px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.loading-bar::after {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  animation: loading-slide 1.2s ease-in-out infinite;
}

@keyframes loading-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.loading-text {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---- Error State ---- */

.error-state {
  text-align: center;
  padding: 80px 0;
  color: var(--text-dim);
  font-size: 0.9rem;
}

.error-state .error-icon {
  font-size: 1.5rem;
  margin-bottom: 12px;
  color: var(--cancelled);
}

/* ---- Fade-in animations ---- */

.fade-in {
  animation: fade-in 0.4s ease both;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }

/* ---- Project selector ---- */

.project-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 20px;
}

.project-list {
  list-style: none;
  width: 100%;
  max-width: 480px;
}

.project-item {
  padding: 12px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: var(--bg-surface);
}

.project-item:hover {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.project-item-name {
  font-size: 0.95rem;
  color: var(--text-primary);
}

.project-item-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ---- Login Screen ---- */

.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 24px;
}

.login-logo {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.login-tagline {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  font-style: italic;
  margin-top: -16px;
}

.login-divider {
  width: 60px;
  height: 1px;
  background: var(--border);
  position: relative;
}

.login-divider::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 20px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

#g_id_signin {
  margin-top: 8px;
}

.login-note {
  font-size: 0.75rem;
  color: var(--text-dim);
  max-width: 280px;
  text-align: center;
  line-height: 1.6;
}

</style>
</head>
<body>

<div class="container" id="app">
  <!-- Static content for crawlers / pre-JS state (overwritten by renderLogin) -->
  <div class="login-screen">
    <h1 class="login-logo">Beacon</h1>
    <p class="login-tagline">Where humans and AI are bound together.</p>
    <p class="login-note">Beacon is an AI-driven project monitoring tool. Track milestones, tasks, and commits in real time. Designed for collaboration between humans and AI agents.</p>
    <div class="login-divider"></div>
    <p class="login-note">Sign in with Google to view project telemetry</p>
    <p class="login-note"><a href="https://beacon-ai.dev/privacy">Privacy Policy</a></p>
  </div>
</div>

<!-- Menu overlay (rendered outside container) -->
<div id="menu-root"></div>

<script>
// ================================================================
// Beacon Milestones v3
// ================================================================

const API_BASE = window.location.origin;

let state = {
  projects: [],
  projectId: null,
  project: null,
  expanded: new Set(),
  lastUpdate: null,
  connected: false,
  error: null,
  activeTab: 'dashboard', // 'dashboard' | 'retros' | 'documents'
  retros: [],
  retroContent: null,
  documents: [],
  documentContent: null,  // { doc_id, title, content }
  // Filter: hidden statuses (empty = show all)
  hiddenStatuses: new Set(),
  // Entry done filter (per milestone)
  hideEntryDone: new Set(),
  // Collapsed nested entries
  collapsedEntries: new Set(),
  // Sort
  sortAsc: true,
  // Menu
  menuOpen: false,
  auth: {
    token: localStorage.getItem('beacon_token'),
    email: localStorage.getItem('beacon_email'),
    clientId: null,
  },
};

let ws = null;
let wsReconnectTimer = null;
let lastProjectJson = null;

// ---- Auth ----

async function loadAuthConfig() {
  try {
    const res = await fetch(`${API_BASE}/api/auth/config`);
    if (res.ok) {
      const config = await res.json();
      state.auth.clientId = config.client_id;
    }
  } catch (e) {}
}

function handleCredentialResponse(response) {
  const token = response.credential;
  const payload = JSON.parse(atob(token.split('.')[1]));
  state.auth.token = token;
  state.auth.email = payload.email || '';
  localStorage.setItem('beacon_token', token);
  localStorage.setItem('beacon_email', state.auth.email);
  init();
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-screen fade-in">
      <div class="login-logo">Beacon</div>
      <div class="login-tagline">Where humans and AI are bound together.</div>
      <div class="login-note">AI-driven project monitoring tool.<br>Track milestones, tasks, and commits in real time.</div>
      <div class="login-divider"></div>
      <div id="g_id_signin"></div>
      <div class="login-note">Sign in to view project telemetry</div>
      <div class="login-note"><a href="https://beacon-ai.dev/privacy">Privacy Policy</a></div>
    </div>
  `;
  if (state.auth.clientId && window.google?.accounts) {
    google.accounts.id.initialize({
      client_id: state.auth.clientId,
      callback: handleCredentialResponse,
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'filled_black', size: 'large', shape: 'rectangular', text: 'signin_with' }
    );
  }
}

function logout() {
  state.auth.token = null;
  state.auth.email = null;
  localStorage.removeItem('beacon_token');
  localStorage.removeItem('beacon_email');
  closeWebSocket();
  closeMenu();
  renderLogin();
}

function isAuthenticated() {
  if (!state.auth.token) return false;
  try {
    const payload = JSON.parse(atob(state.auth.token.split('.')[1]));
    return payload.exp * 1000 > Date.now();
  } catch { return false; }
}

// ---- API ----

async function api(path, opts = {}) {
  const headers = { ...opts.headers };
  if (state.auth.token) headers['Authorization'] = `Bearer ${state.auth.token}`;
  const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  if (!res.ok) {
    const text = await res.text().catch(() => res.statusText);
    let detail = text;
    try { detail = JSON.parse(text).detail || text; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

async function loadProjects() {
  try {
    state.projects = await api('/api/projects');
    state.connected = true;
    state.error = null;
  } catch (e) {
    state.connected = false;
    state.error = e.message;
  }
}

// ---- WebSocket ----

function connectWebSocket(projectId) {
  closeWebSocket();
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = window.location.host;
  const tokenParam = state.auth.token ? `?token=${encodeURIComponent(state.auth.token)}` : '';
  ws = new WebSocket(`${protocol}//${host}/ws/projects/${projectId}${tokenParam}`);

  ws.onopen = () => { state.connected = true; state.error = null; updateConnectionStatus(); };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'project') {
      const newJson = JSON.stringify(msg.data);
      if (newJson !== lastProjectJson) {
        lastProjectJson = newJson;
        state.project = msg.data;
        state.lastUpdate = new Date();
        state.connected = true;
        render();
      }
    }
  };
  ws.onclose = () => {
    state.connected = false;
    updateConnectionStatus();
    wsReconnectTimer = setTimeout(() => {
      if (state.projectId === projectId) connectWebSocket(projectId);
    }, 3000);
  };
  ws.onerror = () => { state.connected = false; updateConnectionStatus(); };

  const pingInterval = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping');
    else clearInterval(pingInterval);
  }, 30000);
}

function closeWebSocket() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
}

function updateConnectionStatus() {
  const dot = document.querySelector('.status-dot');
  const label = document.querySelector('.connection-label');
  if (dot) dot.className = `status-dot ${state.connected ? '' : 'offline'}`;
  if (label) label.textContent = state.connected ? 'live' : 'reconnecting';
}

// ---- Render Helpers ----

const STATUS_LABELS = {
  done: 'done', in_progress: 'active', observing: 'observing',
  todo: 'todo', waiting: 'waiting', cancelled: 'cancelled',
};

const FILTER_ORDER = ['todo', 'in_progress', 'observing', 'done'];
const FILTER_CSS_CLASS = { todo: 'f-todo', in_progress: 'f-active', observing: 'f-observing', done: 'f-done' };

function statusBadge(status) {
  const label = STATUS_LABELS[status] || status;
  return `<div class="ms-status-badge"><div class="ms-status-icon ${status}"></div><span class="ms-status-text ${status}">${label}</span></div>`;
}

function entryTypeBadge(type) {
  const labels = { commit: 'commit', task: 'task', note: 'note' };
  return `<span class="entry-type-badge ${type}">${labels[type] || type}</span>`;
}

function entryStatusText(entry) {
  if (entry.type === 'commit') return '';
  const label = STATUS_LABELS[entry.status] || entry.status;
  return `<span class="entry-status-text ${entry.status}">${label}</span>`;
}

let _currentMsId = null; // set during milestone card render

function renderEntry(entry) {
  if (_currentMsId && state.hideEntryDone.has(_currentMsId) && entry.status === 'done') return '';

  const statusClass = entry.status === 'done' ? ' done' : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';
  const detail = entry.detail ? `<div class="entry-detail">${esc(entry.detail)}</div>` : '';
  const statusText = entryStatusText(entry);
  const hasChildren = entry.entries?.length > 0;
  const childCount = hasChildren ? entry.entries.length : 0;
  const isCollapsed = state.collapsedEntries.has(entry.id);
  const toggleClass = hasChildren ? ` entry-toggle${isCollapsed ? ' collapsed' : ''}` : '';

  let children = '';
  if (hasChildren) {
    const hiddenClass = isCollapsed ? ' hidden' : '';
    const filteredChildren = entry.entries.map(renderEntry).join('');
    children = `<div class="entry-children${hiddenClass}">${filteredChildren}</div>`;
  }

  const childBadge = hasChildren && isCollapsed ? `<span class="entry-child-count">${childCount}</span>` : '';

  return `
    <div class="entry${statusClass}${toggleClass}" ${hasChildren ? `onclick="toggleEntry('${entry.id}', event)"` : ''}>
      ${entryTypeBadge(entry.type)}
      <span class="entry-id">${entry.id}</span>
      <span class="entry-desc">${esc(entry.description)}${hash}${statusText}${childBadge}</span>
      <span class="entry-date">${entry.created_at || ''}</span>
      ${detail}
      ${children}
    </div>
  `;
}

function esc(s) {
  if (!s) return '';
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function formatTime(date) {
  if (!date) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ---- Sort milestones by ID number ----

function msIdNum(ms) {
  const m = ms.id.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function sortMilestones(milestones) {
  return [...milestones].sort((a, b) => {
    const diff = msIdNum(a) - msIdNum(b);
    return state.sortAsc ? diff : -diff;
  });
}

// ---- Filter ----

function toggleStatusFilter(status) {
  if (state.hiddenStatuses.has(status)) {
    state.hiddenStatuses.delete(status);
  } else {
    state.hiddenStatuses.add(status);
  }
  render();
}

function showAllStatuses() {
  state.hiddenStatuses.clear();
  render();
}

function filterMilestones(milestones) {
  if (state.hiddenStatuses.size === 0) return milestones;
  return milestones.filter(ms => !state.hiddenStatuses.has(ms.status));
}

// ---- Next retro date ----

function nextRetroDate(retroDay) {
  const days = { monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, sunday: 0 };
  const target = days[(retroDay || 'friday').toLowerCase()];
  if (target === undefined) return null;
  const now = new Date();
  const current = now.getDay();
  if (current === target) return { date: now.toISOString().slice(0, 10), isToday: true };
  let diff = target - current;
  if (diff <= 0) diff += 7;
  const next = new Date(now);
  next.setDate(now.getDate() + diff);
  return { date: next.toISOString().slice(0, 10), isToday: false };
}

// ---- Render ----

function render() {
  const app = document.getElementById('app');

  if (state.error && !state.project) {
    app.innerHTML = `<div class="error-state"><div class="error-icon">\u26a0</div><div>${esc(state.error)}</div></div>`;
    return;
  }

  if (!state.project && state.projects.length === 0) return;

  if (!state.project && state.projects.length > 0) {
    renderProjectSelector(app);
    return;
  }

  const p = state.project;
  const sorted = sortMilestones(p.milestones || []);
  const filtered = filterMilestones(sorted);
  const activeCount = (p.milestones || []).filter(m => m.status === 'in_progress').length;
  const doneCount = (p.milestones || []).filter(m => m.status === 'done').length;
  const retro = nextRetroDate(p.retro_day);

  app.innerHTML = `
    <header class="header fade-in">
      <div class="header-top">
        <button class="hamburger-btn" onclick="openMenu()" title="Menu">
          <span></span><span></span><span></span>
        </button>
        <span class="project-name">${esc(p.name)}</span>
        <span class="header-tag">beacon</span>
        <div class="connection-status">
          <div class="status-dot ${state.connected ? '' : 'offline'}"></div>
          <span class="connection-label">${state.connected ? 'live' : 'reconnecting'}</span>
        </div>
      </div>
    </header>

    ${(p.objective || retro) ? `
    <div class="project-info fade-in stagger-1">
      ${p.objective ? `<div class="project-info-item"><span class="project-info-label">Objective</span><span class="project-info-value">${esc(p.objective)}</span></div>` : ''}
      ${retro ? `<div class="project-info-item${retro.isToday ? ' review-due' : ''}"><span class="project-info-label">${retro.isToday ? '\u26a0 Review Due Today' : 'Next Review'}</span><span class="project-info-value">${retro.date} (${esc(p.retro_day || 'friday')})</span></div>` : ''}
    </div>
    ` : ''}

    <div class="tab-bar fade-in stagger-1">
      <button class="tab-btn ${state.activeTab === 'dashboard' ? 'active' : ''}" onclick="switchTab('dashboard')">Milestones</button>
      <button class="tab-btn ${state.activeTab === 'retros' ? 'active' : ''}" onclick="switchTab('retros')">Reviews</button>
      <button class="tab-btn ${state.activeTab === 'documents' ? 'active' : ''}" onclick="switchTab('documents')">Documents</button>
    </div>

    ${state.activeTab === 'dashboard' ? `
    ${p.summary ? `
    <section class="summary-block fade-in">
      <div class="summary-label">Session Context</div>
      <div class="summary-text">${esc(p.summary)}</div>
    </section>
    ` : ''}
    <section class="milestones fade-in">
      <div class="milestones-header">
        <span class="milestones-title">Milestones</span>
        <span class="milestones-count">${activeCount} active \u00b7 ${doneCount}/${(p.milestones||[]).length} done</span>
      </div>
      <div class="filter-bar">
        <button class="filter-btn f-all ${state.hiddenStatuses.size === 0 ? 'on' : 'off'}" onclick="showAllStatuses()">all</button>
        ${FILTER_ORDER.map(s => {
          const isOn = !state.hiddenStatuses.has(s);
          return `<button class="filter-btn ${isOn ? 'on' : 'off'} ${FILTER_CSS_CLASS[s] || ''}" onclick="toggleStatusFilter('${s}')">${STATUS_LABELS[s] || s}</button>`;
        }).join('')}
        <button class="sort-toggle" onclick="toggleSort()">${state.sortAsc ? '\u2191 ms-1 first' : '\u2193 latest first'}</button>
      </div>
      ${filtered.map((ms, i) => renderMilestoneCard(ms, i)).join('')}
    </section>
    ` : ''}

    ${state.activeTab === 'retros' ? renderRetroSection() : ''}

    ${state.activeTab === 'documents' ? renderDocumentsSection() : ''}

    <footer class="footer fade-in stagger-4">
      <div class="footer-left">
        <div>${esc(state.projectId)}</div>
        <div class="footer-tagline">Where humans and AI are bound together.</div>
      </div>
      <div class="footer-right">
        <span>${state.lastUpdate ? formatTime(state.lastUpdate) : ''}</span>
      </div>
    </footer>
  `;

  document.querySelectorAll('.ms-card-header').forEach(el => {
    el.addEventListener('click', () => toggleMilestone(el.dataset.msId));
  });
}

function renderProjectSelector(app) {
  app.innerHTML = `
    <div class="project-selector fade-in">
      <div class="login-logo">Beacon</div>
      <div class="login-tagline">Where humans and AI are bound together.</div>
      <div style="height: 24px"></div>
      <div class="summary-label">Select Project</div>
      <ul class="project-list">
        ${state.projects.map(p => `
          <li class="project-item" data-id="${esc(p.project_id)}">
            <div class="project-item-name">${esc(p.name)}</div>
            <div class="project-item-id">${esc(p.project_id)}</div>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
  document.querySelectorAll('.project-item').forEach(el => {
    el.addEventListener('click', () => selectProject(el.dataset.id));
  });
}

function renderMilestoneCard(ms, index) {
  const isExpanded = state.expanded.has(ms.id);
  const entries = ms.entries || [];
  const activeClass = ms.status === 'in_progress' ? ' active' : '';
  const expandedClass = isExpanded ? ' expanded' : '';
  const tasksLabel = ms.total_tasks > 0 ? `${ms.done_tasks}/${ms.total_tasks}` : '';

  let bodyHtml = '';
  if (isExpanded && (entries.length > 0 || ms.description)) {
    _currentMsId = ms.id;
    const renderedEntries = entries.map(renderEntry).join('');
    _currentMsId = null;
    const hasDone = entries.some(e => e.status === 'done' || (e.entries || []).some(c => c.status === 'done'));
    const msHideDone = state.hideEntryDone.has(ms.id);
    bodyHtml = `
      <div class="ms-entries">
        ${hasDone ? `
        <div class="ms-entries-toolbar">
          <button class="entry-filter-btn ${msHideDone ? 'active' : ''}" onclick="toggleHideEntryDone('${ms.id}', event)">
            ${msHideDone ? 'show done' : 'hide done'}
          </button>
        </div>
        ` : ''}
        ${ms.description ? `<div class="ms-description">${esc(ms.description)}</div>` : ''}
        ${renderedEntries}
      </div>
    `;
  }

  return `
    <div class="ms-card${activeClass}${expandedClass}">
      <div class="ms-card-header" data-ms-id="${ms.id}">
        ${statusBadge(ms.status)}
        <div class="ms-title-row">
          <span class="ms-id">${ms.id}</span>
          <span class="ms-title">${esc(ms.title)}</span>
        </div>
        <div class="ms-meta">
          ${tasksLabel ? `<span class="ms-tasks-text">${tasksLabel}</span>` : ''}
          <div class="ms-progress-bar">
            <div class="ms-progress-fill ${ms.status}" style="width: ${ms.progress || 0}%"></div>
          </div>
          <span class="ms-progress-text">${ms.progress || 0}%</span>
          ${entries.length > 0 ? `<span class="ms-expand-hint">\u25BE</span>` : ''}
        </div>
      </div>
      <div class="ms-body">${bodyHtml}</div>
    </div>
  `;
}

// ---- Retro ----

function renderRetroSection() {
  if (state.retroContent) {
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" onclick="closeRetro()">\u2190 back to list</span>
        <h3 style="font-size: 1rem; color: var(--text-primary); margin: 8px 0 16px;">${esc(state.retroContent.week)}</h3>
        <div class="retro-content">${esc(state.retroContent.content)}</div>
      </section>`;
  }
  if (state.retros.length === 0) {
    return `<section class="retro-section fade-in"><div class="retro-empty">No retrospective documents yet.</div></section>`;
  }
  return `
    <section class="retro-section fade-in">
      <ul class="retro-list">
        ${state.retros.map(r => `
          <li class="retro-item" onclick="openRetro('${esc(r.week)}')">
            <span class="retro-item-week">${esc(r.week)}</span>
            <span class="retro-item-date">${r.updated_at ? r.updated_at.slice(0, 10) : ''}</span>
          </li>
        `).join('')}
      </ul>
    </section>`;
}

async function switchTab(tab) {
  state.activeTab = tab;
  state.retroContent = null;
  state.documentContent = null;
  if (tab === 'retros' && state.retros.length === 0) {
    try { state.retros = await api(`/api/projects/${state.projectId}/retros`); }
    catch (e) { state.retros = []; }
  }
  if (tab === 'documents' && state.documents.length === 0) {
    try { state.documents = await api(`/api/projects/${state.projectId}/documents`); }
    catch (e) { state.documents = []; }
  }
  render();
}

async function openRetro(week) {
  try { state.retroContent = await api(`/api/projects/${state.projectId}/retros/${week}`); }
  catch (e) { state.retroContent = { week, content: 'Failed to load retro document.' }; }
  render();
}

function closeRetro() { state.retroContent = null; render(); }

// ---- Documents ----

function scopeBadge(scope) {
  const styles = {
    core: 'background: var(--accent); color: #fff;',
    spec: 'background: var(--border); color: var(--text-primary);',
    memo: 'background: transparent; color: var(--text-secondary); border: 1px solid var(--border);',
  };
  return `<span style="display:inline-block; font-size:0.65rem; padding:1px 6px; border-radius:3px; margin-right:6px; ${styles[scope] || styles.memo}">${(scope || 'memo').toUpperCase()}</span>`;
}

function renderDocumentsSection() {
  if (state.documentContent) {
    const scope = state.documentContent.scope || 'memo';
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" onclick="closeDocument()">\u2190 back to list</span>
        <h3 style="font-size: 1rem; color: var(--text-primary); margin: 8px 0 16px;">${scopeBadge(scope)}${esc(state.documentContent.title)}</h3>
        <div class="retro-content">${esc(state.documentContent.content)}</div>
      </section>`;
  }
  if (state.documents.length === 0) {
    return `<section class="retro-section fade-in"><div class="retro-empty">No documents yet.</div></section>`;
  }
  // Group by scope
  const order = ['core', 'spec', 'memo'];
  const grouped = {};
  for (const s of order) grouped[s] = [];
  for (const d of state.documents) {
    const s = d.scope || 'memo';
    if (!grouped[s]) grouped[s] = [];
    grouped[s].push(d);
  }
  const labels = { core: '\u2605 CORE', spec: '\u25CB SPEC', memo: '\u25CB MEMO' };
  let html = '';
  for (const s of order) {
    if (grouped[s].length === 0) continue;
    html += `
      <section class="retro-section fade-in" style="margin-bottom: 12px;">
        <h4 style="font-size: 0.75rem; color: var(--text-secondary); margin: 0 0 6px; letter-spacing: 0.05em;">${labels[s]}</h4>
        <ul class="retro-list">
          ${grouped[s].map(d => `
            <li class="retro-item" onclick="openDocument('${esc(d.doc_id)}')">
              <span class="retro-item-week">${esc(d.title)}</span>
              <span class="retro-item-date">${d.updated_at ? d.updated_at.slice(0, 10) : ''}</span>
            </li>
          `).join('')}
        </ul>
      </section>`;
  }
  return html;
}

async function openDocument(docId) {
  try { state.documentContent = await api(`/api/projects/${state.projectId}/documents/${docId}`); }
  catch (e) { state.documentContent = { doc_id: docId, title: 'Error', content: 'Failed to load document.' }; }
  render();
}

function closeDocument() { state.documentContent = null; render(); }

// ---- Hamburger Menu ----

function openMenu() {
  state.menuOpen = true;
  renderMenu();
}

function closeMenu() {
  state.menuOpen = false;
  document.getElementById('menu-root').innerHTML = '';
}

async function renderMenu() {
  // Load projects list if not loaded
  if (state.projects.length === 0) {
    try { await loadProjects(); } catch (e) {}
  }

  const root = document.getElementById('menu-root');
  root.innerHTML = `
    <div class="menu-overlay" onclick="closeMenu()"></div>
    <div class="menu-panel">
      <div class="menu-header">
        <span class="menu-title">Menu</span>
        <button class="menu-close" onclick="closeMenu()">\u00d7</button>
      </div>

      <div class="menu-section">
        <div class="menu-section-title">Projects</div>
        ${state.projects.map(p => `
          <button class="menu-item ${p.project_id === state.projectId ? 'current' : ''}"
                  onclick="menuSelectProject('${esc(p.project_id)}')">
            ${esc(p.name)}
            <div class="menu-item-sub">${esc(p.project_id)}</div>
          </button>
        `).join('')}
      </div>

      <div class="menu-section">
        <div class="menu-section-title">Members</div>
        <div id="menu-members"><div class="menu-user" style="color:var(--text-dim)">Loading...</div></div>
      </div>

      <div class="menu-section">
        <div class="menu-section-title">Account</div>
        ${state.auth.email ? `<div class="menu-user">${esc(state.auth.email)}</div>` : ''}
        <a class="menu-item" href="/admin" style="text-decoration:none;display:block">Admin</a>
        <button class="menu-item" onclick="logout()">Sign out</button>
      </div>
    </div>
  `;
  loadMembers();
}

async function loadMembers() {
  if (!state.projectId) return;
  const el = document.getElementById('menu-members');
  if (!el) return;
  try {
    const data = await api(`/api/projects/${state.projectId}/members`);
    const isOwner = state.auth.email && data.owner_email === state.auth.email;
    let html = '';
    // Owner
    if (data.owner_email) {
      html += `<div class="menu-user">${esc(data.owner_email)} <span style="color:var(--accent);font-size:0.7rem">owner</span></div>`;
    }
    // Members
    for (const m of data.members || []) {
      html += `<div class="menu-user" style="display:flex;align-items:center;justify-content:space-between;">
        <span>${esc(m.email)} <span style="color:var(--text-dim);font-size:0.7rem">${esc(m.role)}</span></span>
        ${isOwner ? `<span style="display:flex;gap:4px;">
          <button onclick="toggleMemberRole('${esc(m.email)}','${m.role === 'viewer' ? 'editor' : 'viewer'}')" style="background:none;border:1px solid var(--border);color:var(--text-secondary);font-size:0.65rem;padding:1px 5px;border-radius:3px;cursor:pointer">${m.role === 'viewer' ? '\u2191 editor' : '\u2193 viewer'}</button>
          <button onclick="removeMember('${esc(m.email)}')" style="background:none;border:1px solid var(--border);color:var(--text-dim);font-size:0.65rem;padding:1px 5px;border-radius:3px;cursor:pointer">\u00d7</button>
        </span>` : ''}
      </div>`;
    }
    // Invite form (owner only)
    if (isOwner) {
      html += `<div style="margin-top:8px;display:flex;gap:4px;">
        <input id="invite-email" type="email" placeholder="email" style="flex:1;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);padding:4px 8px;border-radius:4px;font-size:0.75rem;font-family:var(--font-mono)">
        <select id="invite-role" style="background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);padding:4px;border-radius:4px;font-size:0.75rem">
          <option value="viewer">viewer</option>
          <option value="editor">editor</option>
        </select>
        <button onclick="inviteMember()" style="background:var(--accent-dim);border:none;color:var(--accent);padding:4px 8px;border-radius:4px;font-size:0.75rem;cursor:pointer">Invite</button>
      </div>
      <div id="invite-msg" style="font-size:0.7rem;color:var(--text-dim);margin-top:4px;"></div>`;
    }
    if (!html) html = '<div class="menu-user" style="color:var(--text-dim)">No members</div>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<div class="menu-user" style="color:var(--text-dim)">Failed to load</div>';
  }
}

async function inviteMember() {
  const email = document.getElementById('invite-email')?.value?.trim();
  const role = document.getElementById('invite-role')?.value || 'viewer';
  const msg = document.getElementById('invite-msg');
  if (!email) return;
  try {
    await api(`/api/projects/${state.projectId}/members`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, role})
    });
    if (msg) msg.textContent = `Invited ${email}`;
    loadMembers();
  } catch (e) {
    if (msg) msg.textContent = e.message || 'Error';
  }
}

async function removeMember(email) {
  try {
    await api(`/api/projects/${state.projectId}/members/${encodeURIComponent(email)}`, {method: 'DELETE'});
    loadMembers();
  } catch (e) { alert(e.message || 'Error'); }
}

async function toggleMemberRole(email, newRole) {
  try {
    await api(`/api/projects/${state.projectId}/members/${encodeURIComponent(email)}`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({role: newRole})
    });
    loadMembers();
  } catch (e) { alert(e.message || 'Error'); }
}

async function menuSelectProject(projectId) {
  closeMenu();
  if (projectId !== state.projectId) {
    state.project = null;
    state.expanded.clear();
    state.hiddenStatuses.clear();
    state.hideEntryDone.clear();
    state.collapsedEntries.clear();
    state.activeTab = 'dashboard';
    state.retros = [];
    state.retroContent = null;
    state.documents = [];
    state.documentContent = null;
    lastProjectJson = null;
    await selectProject(projectId);
  }
}

// ---- Interactions ----

async function selectProject(projectId) {
  state.projectId = projectId;
  state.activeTab = 'dashboard';
  state.retros = [];
  state.retroContent = null;
  state.documents = [];
  state.documentContent = null;
  state.hiddenStatuses.clear();
  lastProjectJson = null;

  document.getElementById('app').innerHTML = `
    <div class="loading"><div class="loading-bar"></div><div class="loading-text">Loading</div></div>
  `;

  connectWebSocket(projectId);

  try {
    const data = await api(`/api/projects/${projectId}`);
    if (!state.project) {
      state.project = data;
      state.lastUpdate = new Date();
      for (const ms of data.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render();
    }
  } catch (e) {
    if (!state.project) { state.error = e.message; render(); }
  }
}

function toggleMilestone(msId) {
  if (state.expanded.has(msId)) state.expanded.delete(msId);
  else state.expanded.add(msId);
  render();
}

function toggleEntry(entryId, event) {
  // Don't toggle when clicking on links etc inside entry
  if (event.target.closest('.entry-children')) return;
  event.stopPropagation();
  if (state.collapsedEntries.has(entryId)) state.collapsedEntries.delete(entryId);
  else state.collapsedEntries.add(entryId);
  render();
}

function toggleHideEntryDone(msId, event) {
  event.stopPropagation();
  if (state.hideEntryDone.has(msId)) state.hideEntryDone.delete(msId);
  else state.hideEntryDone.add(msId);
  render();
}

function toggleSort() {
  state.sortAsc = !state.sortAsc;
  render();
}

// ---- URL routing ----

function getProjectIdFromUrl() {
  return new URLSearchParams(window.location.search).get('project');
}

// ---- Init ----

async function init() {
  await loadAuthConfig();
  if (!isAuthenticated()) {
    function waitForGsi() {
      if (window.google?.accounts) renderLogin();
      else setTimeout(waitForGsi, 100);
    }
    waitForGsi();
    return;
  }
  const urlProjectId = getProjectIdFromUrl();
  if (urlProjectId) {
    await selectProject(urlProjectId);
  } else {
    await loadProjects();
    if (state.projects.length === 1) await selectProject(state.projects[0].project_id);
    else render();
  }
}

init();
</script>
</body>
</html>
