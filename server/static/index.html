<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   BEACON — Terminal Noir Dashboard
   A control room window into an AI-driven project.
   ================================================================ */

:root {
  --bg-void: #0a0a0c;
  --bg-surface: #111114;
  --bg-raised: #18181c;
  --bg-hover: #1f1f24;
  --border: #2a2a30;
  --border-subtle: #1e1e24;
  --text-primary: #d4d4d8;
  --text-secondary: #71717a;
  --text-dim: #52525b;
  --accent: #4ade80;
  --accent-dim: #166534;
  --accent-glow: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --info: #60a5fa;
  --done: #4ade80;
  --in-progress: #60a5fa;
  --observing: #a78bfa;
  --todo: #52525b;
  --cancelled: #ef4444;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
  --scanline-opacity: 0.03;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ---- Layout ---- */

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---- Header ---- */

.header {
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.header::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 120px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 4px;
}

.project-name {
  font-family: var(--font-mono);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.header-tag {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.connection-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.offline {
  background: var(--cancelled);
  box-shadow: 0 0 6px var(--cancelled);
  animation: none;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---- Summary Block ---- */

.summary-block {
  padding: 20px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.summary-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.summary-text {
  color: var(--text-secondary);
  font-size: 0.85rem;
  line-height: 1.7;
  max-width: 72ch;
}

/* ---- Milestone List ---- */

.milestones {
  padding: 24px 0;
}

.milestones-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}

.milestones-title {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.milestones-count {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ---- Milestone Card ---- */

.ms-card {
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 8px;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
}

.ms-card:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.ms-card.active {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.ms-card-header {
  padding: 12px 16px;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}

.ms-status-icon {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ms-status-icon.done { background: var(--done); box-shadow: 0 0 4px rgba(74, 222, 128, 0.3); }
.ms-status-icon.in_progress { background: var(--in-progress); box-shadow: 0 0 4px rgba(96, 165, 250, 0.3); animation: pulse-dot 2s ease-in-out infinite; }
.ms-status-icon.observing { background: var(--observing); box-shadow: 0 0 4px rgba(167, 139, 250, 0.3); }
.ms-status-icon.todo { background: var(--todo); }
.ms-status-icon.cancelled { background: var(--cancelled); }

.ms-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.ms-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ms-title {
  font-size: 0.85rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ms-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.ms-progress-bar {
  width: 80px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.ms-progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.ms-progress-fill.done { background: var(--done); }
.ms-progress-fill.in_progress { background: var(--in-progress); }
.ms-progress-fill.observing { background: var(--observing); }
.ms-progress-fill.todo { background: var(--todo); }

.ms-progress-text {
  font-size: 0.7rem;
  color: var(--text-dim);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ms-tasks-text {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ---- Milestone Expanded ---- */

.ms-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.ms-card.expanded .ms-body {
  max-height: 2000px;
}

.ms-entries {
  padding: 0 16px 12px;
  border-top: 1px solid var(--border-subtle);
}

.ms-description {
  padding: 8px 0 4px;
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-style: italic;
}

/* ---- Entry Row ---- */

.entry {
  display: grid;
  grid-template-columns: 18px auto 1fr auto;
  gap: 8px;
  padding: 6px 0;
  align-items: start;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.8rem;
  animation: entry-in 0.3s ease both;
}

.entry:last-child { border-bottom: none; }

@keyframes entry-in {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.entry-type-icon {
  font-size: 0.65rem;
  line-height: 1.8;
  text-align: center;
}

.entry-type-icon.commit { color: var(--accent); }
.entry-type-icon.task { color: var(--info); }
.entry-type-icon.note { color: var(--warning); }

.entry-id {
  font-size: 0.65rem;
  color: var(--text-dim);
  line-height: 1.8;
}

.entry-desc {
  color: var(--text-secondary);
  line-height: 1.6;
}

.entry.done .entry-desc {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--border);
}

.entry-date {
  font-size: 0.65rem;
  color: var(--text-dim);
  line-height: 1.8;
  white-space: nowrap;
}

.entry-hash {
  font-size: 0.65rem;
  color: var(--accent-dim);
  margin-left: 4px;
}

/* ---- Entry Detail ---- */

.entry-detail {
  grid-column: 3 / -1;
  font-size: 0.75rem;
  color: var(--text-dim);
  padding: 4px 0 2px;
  line-height: 1.5;
  border-left: 2px solid var(--border-subtle);
  padding-left: 10px;
  margin-top: 2px;
}

/* ---- Nested entries (under task) ---- */

.entry-children {
  grid-column: 1 / -1;
  padding-left: 18px;
}

.entry-children .entry {
  border-bottom-color: transparent;
  padding: 3px 0;
}

/* ---- Footer ---- */

.footer {
  padding: 24px 0 40px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.footer-right {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.updated-time {
  color: var(--text-dim);
}

/* ---- Loading State ---- */

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  flex-direction: column;
  gap: 16px;
}

.loading-bar {
  width: 120px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.loading-bar::after {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  animation: loading-slide 1.2s ease-in-out infinite;
}

@keyframes loading-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.loading-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---- Error State ---- */

.error-state {
  text-align: center;
  padding: 80px 0;
  color: var(--text-dim);
  font-size: 0.85rem;
}

.error-state .error-icon {
  font-size: 1.5rem;
  margin-bottom: 12px;
  color: var(--cancelled);
}

/* ---- Fade-in animations ---- */

.fade-in {
  animation: fade-in 0.4s ease both;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }

/* ---- Project selector ---- */

.project-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 20px;
}

.project-list {
  list-style: none;
  width: 100%;
  max-width: 480px;
}

.project-item {
  padding: 12px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: var(--bg-surface);
}

.project-item:hover {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.project-item-name {
  font-size: 0.9rem;
  color: var(--text-primary);
}

.project-item-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 2px;
}

</style>
</head>
<body>

<div class="container" id="app">
  <div class="loading" id="loading-state">
    <div class="loading-bar"></div>
    <div class="loading-text">Connecting</div>
  </div>
</div>

<script>
// ================================================================
// Beacon Dashboard — Read-only monitoring UI
// ================================================================

const API_BASE = window.location.origin;
const POLL_INTERVAL = 5000;

let state = {
  projects: [],
  projectId: null,
  project: null,
  milestones: {},   // ms_id -> expanded detail
  expanded: new Set(),
  lastUpdate: null,
  connected: false,
  error: null,
};

// ---- API ----

async function api(path) {
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
  return res.json();
}

async function loadProjects() {
  try {
    state.projects = await api('/api/projects');
    state.connected = true;
    state.error = null;
  } catch (e) {
    state.connected = false;
    state.error = e.message;
  }
}

async function loadProject(projectId) {
  try {
    state.project = await api(`/api/projects/${projectId}`);
    state.projectId = projectId;
    state.lastUpdate = new Date();
    state.connected = true;
    state.error = null;
  } catch (e) {
    state.connected = false;
    state.error = e.message;
  }
}

async function loadMilestone(projectId, msId) {
  try {
    const data = await api(`/api/projects/${projectId}/milestones/${msId}`);
    state.milestones[msId] = data;
  } catch (e) {
    // silent fail for milestone detail
  }
}

// ---- Render Helpers ----

function statusIcon(status) {
  return `<div class="ms-status-icon ${status}"></div>`;
}

function entryTypeIcon(type) {
  const icons = { commit: '\u25cb', task: '\u25a1', note: '\u25c7' };
  return `<span class="entry-type-icon ${type}">${icons[type] || '\u00b7'}</span>`;
}

function renderEntry(entry) {
  const statusClass = entry.status === 'done' ? ' done' : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';
  const detail = entry.detail ? `<div class="entry-detail">${esc(entry.detail)}</div>` : '';

  let children = '';
  if (entry.entries?.length) {
    children = `<div class="entry-children">${entry.entries.map(renderEntry).join('')}</div>`;
  }

  return `
    <div class="entry${statusClass}">
      ${entryTypeIcon(entry.type)}
      <span class="entry-id">${entry.id}</span>
      <span class="entry-desc">${esc(entry.description)}${hash}</span>
      <span class="entry-date">${entry.created_at || ''}</span>
      ${detail}
      ${children}
    </div>
  `;
}

function esc(s) {
  if (!s) return '';
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function formatTime(date) {
  if (!date) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ---- Sort milestones ----

function sortMilestones(milestones) {
  const order = { in_progress: 0, observing: 1, todo: 2, done: 3, cancelled: 4 };
  return [...milestones].sort((a, b) => {
    const oa = order[a.status] ?? 5;
    const ob = order[b.status] ?? 5;
    if (oa !== ob) return oa - ob;
    return 0;
  });
}

// ---- Render ----

function render() {
  const app = document.getElementById('app');

  if (state.error && !state.project) {
    app.innerHTML = `
      <div class="error-state">
        <div class="error-icon">\u26a0</div>
        <div>${esc(state.error)}</div>
      </div>
    `;
    return;
  }

  if (!state.project && state.projects.length === 0) {
    return; // still loading
  }

  if (!state.project && state.projects.length > 0) {
    renderProjectSelector(app);
    return;
  }

  const p = state.project;
  const sorted = sortMilestones(p.milestones || []);
  const activeCount = sorted.filter(m => m.status === 'in_progress').length;
  const doneCount = sorted.filter(m => m.status === 'done').length;

  app.innerHTML = `
    <header class="header fade-in">
      <div class="header-top">
        <span class="project-name">${esc(p.name)}</span>
        <span class="header-tag">beacon</span>
        <div class="connection-status">
          <div class="status-dot ${state.connected ? '' : 'offline'}"></div>
          <span>${state.connected ? 'live' : 'offline'}</span>
        </div>
      </div>
    </header>

    ${p.summary ? `
    <section class="summary-block fade-in stagger-1">
      <div class="summary-label">Session Context</div>
      <div class="summary-text">${esc(p.summary)}</div>
    </section>
    ` : ''}

    <section class="milestones fade-in stagger-2">
      <div class="milestones-header">
        <span class="milestones-title">Milestones</span>
        <span class="milestones-count">${activeCount} active \u00b7 ${doneCount}/${sorted.length} done</span>
      </div>
      ${sorted.map((ms, i) => renderMilestoneCard(ms, i)).join('')}
    </section>

    <footer class="footer fade-in stagger-4">
      <div class="footer-left">${esc(state.projectId)}</div>
      <div class="footer-right">
        <span class="updated-time">${state.lastUpdate ? formatTime(state.lastUpdate) : ''}</span>
      </div>
    </footer>
  `;

  // Attach click handlers
  document.querySelectorAll('.ms-card-header').forEach(el => {
    el.addEventListener('click', () => toggleMilestone(el.dataset.msId));
  });
}

function renderProjectSelector(app) {
  app.innerHTML = `
    <div class="project-selector fade-in">
      <div class="summary-label">Select Project</div>
      <ul class="project-list">
        ${state.projects.map(p => `
          <li class="project-item" data-id="${esc(p.project_id)}">
            <div class="project-item-name">${esc(p.name)}</div>
            <div class="project-item-id">${esc(p.project_id)}</div>
          </li>
        `).join('')}
      </ul>
    </div>
  `;

  document.querySelectorAll('.project-item').forEach(el => {
    el.addEventListener('click', () => selectProject(el.dataset.id));
  });
}

function renderMilestoneCard(ms, index) {
  const isExpanded = state.expanded.has(ms.id);
  const detail = state.milestones[ms.id];
  const entries = detail?.entries || [];
  const activeClass = ms.status === 'in_progress' ? ' active' : '';
  const expandedClass = isExpanded ? ' expanded' : '';

  const tasksLabel = ms.total_tasks > 0
    ? `${ms.done_tasks}/${ms.total_tasks}`
    : '';

  let bodyHtml = '';
  if (isExpanded && entries.length > 0) {
    bodyHtml = `
      <div class="ms-entries">
        ${ms.description ? `<div class="ms-description">${esc(ms.description)}</div>` : ''}
        ${entries.map(renderEntry).join('')}
      </div>
    `;
  } else if (isExpanded && ms.description) {
    bodyHtml = `
      <div class="ms-entries">
        <div class="ms-description">${esc(ms.description)}</div>
      </div>
    `;
  }

  return `
    <div class="ms-card${activeClass}${expandedClass}">
      <div class="ms-card-header" data-ms-id="${ms.id}">
        ${statusIcon(ms.status)}
        <div class="ms-title-row">
          <span class="ms-id">${ms.id}</span>
          <span class="ms-title">${esc(ms.title)}</span>
        </div>
        <div class="ms-meta">
          ${tasksLabel ? `<span class="ms-tasks-text">${tasksLabel}</span>` : ''}
          <div class="ms-progress-bar">
            <div class="ms-progress-fill ${ms.status}" style="width: ${ms.progress || 0}%"></div>
          </div>
          <span class="ms-progress-text">${ms.progress || 0}%</span>
        </div>
      </div>
      <div class="ms-body">
        ${bodyHtml}
      </div>
    </div>
  `;
}

// ---- Interactions ----

async function selectProject(projectId) {
  document.getElementById('app').innerHTML = `
    <div class="loading">
      <div class="loading-bar"></div>
      <div class="loading-text">Loading</div>
    </div>
  `;
  await loadProject(projectId);
  // Auto-expand in_progress milestones
  if (state.project) {
    for (const ms of state.project.milestones || []) {
      if (ms.status === 'in_progress') {
        state.expanded.add(ms.id);
        await loadMilestone(projectId, ms.id);
      }
    }
  }
  render();
  startPolling();
}

async function toggleMilestone(msId) {
  if (state.expanded.has(msId)) {
    state.expanded.delete(msId);
  } else {
    state.expanded.add(msId);
    if (!state.milestones[msId]) {
      await loadMilestone(state.projectId, msId);
    }
  }
  render();
}

// ---- Polling ----

let pollTimer = null;

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    await loadProject(state.projectId);
    // Refresh expanded milestones
    for (const msId of state.expanded) {
      await loadMilestone(state.projectId, msId);
    }
    render();
  }, POLL_INTERVAL);
}

// ---- URL routing ----

function getProjectIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('project');
}

// ---- Init ----

async function init() {
  const urlProjectId = getProjectIdFromUrl();

  if (urlProjectId) {
    await selectProject(urlProjectId);
  } else {
    await loadProjects();
    if (state.projects.length === 1) {
      await selectProject(state.projects[0].project_id);
    } else {
      render();
    }
  }
}

init();
</script>
</body>
</html>
