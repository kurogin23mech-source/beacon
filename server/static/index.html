<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ================================================================
   BEACON — Terminal Noir Dashboard v2
   ================================================================ */

:root {
  --bg-void: #0a0a0c;
  --bg-surface: #111114;
  --bg-raised: #18181c;
  --bg-hover: #1f1f24;
  --border: #2a2a30;
  --border-subtle: #1e1e24;
  --text-primary: #e4e4e8;
  --text-secondary: #a1a1aa;
  --text-dim: #71717a;
  --accent: #4ade80;
  --accent-dim: #166534;
  --accent-glow: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --info: #60a5fa;
  --done: #4ade80;
  --in-progress: #60a5fa;
  --observing: #a78bfa;
  --todo: #71717a;
  --waiting: #f97316;
  --cancelled: #ef4444;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
  --scanline-opacity: 0.03;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ---- Layout ---- */

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---- Header ---- */

.header {
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.header::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 120px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 4px;
}

.project-name {
  font-family: var(--font-mono);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.project-back {
  font-size: 0.8rem;
  color: var(--text-dim);
  cursor: pointer;
  padding: 2px 8px;
  border: 1px solid transparent;
  border-radius: 3px;
  transition: border-color 0.2s, color 0.2s;
  text-decoration: none;
}

.project-back:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

.header-tag {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.connection-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.offline {
  background: var(--cancelled);
  box-shadow: 0 0 6px var(--cancelled);
  animation: none;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---- Summary Block ---- */

.summary-block {
  padding: 20px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.summary-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.summary-text {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.7;
  max-width: 72ch;
}

/* ---- Filter Bar ---- */

.filter-bar {
  display: flex;
  gap: 6px;
  padding: 16px 0 0;
  flex-wrap: wrap;
}

.filter-btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}

.filter-btn:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

.filter-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

/* ---- Milestone List ---- */

.milestones {
  padding: 24px 0;
}

.milestones-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}

.milestones-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.milestones-count {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ---- Milestone Card ---- */

.ms-card {
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 8px;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
}

.ms-card:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.ms-card.active {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.ms-card-header {
  padding: 12px 16px;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}

.ms-status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.ms-status-icon {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ms-status-icon.done { background: var(--done); box-shadow: 0 0 4px rgba(74, 222, 128, 0.3); }
.ms-status-icon.in_progress { background: var(--in-progress); box-shadow: 0 0 4px rgba(96, 165, 250, 0.3); animation: pulse-dot 2s ease-in-out infinite; }
.ms-status-icon.observing { background: var(--observing); box-shadow: 0 0 4px rgba(167, 139, 250, 0.3); }
.ms-status-icon.todo { background: var(--todo); }
.ms-status-icon.waiting { background: var(--waiting); }
.ms-status-icon.cancelled { background: var(--cancelled); }

.ms-status-text {
  font-size: 0.65rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 500;
}

.ms-status-text.done { color: var(--done); }
.ms-status-text.in_progress { color: var(--in-progress); }
.ms-status-text.observing { color: var(--observing); }
.ms-status-text.todo { color: var(--todo); }
.ms-status-text.waiting { color: var(--waiting); }
.ms-status-text.cancelled { color: var(--cancelled); }

.ms-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.ms-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ms-title {
  font-size: 0.9rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ms-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.ms-progress-bar {
  width: 80px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.ms-progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.ms-progress-fill.done { background: var(--done); }
.ms-progress-fill.in_progress { background: var(--in-progress); }
.ms-progress-fill.observing { background: var(--observing); }
.ms-progress-fill.todo { background: var(--todo); }

.ms-progress-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ms-tasks-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ---- Milestone Expanded ---- */

.ms-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.ms-card.expanded .ms-body {
  max-height: 4000px;
}

.ms-entries {
  padding: 0 16px 12px;
  border-top: 1px solid var(--border-subtle);
}

.ms-description {
  padding: 8px 0 4px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-style: italic;
}

/* ---- Entry Row ---- */

.entry {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 8px;
  padding: 6px 0;
  align-items: start;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.85rem;
}

.entry:last-child { border-bottom: none; }

.entry-type-badge {
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 1px 5px;
  border-radius: 2px;
  line-height: 1.8;
  white-space: nowrap;
}

.entry-type-badge.commit {
  color: var(--accent);
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.15);
}

.entry-type-badge.task {
  color: var(--info);
  background: rgba(96, 165, 250, 0.1);
  border: 1px solid rgba(96, 165, 250, 0.15);
}

.entry-type-badge.note {
  color: var(--warning);
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.15);
}

.entry-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
}

.entry-desc {
  color: var(--text-secondary);
  line-height: 1.6;
}

.entry.done .entry-desc {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--border);
}

.entry-status-text {
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-left: 4px;
}

.entry-status-text.done { color: var(--done); }
.entry-status-text.todo { color: var(--todo); }
.entry-status-text.in_progress { color: var(--in-progress); }

.entry-date {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
  white-space: nowrap;
}

.entry-hash {
  font-size: 0.7rem;
  color: var(--accent-dim);
  margin-left: 4px;
}

/* ---- Entry Detail ---- */

.entry-detail {
  grid-column: 3 / -1;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 0 2px;
  line-height: 1.5;
  border-left: 2px solid var(--border-subtle);
  padding-left: 10px;
  margin-top: 2px;
}

/* ---- Nested entries (under task) ---- */

.entry-children {
  grid-column: 1 / -1;
  padding-left: 18px;
}

.entry-children .entry {
  border-bottom-color: transparent;
  padding: 3px 0;
}

/* ---- Tabs (Dashboard / Retros) ---- */

.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border-subtle);
}

.tab-btn {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}

.tab-btn:hover {
  color: var(--text-secondary);
}

.tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}

/* ---- Retro Viewer ---- */

.retro-section {
  padding: 24px 0;
}

.retro-list {
  list-style: none;
}

.retro-item {
  padding: 10px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.retro-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.retro-item-week {
  font-size: 0.9rem;
  color: var(--text-primary);
}

.retro-item-date {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.retro-content {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 20px;
  white-space: pre-wrap;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--text-secondary);
  max-height: 70vh;
  overflow-y: auto;
}

.retro-back {
  font-size: 0.8rem;
  color: var(--text-dim);
  cursor: pointer;
  margin-bottom: 12px;
  display: inline-block;
  transition: color 0.2s;
}

.retro-back:hover {
  color: var(--text-secondary);
}

.retro-empty {
  text-align: center;
  padding: 40px 0;
  color: var(--text-dim);
  font-size: 0.85rem;
}

/* ---- Footer ---- */

.footer {
  padding: 24px 0 40px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.footer-tagline {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-style: italic;
  letter-spacing: 0.03em;
}

.footer-right {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ---- Loading State ---- */

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  flex-direction: column;
  gap: 16px;
}

.loading-bar {
  width: 120px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.loading-bar::after {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  animation: loading-slide 1.2s ease-in-out infinite;
}

@keyframes loading-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.loading-text {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---- Error State ---- */

.error-state {
  text-align: center;
  padding: 80px 0;
  color: var(--text-dim);
  font-size: 0.9rem;
}

.error-state .error-icon {
  font-size: 1.5rem;
  margin-bottom: 12px;
  color: var(--cancelled);
}

/* ---- Fade-in animations ---- */

.fade-in {
  animation: fade-in 0.4s ease both;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }

/* ---- Project selector ---- */

.project-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 20px;
}

.project-list {
  list-style: none;
  width: 100%;
  max-width: 480px;
}

.project-item {
  padding: 12px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: var(--bg-surface);
}

.project-item:hover {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.project-item-name {
  font-size: 0.95rem;
  color: var(--text-primary);
}

.project-item-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ---- Login Screen ---- */

.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 24px;
}

.login-logo {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.login-tagline {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  font-style: italic;
  margin-top: -16px;
}

.login-divider {
  width: 60px;
  height: 1px;
  background: var(--border);
  position: relative;
}

.login-divider::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 20px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

#g_id_signin {
  margin-top: 8px;
}

.login-note {
  font-size: 0.75rem;
  color: var(--text-dim);
  max-width: 280px;
  text-align: center;
  line-height: 1.6;
}

/* ---- User Info ---- */

.user-info {
  font-size: 0.75rem;
  color: var(--text-dim);
  cursor: pointer;
  padding: 2px 8px;
  border: 1px solid transparent;
  border-radius: 3px;
  transition: border-color 0.2s;
}

.user-info:hover {
  border-color: var(--border);
}

</style>
</head>
<body>

<div class="container" id="app">
  <div class="loading" id="loading-state">
    <div class="loading-bar"></div>
    <div class="loading-text">Connecting</div>
  </div>
</div>

<script>
// ================================================================
// Beacon Dashboard v2 — WebSocket + UI improvements
// ================================================================

const API_BASE = window.location.origin;

let state = {
  projects: [],
  projectId: null,
  project: null,
  milestones: {},   // ms_id -> expanded detail (enriched data from WS includes this)
  expanded: new Set(),
  lastUpdate: null,
  connected: false,
  error: null,
  activeTab: 'dashboard', // 'dashboard' | 'retros'
  retros: [],
  retroContent: null,  // { week, content }
  statusFilter: new Set(), // empty = show all; otherwise only show these statuses
  auth: {
    token: localStorage.getItem('beacon_token'),
    email: localStorage.getItem('beacon_email'),
    clientId: null,
  },
};

let ws = null;
let wsReconnectTimer = null;
let lastProjectJson = null; // for diff-based rendering

// ---- Auth ----

async function loadAuthConfig() {
  try {
    const res = await fetch(`${API_BASE}/api/auth/config`);
    if (res.ok) {
      const config = await res.json();
      state.auth.clientId = config.client_id;
    }
  } catch (e) {}
}

function handleCredentialResponse(response) {
  const token = response.credential;
  const payload = JSON.parse(atob(token.split('.')[1]));
  state.auth.token = token;
  state.auth.email = payload.email || '';
  localStorage.setItem('beacon_token', token);
  localStorage.setItem('beacon_email', state.auth.email);
  init();
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-screen fade-in">
      <div class="login-logo">Beacon</div>
      <div class="login-tagline">Where humans and AI are bound together.</div>
      <div class="login-divider"></div>
      <div id="g_id_signin"></div>
      <div class="login-note">Sign in to view project telemetry</div>
    </div>
  `;

  if (state.auth.clientId && window.google?.accounts) {
    google.accounts.id.initialize({
      client_id: state.auth.clientId,
      callback: handleCredentialResponse,
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'filled_black', size: 'large', shape: 'rectangular', text: 'signin_with' }
    );
  }
}

function logout() {
  state.auth.token = null;
  state.auth.email = null;
  localStorage.removeItem('beacon_token');
  localStorage.removeItem('beacon_email');
  closeWebSocket();
  renderLogin();
}

function isAuthenticated() {
  if (!state.auth.token) return false;
  try {
    const payload = JSON.parse(atob(state.auth.token.split('.')[1]));
    return payload.exp * 1000 > Date.now();
  } catch {
    return false;
  }
}

// ---- API ----

async function api(path) {
  const headers = {};
  if (state.auth.token) {
    headers['Authorization'] = `Bearer ${state.auth.token}`;
  }
  const res = await fetch(`${API_BASE}${path}`, { headers });
  if (res.status === 401) {
    logout();
    throw new Error('Session expired');
  }
  if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
  return res.json();
}

async function loadProjects() {
  try {
    state.projects = await api('/api/projects');
    state.connected = true;
    state.error = null;
  } catch (e) {
    state.connected = false;
    state.error = e.message;
  }
}

// ---- WebSocket ----

function connectWebSocket(projectId) {
  closeWebSocket();

  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const host = window.location.host;
  const tokenParam = state.auth.token ? `?token=${encodeURIComponent(state.auth.token)}` : '';
  const url = `${protocol}//${host}/ws/projects/${projectId}${tokenParam}`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    state.connected = true;
    state.error = null;
    updateConnectionStatus();
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'project') {
      const newJson = JSON.stringify(msg.data);
      if (newJson !== lastProjectJson) {
        lastProjectJson = newJson;
        state.project = msg.data;
        state.lastUpdate = new Date();
        state.connected = true;
        render();
      }
    }
  };

  ws.onclose = () => {
    state.connected = false;
    updateConnectionStatus();
    // Reconnect after 3 seconds
    wsReconnectTimer = setTimeout(() => {
      if (state.projectId === projectId) {
        connectWebSocket(projectId);
      }
    }, 3000);
  };

  ws.onerror = () => {
    state.connected = false;
    updateConnectionStatus();
  };

  // Ping every 30s to keep connection alive
  const pingInterval = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('ping');
    } else {
      clearInterval(pingInterval);
    }
  }, 30000);
}

function closeWebSocket() {
  if (ws) {
    ws.onclose = null; // prevent reconnect
    ws.close();
    ws = null;
  }
  if (wsReconnectTimer) {
    clearTimeout(wsReconnectTimer);
    wsReconnectTimer = null;
  }
}

function updateConnectionStatus() {
  const dot = document.querySelector('.status-dot');
  const label = document.querySelector('.connection-label');
  if (dot) {
    dot.className = `status-dot ${state.connected ? '' : 'offline'}`;
  }
  if (label) {
    label.textContent = state.connected ? 'live' : 'reconnecting';
  }
}

// ---- Render Helpers ----

const STATUS_LABELS = {
  done: 'done',
  in_progress: 'active',
  observing: 'observing',
  todo: 'todo',
  waiting: 'waiting',
  cancelled: 'cancelled',
};

function statusBadge(status) {
  const label = STATUS_LABELS[status] || status;
  return `
    <div class="ms-status-badge">
      <div class="ms-status-icon ${status}"></div>
      <span class="ms-status-text ${status}">${label}</span>
    </div>`;
}

function entryTypeBadge(type) {
  const labels = { commit: 'commit', task: 'task', note: 'note' };
  return `<span class="entry-type-badge ${type}">${labels[type] || type}</span>`;
}

function entryStatusText(entry) {
  if (entry.type === 'commit') return '';
  const label = STATUS_LABELS[entry.status] || entry.status;
  return `<span class="entry-status-text ${entry.status}">${label}</span>`;
}

function renderEntry(entry) {
  const statusClass = entry.status === 'done' ? ' done' : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';
  const detail = entry.detail ? `<div class="entry-detail">${esc(entry.detail)}</div>` : '';
  const statusText = entryStatusText(entry);

  let children = '';
  if (entry.entries?.length) {
    children = `<div class="entry-children">${entry.entries.map(renderEntry).join('')}</div>`;
  }

  return `
    <div class="entry${statusClass}">
      ${entryTypeBadge(entry.type)}
      <span class="entry-id">${entry.id}</span>
      <span class="entry-desc">${esc(entry.description)}${hash}${statusText}</span>
      <span class="entry-date">${entry.created_at || ''}</span>
      ${detail}
      ${children}
    </div>
  `;
}

function esc(s) {
  if (!s) return '';
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function formatTime(date) {
  if (!date) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ---- Sort milestones ----

function sortMilestones(milestones) {
  const order = { in_progress: 0, observing: 1, todo: 2, waiting: 3, done: 4, cancelled: 5 };
  return [...milestones].sort((a, b) => {
    const oa = order[a.status] ?? 6;
    const ob = order[b.status] ?? 6;
    return oa - ob;
  });
}

// ---- Filter ----

function toggleFilter(status) {
  if (state.statusFilter.has(status)) {
    state.statusFilter.delete(status);
  } else {
    state.statusFilter.add(status);
  }
  render();
}

function filterMilestones(milestones) {
  if (state.statusFilter.size === 0) return milestones;
  return milestones.filter(ms => state.statusFilter.has(ms.status));
}

function getAvailableStatuses(milestones) {
  const statuses = new Set();
  for (const ms of milestones) {
    statuses.add(ms.status);
  }
  const order = ['in_progress', 'observing', 'todo', 'waiting', 'done', 'cancelled'];
  return order.filter(s => statuses.has(s));
}

// ---- Render ----

function render() {
  const app = document.getElementById('app');

  if (state.error && !state.project) {
    app.innerHTML = `
      <div class="error-state">
        <div class="error-icon">\u26a0</div>
        <div>${esc(state.error)}</div>
      </div>
    `;
    return;
  }

  if (!state.project && state.projects.length === 0) {
    return; // still loading
  }

  if (!state.project && state.projects.length > 0) {
    renderProjectSelector(app);
    return;
  }

  const p = state.project;
  const sorted = sortMilestones(p.milestones || []);
  const availableStatuses = getAvailableStatuses(sorted);
  const filtered = filterMilestones(sorted);
  const activeCount = sorted.filter(m => m.status === 'in_progress').length;
  const doneCount = sorted.filter(m => m.status === 'done').length;

  app.innerHTML = `
    <header class="header fade-in">
      <div class="header-top">
        <span class="project-back" onclick="goBack()">\u2190 projects</span>
        <span class="project-name">${esc(p.name)}</span>
        <span class="header-tag">beacon</span>
        <div class="connection-status">
          <div class="status-dot ${state.connected ? '' : 'offline'}"></div>
          <span class="connection-label">${state.connected ? 'live' : 'reconnecting'}</span>
        </div>
        ${state.auth.email ? `<span class="user-info" onclick="logout()" title="Click to sign out">${esc(state.auth.email)}</span>` : ''}
      </div>
    </header>

    ${p.summary ? `
    <section class="summary-block fade-in stagger-1">
      <div class="summary-label">Session Context</div>
      <div class="summary-text">${esc(p.summary)}</div>
    </section>
    ` : ''}

    <div class="tab-bar fade-in stagger-2">
      <button class="tab-btn ${state.activeTab === 'dashboard' ? 'active' : ''}" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="tab-btn ${state.activeTab === 'retros' ? 'active' : ''}" onclick="switchTab('retros')">Retros</button>
    </div>

    ${state.activeTab === 'dashboard' ? `
    <section class="milestones fade-in">
      <div class="milestones-header">
        <span class="milestones-title">Milestones</span>
        <span class="milestones-count">${activeCount} active \u00b7 ${doneCount}/${sorted.length} done</span>
      </div>
      ${availableStatuses.length > 1 ? `
      <div class="filter-bar">
        ${availableStatuses.map(s => `
          <button class="filter-btn ${state.statusFilter.has(s) ? 'active' : ''}" onclick="toggleFilter('${s}')">${STATUS_LABELS[s] || s}</button>
        `).join('')}
        ${state.statusFilter.size > 0 ? `<button class="filter-btn" onclick="clearFilters()">clear</button>` : ''}
      </div>
      ` : ''}
      ${filtered.map((ms, i) => renderMilestoneCard(ms, i)).join('')}
    </section>
    ` : ''}

    ${state.activeTab === 'retros' ? renderRetroSection() : ''}

    <footer class="footer fade-in stagger-4">
      <div class="footer-left">
        <div>${esc(state.projectId)}</div>
        <div class="footer-tagline">Where humans and AI are bound together.</div>
      </div>
      <div class="footer-right">
        <span>${state.lastUpdate ? formatTime(state.lastUpdate) : ''}</span>
      </div>
    </footer>
  `;

  // Attach click handlers for milestone headers
  document.querySelectorAll('.ms-card-header').forEach(el => {
    el.addEventListener('click', () => toggleMilestone(el.dataset.msId));
  });
}

function renderProjectSelector(app) {
  app.innerHTML = `
    <div class="project-selector fade-in">
      <div class="login-logo">Beacon</div>
      <div class="login-tagline">Where humans and AI are bound together.</div>
      <div style="height: 24px"></div>
      <div class="summary-label">Select Project</div>
      <ul class="project-list">
        ${state.projects.map(p => `
          <li class="project-item" data-id="${esc(p.project_id)}">
            <div class="project-item-name">${esc(p.name)}</div>
            <div class="project-item-id">${esc(p.project_id)}</div>
          </li>
        `).join('')}
      </ul>
    </div>
  `;

  document.querySelectorAll('.project-item').forEach(el => {
    el.addEventListener('click', () => selectProject(el.dataset.id));
  });
}

function renderMilestoneCard(ms, index) {
  const isExpanded = state.expanded.has(ms.id);
  // WebSocket data already includes enriched entries
  const entries = ms.entries || [];
  const activeClass = ms.status === 'in_progress' ? ' active' : '';
  const expandedClass = isExpanded ? ' expanded' : '';

  const tasksLabel = ms.total_tasks > 0
    ? `${ms.done_tasks}/${ms.total_tasks}`
    : '';

  let bodyHtml = '';
  if (isExpanded && entries.length > 0) {
    bodyHtml = `
      <div class="ms-entries">
        ${ms.description ? `<div class="ms-description">${esc(ms.description)}</div>` : ''}
        ${entries.map(renderEntry).join('')}
      </div>
    `;
  } else if (isExpanded && ms.description) {
    bodyHtml = `
      <div class="ms-entries">
        <div class="ms-description">${esc(ms.description)}</div>
      </div>
    `;
  }

  return `
    <div class="ms-card${activeClass}${expandedClass}">
      <div class="ms-card-header" data-ms-id="${ms.id}">
        ${statusBadge(ms.status)}
        <div class="ms-title-row">
          <span class="ms-id">${ms.id}</span>
          <span class="ms-title">${esc(ms.title)}</span>
        </div>
        <div class="ms-meta">
          ${tasksLabel ? `<span class="ms-tasks-text">${tasksLabel}</span>` : ''}
          <div class="ms-progress-bar">
            <div class="ms-progress-fill ${ms.status}" style="width: ${ms.progress || 0}%"></div>
          </div>
          <span class="ms-progress-text">${ms.progress || 0}%</span>
        </div>
      </div>
      <div class="ms-body">
        ${bodyHtml}
      </div>
    </div>
  `;
}

// ---- Retro ----

function renderRetroSection() {
  if (state.retroContent) {
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" onclick="closeRetro()">\u2190 back to list</span>
        <h3 style="font-size: 1rem; color: var(--text-primary); margin: 8px 0 16px;">${esc(state.retroContent.week)}</h3>
        <div class="retro-content">${esc(state.retroContent.content)}</div>
      </section>
    `;
  }

  if (state.retros.length === 0) {
    return `
      <section class="retro-section fade-in">
        <div class="retro-empty">No retrospective documents yet.</div>
      </section>
    `;
  }

  return `
    <section class="retro-section fade-in">
      <ul class="retro-list">
        ${state.retros.map(r => `
          <li class="retro-item" onclick="openRetro('${esc(r.week)}')">
            <span class="retro-item-week">${esc(r.week)}</span>
            <span class="retro-item-date">${r.updated_at ? r.updated_at.slice(0, 10) : ''}</span>
          </li>
        `).join('')}
      </ul>
    </section>
  `;
}

async function switchTab(tab) {
  state.activeTab = tab;
  state.retroContent = null;
  if (tab === 'retros' && state.retros.length === 0) {
    try {
      state.retros = await api(`/api/projects/${state.projectId}/retros`);
    } catch (e) {
      state.retros = [];
    }
  }
  render();
}

async function openRetro(week) {
  try {
    const data = await api(`/api/projects/${state.projectId}/retros/${week}`);
    state.retroContent = data;
  } catch (e) {
    state.retroContent = { week, content: 'Failed to load retro document.' };
  }
  render();
}

function closeRetro() {
  state.retroContent = null;
  render();
}

// ---- Interactions ----

async function selectProject(projectId) {
  state.projectId = projectId;
  state.activeTab = 'dashboard';
  state.retros = [];
  state.retroContent = null;
  state.statusFilter.clear();
  lastProjectJson = null;

  document.getElementById('app').innerHTML = `
    <div class="loading">
      <div class="loading-bar"></div>
      <div class="loading-text">Loading</div>
    </div>
  `;

  // Try WebSocket first
  connectWebSocket(projectId);

  // Also do an initial API fetch as fallback
  try {
    const data = await api(`/api/projects/${projectId}`);
    // Enrich client-side if WS hasn't delivered yet
    if (!state.project) {
      state.project = data;
      state.lastUpdate = new Date();
      // Auto-expand in_progress milestones
      for (const ms of data.milestones || []) {
        if (ms.status === 'in_progress') {
          state.expanded.add(ms.id);
        }
      }
      render();
    }
  } catch (e) {
    if (!state.project) {
      state.error = e.message;
      render();
    }
  }
}

function goBack() {
  closeWebSocket();
  state.project = null;
  state.projectId = null;
  state.expanded.clear();
  state.milestones = {};
  state.activeTab = 'dashboard';
  state.retros = [];
  state.retroContent = null;
  state.statusFilter.clear();
  lastProjectJson = null;
  render();
}

function toggleMilestone(msId) {
  if (state.expanded.has(msId)) {
    state.expanded.delete(msId);
  } else {
    state.expanded.add(msId);
  }
  render();
}

function clearFilters() {
  state.statusFilter.clear();
  render();
}

// ---- URL routing ----

function getProjectIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('project');
}

// ---- Init ----

async function init() {
  await loadAuthConfig();

  if (!isAuthenticated()) {
    function waitForGsi() {
      if (window.google?.accounts) {
        renderLogin();
      } else {
        setTimeout(waitForGsi, 100);
      }
    }
    waitForGsi();
    return;
  }

  const urlProjectId = getProjectIdFromUrl();

  if (urlProjectId) {
    await selectProject(urlProjectId);
  } else {
    await loadProjects();
    if (state.projects.length === 1) {
      await selectProject(state.projects[0].project_id);
    } else {
      render();
    }
  }
}

init();
</script>
