<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0c"/>
  <!-- Glow -->
  <circle cx="256" cy="220" r="200" fill="url(#glow)"/>
  <!-- Signal waves -->
  <path d="M 256 220 m -140 0 a 140 140 0 0 1 280 0" fill="none" stroke="#4ade80" stroke-width="6" stroke-opacity="0.2" stroke-linecap="round"/>
  <path d="M 256 220 m -100 0 a 100 100 0 0 1 200 0" fill="none" stroke="#4ade80" stroke-width="7" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M 256 220 m -60 0 a 60 60 0 0 1 120 0" fill="none" stroke="#4ade80" stroke-width="8" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- Beacon core (diamond/tower shape) -->
  <polygon points="256,140 280,220 256,380 232,220" fill="#4ade80"/>
  <!-- Center dot -->
  <circle cx="256" cy="220" r="16" fill="#fff"/>
  <!-- Base -->
  <rect x="226" y="370" width="60" height="12" rx="4" fill="#4ade80" opacity="0.6"/>
</svg>
