<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0c"/>
  <!-- Glow -->
  <circle cx="256" cy="190" r="180" fill="url(#glow)"/>
  <!-- Signal waves -->
  <path d="M 256 190 m -130 0 a 130 130 0 0 1 260 0" fill="none" stroke="#4ade80" stroke-width="6" stroke-opacity="0.2" stroke-linecap="round"/>
  <path d="M 256 190 m -90 0 a 90 90 0 0 1 180 0" fill="none" stroke="#4ade80" stroke-width="7" stroke-opacity="0.4" stroke-linecap="round"/>
  <path d="M 256 190 m -50 0 a 50 50 0 0 1 100 0" fill="none" stroke="#4ade80" stroke-width="8" stroke-opacity="0.7" stroke-linecap="round"/>
  <!-- Beacon core (diamond/tower shape) -->
  <polygon points="256,115 278,190 256,340 234,190" fill="#4ade80"/>
  <!-- Center dot -->
  <circle cx="256" cy="190" r="14" fill="#fff"/>
  <!-- Base -->
  <rect x="228" y="332" width="56" height="10" rx="4" fill="#4ade80" opacity="0.6"/>
  <!-- Text: Beacon -->
  <text x="256" y="430" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="56" font-weight="600" fill="#e4e4e8" letter-spacing="4">Beacon</text>
</svg>
