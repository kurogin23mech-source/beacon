[package]
name = "beacon-desktop"
version = "0.1.0"
description = "Beacon Desktop - Local AI project monitoring"
authors = ["r-kida2"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
notify = { version = "7", features = ["macos_fsevent"] }
ureq = { version = "2", features = ["json", "native-certs"] }
