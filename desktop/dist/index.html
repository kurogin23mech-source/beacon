// ---- Shared search partial-update (both Web and Desktop) ----

function renderMsListArea() {
  if (!state.project) return;
  const container = document.getElementById('ms-list-container');
  if (!container) {
    // The shell hasn't been mounted yet (e.g. WS pushed project data while
    // we're still on the loading screen). Promote to a full render so the
    // UI catches up; partial render alone would silently no-op and leave
    // the user stranded on "loading".
    //
    // Exception: if the user is mid-IME composition, a full render would
    // destroy the search input and force-confirm what they've typed. Defer
    // until compositionend.
    if (_isComposing) {
      _pendingDataRender = render;
      return;
    }
    render();
    return;
  }
  const filtered = filterMilestones(sortMilestones(state.project.milestones || []));
  container.innerHTML = state.searchQuery.trim() ? renderSearchResults() : `
    <div class="filter-bar">
      <button class="filter-btn f-all ${state.hiddenStatuses.size === 0 ? 'on' : 'off'}" data-action="filter-all">all</button>
      ${FILTER_ORDER.map(s => {
        const isOn = !state.hiddenStatuses.has(s);
        return `<button class="filter-btn ${isOn ? 'on' : 'off'} ${FILTER_CSS_CLASS[s] || ''}" data-action="filter-status" data-status="${s}">${STATUS_LABELS[s] || s}</button>`;
      }).join('')}
      <button class="sort-toggle" data-action="toggle-sort">${state.sortAsc ? '↑ ms-1 first' : '↓ latest first'}</button>
    </div>
    ${filtered.map((ms, i) => renderMilestoneCard(ms, i)).join('')}`;
  // Bind only within this container — avoids stacking duplicate handlers on the rest of the page
  container.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleAction));
}

// Smart re-render on data updates from WS / file watcher.
// (1) On the MS tab (non-graph), use renderMsListArea() (partial) so the outer
//     scroll container is not rebuilt.
// (2) Even with partial render, WKWebView cancels momentum scrolling if
//     innerHTML is rebuilt mid-scroll → defer until user stops scrolling.
//
// Scroll detection caveats:
//   - scroll events DON'T bubble by default → window-only listener misses
//     events from nested scroll containers. Use `capture: true` on document
//     to catch scroll on any element.
//   - On trackpads, `wheel` fires before scroll, and momentum continues
//     after the last scroll event. Cover both.
//   - touchmove for touch devices.
// 300ms quiet window — short enough to feel responsive, long enough to
// outlast trackpad momentum.
let _userScrolling = false;
let _scrollEndTimer = null;
let _pendingDataRender = null;
function _markUserScrolling() {
  _userScrolling = true;
  clearTimeout(_scrollEndTimer);
  _scrollEndTimer = setTimeout(() => {
    _userScrolling = false;
    if (_pendingDataRender) {
      const fn = _pendingDataRender;
      _pendingDataRender = null;
      fn();
    }
  }, 300);
}
document.addEventListener('scroll', _markUserScrolling, { capture: true, passive: true });
document.addEventListener('wheel', _markUserScrolling, { passive: true });
document.addEventListener('touchmove', _markUserScrolling, { passive: true });

function renderOnDataChange() {
  const doRender = () => {
    // Use the partial #main-content swap (no header/search-box re-render)
    // whenever the project is loaded. When showing the dashboard MS list,
    // prefer the even narrower renderMsListArea so the outer scroll container
    // stays intact.
    if (state.searchQuery.trim()) {
      renderMainContentArea();
    } else if (state.activeTab === 'dashboard' && !state.documentContent && !state.retroContent) {
      renderMsListArea();
    } else {
      render();
    }
  };
  // Defer renders while the user is scrolling (jitter avoidance) or composing
  // text in the search input (re-rendering the shell would destroy the input
  // mid-stroke and force-confirm partial IME composition).
  if (_userScrolling || _isComposing) {
    _pendingDataRender = doRender;
    return;
  }
  doRender();
}

// ms-43 e-631: debounced unified search dispatch.
let _searchDebounceTimer = null;
function _runUnifiedSearch() {
  const q = state.searchQuery.trim();
  if (!q) {
    state.searchResults = null;
    state.searchFacets = { type: {}, status: {}, priority: {}, scope: {} };
    state.searchTotal = 0;
    state.searchLoading = false;
    renderMainContentArea();
    return;
  }
  if (!dataSource.searchProject) {
    state.searchResults = null;
    renderMainContentArea();
    return;
  }
  state.searchLoading = true;
  const myToken = ++state.searchToken;
  renderMainContentArea();
  dataSource.searchProject({ q, limit: 200 })
    .then(resp => {
      if (myToken !== state.searchToken) return;
      state.searchResults = resp?.results || [];
      state.searchFacets = resp?.facets || { type: {}, status: {}, priority: {}, scope: {} };
      state.searchTotal = resp?.total || 0;
      state.searchLoading = false;
      renderMainContentArea();
    })
    .catch(() => {
      if (myToken !== state.searchToken) return;
      state.searchResults = null;
      state.searchLoading = false;
      renderMainContentArea();
    });
}

// IME composition handling: while the user is mid-composition (Japanese,
// Chinese, etc.), the `input` event fires for every interim character. If we
// updated state.searchQuery from those intermediate values and a re-render
// touched the input.value attribute, the IME's composition state would be
// destroyed, forcing the user to confirm partial characters.
//
// Strategy: ignore `input` while composing; sync state once on `compositionend`.
let _isComposing = false;

function _kickSearchAfterInput(value) {
  state.searchQuery = value;
  state.searchTypeFilter = new Set();
  renderMainContentArea();
  clearTimeout(_searchDebounceTimer);
  _searchDebounceTimer = setTimeout(_runUnifiedSearch, 200);
}

document.addEventListener('compositionstart', e => {
  if (e.target.id === 'search-input') _isComposing = true;
});
document.addEventListener('compositionend', e => {
  if (e.target.id === 'search-input') {
    _isComposing = false;
    _kickSearchAfterInput(e.target.value);
    // Drain any render that was deferred while composing (e.g. a WS push
    // that came in during typing).
    if (_pendingDataRender) {
      const fn = _pendingDataRender;
      _pendingDataRender = null;
      fn();
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'search-input') return;
  if (_isComposing) return;       // ← skip interim IME events
  if (e.isComposing) return;       // ← belt-and-suspenders for browsers that set this directly
  _kickSearchAfterInput(e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.searchQuery) {
    state.searchQuery = '';
    state.searchResults = null;
    state.searchTypeFilter = new Set();
    state.searchLoading = false;
    const input = document.getElementById('search-input');
    if (input) input.value = '';
    renderMainContentArea();
    input?.focus();
  }
});

// ---- Common action dispatch (ms-46 e-726) ----
// Handles state-only actions that behave identically on Web and Tauri.
// Each platform's handleAction calls this first; if it returns true, the action
// is already handled and the caller short-circuits. Platform-specific cases
// (data fetching, Tauri/Web-only commands) remain in each handleAction's switch.
//
// Adding a new state-only action? Add it here ONCE — both layers get it.
// Adding a data-source-specific action? Keep it in each handleAction (until
// e-728 DataSource adapter unifies the data layer).
function handleCommonAction(action, el) {
  switch (action) {
    case 'toggle-ms': {
      const msId = el.dataset.msId;
      const wasExpanded = state.expanded.has(msId);
      wasExpanded ? state.expanded.delete(msId) : state.expanded.add(msId);
      render();
      // ms-69 / e-1664: lazy-load related treks the first time this ms is
      // expanded. Re-renders the card in-place once the data lands; the
      // widget hides itself when the result is empty.
      if (!wasExpanded && state.relatedTreks['ms:' + msId] === undefined) {
        dataSource.loadRelatedTreks('milestone', msId).then(() => render());
      }
      return true;
    }
    case 'toggle-entry': {
      const eid = el.dataset.entryId;
      state.collapsedEntries.has(eid) ? state.collapsedEntries.delete(eid) : state.collapsedEntries.add(eid);
      render(); return true;
    }
    case 'toggle-hide-done': {
      const mid = el.dataset.msId;
      state.hideEntryDone.has(mid) ? state.hideEntryDone.delete(mid) : state.hideEntryDone.add(mid);
      render(); return true;
    }
    case 'toggle-show-cancelled': {
      const mid = el.dataset.msId;
      state.showCancelled.has(mid) ? state.showCancelled.delete(mid) : state.showCancelled.add(mid);
      render(); return true;
    }
    case 'filter-status': {
      const s = el.dataset.status;
      state.hiddenStatuses.has(s) ? state.hiddenStatuses.delete(s) : state.hiddenStatuses.add(s);
      render(); return true;
    }
    case 'filter-all':
      state.hiddenStatuses.clear(); render(); return true;
    case 'toggle-sort':
      state.sortAsc = !state.sortAsc; render(); return true;
    case 'toggle-release-graph':
      state.showReleaseGraph = !state.showReleaseGraph; render(); return true;
    case 'switch-releases-tab':
      state.releasesSubTab = el.dataset.subtab; render(); return true;
    case 'switch-deploy-env':
      state.selectedDeployEnv = el.dataset.env || null; render(); return true;
    case 'expand-push': {
      const pId = el.dataset.pushId;
      state.expandedPushId = state.expandedPushId === pId ? null : pId;
      render(); return true;
    }
    case 'expand-deploy': {
      const dId = el.dataset.deployId;
      state.expandedDeployId = state.expandedDeployId === dId ? null : dId;
      render(); return true;
    }
    case 'search-goto': {
      // Click on a search result: keep the search query/state intact so the
      // user can come back to it. For tasks/commits/saves, pop the entry
      // detail modal (no tab switch, no scroll). For milestones, switch to
      // the dashboard tab and scroll — they don't have a modal.
      const msId = el.dataset.msId;
      const entryId = el.dataset.entryId;
      if (typeof history !== 'undefined' && history.pushState) {
        if (entryId && entryId !== msId) {
          history.pushState(null, '', '#entry/' + entryId);
        } else if (msId) {
          history.pushState(null, '', '#ms/' + msId);
        }
      }
      if (entryId && entryId !== msId && typeof openEntryDetail === 'function') {
        openEntryDetail(entryId);
      } else if (msId) {
        state.searchQuery = '';
        state.searchResults = null;
        state.searchTypeFilter = new Set();
        state.activeTab = 'dashboard';
        state.expanded.add(msId);
        const input = document.getElementById('search-input');
        if (input) input.value = '';
        render();
        setTimeout(() => document.getElementById(`ms-${msId}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      }
      return true;
    }
    case 'search-filter-type': {
      // Facet chip: exclusive selection. Clicking the same chip again clears.
      const t = el.dataset.type || '';
      if (!t) {
        state.searchTypeFilter = new Set();
      } else if (state.searchTypeFilter.size === 1 && state.searchTypeFilter.has(t)) {
        state.searchTypeFilter = new Set();
      } else {
        state.searchTypeFilter = new Set([t]);
      }
      renderMainContentArea();
      return true;
    }
    case 'search-open-document': {
      // Document hit: open in overlay so the search query / filters / scroll
      // position are preserved when the user closes it (ms-43 e-796).
      const docId = el.dataset.docId;
      if (docId) openDocumentOverlay(docId);
      return true;
    }
    case 'close-document-overlay':
      closeDocumentOverlay(); return true;
    case 'documents-filter-scope': {
      // Documents-tab scope chip: exclusive (clicking same chip clears).
      const s = el.dataset.scope || '';
      state.documentsScopeFilter = (state.documentsScopeFilter === s) ? '' : s;
      render();
      return true;
    }
    // close-* / close-menu: each platform supplies its own helper
    // (history.pushState on Web, menu-root innerHTML on Tauri).
    // Dispatch by name. open-menu varies more (Web has openMenu wrapper,
    // Tauri jumps to renderMenu directly) — kept platform-specific.
    case 'close-document':
      closeDocument(); return true;
    case 'close-retro':
      closeRetro(); return true;
    case 'close-menu':
      if (typeof closeMenu === 'function') closeMenu();
      return true;
    case 'open-entry-detail':
      openEntryDetail(el.dataset.entryId); return true;
    case 'close-entry-modal':
      closeEntryModal(); return true;
    // ms-46 e-728: data-fetching actions now route through SHARED via DataSource.
    // Each platform supplies `dataSource` (Web SKIP: fetch/api; Tauri layer.js: invoke).
    case 'switch-tab':
      switchTab(el.dataset.tab); return true;
    case 'set-session-view':
      // ms-57 e-1041: in-tab toggle between Notes (live scratch) and
      // Session Log (per-session aggregated entries).
      state.sessionView = el.dataset.view === 'logs' ? 'logs' : 'notes';
      render();
      return true;
    case 'open-document':
      openDocument(el.dataset.docId); return true;
    case 'open-retro':
      openRetro(el.dataset.week); return true;
    // ms-69 / e-1659 — Trek detail
    case 'open-trek':
      openTrek(el.dataset.trekId); return true;
    case 'close-trek':
      closeTrek(); return true;
    // ms-86 / e-2133 — session ref (= s-N badge) クリックで実 session id を
    // clipboard にコピー + 短い toast 表示。
    case 'copy-trek-sid': {
      const sid = el.dataset.sid || '';
      if (!sid) return true;
      const fallbackToast = (txt) => _beaconShowToast(txt);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(sid).then(
            () => fallbackToast('Copied session id: ' + sid),
            () => fallbackToast('Copy failed — session id: ' + sid)
          );
        } else {
          // fallback: 古い browser / 非 secure context での execCommand 経路
          const ta = document.createElement('textarea');
          ta.value = sid;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (_e) { /* noop */ }
          document.body.removeChild(ta);
          fallbackToast('Copied session id: ' + sid);
        }
      } catch (_e) {
        fallbackToast('Copy failed — session id: ' + sid);
      }
      // visual feedback on the clicked badge (= short flash)
      try {
        el.classList.add('copied');
        setTimeout(() => { try { el.classList.remove('copied'); } catch (_e) {} }, 600);
      } catch (_e) { /* noop */ }
      return true;
    }
    // ms-69 / e-1659 v3 — sidebar trek nav + settings overlay
    case 'menu-open-trek':
      closeMenu(); openTrek(el.dataset.trekId); return true;
    case 'open-settings':
      openSettings(); return true;
    case 'close-settings':
      closeSettings(); return true;
    case 'settings-set-tab':
      setSettingsTab(el.dataset.tab); return true;
    case 'toggle-account-menu':
      toggleAccountMenu(); return true;
    case 'close-account-menu':
      closeAccountMenu(); return true;
    case 'goto-admin':
      gotoAdmin(); return true;
    case 'settings-switch-project': {
      // Peek at another project's members in Settings — does NOT switch the
      // currently-opened project. The user can return to the main project
      // view by closing Settings; their project context is preserved.
      const pid = el.value || el.dataset.projectId;
      if (pid) {
        state.settingsViewProjectId = pid;
        _resolveMyRole();
        renderSettings();
      }
      return true;
    }
    case 'settings-invite-member':
      _settingsInviteMember(); return true;
    // ms-82 / e-1972 — avatar-opened Profile modal save handler.
    // (Legacy Settings > Profile tab handler removed in e-1973.)
    case 'account-profile-save':
      _accountProfileSave(); return true;
    case 'display-name-prompt-save':
      _displayNamePromptSave(); return true;
    case 'display-name-prompt-dismiss':
      _displayNamePromptDismiss(); return true;
    case 'settings-cancel-invitation':
      // ms-78 e-1803 — Pending invitations row × button. Cancel handlers
      // attached at render time (= _settingsLoadInvitationList), so this
      // path is reached only if the row is re-rendered without that hook,
      // but registering the action keeps frontend-drift check happy and
      // gives a fallback bind.
      _settingsCancelInvitation({ currentTarget: el });
      return true;
    case 'settings-copy-invite-url':
      // ms-78 e-1803 — Copy invite URL button. Handler is attached inline
      // by _settingsInviteMember after the box is built, so this case is
      // mostly here for frontend-drift coverage. If the inline binding is
      // missing for any reason, fall back to copying from data-url.
      try {
        const u = el.dataset.url || '';
        if (u) navigator.clipboard.writeText(u);
      } catch (_) { /* noop */ }
      return true;
    case 'settings-archive-project':
      _settingsArchiveProject(); return true;
    case 'settings-export-json':
      if (typeof exportProject === 'function') exportProject(_settingsViewedProjectId());
      return true;
    // ms-69 / e-1664 — Related Treks widget on work item detail
    case 'trek-jump-from-widget': {
      const tid = el.dataset.trekId;
      // Close the entry modal (if open) so the Treks tab is unobstructed.
      if (state.openEntryId) closeEntryModal();
      switchTab('treks').then(() => openTrek(tid));
      return true;
    }
    // ms-69 / e-1659 v2 — trek detail STOP / Resume buttons surface the CLI
    // command (= editing is terminal-only per ux-principle-no-terminal CORE doc).
    case 'trek-cli-hint': {
      const cmd = el.dataset.cmd || '';
      try {
        if (navigator.clipboard) navigator.clipboard.writeText(cmd);
      } catch (_e) { /* noop */ }
      window.alert('Run this command in your terminal:\n\n' + cmd + '\n\n(copied to clipboard)');
      return true;
    }
    // ms-86 / e-2222 — TREK TASKS の MS / Op 行 chevron 経由の accordion
    // 開閉。 mockup L460-502 の collapsed / expanded 状態を user 操作で切替。
    case 'trek-scope-toggle': {
      const msId = el.dataset.ms || '';
      if (!msId) return true;
      if (!state.openTrekExpanded) state.openTrekExpanded = new Set();
      if (state.openTrekExpanded.has(msId)) state.openTrekExpanded.delete(msId);
      else state.openTrekExpanded.add(msId);
      render();
      return true;
    }
  }
  return false;
}

// ---- Entry detail modal (ms-46 e-740: moved into SHARED so Tauri can use it too) ----

function findEntryById(id, entries) {
  for (const e of entries || []) {
    if (e.id === id) return e;
    const found = findEntryById(id, e.entries);
    if (found) return found;
  }
  return null;
}

function findEntryInProject(id) {
  for (const ms of state.project?.milestones || []) {
    const found = findEntryById(id, ms.entries || []);
    if (found) return { entry: found, ms };
  }
  for (const op of state.project?.operations || []) {
    const found = findEntryById(id, op.entries || []);
    if (found) return { entry: found, op };
  }
  return null;
}

function openEntryDetail(entryId) {
  const result = findEntryInProject(entryId);
  if (!result) return;
  state.openEntryId = entryId;
  renderEntryModal(result.entry, result.ms || result.op);
  // ms-69 / e-1664: lazy-load related treks for this task entry. When the
  // data lands, re-render the modal so the widget appears (or stays empty,
  // in which case the widget is silent).
  if (state.relatedTreks['task:' + entryId] === undefined) {
    dataSource.loadRelatedTreks('task', entryId).then(() => {
      // Only re-render the modal if it's still showing the same entry.
      if (state.openEntryId === entryId) {
        renderEntryModal(result.entry, result.ms || result.op);
      }
    });
  }
}

function renderEntryModal(entry, parent) {
  const overlay = document.getElementById('entry-detail-modal');
  if (!overlay) return;

  const priority = entry.meta?.priority;
  const priorityBadge = priority ? `<span class="priority-badge priority-${priority}">${priority}</span>` : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';

  const motivation = entry.motivation
    ? `<div class="entry-modal-field modal-field-why"><div class="entry-modal-field-label">why</div>${esc(entry.motivation)}</div>` : '';
  const ac = entry.acceptance_criteria
    ? `<div class="entry-modal-field modal-field-ac"><div class="entry-modal-field-label">done when</div>${esc(entry.acceptance_criteria)}</div>` : '';
  const behavior = entry.behavior
    ? `<div class="entry-modal-field modal-field-behavior"><div class="entry-modal-field-label">behavior</div>${esc(entry.behavior)}</div>` : '';
  const resolves = entry.meta?.resolves
    ? `<div class="entry-modal-field modal-field-resolves"><div class="entry-modal-field-label">resolves</div>${esc(entry.meta.resolves)}</div>` : '';
  const detail = entry.detail
    ? `<div class="entry-modal-field modal-field-detail"><div class="entry-modal-field-label">detail</div>${esc(entry.detail)}</div>` : '';
  // e-976: surface done/cancel/restore reasons in modal with PR #N / e-XXX auto-links.
  const doneReason = renderReasonField(entry, 'done_reason', 'done reason');
  const cancelReason = renderReasonField(entry, 'cancel_reason', 'cancel reason');
  const restoreReason = renderReasonField(entry, 'restore_reason', 'restore reason');
  const reasonMissing = reasonMissingBadge(entry);

  const statusText = entryStatusText(entry);
  const msLabel = parent ? `<span style="color:var(--text-dim);font-size:11px;">${esc(parent.id)}</span>` : '';

  // ms-78 / e-1909 — show the human author in the modal (= clickable rows
  // surface display_name; the modal pins both display_name and email).
  const authorLabel = renderEntryAuthor(entry);
  const authorField = authorLabel
    ? `<div class="entry-modal-field modal-field-author"><div class="entry-modal-field-label">author</div>${authorLabel}</div>`
    : '';

  overlay.innerHTML = `
    <div class="entry-modal" onclick="event.stopPropagation()">
      <div class="entry-modal-header">
        ${entryTypeBadge(entry.type)}
        <span class="entry-modal-title">${esc(entry.id)}${hash} ${msLabel}</span>
        <button class="entry-modal-close" data-action="close-entry-modal">✕</button>
      </div>
      <div class="entry-modal-body">
        <div class="entry-modal-desc">${esc(entry.description)}</div>
        <div class="entry-modal-meta">${priorityBadge}${statusText}${reasonMissing}</div>
        ${authorField}${motivation}${ac}${behavior}${resolves}${detail}${doneReason}${cancelReason}${restoreReason}
        ${renderRelatedTreksWidget('task', entry.id)}
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
  overlay.querySelector('[data-action="close-entry-modal"]')?.addEventListener('click', closeEntryModal);
  overlay.querySelectorAll('[data-action="trek-jump-from-widget"]').forEach(node => {
    node.addEventListener('click', handleAction);
  });
}

function closeEntryModal() {
  state.openEntryId = null;
  const overlay = document.getElementById('entry-detail-modal');
  if (overlay) overlay.style.display = 'none';
}

// Document overlay (ms-43 e-796): open Markdown doc on top of current view
// without disturbing search / Documents list state. Used by search hits.
async function openDocumentOverlay(docId) {
  try {
    await dataSource.loadDocumentContent(docId);
    state.documentOverlay = state.documentContent;
    state.documentContent = null;
  } catch (e) {
    state.documentOverlay = { doc_id: docId, title: 'Error', content: 'Failed to load document.', scope: 'memo' };
  }
  renderDocumentOverlay();
}

function renderDocumentOverlay() {
  const overlay = document.getElementById('document-overlay-modal');
  if (!overlay) return;
  const d = state.documentOverlay;
  if (!d) { overlay.style.display = 'none'; overlay.innerHTML = ''; return; }
  const scope = d.scope || 'memo';
  overlay.innerHTML = `
    <div class="entry-modal entry-modal-wide" onclick="event.stopPropagation()">
      <div class="entry-modal-header">
        <span class="entry-modal-title">${scopeBadge(scope)}${esc(d.title || d.doc_id)}</span>
        <button class="entry-modal-close" data-action="close-document-overlay">✕</button>
      </div>
      <div class="entry-modal-body">
        <div class="doc-content">${marked.parse(d.content || '')}</div>
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
  overlay.querySelector('[data-action="close-document-overlay"]')?.addEventListener('click', closeDocumentOverlay);
}

function closeDocumentOverlay() {
  state.documentOverlay = null;
  const overlay = document.getElementById('document-overlay-modal');
  if (overlay) { overlay.style.display = 'none'; overlay.innerHTML = ''; }
}

// ms-70 / e-1718 — DM approval history (audit) row rendering.
//
// Lives inside the SHARED region so the Web build (server/static/index.html)
// and the Tauri build (desktop/dist/index.html generated by desktop/build.py)
// render the same audit table from the same source of truth. If the Tauri
// side ever wires up a Rust loader, it can reuse this helper unchanged.
//
// Read-only by design: per SPEC 設計方針 3 the approve/deny decision is
// made exclusively in the terminal Claude Code via `beacon dm respond`.
// The Web UI is the *aftermath* view — who decided what, when. There is
// no approve / deny button here and there must never be one (= violating
// the terminal-only invariant would let a curious browser tab smuggle a
// decision past the receiver's own typing).
//
// ``rows`` is the array returned by GET /api/projects/{pid}/dm/approval/history
// (server-side: db.list_decided_approvals). Each row is the 7-field
// sidecar shape; we surface 6 of them (sender / receiver / status /
// decision_at / decision_by / event_id) and omit ``created_at`` to keep
// the table scannable — created_at differs from decision_at only by the
// elapsed-pending time, which is rarely useful for human audit.
function renderDmApprovalHistoryRows(rows) {
  if (!Array.isArray(rows) || rows.length === 0) {
    return '<div class="menu-user" style="color:var(--text-dim);padding:12px;font-style:italic;">No approval history yet (= no DM actions have been approved or denied).</div>';
  }
  const head = `
    <thead>
      <tr>
        <th style="width:90px;">status</th>
        <th>sender</th>
        <th>receiver</th>
        <th style="width:140px;">decided at</th>
        <th>decided by</th>
        <th style="width:120px;">event_id</th>
      </tr>
    </thead>`;
  const body = rows.map(r => {
    const status = r.approval_status || '';
    const sender = r.sender_user_id || '';
    const receiver = r.receiver_user_id || '';
    const decidedAt = r.decision_at || '';
    const decidedBy = r.decision_by || '';
    const eid = r.event_id || '';
    // Color-tag approved / denied so the eye can sweep the column. Inline
    // styles only — no new CSS class needed (= minimal blast radius).
    const statusColor = status === 'approved'
      ? 'color:#7fb389;'
      : status === 'denied'
      ? 'color:#c97a7a;'
      : 'color:var(--text-dim);';
    return `
      <tr>
        <td><span style="${statusColor}font-weight:600;">${esc(status)}</span></td>
        <td><span style="font-size:0.72rem;">${esc(sender)}</span></td>
        <td><span style="font-size:0.72rem;">${esc(receiver)}</span></td>
        <td><span style="font-size:0.7rem;color:var(--text-dim);">${esc(decidedAt)}</span></td>
        <td><span style="font-size:0.72rem;">${esc(decidedBy)}</span></td>
        <td><span style="font-size:0.65rem;color:var(--text-dim);font-family:var(--font-mono,monospace);">${esc(eid)}</span></td>
      </tr>`;
  }).join('');
  return `
    <table class="settings-table">
      ${head}
      <tbody>${body}</tbody>
    </table>`;
}
</script>
