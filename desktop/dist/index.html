// Build hash → beacon entry map from all milestone entries
function buildHashEntryMap(project) {
  const map = {};
  function scan(entries) {
    for (const e of entries) {
      if (e.type === 'commit') {
        const h = (e.meta || {}).hash || '';
        if (h) map[h] = { id: e.id || '', description: e.description || '', hash: h };
      }
      if (e.entries) scan(e.entries);
    }
  }
  for (const ms of project.milestones || []) scan(ms.entries || []);
  return map;
}

function lookupEntry(hashMap, shortHash) {
  if (!shortHash) return null;
  if (hashMap[shortHash]) return hashMap[shortHash];
  for (const [k, v] of Object.entries(hashMap)) {
    if (k.startsWith(shortHash) || shortHash.startsWith(k)) return v;
  }
  return null;
}

function renderReleasesSection() {
  const p = state.project;
  const subtabs = `<div class="releases-subtabs">
    <button class="releases-subtab-btn ${state.releasesSubTab === 'service' ? 'active' : ''}" data-action="switch-releases-tab" data-subtab="service">サービス</button>
    <button class="releases-subtab-btn ${state.releasesSubTab === 'code' ? 'active' : ''}" data-action="switch-releases-tab" data-subtab="code">コード</button>
  </div>`;

  if (state.releasesSubTab === 'code') {
    return `<section class="retro-section fade-in"><div>${subtabs}${renderCodeReleasesTab(p)}</div></section>`;
  }

  const allDeps = p?.deployments || [];
  const releases = {};
  for (const r of (p?.releases || [])) releases[r.id] = r;

  if (allDeps.length === 0) {
    return `<section class="retro-section fade-in"><div>${subtabs}
      <div class="retro-empty">No deployments recorded yet.<br>
        <span style="font-size:0.75rem;color:var(--text-dim)">Run <code>beacon deploy record</code> after each deploy.</span>
      </div></div>
    </section>`;
  }

  const hashMap = buildHashEntryMap(p);
  const msTitle = id => p?.milestones?.find(m => m.id === id)?.title || id;

  // Build deploy-id → release mapping (from release.deploy_ids only, not from deploy.linked_release)
  const deployToRelease = {};
  for (const r of Object.values(releases)) {
    for (const id of (r.deploy_ids || [])) deployToRelease[id] = r;
  }

  // Collect unique environments for filter buttons
  const envSet = new Set(allDeps.map(d => d.environment || 'prod'));
  const envList = [...envSet].sort();

  // Filter by selected environment
  const filtered = state.selectedDeployEnv
    ? allDeps.filter(d => (d.environment || 'prod') === state.selectedDeployEnv)
    : allDeps;

  // Sort newest first
  const sorted = filtered.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function deployDetail(d) {
    const mcMap = d.milestone_commits;
    if (!mcMap || !Object.keys(mcMap).length) {
      const badges = (d.milestones || []).map(id =>
        `<span class="release-ms-badge">${esc(id)}</span>`).join('');
      return badges ? `<div class="deploy-ms-badges">${badges}</div>` : '';
    }
    const newlyDone = new Set(d.newly_completed_ms || []);
    // completions first, patches after
    const sorted = Object.entries(mcMap).sort(([a],[b]) =>
      (newlyDone.has(b)?1:0) - (newlyDone.has(a)?1:0));
    let h = '<div class="deploy-detail">';
    for (const [msId, hashes] of sorted) {
      const completion = newlyDone.has(msId);
      // Minor deploys cannot have MS release
      const blockType = (d.type === 'minor') ? 'patch' : (completion ? 'completion' : 'patch');
      h += `<div class="deploy-ms-block ${blockType}">
        <div class="deploy-ms-block-header">
          <span class="deploy-ms-type-label">${blockType === 'completion' ? 'MS release' : 'MS patch'}</span>
          <span class="deploy-ms-block-id">${esc(msId)}</span>
          <span class="deploy-ms-block-title">${esc(msTitle(msId))}</span>
        </div>
        <div class="deploy-commit-list">`;
      for (const hash of hashes) {
        const entry = lookupEntry(hashMap, hash);
        h += `<div class="deploy-commit-row">
          <span class="deploy-commit-label">commit</span>
          <span class="deploy-commit-eid">${esc(entry?.id || '')}</span>
          <span class="deploy-commit-desc">${esc(entry?.description || hash)}</span>
          <code class="deploy-commit-hash">${esc(hash.slice(0,7))}</code>
        </div>`;
      }
      h += `</div></div>`;
    }
    const unassigned = d.unassigned_commits || [];
    if (unassigned.length) {
      h += `<div class="deploy-ms-block untracked">
        <div class="deploy-ms-block-header"><span class="deploy-ms-type-label">untracked</span></div>
        <div class="deploy-commit-list">`;
      for (const hash of unassigned) {
        h += `<div class="deploy-commit-row">
          <span class="deploy-commit-label">commit</span>
          <code class="deploy-commit-hash">${esc(hash.slice(0,7))}</code>
        </div>`;
      }
      h += `</div></div>`;
    }
    return h + '</div>';
  }

  function deployCard(d) {
    const isMajor = d.type === 'major';
    const expanded = state.expandedDeployId === d.id;
    const dot = `<span class="deploy-type-dot ${isMajor?'major':'minor'}">${isMajor?'◉':'○'}</span>`;
    let h = `<div class="deploy-card ${isMajor?'is-major':'is-minor'}" data-action="expand-deploy" data-deploy-id="${esc(d.id)}" style="cursor:pointer;">
      <div class="deploy-card-header">
        ${dot}
        <span class="deploy-id">${esc(d.id)}</span>
        <span class="deploy-env-badge">${esc(d.environment||'prod')}</span>
        <span class="deploy-datetime">${esc(fmtDate(d.date))}</span>
        <span class="deploy-expand-arrow">${expanded?'▲':'▼'}</span>
      </div>
      <div class="deploy-desc">${esc(d.description||'')}</div>`;
    if (expanded) {
      h += deployDetail(d);
    } else {
      const newlyDone = new Set(d.newly_completed_ms || []);
      const badges = (d.milestones||[]).map(id => {
        const isCompletion = d.type !== 'minor' && newlyDone.has(id);
        const isPatch = !isCompletion;
        const cls = isCompletion ? 'release-ms-badge-completion' : 'release-ms-badge-patch';
        return `<span class="${cls}">${esc(id)}</span>`;
      }).join('');
      if (badges) h += `<div class="deploy-ms-badges">${badges}</div>`;
    }
    return h + '</div>';
  }

  // Env filter bar (only shown when multiple environments exist)
  const envFilter = envList.length > 1 ? `<div class="deploy-env-filter">
    <button class="deploy-env-btn ${!state.selectedDeployEnv ? 'active' : ''}" data-action="switch-deploy-env" data-env="">すべて</button>
    ${envList.map(e => `<button class="deploy-env-btn ${state.selectedDeployEnv === e ? 'active' : ''}" data-action="switch-deploy-env" data-env="${esc(e)}">${esc(e)}</button>`).join('')}
  </div>` : '';

  let html = `<section class="retro-section fade-in"><div>${subtabs}${envFilter}`;

  // Render purely chronologically; insert release header before the first deploy in that release
  const shownReleases = new Set();
  for (const d of sorted) {
    const rel = deployToRelease[d.id];
    if (rel && !shownReleases.has(rel.id)) {
      shownReleases.add(rel.id);
      const sv = rel.semver ? `<span class="release-group-semver">${esc(rel.semver)}</span>` : '';
      html += `<div class="release-group-header"><span>${esc(rel.id)}</span>${sv}</div>`;
    }
    html += deployCard(d);
  }

  return html + `</div></section>`;
}

function renderCodeReleasesTab(p) {

function renderOperationsSection() {
  const p = state.project;
  const allOps = p.operations || [];
  const activeOps = allOps.filter(o => o.status === 'open');
  const pendingOps = allOps.filter(o => o.status === 'todo' || o.status === 'in_progress');
  const closedOps = allOps.filter(o => o.status === 'closed');

  const runIcon = s => s === 'ok' ? '✓' : s === 'warning' ? '⚠' : s === 'error' ? '✗' : '?';
  const runColor = s => s === 'ok' ? 'var(--green)' : s === 'warning' ? 'var(--warn,#f0b429)' : s === 'error' ? 'var(--red,#e55)' : 'var(--text-dim)';

  const renderOp = (op) => {
    const entries = op.entries || [];
    const opTasks = entries.filter(e => e.type === 'operation_task');
    const opTasksDone = opTasks.filter(t => t.status === 'done').length;
    const runs = entries.filter(e => e.type === 'run_record').slice(-5).reverse();
    const incidents = entries.filter(e => e.type === 'incident' && e.status === 'open');
    const resolvedIncidents = entries.filter(e => e.type === 'incident' && e.status === 'resolved');

    const status = op.status || 'open';
    const statusBadge = `<span class="op-status-badge ${status}">${status}</span>`;
    const priorityBadge = op.priority ? `<span class="priority-badge priority-${op.priority}">${op.priority}</span>` : '';

    const objectiveBlock = op.objective
      ? `<div class="op-meta-block op-meta-objective"><div class="op-meta-label">objective</div>${esc(op.objective)}</div>` : '';
    const hintBlock = op.activation_hint
      ? `<div class="op-meta-block op-meta-hint"><div class="op-meta-label">activation hint</div>${esc(op.activation_hint)}</div>` : '';

    const opTasksHtml = opTasks.length ? `
      <div class="op-tasks">
        <div class="op-section-label">OperationTasks <span class="op-task-progress">(${opTasksDone}/${opTasks.length} 完了)</span></div>
        ${opTasks.map(t => {
          const isDone = t.status === 'done';
          const icon = isDone ? '●' : '○';
          const pri = t.meta?.priority ? `<span class="priority-badge priority-${t.meta.priority}">${t.meta.priority}</span>` : '';
          return `<div class="op-task-row ${isDone ? 'done' : ''}" data-action="open-entry-detail" data-entry-id="${esc(t.id)}">
            <span class="op-task-status">${icon}</span>
            <span class="op-task-desc">${esc(t.description||'')}</span>
            ${pri}
          </div>`;
        }).join('')}
      </div>` : '';

    const runsHtml = (status === 'open') ? `
      <div class="op-runs">
        <div class="op-section-label">Run Records</div>
        ${runs.length ? runs.map(r => `
          <div class="op-run-row">
            <span style="color:${runColor(r.status)};font-size:0.85em;">${runIcon(r.status)}</span>
            <span class="op-run-date">${(r.date||'').slice(0,10)}</span>
            <span class="op-run-batch">${esc(r.batch||'')}</span>
            <span class="op-run-desc">${esc(r.description||'')}</span>
          </div>`).join('') : '<div class="op-empty">まだ記録なし</div>'}
      </div>` : '';

    const incidentsHtml = incidents.map(i => `
      <div class="op-incident open">
        <span class="op-incident-icon">⚠</span>
        <span class="op-incident-id">[${esc(i.id)}]</span>
        <span class="op-incident-title">${esc(i.title||'')}</span>
        <span class="op-incident-date">${(i.opened_at||'').slice(0,10)}</span>
      </div>`).join('');

    const resolvedHtml = resolvedIncidents.slice(-3).map(i => `
      <div class="op-incident resolved">
        <span class="op-incident-icon" style="color:var(--text-dim)">✓</span>
        <span class="op-incident-id">[${esc(i.id)}]</span>
        <span class="op-incident-title" style="color:var(--text-dim)">${esc(i.title||'')}</span>
        <span class="op-incident-date">${(i.resolved_at||'').slice(0,10)}</span>
      </div>`).join('');

    return `
    <div class="op-card">
      <div class="op-header">
        <span class="op-id">${esc(op.id)}</span>
        <span class="op-title">${esc(op.title||'')}</span>
        ${statusBadge}
        ${priorityBadge}
        <span class="op-badge">${esc((op.schedule||{}).frequency||'')}</span>
        <span class="op-source">${esc(op.log_source||'')}</span>
        ${incidents.length ? `<span class="op-incident-count">⚠ ${incidents.length}件</span>` : ''}
      </div>
      ${objectiveBlock}${hintBlock}
      ${opTasksHtml}
      ${runsHtml}
      ${incidents.length || resolvedIncidents.length ? `
      <div class="op-incidents">
        <div class="op-section-label">Incidents</div>
        ${incidentsHtml}${resolvedHtml}
      </div>` : ''}
    </div>`;
  };

  const summary = [
    activeOps.length ? `${activeOps.length} active` : '',
    pendingOps.length ? `${pendingOps.length} pending` : '',
    closedOps.length ? `${closedOps.length} closed` : '',
  ].filter(Boolean).join(' · ');

  return `<section class="retro-section fade-in">
    <div style="margin-bottom:12px;font-size:0.78rem;color:var(--text-dim);">
      ${summary || 'No operations.'}
    </div>

    <details open style="margin-top:16px;">
      <summary style="font-size:0.75rem;color:var(--text-dim);cursor:pointer;">Pending Operations (${pendingOps.length})</summary>
      <div style="margin-top:8px;">${pendingOps.map(renderOp).join('')}</div>
    </details>` : ''}
    ${closedOps.length ? `
    <details style="margin-top:16px;">
      <summary style="font-size:0.75rem;color:var(--text-dim);cursor:pointer;">Closed Operations (${closedOps.length})</summary>
      <div style="margin-top:8px;opacity:0.6;">${closedOps.map(renderOp).join('')}</div>
    </details>` : ''}
  </section>`;
}

          <span style="font-size:0.72rem;color:var(--text-dim);">Claude Codeで「メモして」と言うか、<code>beacon note "text"</code> で追加できます。</span>
        </div>`
      : noteRows}
    ${notes.length > 0 ? `<div style="margin-top:12px;font-size:0.7rem;color:var(--text-dim);">${notes.length}件 · beacon note clear でクリア</div>` : ''}
  </section>`;
}


function renderGraphSection() {
  const p = state.project;
  const header = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
    <span class="retro-back" data-action="hide-graph">← back</span>
    <button class="sort-toggle" data-action="toggle-graph-filter" style="font-size:0.7rem;">${state.graphFilterDeps ? 'deps only ✓' : 'show all'}</button>
  </div>`;

  if (!p || !p.milestones || p.milestones.length === 0) {
    return `<section class="graph-section fade-in">${header}<div class="graph-empty">No milestones.</div></section>`;
  }

  const fullGraph = buildGraph(p.milestones);
  if (fullGraph.edges.length === 0) {
    return `<section class="graph-section fade-in">${header}<div class="graph-empty">No dependencies defined yet.<br><span style="font-size:0.7rem;color:var(--text-dim)">Use <code>beacon milestone depends ms-X --on ms-Y</code> to add.</span></div></section>`;
  }

  let milestones = p.milestones;
  if (state.graphFilterDeps) {
    const connected = new Set();
    for (const e of fullGraph.edges) { connected.add(e.from); connected.add(e.to); }
    milestones = milestones.filter(ms => connected.has(ms.id));
  }
  const graph = state.graphFilterDeps ? buildGraph(milestones) : fullGraph;

  if (graph.edges.length === 0) {
    return `<section class="graph-section fade-in">${header}<div class="graph-empty">No dependencies defined yet.<br><span style="font-size:0.7rem;color:var(--text-dim)">Use <code>beacon milestone depends ms-X --on ms-Y</code> to add.</span></div></section>`;
  }

  // Layout: waves flow left-to-right, nodes stacked vertically within each wave
  const nodeW = 180;
  const nodeH = 52;
  const waveGap = 60;
  const nodeGap = 16;
  const padX = 40;
  const padY = 32;

  // Assign positions
  const pos = {};
  let maxRow = 0;
  for (const w of graph.waves) {
    maxRow = Math.max(maxRow, w.milestones.length);
  }

  for (let wi = 0; wi < graph.waves.length; wi++) {
    const wave = graph.waves[wi];
    const count = wave.milestones.length;
    const startY = (maxRow - count) * (nodeH + nodeGap) / 2;
    for (let ni = 0; ni < count; ni++) {
      pos[wave.milestones[ni]] = {
        x: padX + wi * (nodeW + waveGap),
        y: padY + startY + ni * (nodeH + nodeGap),
      };
    }
  }

  const svgW = padX * 2 + graph.waves.length * (nodeW + waveGap) - waveGap;
  const svgH = padY * 2 + maxRow * (nodeH + nodeGap) - nodeGap;

  // Build SVG
  const nodeMap = {};
  for (const n of graph.nodes) nodeMap[n.id] = n;

  let edgeSvg = '';
  for (const e of graph.edges) {
    const from = pos[e.from];
    const to = pos[e.to];
    if (!from || !to) continue;

    // Edge: from depends on to, arrow from "to" to "from" (dependency flows right)
    const x1 = to.x + nodeW;
    const y1 = to.y + nodeH / 2;
    const x2 = from.x;
    const y2 = from.y + nodeH / 2;

    const cx1 = x1 + (x2 - x1) * 0.4;
    const cx2 = x1 + (x2 - x1) * 0.6;

    const cls = e.type === 'cross_task' ? ' cross-task' : '';
    edgeSvg += `<path class="graph-edge${cls}" d="M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}" />`;
  }

  let nodeSvg = '';
  for (const n of graph.nodes) {
    const p = pos[n.id];
    if (!p) continue;
    const fill = GRAPH_STATUS_COLORS[n.status] || GRAPH_STATUS_COLORS.todo;
    const stroke = GRAPH_STATUS_STROKES[n.status] || GRAPH_STATUS_STROKES.todo;
    const titleTrunc = n.title.length > 20 ? n.title.slice(0, 19) + '\u2026' : n.title;

    nodeSvg += `
      <g class="graph-node" transform="translate(${p.x},${p.y})">
        <rect width="${nodeW}" height="${nodeH}" fill="${fill}" stroke="${stroke}" />
        <text class="node-id" x="8" y="16">${esc(n.id)}</text>
        <text x="8" y="32">${esc(titleTrunc)}</text>
        <text class="node-progress" x="${nodeW - 8}" y="16" text-anchor="end">${n.progress}%</text>
      </g>`;
  }

  // Wave labels
  let waveSvg = '';
  for (let wi = 0; wi < graph.waves.length; wi++) {
    const x = padX + wi * (nodeW + waveGap) + nodeW / 2;
    waveSvg += `<text x="${x}" y="18" text-anchor="middle" fill="var(--text-dim)" font-size="10" font-family="var(--font-mono)">wave ${graph.waves[wi].wave}${graph.waves[wi].cycle ? ' (cycle)' : ''}</text>`;
  }

  const legendItems = [
    { label: 'done', color: GRAPH_STATUS_STROKES.done },
    { label: 'in_progress', color: GRAPH_STATUS_STROKES.in_progress },
    { label: 'todo', color: GRAPH_STATUS_STROKES.todo },
    { label: 'observing', color: GRAPH_STATUS_STROKES.observing },
    { label: 'waiting', color: GRAPH_STATUS_STROKES.waiting },
  ];

  return `
    <section class="graph-section fade-in">
      ${header}
      <div class="graph-container">
        <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="var(--border)" />
            </marker>
          </defs>
          ${waveSvg}
          ${edgeSvg}
          ${nodeSvg}
        </svg>
      </div>
      <div class="graph-legend">
        ${legendItems.map(l => `<div class="graph-legend-item"><div class="graph-legend-swatch" style="background:${l.color}"></div>${l.label}</div>`).join('')}
      </div>
    </section>`;
}

// ---- Shared search partial-update (both Web and Desktop) ----

function renderMsListArea() {
  const container = document.getElementById('ms-list-container');
  if (!container || !state.project) return;
  const filtered = filterMilestones(sortMilestones(state.project.milestones || []));
  container.innerHTML = state.searchQuery.trim() ? renderSearchResults() : `
    <div class="filter-bar">
      <button class="filter-btn f-all ${state.hiddenStatuses.size === 0 ? 'on' : 'off'}" data-action="filter-all">all</button>
      ${FILTER_ORDER.map(s => {
        const isOn = !state.hiddenStatuses.has(s);
        return `<button class="filter-btn ${isOn ? 'on' : 'off'} ${FILTER_CSS_CLASS[s] || ''}" data-action="filter-status" data-status="${s}">${STATUS_LABELS[s] || s}</button>`;
      }).join('')}
      <button class="sort-toggle" data-action="toggle-sort">${state.sortAsc ? '↑ ms-1 first' : '↓ latest first'}</button>
    </div>
    ${filtered.map((ms, i) => renderMilestoneCard(ms, i)).join('')}`;
  // Bind only within this container — avoids stacking duplicate handlers on the rest of the page
  container.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleAction));
}

// Smart re-render on data updates from WS / file watcher.
// (1) On the MS tab (non-graph), use renderMsListArea() (partial) so the outer
//     scroll container is not rebuilt.
// (2) Even with partial render, WKWebView cancels momentum scrolling if
//     innerHTML is rebuilt mid-scroll → defer until user stops scrolling.
//
// Scroll detection caveats:
//   - scroll events DON'T bubble by default → window-only listener misses
//     events from nested scroll containers. Use `capture: true` on document
//     to catch scroll on any element.
//   - On trackpads, `wheel` fires before scroll, and momentum continues
//     after the last scroll event. Cover both.
//   - touchmove for touch devices.
// 300ms quiet window — short enough to feel responsive, long enough to
// outlast trackpad momentum.
let _userScrolling = false;
let _scrollEndTimer = null;
let _pendingDataRender = null;
function _markUserScrolling() {
  _userScrolling = true;
  clearTimeout(_scrollEndTimer);
  _scrollEndTimer = setTimeout(() => {
    _userScrolling = false;
    if (_pendingDataRender) {
      const fn = _pendingDataRender;
      _pendingDataRender = null;
      fn();
    }
  }, 300);
}
document.addEventListener('scroll', _markUserScrolling, { capture: true, passive: true });
document.addEventListener('wheel', _markUserScrolling, { passive: true });
document.addEventListener('touchmove', _markUserScrolling, { passive: true });

function renderOnDataChange() {
  const doRender = () => {
    // The MS list tab is internally called 'dashboard' (see tab-btn data-tab="dashboard").
    // Use renderMsListArea (partial) on that tab to keep the outer scroll container
    // intact and avoid restarting fade-in animations on every WS update.
    if (state.activeTab === 'dashboard' && !state.showGraph && !state.documentContent && !state.retroContent) {
      renderMsListArea();
    } else {
      render();
    }
  };
  if (_userScrolling) {
    // Coalesce — keep only the latest pending render; state has the freshest data
    _pendingDataRender = doRender;
    return;
  }
  doRender();
}

document.addEventListener('input', e => {
  if (e.target.id === 'search-input') {
    state.searchQuery = e.target.value;
    renderMsListArea();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.searchQuery) {
    state.searchQuery = '';
    renderMsListArea();
    document.getElementById('search-input')?.focus();
  }
});

// ---- Common action dispatch (ms-46 e-726) ----
// Handles state-only actions that behave identically on Web and Tauri.
// Each platform's handleAction calls this first; if it returns true, the action
// is already handled and the caller short-circuits. Platform-specific cases
// (data fetching, Tauri/Web-only commands) remain in each handleAction's switch.
//
// Adding a new state-only action? Add it here ONCE — both layers get it.
// Adding a data-source-specific action? Keep it in each handleAction (until
// e-728 DataSource adapter unifies the data layer).
function handleCommonAction(action, el) {
  switch (action) {
    case 'toggle-ms': {
      const msId = el.dataset.msId;
      state.expanded.has(msId) ? state.expanded.delete(msId) : state.expanded.add(msId);
      render(); return true;
    }
    case 'toggle-entry': {
      const eid = el.dataset.entryId;
      state.collapsedEntries.has(eid) ? state.collapsedEntries.delete(eid) : state.collapsedEntries.add(eid);
      render(); return true;
    }
    case 'toggle-hide-done': {
      const mid = el.dataset.msId;
      state.hideEntryDone.has(mid) ? state.hideEntryDone.delete(mid) : state.hideEntryDone.add(mid);
      render(); return true;
    }
    case 'filter-status': {
      const s = el.dataset.status;
      state.hiddenStatuses.has(s) ? state.hiddenStatuses.delete(s) : state.hiddenStatuses.add(s);
      render(); return true;
    }
    case 'filter-all':
      state.hiddenStatuses.clear(); render(); return true;
    case 'toggle-sort':
      state.sortAsc = !state.sortAsc; render(); return true;
    case 'show-graph':
      state.showGraph = true; render(); return true;
    case 'hide-graph':
      state.showGraph = false; render(); return true;
    case 'toggle-graph-filter':
      state.graphFilterDeps = !state.graphFilterDeps; render(); return true;
    case 'toggle-release-graph':
      state.showReleaseGraph = !state.showReleaseGraph; render(); return true;
    case 'switch-releases-tab':
      state.releasesSubTab = el.dataset.subtab; render(); return true;
    case 'switch-deploy-env':
      state.selectedDeployEnv = el.dataset.env || null; render(); return true;
    case 'expand-push': {
      const pId = el.dataset.pushId;
      state.expandedPushId = state.expandedPushId === pId ? null : pId;
      render(); return true;
    }
    case 'expand-deploy': {
      const dId = el.dataset.deployId;
      state.expandedDeployId = state.expandedDeployId === dId ? null : dId;
      render(); return true;
    }
    case 'search-goto': {
      const msId = el.dataset.msId;
      state.searchQuery = '';
      state.activeTab = 'dashboard';
      state.expanded.add(msId);
      render();
      setTimeout(() => document.getElementById(`ms-${msId}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      return true;
    }
    // close-* / close-menu: each platform supplies its own helper
    // (history.pushState on Web, menu-root innerHTML on Tauri).
    // Dispatch by name. open-menu varies more (Web has openMenu wrapper,
    // Tauri jumps to renderMenu directly) — kept platform-specific.
    case 'close-document':
      closeDocument(); return true;
    case 'close-retro':
      closeRetro(); return true;
    case 'close-menu':
      if (typeof closeMenu === 'function') closeMenu();
      return true;
    case 'open-entry-detail':
      openEntryDetail(el.dataset.entryId); return true;
    case 'close-entry-modal':
      closeEntryModal(); return true;
  }
  return false;
}

// ---- Entry detail modal (ms-46 e-740: moved into SHARED so Tauri can use it too) ----

function findEntryById(id, entries) {
  for (const e of entries || []) {
    if (e.id === id) return e;
    const found = findEntryById(id, e.entries);
    if (found) return found;
  }
  return null;
}

function findEntryInProject(id) {
  for (const ms of state.project?.milestones || []) {
    const found = findEntryById(id, ms.entries || []);
    if (found) return { entry: found, ms };
  }
  for (const op of state.project?.operations || []) {
    const found = findEntryById(id, op.entries || []);
    if (found) return { entry: found, op };
  }
  return null;
}

function openEntryDetail(entryId) {
  const result = findEntryInProject(entryId);
  if (!result) return;
  state.openEntryId = entryId;
  renderEntryModal(result.entry, result.ms || result.op);
}

function renderEntryModal(entry, parent) {
  const overlay = document.getElementById('entry-detail-modal');
  if (!overlay) return;

  const priority = entry.meta?.priority;
  const priorityBadge = priority ? `<span class="priority-badge priority-${priority}">${priority}</span>` : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';

  const motivation = entry.motivation
    ? `<div class="entry-modal-field modal-field-why"><div class="entry-modal-field-label">why</div>${esc(entry.motivation)}</div>` : '';
  const ac = entry.acceptance_criteria
    ? `<div class="entry-modal-field modal-field-ac"><div class="entry-modal-field-label">done when</div>${esc(entry.acceptance_criteria)}</div>` : '';
  const behavior = entry.behavior
    ? `<div class="entry-modal-field modal-field-behavior"><div class="entry-modal-field-label">behavior</div>${esc(entry.behavior)}</div>` : '';
  const resolves = entry.meta?.resolves
    ? `<div class="entry-modal-field modal-field-resolves"><div class="entry-modal-field-label">resolves</div>${esc(entry.meta.resolves)}</div>` : '';
  const detail = entry.detail
    ? `<div class="entry-modal-field modal-field-detail"><div class="entry-modal-field-label">detail</div>${esc(entry.detail)}</div>` : '';

  const statusText = entryStatusText(entry);
  const msLabel = parent ? `<span style="color:var(--text-dim);font-size:11px;">${esc(parent.id)}</span>` : '';

  overlay.innerHTML = `
    <div class="entry-modal" onclick="event.stopPropagation()">
      <div class="entry-modal-header">
        ${entryTypeBadge(entry.type)}
        <span class="entry-modal-title">${esc(entry.id)}${hash} ${msLabel}</span>
        <button class="entry-modal-close" data-action="close-entry-modal">✕</button>
      </div>
      <div class="entry-modal-body">
        <div class="entry-modal-desc">${esc(entry.description)}</div>
        <div class="entry-modal-meta">${priorityBadge}${statusText}</div>
        ${motivation}${ac}${behavior}${resolves}${detail}
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
  overlay.querySelector('[data-action="close-entry-modal"]')?.addEventListener('click', closeEntryModal);
}

function closeEntryModal() {
  state.openEntryId = null;
  const overlay = document.getElementById('entry-detail-modal');
  if (overlay) overlay.style.display = 'none';
}
</script>
