// ms-86 v2 (= e-2126 mockup) — TREK TASKS / MEMBERS table / ACTIVITY helpers.
//
// _trekTaskStateLabel — return the 5-state token for a scope entry, looking
// it up in trek_doc.task_states. Defaults to "todo" when the executor has
// not stamped yet (= same default as lib/trek.get_task_state).
function _trekTaskStateLabel(t, taskId) {
  const states = t.task_states || {};
  const entry = states[taskId] || {};
  const raw = entry.state || 'todo';
  // Mirror lib/trek.LEGACY_TASK_STATE_MIGRATIONS so legacy data still renders.
  if (raw === 'waiting-review') return 'leader_review';
  return raw;
}

// _trekTaskAssignee — short session id of whoever last stamped the task
// state. Returns '' when nobody has touched it yet so the column reads as
// "unassigned" (= dash) instead of an empty cell.
function _trekTaskAssignee(t, taskId) {
  const entry = (t.task_states || {})[taskId] || {};
  return entry.updated_by_session_id || '';
}

// _trekLookupTask — find a task entry inside the Trek's cross-project
// scope aggregate. ms-86 / e-2249: this used to read ``state.project``
// (= the project that happened to be currently open), which broke for
// cross-project Treks where the user might be on a different project
// or no project at all. The aggregate is now fetched up-front by
// ``dataSource.loadTrekScope`` and lives at ``state.openTrekScope``;
// pass it in explicitly so the dependency is visible in the signature.
//
// @param {{milestones:Array, operations:Array, tasks:Array}|null} scope
//   Cross-project Trek scope aggregate (= state.openTrekScope shape).
//   ``null`` / empty arrays are tolerated — the function returns null
//   and callers fall back to rendering the bare scope id.
// @param {string} taskId  Target task entry id (= ``e-XXXX``).
// @returns {{entry:Object, ms_id:string, ms_title?:string,
//            op_id?:string, op_title?:string, project_id?:string}|null}
function _trekLookupTask(scope, taskId) {
  if (!scope || !taskId) return null;
  for (const tk of (scope.tasks || [])) {
    if (tk && tk.id === taskId) {
      const ms_id = tk.milestone_id || '';
      const op_id = tk.operation_id || '';
      // Resolve the parent's title for richer UI labels, but tolerate
      // missing parents (= MS / Op might not be in the aggregate if
      // the scope entry was task-narrowed).
      let ms_title = '';
      if (ms_id) {
        const ms = (scope.milestones || []).find(x => x.id === ms_id);
        ms_title = (ms && targetLabel(ms)) || '';
      }
      let op_title = '';
      if (op_id) {
        const op = (scope.operations || []).find(x => x.id === op_id);
        op_title = (op && targetLabel(op)) || '';
      }
      return {
        entry: tk,
        ms_id, ms_title,
        op_id, op_title,
        project_id: tk.project_id || '',
      };
    }
  }
  return null;
}

// _trekLookupMilestone — find a milestone in the Trek scope aggregate
// and return its descendant tasks (filtered by ``milestone_id`` on the
// flat tasks list). ms-86 / e-2249: state.project no longer touched.
//
// @param {{milestones:Array, tasks:Array}|null} scope
// @param {string} msId
// @returns {{ms:Object, tasks:Array}|null}
function _trekLookupMilestone(scope, msId) {
  if (!scope || !msId) return null;
  const ms = (scope.milestones || []).find(x => x.id === msId);
  if (!ms) return null;
  // The aggregate ``tasks`` list is flat across projects; filter by
  // ``milestone_id`` (= the container ref stamped by the /tasks endpoint).
  const tasks = (scope.tasks || []).filter(tk => tk && tk.milestone_id === msId);
  return { ms, tasks };
}

// _renderTrekChildTask — accordion child row inside an MS scope entry.
// Reads the trek-internal state from task_states (with fallback to entry
// status) so the badge reflects the 5-state machine, not the project-wide
// done/todo distinction.
function _renderTrekChildTask(t, taskEntry) {
  const stState = _trekTaskStateLabel(t, taskEntry.id);
  // If the executor never stamped the task, fall back to the project status
  // so a "done" entry doesn't render as "todo" before any Trek interaction.
  const effective = ((t.task_states || {})[taskEntry.id])
    ? stState
    : (taskEntry.status === 'done' ? 'done' : 'todo');
  const desc = taskEntry.description || '';
  // ms-86 / e-2223 — accordion 展開時の MS 配下 task 行もクリックで既存
  // entry-detail-modal を開く (= openEntryDetail / findEntryInProject 流用、
  // motivation / acceptance_criteria / state transitions を表示)。
  return `
    <div class="trek-child-task" data-task-state="${esc(effective)}"
         data-action="open-entry-detail" data-entry-id="${esc(taskEntry.id || '')}">
      <span class="trek-child-task-tag">task</span>
      <span class="trek-child-task-id">${esc(taskEntry.id || '')}</span>
      <span class="trek-child-task-desc" title="${esc(desc)}">${esc(desc)}</span>
      <span class="trek-task-state ${esc(effective)}">${esc(effective)}</span>
    </div>`;
}

// _renderTrekTaskRow — top-level row inside TREK TASKS for a scope entry.
// Three shapes:
//   - { project, milestone } → expandable MS parent (chevron + child accordion)
//   - { project, task }       → leaf task (no chevron)
//   - { project, operation }  → leaf-like row pointing at the operation
// The slotIndex argument feeds the t-N label so rows have a stable visual
// id even before claim primitives (ms-55) ship.
function _renderTrekTaskRow(t, s, slotIndex, scope) {
  const slotLabel = 't-' + (slotIndex + 1);
  const pid = s.project || '';
  const projTag = pid ? `<span class="trek-task-project-tag">${esc(pid.split('-')[0].toUpperCase())}</span>` : '';
  // Leaf task row.
  // ms-86 / e-2223 — task leaf 行クリックで既存 entry-detail-modal を overlay
  // 表示する (= mockup L504-532 click for detail UX)。 既存 openEntryDetail
  // helper をそのまま流用するため data-action="open-entry-detail" + data-entry-id
  // を leaf 全体に付ける。 MS / Op 行 (= chevron 持ち) は trek-scope-toggle 側
  // で扱うので modal は開かない。 lookup 失敗 (= cross-project scope の task)
  // は entry id だけでも modal 側 findEntryInProject が null を返して silent
  // skip するため、 wiring は付けっぱなしで安全。
  // ms-86 / e-2249: ``scope`` is the cross-project aggregate fetched once
  // by openTrek(); helpers no longer read state.project so the row stays
  // correct even when state.project is unrelated to this Trek.
  if (s.task) {
    const lookup = _trekLookupTask(scope, s.task);
    const desc = (lookup && lookup.entry && lookup.entry.description) || s.task;
    const stState = _trekTaskStateLabel(t, s.task);
    const effective = ((t.task_states || {})[s.task])
      ? stState
      : (lookup && lookup.entry && lookup.entry.status === 'done' ? 'done' : 'todo');
    const assignee = _trekTaskAssignee(t, s.task);
    const refLabel = lookup && lookup.ms_id ? lookup.ms_id : s.task;
    return `
      <div class="trek-task-row leaf state-${esc(effective)}"
           data-action="open-entry-detail" data-entry-id="${esc(s.task)}">
        <div class="trek-task-row-head">
          <div class="trek-task-chevron-spacer"></div>
          <div class="trek-task-tk-id">${esc(slotLabel)}</div>
          <div class="trek-task-desc">
            ${projTag}
            <span class="trek-task-ms-id">${esc(refLabel)}</span>
            <span class="trek-task-name" title="${esc(desc)}">${esc(desc)}</span>
          </div>
          <div class="trek-task-assignee">${assignee ? esc(_trekShortSessionId(assignee)) : '—'}</div>
          <div class="trek-task-state ${esc(effective)}">${esc(effective)}</div>
        </div>
      </div>`;
  }
  // Operation row (treated as leaf for now).
  if (s.operation) {
    return `
      <div class="trek-task-row leaf">
        <div class="trek-task-row-head">
          <div class="trek-task-chevron-spacer"></div>
          <div class="trek-task-tk-id">${esc(slotLabel)}</div>
          <div class="trek-task-desc">
            ${projTag}
            <span class="trek-task-ms-id">${esc(s.operation)}</span>
            <span class="trek-task-name">Operation in scope</span>
          </div>
          <div class="trek-task-assignee">—</div>
          <div class="trek-task-state todo">operation</div>
        </div>
      </div>`;
  }
  // Milestone (= expandable parent).
  if (s.milestone) {
    const lookup = _trekLookupMilestone(scope, s.milestone);
    const msTitle = (lookup && lookup.ms && lookup.targetLabel(ms)) || '';
    const tasks = lookup ? lookup.tasks : [];
    // Pick a representative state for the parent: the "most-advanced active"
    // child wins so the leader can see at a glance whether anything is in
    // flight under this milestone.
    let parentState = 'todo';
    const stateOrder = ['working', 'leader_review', 'user_review', 'todo', 'done'];
    for (const cand of stateOrder) {
      if (tasks.some(tk => _trekTaskStateLabel(t, tk.id) === cand
            || (!((t.task_states || {})[tk.id]) && cand === 'todo' && tk.status !== 'done'))) {
        parentState = cand;
        break;
      }
    }
    // Hide children that are already done by default; the show-done button
    // surfaces them on click. We pre-split into pending / done so the
    // template stays readable.
    const pendingChildren = [];
    const doneChildren = [];
    for (const tk of tasks) {
      const eff = ((t.task_states || {})[tk.id])
        ? _trekTaskStateLabel(t, tk.id)
        : (tk.status === 'done' ? 'done' : 'todo');
      if (eff === 'done') doneChildren.push(tk);
      else pendingChildren.push(tk);
    }
    // Assignee for the parent row: most recent stamper across child task_states.
    let parentAssignee = '';
    let parentTs = '';
    for (const tk of tasks) {
      const ent = (t.task_states || {})[tk.id] || {};
      const at = ent.updated_at || '';
      if (at && at > parentTs) { parentTs = at; parentAssignee = ent.updated_by_session_id || ''; }
    }
    // ms-86 / e-2222 — accordion 展開は state.openTrekExpanded (= Set keyed by
    // ms-id) で制御。 default は折りたたみ (= mockup L460 t-1 row が collapsed
    // で並ぶ姿に揃える)。 chevron / row head クリックで toggle される。
    const expanded = state.openTrekExpanded && state.openTrekExpanded.has(s.milestone);
    // ms-86 / e-2224 — show-done toggle は MS-id 単位で state.openTrekShowDone
    // (= Set) に保持。 true の MS だけ done 状態 child を inline 追加表示する。
    // Set で持つことで別 MS の done 表示が同時に切り替わらない。
    const showDone = state.openTrekShowDone && state.openTrekShowDone.has(s.milestone);
    return `
      <div class="trek-task-row ${expanded ? 'expanded' : ''} state-${esc(parentState)}">
        <div class="trek-task-row-head" data-action="trek-scope-toggle" data-ms="${esc(s.milestone)}">
          <div class="trek-task-chevron">${expanded ? '▾' : '▸'}</div>
          <div class="trek-task-tk-id">${esc(slotLabel)}</div>
          <div class="trek-task-desc">
            ${projTag}
            <span class="trek-task-ms-id">${esc(s.milestone)}</span>
            <span class="trek-task-name" title="${esc(msTitle)}">${esc(msTitle || '(milestone not loaded)')}</span>
          </div>
          <div class="trek-task-assignee">${parentAssignee ? esc(_trekShortSessionId(parentAssignee)) : '—'}</div>
          <div class="trek-task-state ${esc(parentState)}">${esc(parentState)}</div>
        </div>
        ${expanded ? `
          <div class="trek-task-children">
            ${doneChildren.length
              ? `<button class="trek-task-show-done-btn${showDone ? ' hide-mode' : ''}" data-action="trek-toggle-done" data-ms="${esc(s.milestone)}">${showDone ? 'hide' : 'show'} ${doneChildren.length} done</button>`
              : ''}
            ${pendingChildren.map(tk => _renderTrekChildTask(t, tk)).join('')}
            ${showDone ? doneChildren.map(tk => _renderTrekChildTask(t, tk)).join('') : ''}
          </div>` : ''}
      </div>`;
  }
  // Project-wide scope (no narrower ref) — surface as a context row.
  return `
    <div class="trek-task-row leaf">
      <div class="trek-task-row-head">
        <div class="trek-task-chevron-spacer"></div>
        <div class="trek-task-tk-id">${esc(slotLabel)}</div>
        <div class="trek-task-desc">
          ${projTag}
          <span class="trek-task-ms-id">—</span>
          <span class="trek-task-name">&lt;project-wide scope&gt;</span>
        </div>
        <div class="trek-task-assignee">—</div>
        <div class="trek-task-state todo">scope</div>
      </div>
    </div>`;
}

// ms-86 / e-2227 — relative-time helper for "last activity" column.
// "just now" / "Nm ago" / "Nh ago" / "Nd ago" / ISO date. Reads the
// browser clock; intentionally fuzzy so the cell stays scannable.
function _trekRelTime(iso) {
  if (!iso) return '';
  const ts = Date.parse(iso);
  if (Number.isNaN(ts)) return '';
  const diff = Math.max(0, Date.now() - ts);
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day}d ago`;
  return iso.slice(0, 10);
}

// ms-86 / e-2227 — build session_id → last activity map from the same
// _trekActivityEvents() feed the ACTIVITY section renders. Each entry
// carries the most-recent event timestamp + a short label of what the
// session last did, so MEMBERS and ACTIVITY share one source of truth
// (= c-1 session_history rows × c-2 activity events).
function _trekLastActivityBySession(t) {
  const m = new Map();
  const events = _trekActivityEvents(t);
  for (const ev of events) {
    if (!ev || !ev.sid) continue;
    const cur = m.get(ev.sid);
    if (cur && cur.ts >= (ev.ts || '')) continue;
    let summary;
    if (ev.kind === 'halt') summary = 'halt';
    else summary = `${ev.task_id} → ${ev.state}`;
    m.set(ev.sid, { ts: ev.ts || '', summary });
  }
  return m;
}

// _renderTrekMembersTable — v2 mockup table: user / session / role / task /
// last activity columns with rowspan grouping for users that hold multiple
// sessions inside the same trek (= same email × N session_ids).
//
// ms-86 / e-2225 — data source changed from the live-only
// ``state.openTrekMemberSessions`` endpoint to ``trek.session_history``
// so past-joined sessions persist in the UI even after they go offline.
// "now online" is rendered as a row marker (= ● green / ○ dim) by
// cross-referencing ``state.onlineSessions``, which keeps the live signal
// without dropping the persistent record.
//
// ms-86 / e-2227 — added "last activity" column sourced from the same
// _trekActivityEvents() feed that drives the ACTIVITY section. This
// integrates the two new data sources (= c-1 session_history rows ×
// c-2 enriched activity events) so the operator can see "this session
// is online but hasn't moved a task in 3 hours" at a glance instead of
// cross-referencing two sections by eye.
function _renderTrekMembersTable(t, scopeAggregate) {
  const lastActivity = _trekLastActivityBySession(t);
  const members = t.members || [];
  if (!members.length) {
    return `<div class="trek-coming-soon">No members yet.</div>`;
  }
  // Build a per-task index so each member row can show which slot they hold.
  // The slot index matches the order TREK TASKS renders rows, keeping the
  // visual cross-reference consistent (= t-1 in MEMBERS == t-1 in TASKS).
  const scope = t.scope || [];
  const taskSlot = new Map();    // taskId → slot label
  const msSlot = new Map();      // msId → slot label (parent rows)
  scope.forEach((s, i) => {
    const slot = 't-' + (i + 1);
    if (s.task) taskSlot.set(s.task, slot);
    if (s.milestone) msSlot.set(s.milestone, slot);
  });
  function taskLinksForSession(sid) {
    const slots = new Set();
    for (const [taskId, ent] of Object.entries(t.task_states || {})) {
      if (ent && ent.updated_by_session_id === sid) {
        if (taskSlot.has(taskId)) slots.add(taskSlot.get(taskId));
        else {
          // Walk back from task → milestone to find a parent slot.
          // ms-86 / e-2249: ``scopeAggregate`` is the cross-project aggregate
          // passed in by _renderTrekDetail; the lookup no longer reads
          // state.project, so member→slot wiring works for cross-project
          // Treks regardless of which project the caller currently has open.
          const lookup = _trekLookupTask(scopeAggregate, taskId);
          if (lookup && lookup.ms_id && msSlot.has(lookup.ms_id)) {
            slots.add(msSlot.get(lookup.ms_id));
          }
        }
      }
    }
    return Array.from(slots).sort();
  }

  // ms-86 / e-2225 — live overlay: which session_ids are currently online?
  // We treat anything in state.onlineSessions as live. This keeps the table
  // populated from the persistent session_history record while letting the
  // user see at a glance who is around right now.
  const liveSidSet = new Set();
  for (const s of (state.onlineSessions || [])) {
    if (s && s.session_id) liveSidSet.add(String(s.session_id));
  }
  function liveMarker(sid) {
    if (!sid) return '<span class="session-live-marker none" title="no session">○</span>';
    return liveSidSet.has(String(sid))
      ? '<span class="session-live-marker online" title="online">●</span>'
      : '<span class="session-live-marker offline" title="offline">○</span>';
  }

  // ms-86 / e-2225 — build per-member session list from session_history.
  // sessionsByEmail[email] = [{session_id, role_at_join, joined_at}, ...]
  // sorted by joined_at ascending so leader-at-join appears first.
  const history = Array.isArray(t.session_history) ? t.session_history : [];
  const sessionsByEmail = new Map();
  for (const h of history) {
    if (!h || !h.email) continue;
    if (!sessionsByEmail.has(h.email)) sessionsByEmail.set(h.email, []);
    sessionsByEmail.get(h.email).push(h);
  }
  for (const list of sessionsByEmail.values()) {
    list.sort((a, b) => {
      const aj = (a && a.joined_at) ? String(a.joined_at) : '';
      const bj = (b && b.joined_at) ? String(b.joined_at) : '';
      if (aj !== bj) return aj < bj ? -1 : 1;
      const as = (a && a.session_id) ? String(a.session_id) : '';
      const bs = (b && b.session_id) ? String(b.session_id) : '';
      return as < bs ? -1 : 1;
    });
  }

  // Group members by email so each user gets one "user" cell with rowspan.
  // Within each email group, emit one row per recorded session
  // (= e-2225, persistent record) instead of one row per member doc
  // (= legacy, one row per invitation).
  const ordered = [
    ...members.filter(m => m.role === 'leader'),
    ...members.filter(m => m.role !== 'leader' && m.joined_at),
    ...members.filter(m => !m.joined_at),
  ];
  const seenEmails = new Set();
  const orderedEmails = [];
  for (const m of ordered) {
    const key = m.email || m.user_id || '(unknown)';
    if (seenEmails.has(key)) continue;
    seenEmails.add(key);
    orderedEmails.push(key);
  }

  const leaderSid = t.leader_session_id || '';
  const rows = [];

  for (const email of orderedEmails) {
    // Pick the matching member doc (= for role / invitation status fall-back).
    const memberDoc = members.find(m => (m.email || m.user_id || '(unknown)') === email);
    const memberRole = memberDoc ? (memberDoc.role || 'member') : 'member';
    const isInvitedOnly = memberDoc ? !memberDoc.joined_at : false;
    // Sessions recorded for this email.
    const sessionEntries = sessionsByEmail.get(email) || [];

    // Build the per-row payload list. If session_history has zero entries
    // for this email (= invited but never joined any session), emit one
    // synthetic row showing the invitation state.
    const rowPayloads = sessionEntries.length
      ? sessionEntries.map(h => ({
          sid: h.session_id || '',
          role_at_join: h.role_at_join || 'member',
          joined_at: h.joined_at || '',
          synthetic: false,
        }))
      : [{ sid: '', role_at_join: memberRole, joined_at: '', synthetic: true }];

    rowPayloads.forEach((p, idx) => {
      const isFirstRow = idx === 0;
      const sid = p.sid;
      // ms-86 / e-2225 — role label now reflects role_at_join (= session's
      // role at the moment it joined) instead of the member's current role.
      // This keeps "who was leader when" auditable even after transfer-leader.
      const isCurrentLeader = sid && sid === leaderSid;
      const isLeaderAtJoin = p.role_at_join === 'leader';
      let roleHtml;
      if (p.synthetic && isInvitedOnly) {
        roleHtml = `<span class="role-invited">invited</span>`;
      } else if (isCurrentLeader || isLeaderAtJoin) {
        // Current leader gets the strong badge; past leaders that were
        // since demoted keep a softer "leader (past)" hint so the audit
        // record is visible without misleading the operator about who is
        // actually leading right now.
        roleHtml = isCurrentLeader
          ? `<span class="role-leader">LEADER</span>`
          : `<span class="role-leader" title="was leader at join">leader (past)</span>`;
      } else {
        roleHtml = `<span class="role-member">member</span>`;
      }
      const slots = sid ? taskLinksForSession(sid) : [];
      const taskCell = slots.length
        ? `<span class="task-link">${slots.map(esc).join(', ')}</span>`
        : `<span class="task-link none">—</span>`;
      // ms-86 / e-2227 — last activity cell joins this session's row to the
      // ACTIVITY feed. Empty for sessions that never moved a task (= invited
      // but idle, or only halt-issuer rows whose sid lives elsewhere).
      const last = sid ? lastActivity.get(sid) : null;
      const lastActivityCell = last
        ? `<span class="last-activity" title="${esc(last.summary + ' @ ' + last.ts)}">`
          + `<span class="last-activity-rel">${esc(_trekRelTime(last.ts))}</span> `
          + `<span class="last-activity-summary">${esc(last.summary)}</span>`
          + `</span>`
        : `<span class="last-activity none">—</span>`;
      let sessionLocalCell;
      let sessionFullCell;
      if (sid) {
        const fullSid = String(sid);
        const localRef = _trekRenderSessionRef(t, fullSid);
        const shortLabel = _trekShortSessionId(fullSid);
        const tooltip = `${fullSid} (click to copy)`;
        // Live marker rides immediately before the local label so the row
        // reads "● s-1" / "○ s-2" — a single eye-scan tells the operator
        // who is around right now.
        sessionLocalCell = liveMarker(fullSid) + ' ' + localRef;
        sessionFullCell = `<span class="session-full session-full-clickable" data-action="copy-trek-sid" data-sid="${esc(fullSid)}" title="${esc(tooltip)}">${esc(shortLabel)}</span>`;
      } else {
        sessionLocalCell = liveMarker('') + ` <span class="session-local none">—</span>`;
        sessionFullCell = `<span class="session-full none">(no session yet)</span>`;
      }
      rows.push(`
        <tr class="${isFirstRow ? '' : 'continued'}">
          ${isFirstRow
            ? `<td class="member-email member-email-cell" rowspan="${rowPayloads.length}">${esc(email)}</td>`
            : ''}
          <td class="session-local-cell">${sessionLocalCell}</td>
          <td class="session-full-cell">${sessionFullCell}</td>
          <td>${roleHtml}</td>
          <td>${taskCell}</td>
          <td class="last-activity-cell">${lastActivityCell}</td>
        </tr>`);
    });
  }
  return `
    <table class="trek-members-table">
      <thead>
        <tr>
          <th>user</th>
          <th>session</th>
          <th>session id</th>
          <th>role</th>
          <th>task</th>
          <th>last activity</th>
        </tr>
      </thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
}

// ms-86 / e-2226 — ACTIVITY event collector.
// Builds the time-sorted event list from task_states + halt. Split out
// from _renderTrekActivity so the caller can read events.length for the
// section header (= "N events / showing M") and for the show-all toggle
// gating.
function _trekActivityEvents(t) {
  const events = [];
  if (!t) return events;
  for (const [taskId, ent] of Object.entries(t.task_states || {})) {
    if (!ent || !ent.updated_at) continue;
    events.push({
      ts: ent.updated_at,
      task_id: taskId,
      state: ent.state || 'todo',
      note: ent.note || '',
      sid: ent.updated_by_session_id || '',
    });
  }
  if (t.halt && t.halt.issued_at) {
    events.push({
      ts: t.halt.issued_at,
      kind: 'halt',
      reason: t.halt.reason || '',
      sid: t.halt.issued_by_session_id || '',
    });
  }
  events.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  return events;
}

// _renderTrekActivity — render the ACTIVITY rows from the real
// task_states transition timestamps (= best available signal until e-2227
// lands the c-1 session_history + c-2 Activity expansion data source
// integration). Each row carries: timestamp + state icon + Trek-local
// session ref (= s-N) + task id + state label + transition note.
//
// ms-86 / e-2226: renamed from _renderTrekRecentActivity. Adds session
// column and pagination footer (= "Show all (N)" / "Show fewer").
function _renderTrekActivity(t, events, expanded) {
  if (!events.length) {
    return `<div class="trek-coming-soon">
      No activity recorded yet. State transitions and halt events surface
      here automatically — a richer feed (commits / DMs / scope changes)
      lands with e-2227.
    </div>`;
  }
  const cap = expanded ? events.length : 10;
  const shown = events.slice(0, cap);
  const rows = shown.map(ev => {
    const ts = (ev.ts || '').slice(0, 16).replace('T', ' ');
    const sidHtml = ev.sid ? _trekRenderSessionRef(t, ev.sid) : '';
    if (ev.kind === 'halt') {
      const text = `halt — ${ev.reason || '(no reason)'}`;
      return `
        <div class="trek-activity-row-v2">
          <div class="activity-ts">${esc(ts)}</div>
          <div class="activity-icon">⛔</div>
          <div class="activity-sid">${sidHtml}</div>
          <div class="activity-text" title="${esc(text)}">${esc(text)}</div>
        </div>`;
    }
    const icon = ev.state === 'done' ? '✓'
      : ev.state === 'working' ? '▸'
      : ev.state === 'leader_review' ? '👀'
      : ev.state === 'user_review' ? '⏸'
      : '○';
    // Operation text: "<task-id> → <state>[ — <note>]". The note (= done
    // reason or transition comment, from task_states[task_id].note) is the
    // "操作内容テキスト" surface — it's what the actor wrote about the
    // transition. Title attribute carries the full plain-text version for
    // hover (= row truncates via ellipsis when narrow).
    const noteSuffix = ev.note ? ` — ${ev.note}` : '';
    const titleText = `${ev.task_id} → ${ev.state}${noteSuffix}`;
    const textHtml = `<span class="activity-task">${esc(ev.task_id)}</span>`
      + ` <span class="activity-state">→ ${esc(ev.state)}</span>`
      + (ev.note ? ` <span class="activity-note">— ${esc(ev.note)}</span>` : '');
    return `
      <div class="trek-activity-row-v2">
        <div class="activity-ts">${esc(ts)}</div>
        <div class="activity-icon">${icon}</div>
        <div class="activity-sid">${sidHtml}</div>
        <div class="activity-text" title="${esc(titleText)}">${textHtml}</div>
      </div>`;
  }).join('');
  let footer = '';
  if (events.length > 10) {
    const label = expanded
      ? `Show fewer (last 10 of ${events.length})`
      : `Show all (${events.length})`;
    footer = `<div class="trek-activity-toggle">
      <button data-action="trek-activity-toggle-expand">${esc(label)}</button>
    </div>`;
  }
  return rows + footer;
}

// ms-97 / e-2609 (AC23 / AC25) — Pending scope mutation approvals。 trek doc
// が backend (= e-2611 land) で `pending_scope_changes` field を持つように
// なった時点で、 この surface が自動で出現する。 既存 backend (= add/remove
// が即座に commit される現行 API) では field 不在 → render は空文字列を返し、
// section ごと省略される。
//
// pending_scope_changes entry shape (= 想定、 e-2611 SPEC で確定する):
//   { id, action: "add"|"remove", entry: {project, milestone, operation, task},
//     requested_by_session_id, requested_at, blanket_eligible_category }
//
// blanket auto-commit (= e-2603 / AC24) が land した後は、 blanket 対象の add
// は server-side で自動 commit されてここに出ない。 UI 側は何もしなくてよい。
function _renderTrekScopeApprovals(t) {
  const pending = Array.isArray(t.pending_scope_changes)
    ? t.pending_scope_changes
    : [];
  if (pending.length === 0) return '';

  // ms-97 / e-2609 — backend が e-2611 land 前の場合に remove ボタンを薄く
  // (= disabled) 表示する保険。 backend が remove approval endpoint を返す
  // ようになった時点で、 trek doc に capabilities.scope_remove_approval=true
  // のような flag を置くか、 単純に endpoint が存在する前提で送って 404
  // を catch して silent degrade することも可能。 ここでは disabled-flag を
  // pending entry に optional に持たせる契約とし、 不在なら全機能有効。
  const removeDisabled = !!t.meta && t.meta.scope_remove_approval_disabled === true;

  const fmtEntry = (entry) => {
    if (!entry || typeof entry !== 'object') return '';
    const parts = [];
    if (entry.project) parts.push(`project=${esc(entry.project)}`);
    if (entry.milestone) parts.push(`milestone=${esc(entry.milestone)}`);
    if (entry.operation) parts.push(`operation=${esc(entry.operation)}`);
    if (entry.task) parts.push(`task=${esc(entry.task)}`);
    return parts.join(' · ');
  };

  const rows = pending.map(p => {
    const id = String(p.id || '');
    const action = (p.action || 'add') === 'remove' ? 'remove' : 'add';
    const requestedByHtml = _trekRenderSessionRef(t, p.requested_by_session_id || '');
    const requestedAt = (p.requested_at || '').slice(0, 16).replace('T', ' ');
    const blanketTag = p.blanket_eligible_category
      ? `<span class="trek-pending-blanket-tag" title="next time this category is requested, it can be auto-committed via blanket-approve">category=${esc(p.blanket_eligible_category)}</span>`
      : '';
    const removeBtnDisabled = action === 'remove' && removeDisabled;
    const rejectReasonInputId = `trek-pending-reject-reason-${esc(id)}`;
    return `
      <div class="trek-pending-row">
        <div class="trek-pending-meta">
          <span class="trek-pending-action ${action}">${action === 'add' ? '+ add' : '− remove'}</span>
          <span class="trek-pending-entry">${fmtEntry(p.entry)}</span>
          ${blanketTag}
        </div>
        <div class="trek-pending-sub">
          requested by ${requestedByHtml} at ${esc(requestedAt)}
        </div>
        <div class="trek-pending-actions">
          <button class="trek-pending-approve"
                  data-action="trek-scope-approve"
                  data-trek-id="${esc(t.trek_id)}"
                  data-pending-id="${esc(id)}"
                  ${removeBtnDisabled ? 'disabled title="scope-remove approval endpoint not yet shipped (= e-2611 pending)"' : ''}>
            Approve
          </button>
          <button class="trek-pending-reject"
                  data-action="trek-scope-reject"
                  data-trek-id="${esc(t.trek_id)}"
                  data-pending-id="${esc(id)}"
                  data-reason-input="${rejectReasonInputId}"
                  ${removeBtnDisabled ? 'disabled' : ''}>
            Reject
          </button>
          <input type="text"
                 class="trek-pending-reason"
                 id="${rejectReasonInputId}"
                 placeholder="reason (optional)"
                 ${removeBtnDisabled ? 'disabled' : ''}>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="trek-section">
      <div class="trek-section-title">
        <span>PENDING SCOPE CHANGES</span>
        <span class="right">${pending.length} awaiting approval</span>
      </div>
      <div class="trek-pending-list">
        ${rows}
      </div>
    </div>
  `;
}

function _renderTrekDetail(t) {
  const members = t.members || [];
  const scope = t.scope || [];
  const halted = !!t.halt;
  // ms-99 / e-2834 — quiesce marker on the header so an operator eyeing
  // the detail page immediately sees "AI 自律実行完了" without expanding
  // the meta panel. Cleared server-side when a task transitions out of
  // terminal (= PATCH /api/treks/{id}/task-state).
  const quiesceMeta = (t.meta || {}).quiesced_at || '';
  const quiesceReason = (t.meta || {}).quiesce_reason || '';
  const quiesced = !!quiesceMeta;
  const projectsInScope = new Set(scope.map(s => s.project).filter(Boolean));
  const workItemsInScope = scope.filter(s => s.milestone || s.operation || s.task).length;
  // ms-86 / e-2249 — cross-project aggregate (= MS / Op / Task across
  // every project the Trek's scope reaches), fetched by openTrek().
  // Passed down to renderers so helpers don't have to fish into
  // state.project (= which may be unrelated to this Trek, or null).
  const scopeAggregate = state.openTrekScope
    || { milestones: [], operations: [], tasks: [] };

  const creatorEmail = (t.creator_actor || {}).email || '';
  const leaderSid = t.leader_session_id || '';

  // ms-86 v2 layout (= mockups/trek-detail.html, e-2126):
  // - drop project subpage decorations (breadcrumb / trek-meta / archive card)
  // - WebUI 哲学への return: 全 CLI hints を削除、 read-only 監査 view に統一
  // - keep: HEADER (= trek title + halted pill) / WHY / HALT / TREK TASKS /
  //   MEMBERS table / PULSE-ACK / ACTIVITY
  // STOP / HALT card: no CLI hint text — operation は CLI + Skill (= Claude
  // Code) 経由、 ボタンは将来 fetch で叩く placeholder。
  let stopCardHtml = '';
  if (t.status === 'active') {
    if (halted) {
      const haltedReason = (t.halt && t.halt.reason) ? esc(t.halt.reason) : '(no reason given)';
      // ms-86 / e-2133: halt 発令 session は Trek-local 番号 (= s-N) badge で表示。
      const haltedByHtml = _trekRenderSessionRef(t, (t.halt && t.halt.issued_by_session_id) || '');
      const haltedAt = ((t.halt && t.halt.issued_at) || '').slice(0, 16).replace('T', ' ');
      stopCardHtml = `
        <div class="trek-stop-card halted">
          <span class="icon">⏸</span>
          <div class="text">
            <strong>HALTED — sessions are paused</strong>
            reason: ${haltedReason}<br>
            issued by ${haltedByHtml} at ${esc(haltedAt)}.
          </div>
          <button data-action="trek-resume-noop" data-trek="${esc(t.trek_id)}">Resume</button>
        </div>`;
    } else {
      stopCardHtml = `
        <div class="trek-stop-card">
          <span class="icon">🚨</span>
          <div class="text">
            <strong>STOP THIS TREK</strong>
            All joined sessions halt before their next tool call and persist their state.
          </div>
          <button data-action="trek-stop-noop" data-trek="${esc(t.trek_id)}">STOP</button>
        </div>`;
    }
  }

  const goalState = (t.goal_state || '').trim();
  const whyHtml = goalState
    ? `<div class="trek-why-block">${esc(goalState)}</div>`
    : `<div class="trek-why-block empty">No goal_state set yet.</div>`;

  // ms-97 / e-2608 (AC5) — leader_session_id を 1 行で表示する。 user / 他
  // session が leader session を確認して 「request-invite を誰宛に送るか」
  // 「leader_review への遷移は誰の権限か」 を判断できるようにする。 trek-id badge
  // と同じ monospace でラベル + sid を並べる (= "司令塔: sv-xxxx")。 不在の場合
  // (= migration 前の trek、 または leader 未任命) は表示しない。
  const leaderRowHtml = leaderSid
    ? `<div class="trek-leader-row">
         <span class="trek-leader-label">Leader</span>
         <span class="trek-leader-sid" title="${esc(leaderSid)}">${esc(leaderSid)}</span>
       </div>`
    : '';

  // ms-97 / e-2608 (AC8 / AC31) — project-wide scope (= narrowing key なし、
  // 「project: X」 だけのエントリ) を 1 件でも持つ trek には warning bar を出す。
  // SPEC AC7 で project-wide は新規追加が reject されるが、 既存 trek は
  // grandfathered (= AC8)。 自律権限が project 全体に染み出すリスクを user に
  // 周知し、 narrowing key (milestone / operation / task) の追加を促す。
  const projectWideEntries = scope.filter(
    s => s && s.project && !s.milestone && !s.operation && !s.task
  );
  const projectWideWarningHtml = projectWideEntries.length
    ? `<div class="trek-warning-bar" role="alert">
         <span class="icon">⚠</span>
         <div class="text">
           <strong>Project-wide scope detected</strong>
           This trek has ${projectWideEntries.length} scope entr${projectWideEntries.length === 1 ? 'y' : 'ies'} without a narrowing key (milestone / operation / task).
           Trek の自律権限が project 全体に染み出すリスクがあります。
           各 entry に narrowing key を追加してください (= CLI: <code>beacon trek plan ${esc(t.trek_id || '&lt;trek_id&gt;')} --add-scope ${esc(projectWideEntries[0].project || '')}:&lt;ms-id|op-id|e-id&gt;</code>)。
           <div class="trek-warning-bar-entries">
             ${projectWideEntries.map(s => `<span class="trek-warning-chip">project: ${esc(s.project || '')}</span>`).join('')}
           </div>
         </div>
       </div>`
    : '';

  return `
    <section class="fade-in trek-detail-v2">

      <div class="trek-head">
        <div class="trek-title-row">
          <span class="trek-title-text">${esc(t.title || '')}</span>
          <span class="trek-id-badge" title="${esc(t.trek_id)}">${esc(t.trek_id)}</span>
          ${halted ? `<span class="trek-badge" style="color:var(--warning,#fbbf24);border-color:var(--warning,#fbbf24);">⚠ halted</span>` : ''}
          ${quiesced ? `<span class="trek-badge" style="color:#4ade80;border-color:#4ade80;" title="quiesced at ${esc(quiesceMeta)} (reason=${esc(quiesceReason)})">✓ quiesced</span>` : ''}
        </div>
        <div class="trek-stats">
          ${projectsInScope.size} project${projectsInScope.size === 1 ? '' : 's'} · ${workItemsInScope} work item${workItemsInScope === 1 ? '' : 's'} · ${members.length} member${members.length === 1 ? '' : 's'}
        </div>
        ${leaderRowHtml}
        ${quiesced ? `<div class="trek-quiesce-row" style="margin-top:8px;padding:8px 10px;border-radius:6px;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.25);color:#4ade80;font-size:13px;">
          <strong>QUIESCED</strong> — Trek scope 内の全 slot が terminal state (= done / user_review) に到達しました。

function renderTreksSection() {
  // Detail view first (if a trek is open) so loading shows immediately.
  if (state.openTrekId) {
    const t = (state.treks || []).find(x => x.trek_id === state.openTrekId);
    if (!t) {
      return `
        <section class="retro-section fade-in">
          <span class="retro-back" data-action="close-trek">← back to Treks</span>
          <div class="retro-empty">Trek not found (= it was archived elsewhere or you're not a member).</div>
        </section>`;
    }
    return _renderTrekDetail(t);
  }
  // List view (ms-86 / e-2251): show ALL treks the caller belongs to
  // (= creator or member), not just treks scoped to the current project.
  // Trek は cross-project な独立 scope (= SPEC IgCFK8I34cBfPco3UE06 中心原則 1
  // 「Project ⟷ Trek は M:N 独立オブジェクト」)。 project filter を外して
  // user 全 Trek を 1 画面で一覧できるようにする。 紐付く project は各行で
  // chip 表示 (= 何の project に絡む Trek かは 1 行で読み取れる)。
  // /api/treks endpoint 側で caller=member の絞り込みは既に走っているので、
  // ここで追加 filter する必要は無い。
  const allTreks = state.treks || [];
  if (allTreks.length === 0) {
    return `
      <section class="retro-section fade-in">
        <div class="milestones-header" style="margin-bottom:4px;">
          <span class="milestones-title">Treks</span>
          <span class="milestones-count">0</span>
        </div>
        <div class="retro-empty" style="margin-top:10px;">
          You don't belong to any treks yet (= a trek is a cross-project, cross-session coordination workspace).
        </div>
        <div style="margin-top:14px;padding:10px 12px;font-size:0.72rem;color:var(--text-dim);background:var(--bg-surface);border:1px solid var(--border);border-radius:4px;line-height:1.5;">
          ℹ Treks are created from the terminal:
          <code style="display:block;margin-top:6px;color:var(--accent);">beacon trek create "title" --type persistent</code>
        </div>
      </section>`;
  }
  // Split active vs archived for visual grouping (mock convention).
  const active = allTreks.filter(t => t.status !== 'archived');
  const archived = allTreks.filter(t => t.status === 'archived');
  // ms-86 / e-2251 — derive distinct project count per trek (= "this trek
  // spans N projects" chip). scope[] entries carry a `project` field per
  // normalize_scope_entry (lib/trek.py L922-936). De-duplicate by project id
  // so a 5-task / 1-project trek shows "1 project" rather than "5 projects".
  const trekRow = (t) => {
    const halt = !!t.halt;
    const memberCount = (t.members || []).length;
    const scopeEntries = t.scope || [];
    const scopeCount = scopeEntries.length;
    const projectIds = new Set();
    for (const s of scopeEntries) {
      if (s && s.project) projectIds.add(s.project);
    }
    const projectCount = projectIds.size;
    return `
      <div class="trek-list-row" data-action="open-trek" data-trek-id="${esc(t.trek_id)}">
        <span class="status-dot ${_trekBadgeClass(t.status)}"></span>
        <span class="name">${esc(t.title || '')}${halt ? '<span class="halt-mark">⚠</span>' : ''}<span class="id">${esc(t.trek_id)}</span></span>
        <span class="counts">${memberCount}m / ${scopeCount}s</span>
        <span class="counts">${projectCount} project${projectCount === 1 ? '' : 's'}</span>
        <span class="counts">${esc(t.type || '')}</span>
      </div>`;
  };
  let html = `
    <section class="retro-section fade-in" style="margin-bottom:6px;">
      <div class="milestones-header" style="margin-bottom:4px;">
        <span class="milestones-title">Treks</span>
        <span class="milestones-count">${active.length} active / ${archived.length} archived</span>
      </div>
    </section>`;
  if (active.length) {
    html += `
      <section class="retro-section fade-in" style="margin-bottom:12px;">
        <div class="trek-section-title" style="margin-bottom:6px;">ACTIVE</div>
        ${active.map(trekRow).join('')}
      </section>`;
  }
  if (archived.length) {
    html += `
      <section class="retro-section fade-in" style="margin-bottom:12px;">
        <div class="trek-section-title" style="margin-bottom:6px;">ARCHIVED</div>
        ${archived.map(trekRow).join('')}
      </section>`;
  }
  html += `
    <div class="trek-cli-hint" style="margin-top:14px;">
      Start a new trek from the terminal:
      <code>beacon trek create "title" --type persistent</code>
    </div>`;
  return html;
}

function scopeBadge(scope) {

// ms-43 e-631: cross-entity search rendering.
// When state.searchResults is populated (server response), render the unified
// list with facet chips. Otherwise fall back to a local milestones-only walk
// so the UI is never blank during the first request or offline.
const SEARCH_TYPE_ICON = {
  task: '□', commit: '○', pr: 'PR', save: '→',
  milestone: 'MS', operation: 'OP', operation_task: 'OT',
  run: 'R·', incident: 'INC',
  document: 'DOC', push: 'PUSH', deploy: 'DEP',
};

const SEARCH_TYPE_LABEL = {
  task: 'Tasks', commit: 'Commits', pr: 'PRs', save: 'Saves',
  milestone: 'Milestones', operation: 'Operations', operation_task: 'Op tasks',
  run: 'Runs', incident: 'Incidents',
  document: 'Documents', push: 'Pushes', deploy: 'Deploys',
};

// Order used to group results (most "primary" first).
const SEARCH_TYPE_ORDER = [
  'milestone', 'task', 'pr', 'commit', 'save',
  'document', 'operation', 'incident', 'operation_task', 'run',
  'push', 'deploy',
];

function _localSearchFallback(q) {
  // ms-46 e-1228: walk milestones + nested entries (incl. Operations) and match
  // against entry id / ms id / op id alongside description/detail, mirroring
  // the server-side `lib/search.search_project` "id is also matched by `q` as a
  // substring" contract. Web UI receives the server response over REST and
  // rarely hits this path; Tauri (no `dataSource.searchProject`) relies on this
  // walk for every search, so id-based queries like "e-1228" must resolve here
  // too, otherwise Task entries silently fall out of Tauri search results.
  const results = [];
  function walk(entries, parentScope) {
    // parentScope: { ms_id, ms_title } or { op_id, op_title } depending on
    // which container we descended from. Either may be undefined when the
    // entity has no parent (top-level).
    for (const e of entries) {
      const desc = (e.description || '').toLowerCase();
      const detail = (e.detail || '').toLowerCase();
      const id = (e.id || '').toLowerCase();
      if (desc.includes(q) || detail.includes(q) || id.includes(q)) {
        results.push({
          entity_type: e.type || 'task',
          id: e.id, title: e.description || '',
          snippet: e.description || '',
          ms_id: parentScope?.ms_id, ms_title: parentScope?.ms_title,
          op_id: parentScope?.op_id, op_title: parentScope?.op_title,
          status: e.status,
          created_at: e.date || e.created_at || '',
        });
      }
      if (e.entries) walk(e.entries, parentScope);
    }
  }
  for (const ms of (state.project?.milestones || [])) {
    const t = (targetLabel(ms) || '').toLowerCase();
    const msId = (ms.id || '').toLowerCase();
    if (t.includes(q) || msId.includes(q)) {
      results.push({
        entity_type: 'milestone', id: ms.id, title: targetLabel(ms),
        snippet: targetLabel(ms), ms_id: ms.id, ms_title: targetLabel(ms),
        status: ms.status, created_at: '',
      });
    }
    walk(ms.entries || [], { ms_id: ms.id, ms_title: targetLabel(ms) || '' });
  }
  // ms-46 e-1228: Operations live in a sibling collection but the server search
  // walks them too (lib/search.search_project line 129+). Mirror that so id-
  // based lookups for Operation entries (operation_task / run_record /
  // incident) also resolve in the Tauri local fallback.
  for (const op of (state.project?.operations || [])) {
    const t = (targetLabel(op) || '').toLowerCase();
    const opId = (op.id || '').toLowerCase();
    if (t.includes(q) || opId.includes(q)) {
      results.push({
        entity_type: 'operation', id: op.id, title: targetLabel(op),
        snippet: targetLabel(op), op_id: op.id, op_title: targetLabel(op),
        status: op.status, created_at: '',
      });
    }
    walk(op.entries || [], { op_id: op.id, op_title: targetLabel(op) || '' });
  }
  return results;
}

function _renderFacetChips() {
  const counts = state.searchFacets?.type || {};
  const allCount = Object.values(counts).reduce((a, b) => a + b, 0);
  const isAll = state.searchTypeFilter.size === 0;
  const chips = [
    `<button class="filter-btn ${isAll ? 'on' : 'off'}" data-action="search-filter-type" data-type="">all <span style="opacity:0.6">${allCount}</span></button>`,
  ];
  for (const t of SEARCH_TYPE_ORDER) {
    const c = counts[t] || 0;
    if (!c) continue;
    const on = state.searchTypeFilter.has(t);
    chips.push(
      `<button class="filter-btn ${on ? 'on' : 'off'}" data-action="search-filter-type" data-type="${esc(t)}">` +
      `${esc(SEARCH_TYPE_LABEL[t] || t)} <span style="opacity:0.6">${c}</span></button>`
    );
  }
  return `<div class="filter-bar" style="margin: 4px 0 8px;">${chips.join('')}</div>`;
}

function renderSearchResults() {
  const q = state.searchQuery.trim();
  if (!q) return '';

  // Prefer server response; fall back to local walk while loading.
  let results = state.searchResults;
  let fallback = false;
  if (!Array.isArray(results)) {
    results = _localSearchFallback(q.toLowerCase());
    fallback = true;
  }

  // Apply client-side type filter on top of the server response so toggling
  // chips doesn't require a round-trip.
  if (state.searchTypeFilter.size > 0) {
    results = results.filter(r => state.searchTypeFilter.has(r.entity_type));
  }

  const facetChipsHTML = fallback ? '' : _renderFacetChips();
  const loadingHint = state.searchLoading
    ? ' <span style="color:var(--text-dim);font-size:0.7rem;">searching...</span>'
    : '';
  const total = fallback ? results.length : state.searchTotal;
  const countHTML = `<div class="milestones-count" style="margin-bottom:6px">${results.length} of ${total} result${total === 1 ? '' : 's'}${loadingHint}</div>`;

  if (!results.length) {
    return `<div class="search-results">
      ${countHTML}
      ${facetChipsHTML}
      <div class="search-empty">No results for "${esc(state.searchQuery)}"</div>
    </div>`;
  }

  // Group by entity_type so the user can scan by category.
  const grouped = {};
  for (const r of results) {
    const t = r.entity_type || 'task';
    (grouped[t] = grouped[t] || []).push(r);
  }
  const sectionsHTML = SEARCH_TYPE_ORDER
    .filter(t => grouped[t]?.length)
    .map(t => {
      const items = grouped[t].map(r => {
        const date = (r.updated_at || r.created_at || '').slice(0, 10);
        const ctx = r.ms_id ? `${esc(r.ms_id)}${r.ms_title ? ': ' + esc(r.ms_title) : ''}` :
                    r.op_id ? `${esc(r.op_id)}${r.op_title ? ': ' + esc(r.op_title) : ''}` :
                    r.scope ? `scope:${esc(r.scope)}` : '';
        const dataAction =
          t === 'document' ? 'search-open-document' :
          t === 'milestone' ? 'search-goto' :
          'search-goto';
        const dataAttrs =
          t === 'document' ? `data-doc-id="${esc(r.id)}"` :
          `data-ms-id="${esc(r.ms_id || '')}" data-entry-id="${esc(r.id)}"`;
        const snippet = r.snippet || r.title || '';
        return `
        <div class="search-result-item" data-action="${dataAction}" ${dataAttrs}>
          <span class="search-result-type">${esc(SEARCH_TYPE_ICON[t] || '?')}</span>
          <span class="search-result-desc">${esc(snippet)}</span>
          <span class="search-result-date">${esc(date)}</span>
          <span class="search-result-ms">${ctx}</span>
        </div>`;
      }).join('');
      return `
      <section style="margin-bottom: 10px;">
        <div style="font-size:0.7rem;color:var(--text-dim);margin:6px 0 4px;letter-spacing:0.05em;text-transform:uppercase;">
          ${esc(SEARCH_TYPE_LABEL[t] || t)} (${grouped[t].length})
        </div>
        ${items}
      </section>`;
    }).join('');

  return `<div class="search-results">
    ${countHTML}
    ${facetChipsHTML}
    ${sectionsHTML}
  </div>`;
}

// ms-131 e-4498 — table-doc rendering (read-only).
// A table-doc (frontmatter ``format: table``) carries a fenced
// ```beacon-table``` JSON block ({columns, rows}) in its body instead of prose.
// The Documents tab renders it as an HTML table (column headers + active rows)
// rather than markdown, so a human can audit the structured data. It is
// view-only by design: rows are operated via the CLI (`beacon doc table ...`),
// never edited from the UI (ux-principle-no-terminal / SPEC 方針5). Malformed
// payloads fall back to markdown so nothing is silently lost.
function docFormatIsTable(content) {
  const m = /^---\n([\s\S]*?)\n---/.exec(content || '');
  if (!m) return false;
  return /(^|\n)\s*format:\s*table\s*(\n|$)/.test(m[1]);
}

function parseTableDocPayload(content) {
  const m = /```beacon-table\s*\n([\s\S]*?)\n```/.exec(content || '');
  if (!m) return null;
  try {
    const t = JSON.parse(m[1]);
    return (t && Array.isArray(t.columns)) ? t : null;
  } catch (e) { return null; }
}

// Resolve a ref-typed cell (e.g. "opp-3") to the referenced entity's label when
// it is loaded in the current project state; otherwise show the raw id.
function resolveRefLabel(id) {
  const p = state.project || {};
  const cols = [p.milestones, p.opportunities, p.accounts, p.acquisitions, p.operations];
  for (const c of cols) {
    if (!Array.isArray(c)) continue;
    const hit = c.find(x => x && x.id === id);
    if (hit) return (hit.label || hit.title || hit.name || id);
  }
  return id;
}

function renderTableDocHtml(content) {
  const t = parseTableDocPayload(content);
  if (!t) return marked.parse(content || '');  // malformed → markdown fallback
  const cols = t.columns;
  const allRows = Array.isArray(t.rows) ? t.rows : [];
  const rows = allRows.filter(r => r && !r.removed_at);
  const head = cols.map(c => `<th>${esc(c.label || c.key)}</th>`).join('');
  const body = rows.map(r => {
    const cells = (r && r.cells) || {};
    const tds = cols.map(c => {
      let v = cells[c.key];
      if (v === undefined || v === null) v = '';
      if (c.type === 'ref' && v !== '') v = resolveRefLabel(String(v));
      else if (typeof v === 'boolean') v = v ? '✓' : '✗';
      return `<td>${esc(String(v))}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  const removed = allRows.length - rows.length;
  const parts = [`<table class="table-doc"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`];
  if (rows.length === 0) parts.push('<div class="table-doc-note">(行なし)</div>');
  if (removed > 0) parts.push(`<div class="table-doc-note">${removed} 行が削除済み（履歴に保持）</div>`);
  return parts.join('');
}

// Shared body renderer used by the Documents detail view and the search-hit
// overlay: table-docs render as a table, everything else as markdown.
function renderDocBody(content) {
  return docFormatIsTable(content)
    ? renderTableDocHtml(content)
    : marked.parse(content || '');
}

function renderDocumentsSection() {
  if (state.documentContent) {
    const scope = state.documentContent.scope || 'memo';
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" data-action="close-document">\u2190 back to list</span>
        <button data-action="copy-doc-link" data-doc-id="${esc(state.documentContent.doc_id)}" style="float:right;font-size:0.72rem;padding:3px 10px;background:var(--bg-raised);border:1px solid var(--border);border-radius:3px;color:var(--text-secondary);cursor:pointer;font-family:inherit;">Copy link</button>
        <h3 style="font-size: 1rem; color: var(--text-primary); margin: 8px 0 16px;">${scopeBadge(scope)}${esc(state.documentContent.title)}</h3>
        <div class="doc-content">${renderDocBody(state.documentContent.content)}</div>
      </section>`;
  }
  // ms-46 e-750: pull the retro detail-view early-return up alongside the
  // document detail-view above so it can never strand a partially built html
  // string lower in the function. The Documents tab hosts two independent
  // collections (state.documents and state.retros); the previous code bailed
  // out with "No documents yet." the moment state.documents was empty, which
  // silently hid every retro even after loadRetros had populated
  // state.retros (the W22 symptom in e-750). Both collections are now peers:
  // each section is built only when its collection has data, and the empty
  // placeholder is reserved for the case where *both* are empty.
  if (state.retroContent) {
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" data-action="close-retro">← back to Documents</span>
        <h3 style="font-size:1rem;color:var(--text-primary);margin:8px 0 16px;">${esc(state.retroContent.week)}</h3>
        <div class="retro-content">${esc(state.retroContent.content)}</div>
      </section>`;
  }

  // Scope chips (exclusive). Body / title search is handled by the global
  // search bar at the top of the shell; this section just helps users browse
  // a single scope at a time.
  const scopeFilter = state.documentsScopeFilter || '';
  const order = ['core', 'spec', 'memo', 'retro', 'report'];
  const grouped = {};
  for (const s of order) grouped[s] = [];
  let scopeCounts = { core: 0, spec: 0, memo: 0, retro: 0, report: 0 };
  for (const d of state.documents) {
    const s = d.scope || 'memo';
    scopeCounts[s] = (scopeCounts[s] || 0) + 1;
    if (!grouped[s]) grouped[s] = [];
    if (!scopeFilter || s === scopeFilter) grouped[s].push(d);
  }
  const totalMatches = Object.values(grouped).reduce((a, b) => a + b.length, 0);
  const labels = { core: '\u2605 CORE', spec: '\u25CB SPEC', memo: '\u25CB MEMO', retro: '\u25CB RETRO', report: '\u25CB REPORT' };

  const scopeChip = (s) => {
    const c = scopeCounts[s] || 0;
    if (!c) return '';
    const on = scopeFilter === s;
    return `<button class="filter-btn ${on ? 'on' : 'off'}" data-action="documents-filter-scope" data-scope="${s}">${(labels[s] || s).replace(/^[\u2605\u25CB]\s*/, '')} <span style="opacity:0.6">${c}</span></button>`;
  };
  const allChip = `<button class="filter-btn ${scopeFilter ? 'off' : 'on'}" data-action="documents-filter-scope" data-scope="">all</button>`;

  let html = '';

  if (state.documents.length > 0) {
    html += `
      <section class="retro-section fade-in" style="margin-bottom: 8px;">
        <div class="milestones-header" style="margin-bottom: 4px;">
          <span class="milestones-title">Documents</span>
          <span class="milestones-count">${state.documents.length} total${scopeFilter ? ` / ${totalMatches} shown` : ''}</span>
        </div>
        <div class="filter-bar" style="margin: 4px 0 0;">
          ${allChip}${order.map(scopeChip).join('')}
        </div>
      </section>
    `;

    for (const s of order) {
      if (grouped[s].length === 0) continue;
      html += `
        <section class="retro-section fade-in" style="margin-bottom: 12px;">
          <h4 style="font-size: 0.75rem; color: var(--text-secondary); margin: 0 0 6px; letter-spacing: 0.05em;">${labels[s]}</h4>
          <ul class="retro-list">
            ${grouped[s].map(d => `
              <li class="retro-item" data-action="open-document" data-doc-id="${esc(d.doc_id)}">
                <span class="retro-item-week">${esc(d.title)}</span>
                <span class="retro-item-date">${d.updated_at ? d.updated_at.slice(0, 10) : ''}</span>
              </li>
            `).join('')}
          </ul>
        </section>`;
    }
    if (totalMatches === 0 && scopeFilter) {
      html += `<section class="retro-section fade-in"><div class="retro-empty">No documents in scope "${esc(scopeFilter)}".</div></section>`;
    }
  }

  // Reviews section (retros). Rendered independently of state.documents so a
  // project with only retros (or one whose loadDocuments race lost to
  // loadRetros) still surfaces every week.
  if (state.retros.length > 0) {
    html += `
      <section class="retro-section fade-in" style="margin-bottom:12px;">
        <h4 style="font-size:0.75rem;color:var(--text-secondary);margin:0 0 6px;letter-spacing:0.05em;">○ REVIEWS</h4>
        <ul class="retro-list">
          ${state.retros.map(r => `
            <li class="retro-item" data-action="open-retro" data-week="${esc(r.week)}">
              <span class="retro-item-week">${esc(r.week)}</span>
              <span class="retro-item-date">${r.updated_at ? r.updated_at.slice(0, 10) : ''}</span>
            </li>
          `).join('')}
        </ul>
      </section>`;
  }
  if (!html) return `<section class="retro-section fade-in"><div class="retro-empty">No documents yet.</div></section>`;
  return html;
}

async function openDocument(docId) {
  try { await dataSource.loadDocumentContent(docId); }
  catch (e) { state.documentContent = { doc_id: docId, title: 'Error', content: 'Failed to load document.' }; }
  if (typeof history !== 'undefined' && history.pushState) history.pushState(null, '', '#doc/' + docId);
  render();
}

function closeDocument() {
  state.documentContent = null;
  history.pushState(null, '', location.pathname + location.search);
  render();
}

// Build hash → beacon entry map from all milestone entries
function buildHashEntryMap(project) {
  const map = {};
  function scan(entries) {
    for (const e of entries) {
      if (e.type === 'commit') {
        const h = (e.meta || {}).hash || '';
        if (h) map[h] = { id: e.id || '', description: e.description || '', hash: h };
      }
      if (e.entries) scan(e.entries);
    }
  }
  for (const ms of project.milestones || []) scan(ms.entries || []);
  return map;
}

function lookupEntry(hashMap, shortHash) {
  if (!shortHash) return null;
  if (hashMap[shortHash]) return hashMap[shortHash];
  for (const [k, v] of Object.entries(hashMap)) {
    if (k.startsWith(shortHash) || shortHash.startsWith(k)) return v;
  }
  return null;
}

function renderReleasesSection() {
  const p = state.project;
  const subtabs = `<div class="releases-subtabs">
    <button class="releases-subtab-btn ${state.releasesSubTab === 'service' ? 'active' : ''}" data-action="switch-releases-tab" data-subtab="service">Service</button>
    <button class="releases-subtab-btn ${state.releasesSubTab === 'code' ? 'active' : ''}" data-action="switch-releases-tab" data-subtab="code">Code</button>
  </div>`;

  if (state.releasesSubTab === 'code') {
    return `<section class="retro-section fade-in"><div>${subtabs}${renderCodeReleasesTab(p)}</div></section>`;
  }

  const allDeps = p?.deployments || [];
  const releases = {};
  for (const r of (p?.releases || [])) releases[r.id] = r;

  if (allDeps.length === 0) {
    return `<section class="retro-section fade-in"><div>${subtabs}
      <div class="retro-empty">No deployments recorded yet.<br>
        <span style="font-size:0.75rem;color:var(--text-dim)">Run <code>beacon deploy record</code> after each deploy.</span>
      </div></div>
    </section>`;
  }

  const hashMap = buildHashEntryMap(p);
  const msTitle = id => p?.milestones?.find(m => m.id === id)?.title || id;

  // Build deploy-id → release mapping (from release.deploy_ids only, not from deploy.linked_release)
  const deployToRelease = {};
  for (const r of Object.values(releases)) {
    for (const id of (r.deploy_ids || [])) deployToRelease[id] = r;
  }

  // Collect unique environments for filter buttons
  const envSet = new Set(allDeps.map(d => d.environment || 'prod'));
  const envList = [...envSet].sort();

  // Filter by selected environment
  const filtered = state.selectedDeployEnv
    ? allDeps.filter(d => (d.environment || 'prod') === state.selectedDeployEnv)
    : allDeps;

  // Sort newest first
  const sorted = filtered.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function deployDetail(d) {
    const mcMap = d.milestone_commits;
    if (!mcMap || !Object.keys(mcMap).length) {
      const badges = (d.milestones || []).map(id =>
        `<span class="release-ms-badge">${esc(id)}</span>`).join('');
      return badges ? `<div class="deploy-ms-badges">${badges}</div>` : '';
    }
    const newlyDone = new Set(d.newly_completed_ms || []);
    // completions first, patches after
    const sorted = Object.entries(mcMap).sort(([a],[b]) =>
      (newlyDone.has(b)?1:0) - (newlyDone.has(a)?1:0));
    let h = '<div class="deploy-detail">';
    for (const [msId, hashes] of sorted) {
      const completion = newlyDone.has(msId);
      // Minor deploys cannot have MS release
      const blockType = (d.type === 'minor') ? 'patch' : (completion ? 'completion' : 'patch');
      h += `<div class="deploy-ms-block ${blockType}">
        <div class="deploy-ms-block-header">
          <span class="deploy-ms-type-label">${blockType === 'completion' ? 'MS release' : 'MS patch'}</span>
          <span class="deploy-ms-block-id">${esc(msId)}</span>
          <span class="deploy-ms-block-title">${esc(msTitle(msId))}</span>
        </div>
        <div class="deploy-commit-list">`;
      for (const hash of hashes) {
        const entry = lookupEntry(hashMap, hash);
        h += `<div class="deploy-commit-row">
          <span class="deploy-commit-label">commit</span>
          <span class="deploy-commit-eid">${esc(entry?.id || '')}</span>
          <span class="deploy-commit-desc">${esc(entry?.description || hash)}</span>
          <code class="deploy-commit-hash">${esc(hash.slice(0,7))}</code>
        </div>`;
      }
      h += `</div></div>`;
    }
    const unassigned = d.unassigned_commits || [];
    if (unassigned.length) {
      h += `<div class="deploy-ms-block untracked">
        <div class="deploy-ms-block-header"><span class="deploy-ms-type-label">untracked</span></div>
        <div class="deploy-commit-list">`;
      for (const hash of unassigned) {
        h += `<div class="deploy-commit-row">
          <span class="deploy-commit-label">commit</span>
          <code class="deploy-commit-hash">${esc(hash.slice(0,7))}</code>
        </div>`;
      }
      h += `</div></div>`;
    }
    return h + '</div>';
  }

  function deployCard(d) {
    const isMajor = d.type === 'major';
    const expanded = state.expandedDeployId === d.id;
    const dot = `<span class="deploy-type-dot ${isMajor?'major':'minor'}">${isMajor?'◉':'○'}</span>`;
    // e-1274: show top-level version tag (e.g. v0.22.0) when present so
    // reviewers can cross-reference releases without expanding the card.
    const verBadge = d.version ? `<span class="release-group-semver">${esc(d.version)}</span>` : '';
    let h = `<div class="deploy-card ${isMajor?'is-major':'is-minor'}" data-action="expand-deploy" data-deploy-id="${esc(d.id)}" style="cursor:pointer;">
      <div class="deploy-card-header">
        ${dot}
        <span class="deploy-id">${esc(d.id)}</span>
        ${verBadge}
        <span class="deploy-env-badge">${esc(d.environment||'prod')}</span>
        <span class="deploy-datetime">${esc(fmtDate(d.date))}</span>
        <span class="deploy-expand-arrow">${expanded?'▲':'▼'}</span>
      </div>
      <div class="deploy-desc">${esc(d.description||'')}</div>`;
    if (expanded) {
      h += deployDetail(d);
    } else {
      const newlyDone = new Set(d.newly_completed_ms || []);
      const badges = (d.milestones||[]).map(id => {
        const isCompletion = d.type !== 'minor' && newlyDone.has(id);
        const isPatch = !isCompletion;
        const cls = isCompletion ? 'release-ms-badge-completion' : 'release-ms-badge-patch';
        return `<span class="${cls}">${esc(id)}</span>`;
      }).join('');
      if (badges) h += `<div class="deploy-ms-badges">${badges}</div>`;
    }
    return h + '</div>';
  }

  // Env filter bar (only shown when multiple environments exist)
  const envFilter = envList.length > 1 ? `<div class="deploy-env-filter">
    <button class="deploy-env-btn ${!state.selectedDeployEnv ? 'active' : ''}" data-action="switch-deploy-env" data-env="">All</button>
    ${envList.map(e => `<button class="deploy-env-btn ${state.selectedDeployEnv === e ? 'active' : ''}" data-action="switch-deploy-env" data-env="${esc(e)}">${esc(e)}</button>`).join('')}
  </div>` : '';

  let html = `<section class="retro-section fade-in"><div>${subtabs}${envFilter}`;

  // Render purely chronologically; insert release header before the first deploy in that release
  const shownReleases = new Set();
  for (const d of sorted) {
    const rel = deployToRelease[d.id];
    if (rel && !shownReleases.has(rel.id)) {
      shownReleases.add(rel.id);
      const sv = rel.semver ? `<span class="release-group-semver">${esc(rel.semver)}</span>` : '';
      html += `<div class="release-group-header"><span>${esc(rel.id)}</span>${sv}</div>`;
    }
    html += deployCard(d);
  }

  return html + `</div></section>`;
}

function renderCodeReleasesTab(p) {
  const pushes = (p?.pushes || []).slice().sort((a, b) =>
    (b.pushed_at || '').localeCompare(a.pushed_at || ''));

  if (!pushes.length) {
    return `<div class="retro-empty">No push records yet.<br>
      <span style="font-size:0.75rem;color:var(--text-dim)">Run <code>beacon push record</code> after each push.</span>
    </div>`;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  return pushes.map(push => {
    const expanded = state.expandedPushId === push.id;
    const commits = push.commits || [];
    // e-1274: top-level version tag (e.g. v0.22.0) when present.
    const pushVerBadge = push.version ? `<span class="release-group-semver">${esc(push.version)}</span>` : '';
    let h = `<div class="push-card" data-action="expand-push" data-push-id="${esc(push.id)}" style="cursor:pointer;">
      <div class="push-card-header">
        <span class="push-icon">↑</span>
        <span class="push-id">${esc(push.id)}</span>
        ${pushVerBadge}
        <span class="push-branch-badge">${esc(push.branch || 'main')}</span>
        ${push.pushed_by ? `<span class="push-by">${esc(push.pushed_by)}</span>` : ''}
        <span class="push-commit-count">${push.commit_count || commits.length} commits</span>
        <span class="push-datetime">${esc(fmtDate(push.pushed_at))}</span>
        <span class="push-expand-arrow">${expanded ? '▲' : '▼'}</span>
      </div>
      ${push.summary ? `<div class="push-summary">${esc(push.summary)}</div>` : ''}`;
    if (expanded && commits.length) {
      h += `<div class="push-commit-list">`;

          <code class="push-commit-hash">${esc(c.hash || '')}</code>
          <span class="push-commit-msg">${esc(c.message || '')}</span>
        </div>`;
      }
      h += `</div>`;
    }
    return h + `</div>`;
  }).join('');
}



function renderOperationsSection() {
  const p = state.project;
  const allOps = p.operations || [];
  const activeOps = allOps.filter(o => o.status === 'open');
  const pendingOps = allOps.filter(o => o.status === 'todo' || o.status === 'in_progress');
  const closedOps = allOps.filter(o => o.status === 'closed');

  const runIcon = s => s === 'ok' ? '✓' : s === 'warning' ? '⚠' : s === 'error' ? '✗' : '?';
  const runColor = s => s === 'ok' ? 'var(--green)' : s === 'warning' ? 'var(--warn,#f0b429)' : s === 'error' ? 'var(--red,#e55)' : 'var(--text-dim)';

  const renderOp = (op) => {
    const entries = op.entries || [];
    const opTasks = entries.filter(e => e.type === 'operation_task');
    const opTasksDone = opTasks.filter(t => t.status === 'done').length;
    const runs = entries.filter(e => e.type === 'run_record').slice(-5).reverse();
    const incidents = entries.filter(e => e.type === 'incident' && e.status === 'open');
    const resolvedIncidents = entries.filter(e => e.type === 'incident' && e.status === 'resolved');

    const status = op.status || 'open';
    const statusBadge = `<span class="op-status-badge ${status}">${status}</span>`;
    const priorityBadge = op.priority ? `<span class="priority-badge priority-${op.priority}">${op.priority}</span>` : '';

    // ms-43 / e-2246 — surface the Operation creator (= 起票者) when the
    // project has 2+ distinct authors. Detail surface (creatorBlock) is
    // shown unconditionally so the "who set this up?" question always
    // has an answer inside the expanded card.
    const _opMultiActor = projectHasMultipleAuthors(state.project);
    const _opCreatorLabel = renderCreatorLabel(op);
    const opCreatorRow = (_opMultiActor && _opCreatorLabel)
      ? `<span class="op-creator" style="font-size:0.65rem;color:var(--text-dim);margin-left:8px;">起票者: ${_opCreatorLabel}</span>`
      : '';
    const creatorBlock = _opCreatorLabel
      ? `<div class="op-meta-block op-meta-creator"><div class="op-meta-label">起票者</div>${_opCreatorLabel}</div>`
      : '';

    const objectiveBlock = op.objective
      ? `<div class="op-meta-block op-meta-objective"><div class="op-meta-label">objective</div>${esc(op.objective)}</div>` : '';
    const hintBlock = op.activation_hint
      ? `<div class="op-meta-block op-meta-hint"><div class="op-meta-label">activation hint</div>${esc(op.activation_hint)}</div>` : '';

    const opTasksHtml = opTasks.length ? `
      <div class="op-tasks">
        <div class="op-section-label">OperationTasks <span class="op-task-progress">(${opTasksDone}/${opTasks.length} done)</span></div>
        ${opTasks.map(t => {
          const isDone = t.status === 'done';
          const icon = isDone ? '●' : '○';
          const pri = t.meta?.priority ? `<span class="priority-badge priority-${t.meta.priority}">${t.meta.priority}</span>` : '';
          return `<div class="op-task-row ${isDone ? 'done' : ''}" data-action="open-entry-detail" data-entry-id="${esc(t.id)}">
            <span class="op-task-status">${icon}</span>
            <span class="op-task-desc">${esc(t.description||'')}</span>
            ${pri}
          </div>`;
        }).join('')}
      </div>` : '';

    const runsHtml = (status === 'open') ? `
      <div class="op-runs">
        <div class="op-section-label">Run Records</div>
        ${runs.length ? runs.map(r => `
          <div class="op-run-row">
            <span style="color:${runColor(r.status)};font-size:0.85em;">${runIcon(r.status)}</span>
            <span class="op-run-date">${localDate(r.date)}</span>
            <span class="op-run-batch">${esc(r.batch||'')}</span>
            <span class="op-run-desc">${esc(r.description||'')}</span>
          </div>`).join('') : '<div class="op-empty">No runs yet</div>'}
      </div>` : '';

    const incidentsHtml = incidents.map(i => `
      <div class="op-incident open">
        <span class="op-incident-icon">⚠</span>
        <span class="op-incident-id">[${esc(i.id)}]</span>
        <span class="op-incident-title">${esc(i.title||'')}</span>
        <span class="op-incident-date">${(i.opened_at||'').slice(0,10)}</span>
      </div>`).join('');

    const resolvedHtml = resolvedIncidents.slice(-3).map(i => `
      <div class="op-incident resolved">
        <span class="op-incident-icon" style="color:var(--text-dim)">✓</span>
        <span class="op-incident-id">[${esc(i.id)}]</span>
        <span class="op-incident-title" style="color:var(--text-dim)">${esc(i.title||'')}</span>
        <span class="op-incident-date">${(i.resolved_at||'').slice(0,10)}</span>
      </div>`).join('');

    return `
    <div class="op-card">
      <div class="op-header">
        <span class="op-id">${esc(op.id)}</span>
        <span class="op-title">${esc(targetLabel(op)||'')}</span>
        ${statusBadge}
        ${priorityBadge}
        <span class="op-badge">${esc((op.schedule||{}).frequency||'')}</span>
        <span class="op-source">${esc(op.log_source||'')}</span>
        ${incidents.length ? `<span class="op-incident-count">⚠ ${incidents.length}</span>` : ''}
        ${opCreatorRow}
      </div>
      ${creatorBlock}${objectiveBlock}${hintBlock}
      ${opTasksHtml}
      ${runsHtml}
      ${incidents.length || resolvedIncidents.length ? `
      <div class="op-incidents">
        <div class="op-section-label">Incidents</div>
        ${incidentsHtml}${resolvedHtml}
      </div>` : ''}
      ${renderRelatedTreksWidget('operation', op.id)}
    </div>`;
  };

  const summary = [
    activeOps.length ? `${activeOps.length} active` : '',
    pendingOps.length ? `${pendingOps.length} pending` : '',
    closedOps.length ? `${closedOps.length} closed` : '',
  ].filter(Boolean).join(' · ');

  return `<section class="retro-section fade-in">
    <div style="margin-bottom:12px;font-size:0.78rem;color:var(--text-dim);">
      ${summary || 'No operations.'}
    </div>
    ${activeOps.map(renderOp).join('')}
    ${pendingOps.length ? `
    <details open style="margin-top:16px;">
      <summary style="font-size:0.75rem;color:var(--text-dim);cursor:pointer;">Pending Operations (${pendingOps.length})</summary>
      <div style="margin-top:8px;">${pendingOps.map(renderOp).join('')}</div>
    </details>` : ''}
    ${closedOps.length ? `
    <details style="margin-top:16px;">
      <summary style="font-size:0.75rem;color:var(--text-dim);cursor:pointer;">Closed Operations (${closedOps.length})</summary>
      <div style="margin-top:8px;opacity:0.6;">${closedOps.map(renderOp).join('')}</div>
    </details>` : ''}
  </section>`;
}


function renderSessionSection() {
  // ms-57 e-1041: the Session tab is a 2-view container — Notes (live
  // scratch within the current session) and Session Log (per-session
  // aggregated entries, decision-trail of past sessions). Sharing one
  // tab makes the "where did that hand-off go?" mental model coherent.
  const view = state.sessionView === 'logs' ? 'logs' : 'notes';
  const toggle = `<div class="op-tabs" style="display:flex;gap:6px;margin-bottom:12px;">
    <button class="tab-btn ${view === 'notes' ? 'active' : ''}"
            data-action="set-session-view" data-view="notes">Notes</button>
    <button class="tab-btn ${view === 'logs' ? 'active' : ''}"
            data-action="set-session-view" data-view="logs">Session Log</button>
  </div>`;
  const body = view === 'logs' ? renderSessionLogsSection() : renderNotesSection();
  return `<section class="retro-section fade-in">${toggle}${body}</section>`;
}


function renderSessionLogsSection() {
  const logs = state.sessionLogs || [];
  if (!logs.length) {
    return `<div class="op-empty" style="padding:16px 0;">
      No session logs yet.<br>
      <span style="font-size:0.72rem;color:var(--text-dim);">
        On session end (<code>beacon session end</code> or /beacon-session-end Skill),
        notes / commits / PRs for that session are aggregated and appear here.
      </span>
    </div>`;
  }
  const rows = logs.map(l => {
    const sid = esc(l.session_id || '');
    const when = (l.last_aggregated_at || '').slice(0, 16).replace('T', ' ');
    const counts = `notes:${(l.note_ids || []).length} · commits:${(l.commit_ids || []).length} · prs:${(l.pr_ids || []).length}`;
    const recovered = l.recovered
      ? '<span style="color:var(--text-dim);font-size:0.7rem;">(recovered)</span>'
      : '';
    const summary = esc(l.summary || '');
    return `<div class="note-row" style="flex-direction:column;align-items:flex-start;gap:4px;padding:8px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;">
        <span class="note-time">${when}</span>
        <span style="font-size:0.7rem;color:var(--text-dim);font-family:monospace;">${sid}</span>
        ${recovered}
      </div>
      <div style="font-size:0.78rem;color:var(--text-secondary);">${counts}</div>
      <div class="note-text" style="font-size:0.85rem;">${summary}</div>
    </div>`;
  }).join('');
  return `<div class="op-section-label" style="margin-bottom:10px;">
    Session logs (per-session summaries, decision trail)
  </div>
  ${rows}
  <div style="margin-top:12px;font-size:0.7rem;color:var(--text-dim);">${logs.length} entries · most recent only</div>`;
}


function renderNotesSection() {
  const notes = state.sessionNotes || [];
  const noteRows = notes.map(n => {
    const time = (n.ts || '').slice(11, 16);
    const ctx = n.context ? `<span class="note-ctx">[${esc(n.context)}]</span> ` : '';
    return `<div class="note-row"><span class="note-time">${time}</span>${ctx}<span class="note-text">${esc(n.text || '')}</span></div>`;
  }).join('');

  return `<section class="retro-section fade-in">
    <div class="op-section-label" style="margin-bottom:10px;">
      Session notes (ephemeral — cleared on session end)
    </div>
    ${notes.length === 0
      ? `<div class="op-empty" style="padding:16px 0;">
          No notes.<br>
          <span style="font-size:0.72rem;color:var(--text-dim);">In Claude Code, say "memo this", or run <code>beacon note "text"</code> to add one.</span>
        </div>`
      : noteRows}
    ${notes.length > 0 ? `<div style="margin-top:12px;font-size:0.7rem;color:var(--text-dim);">${notes.length} notes · clear with beacon note clear</div>` : ''}
  </section>`;
}
