<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ================================================================
   BEACON — Terminal Noir Milestones v3
   ================================================================ */

:root {
  --bg-void: #0a0a0c;
  --bg-surface: #111114;
  --bg-raised: #18181c;
  --bg-hover: #1f1f24;
  --border: #2a2a30;
  --border-subtle: #1e1e24;
  --text-primary: #e4e4e8;
  --text-secondary: #a1a1aa;
  --text-dim: #71717a;
  --accent: #4ade80;
  --accent-dim: #166534;
  --accent-glow: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --info: #60a5fa;
  --done: #4ade80;
  --in-progress: #60a5fa;
  --observing: #a78bfa;
  --todo: #71717a;
  --waiting: #f97316;
  --cancelled: #ef4444;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
  --scanline-opacity: 0.03;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ---- Layout ---- */

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---- Header ---- */

.header {
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.header::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 120px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}

.project-name {
  font-family: var(--font-mono);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.header-tag {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* e-587: project version badge in the header. Shown only when the project
   has at least one push record with a semver. Format: "v0.4.0  +N" */
.version-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--accent);
  background: var(--accent-glow, rgba(80,180,140,0.08));
  border: 1px solid var(--accent-dim, rgba(80,180,140,0.3));
  border-radius: 4px;
  letter-spacing: 0.02em;
}
.version-badge .vb-diff {
  color: var(--text-dim);
  font-size: 0.68rem;
}

.connection-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.offline {
  background: var(--cancelled);
  box-shadow: 0 0 6px var(--cancelled);
  animation: none;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---- Search (inline in milestones header) ---- */

.ms-search-inline {
  flex: 1;
  min-width: 0;
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 0.75rem;
  color: var(--text-primary);
  font-family: var(--font-mono);
  outline: none;
}
.ms-search-inline:focus { border-color: var(--accent-dim); }
.ms-search-inline::placeholder { color: var(--text-dim); }
.search-results { margin-top: 4px; }
.search-result-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 6px 10px;
  padding: 7px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  margin-bottom: 4px;
  background: var(--bg-surface);
  cursor: pointer;
  transition: border-color 0.15s;
}
.search-result-item:hover { border-color: var(--border); }
.search-result-type { font-size: 0.65rem; color: var(--text-dim); padding-top: 2px; }
.search-result-desc { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-result-ms { font-size: 0.65rem; color: var(--text-dim); grid-column: 2; }
.search-result-date { font-size: 0.65rem; color: var(--text-dim); text-align: right; }
.search-empty { padding: 16px 0; color: var(--text-dim); font-size: 0.8rem; text-align: center; }

/* ---- Releases subtabs ---- */
.releases-subtabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
.releases-subtab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 16px; font-size: 0.78rem; font-family: var(--font-mono); color: var(--text-dim); cursor: pointer; margin-bottom: -1px; }
.releases-subtab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
/* Push cards */
.push-card { padding: 10px 0 6px 10px; border-bottom: 1px solid var(--border-subtle); border-left: 3px solid #2a5080; }
.push-card:last-child { border-bottom: none; }
.push-card-header { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-wrap: wrap; }
.push-card-header:hover .push-id { color: var(--text-secondary); }
.push-icon { color: #4a9fd4; font-size: 0.85rem; }
.push-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }
.push-branch-badge { font-size: 0.6rem; color: #4a9fd4; background: rgba(74,159,212,0.1); padding: 1px 5px; border-radius: 2px; border: 1px solid rgba(74,159,212,0.25); }
.push-by { font-size: 0.7rem; color: var(--text-dim); }
.push-datetime { font-size: 0.7rem; color: var(--text-dim); margin-left: auto; }
.push-expand-arrow { font-size: 0.6rem; color: var(--text-dim); }
.push-summary { font-size: 0.78rem; color: var(--text-secondary); margin: 4px 0 4px 18px; line-height: 1.4; }
.push-commit-count { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); padding: 1px 6px; border: 1px solid var(--border-subtle); border-radius: 2px; }
.push-commit-list { margin: 8px 0 4px 18px; display: flex; flex-direction: column; gap: 3px; }
.push-commit-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.72rem; }
.push-commit-hash { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
.push-commit-msg { color: var(--text-secondary); }

/* ---- Releases / Deploy Timeline ---- */

.release-group-header { display: flex; align-items: center; gap: 10px; padding: 10px 0 8px; border-bottom: 1px solid var(--accent-dim); margin-bottom: 2px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); }
.release-group-semver { background: var(--accent-glow); padding: 1px 6px; border-radius: 3px; font-size: 0.72rem; }
.deploy-card { padding: 10px 0 6px 10px; border-bottom: 1px solid var(--border-subtle); border-left: 3px solid transparent; }
.deploy-card:last-child { border-bottom: none; }
.deploy-card.is-major { border-left-color: var(--accent-dim); }
.deploy-card.is-minor { border-left-color: var(--border); }
.deploy-card-header { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-wrap: wrap; }
.deploy-card-header:hover .deploy-id { color: var(--text-secondary); }
.deploy-type-dot { font-size: 0.85rem; }
.deploy-type-dot.major { color: var(--accent); }
.deploy-type-dot.minor { color: var(--text-dim); }
.deploy-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }
.deploy-datetime { font-size: 0.7rem; color: var(--text-dim); margin-left: auto; }
.deploy-env-badge { font-size: 0.6rem; color: var(--text-dim); background: var(--bg-raised); padding: 1px 5px; border-radius: 2px; border: 1px solid var(--border-subtle); }
.deploy-env-filter { display: flex; gap: 4px; margin: 6px 0 10px; flex-wrap: wrap; }
.deploy-env-btn { font-size: 0.7rem; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border-subtle); background: var(--bg-raised); color: var(--text-dim); cursor: pointer; }
.deploy-env-btn.active { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }
.op-card { background: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 12px 16px; margin-bottom: 14px; }
.op-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.op-id { font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); }
.op-title { font-size: 0.88rem; color: var(--text); font-weight: 600; flex: 1; }
.op-badge { font-size: 0.65rem; padding: 1px 6px; border-radius: 3px; background: var(--bg-mid); color: var(--text-dim); }
.op-source { font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono); }
.op-incident-count { font-size: 0.72rem; color: var(--warn,#f0b429); margin-left: auto; }
.op-section-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; margin-top: 8px; }
.op-run-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.78rem; padding: 2px 0; }
.op-run-date { color: var(--text-dim); font-family: var(--font-mono); font-size: 0.72rem; min-width: 72px; }
.op-run-batch { color: var(--text-dim); font-family: var(--font-mono); font-size: 0.72rem; }
.op-run-desc { color: var(--text); flex: 1; }
.op-empty { font-size: 0.75rem; color: var(--text-dim); font-style: italic; }
.op-incident { display: flex; align-items: baseline; gap: 6px; font-size: 0.78rem; padding: 3px 0; }
.op-incident-icon { font-size: 0.8rem; }
.op-incident-id { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); }
.op-incident-title { flex: 1; color: var(--text); }
.op-incident-date { font-size: 0.7rem; color: var(--text-dim); }
.note-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.82rem; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
.note-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); min-width: 36px; }
.note-ctx { font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); }
.note-text { flex: 1; color: var(--text); }
.deploy-expand-arrow { font-size: 0.6rem; color: var(--text-dim); }
.deploy-desc { font-size: 0.78rem; color: var(--text-secondary); margin: 4px 0 4px 18px; line-height: 1.4; }
.deploy-ms-badges { margin: 4px 0 0 18px; display: flex; flex-wrap: wrap; gap: 4px; }
.release-ms-badge { font-family: var(--font-mono); font-size: 0.65rem; padding: 1px 6px; border: 1px solid var(--border-subtle); border-radius: 2px; color: var(--text-dim); }
.release-ms-badge-completion { font-family: var(--font-mono); font-size: 0.65rem; padding: 1px 6px; border: 1px solid var(--accent-dim); border-radius: 2px; color: var(--accent); background: var(--accent-glow); }
.release-ms-badge-patch { font-family: var(--font-mono); font-size: 0.65rem; padding: 1px 6px; border: 1px solid #9a7000; border-radius: 2px; color: #c89000; background: rgba(180,120,0,0.07); }
.deploy-minor-group { margin-left: 20px; padding-left: 12px; border-left: 2px solid var(--border-subtle); }

/* Deploy expanded detail */
.deploy-detail { margin: 8px 0 4px 18px; display: flex; flex-direction: column; gap: 6px; }
.deploy-ms-block { border-radius: 3px; overflow: hidden; }
.deploy-ms-block-header { display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex-wrap: wrap; }
.deploy-ms-block.completion .deploy-ms-block-header { background: var(--accent-glow); border-left: 3px solid var(--accent); }
.deploy-ms-block.patch .deploy-ms-block-header { background: rgba(180,120,0,0.07); border-left: 3px solid #9a7000; }
.deploy-ms-block.untracked .deploy-ms-block-header { background: var(--bg-raised); border-left: 3px solid var(--border); }
.deploy-ms-type-label { font-size: 0.6rem; padding: 1px 6px; border-radius: 2px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.deploy-ms-block.completion .deploy-ms-type-label { background: rgba(0,200,120,0.15); color: var(--accent); }
.deploy-ms-block.patch .deploy-ms-type-label { background: rgba(180,120,0,0.2); color: #c89000; }
.deploy-ms-block.untracked .deploy-ms-type-label { color: var(--text-dim); border: 1px dashed var(--border-subtle); }
.deploy-ms-block-id { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
.deploy-ms-block-title { font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
.deploy-commit-list { padding: 4px 10px 6px; display: flex; flex-direction: column; gap: 4px; }
.deploy-commit-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.deploy-commit-label { font-size: 0.58rem; padding: 0 5px; border-radius: 2px; background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--border-subtle); white-space: nowrap; }
.deploy-commit-eid { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); min-width: 36px; }
.deploy-commit-desc { flex: 1; min-width: 120px; color: var(--text-secondary); font-size: 0.72rem; }
.deploy-commit-hash { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); background: var(--bg-raised); padding: 0 4px; border-radius: 2px; }

/* ---- Hamburger Menu ---- */

.hamburger-btn {
  background: none;
  border: 1px solid transparent;
  border-radius: 3px;
  cursor: pointer;
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color 0.2s;
}

.hamburger-btn:hover {
  border-color: var(--border);
}

.hamburger-btn span {
  display: block;
  width: 16px;
  height: 1.5px;
  background: var(--text-dim);
  transition: background 0.2s;
}

.hamburger-btn:hover span {
  background: var(--text-secondary);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  animation: fade-overlay 0.15s ease;
}

@keyframes fade-overlay {
  from { opacity: 0; }
  to { opacity: 1; }
}

.menu-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  max-width: 80vw;
  height: 100vh;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  z-index: 1001;
  padding: 24px;
  overflow-y: auto;
  animation: slide-in 0.2s ease;
}

@keyframes slide-in {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

.menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}

.menu-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.menu-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
}

.menu-close:hover {
  color: var(--text-primary);
}

.menu-section {
  margin-bottom: 20px;
}

.menu-section-title {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.menu-item {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 4px;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.85rem;
  text-align: left;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}

.menu-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
  color: var(--text-primary);
}

.menu-item.current {
  border-color: var(--accent-dim);
  color: var(--accent);
}

.menu-item-sub {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.menu-user {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  word-break: break-all;
}

/* ---- Project Info Block ---- */

.project-info {
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.project-info-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.project-info-label {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.project-info-value {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.project-info-item.review-due .project-info-label {
  color: var(--warning);
}

.project-info-item.review-due .project-info-value {
  color: var(--warning);
  font-weight: 500;
}

/* ---- Summary Block ---- */

.summary-block {
  padding: 20px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.summary-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.summary-text {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.7;
}

/* ---- Filter Bar ---- */

.filter-bar {
  display: flex;
  gap: 6px;
  padding: 16px 0 0;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
}

/* Active (visible) state — colored per status */
.filter-btn.on {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

.filter-btn.on.f-todo { color: var(--todo); border-color: var(--todo); background: rgba(113,113,122,0.08); }
.filter-btn.on.f-active { color: var(--in-progress); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.08); }
.filter-btn.on.f-observing { color: var(--observing); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
.filter-btn.on.f-done { color: var(--done); border-color: var(--accent-dim); background: var(--accent-glow); }
.filter-btn.on.f-waiting { color: var(--waiting); border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.08); }

/* Off (hidden) state */
.filter-btn.off {
  color: var(--text-dim);
  opacity: 0.4;
  border-color: var(--border-subtle);
  background: transparent;
}

.filter-btn.off:hover {
  opacity: 0.7;
}

.filter-btn.f-all {
  color: var(--text-dim);
  border-color: var(--border-subtle);
}

.filter-btn.f-all:hover {
  color: var(--text-secondary);
  border-color: var(--border);
}

/* ---- Sort Toggle ---- */

.sort-toggle {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
  margin-left: auto;
}

.sort-toggle:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

/* ---- Milestone List ---- */

.milestones {
  padding: 24px 0;
}

.milestones-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.milestones-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.milestones-count {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ---- Milestone Card ---- */

.ms-card {
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 8px;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
}

.ms-card:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.ms-card.active {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.ms-card-header {
  padding: 12px 16px;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}

.ms-status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.ms-status-icon {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ms-status-icon.done { background: var(--done); box-shadow: 0 0 4px rgba(74, 222, 128, 0.3); }
.ms-status-icon.in_progress { background: var(--in-progress); box-shadow: 0 0 4px rgba(96, 165, 250, 0.3); animation: pulse-dot 2s ease-in-out infinite; }
.ms-status-icon.observing { background: var(--observing); box-shadow: 0 0 4px rgba(167, 139, 250, 0.3); }
.ms-status-icon.todo { background: var(--todo); }
.ms-status-icon.waiting { background: var(--waiting); }
.ms-status-icon.cancelled { background: var(--cancelled); }

.ms-status-text {
  font-size: 0.65rem;
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 500;
}

.ms-status-text.done { color: var(--done); }
.ms-status-text.in_progress { color: var(--in-progress); }
.ms-status-text.observing { color: var(--observing); }
.ms-status-text.todo { color: var(--todo); }
.ms-status-text.waiting { color: var(--waiting); }
.ms-status-text.cancelled { color: var(--cancelled); }

.ms-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.ms-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ms-title {
  font-size: 0.9rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.ms-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.ms-progress-bar {
  width: 80px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.ms-progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.ms-progress-fill.done { background: var(--done); }
.ms-progress-fill.in_progress { background: var(--in-progress); }
.ms-progress-fill.observing { background: var(--observing); }
.ms-progress-fill.todo { background: var(--todo); }

.ms-progress-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ms-expand-hint {
  font-size: 0.65rem;
  color: var(--text-dim);
  transition: transform 0.2s;
}

@media (max-width: 500px) {
  .ms-meta { gap: 8px; }
  .ms-progress-bar { width: 40px; }
  .ms-tasks-text { display: none; }
  .ms-status-text { display: none; }
  .sort-toggle { display: none; }
  .ms-card-header { gap: 8px; }
}

.ms-card.expanded .ms-title {
  white-space: normal;
  overflow: visible;
}

.ms-card.expanded .ms-expand-hint {
  transform: rotate(180deg);
}

.ms-tasks-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ---- Milestone Expanded ---- */

.ms-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.ms-card.expanded .ms-body {
  max-height: 8000px;
}

.ms-entries {
  padding: 0 16px 12px;
  border-top: 1px solid var(--border-subtle);
}

.ms-entries-toolbar {
  display: flex;
  align-items: center;
  padding: 8px 0 4px;
  gap: 8px;
}

.entry-filter-btn {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 8px;
  border: 1px solid var(--border-subtle);
  border-radius: 2px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}

.entry-filter-btn:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

.entry-filter-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

.ms-description {
  padding: 8px 0 4px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-style: italic;
}

/* ---- Entry Row ---- */

.entry {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 8px;
  padding: 6px 0;
  align-items: start;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.85rem;
}

.entry:last-child { border-bottom: none; }

.entry-type-badge {
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 1px 5px;
  border-radius: 2px;
  line-height: 1.8;
  white-space: nowrap;
}

.entry-type-badge.commit {
  color: var(--accent);
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.15);
}

.entry-type-badge.task {
  color: var(--info);
  background: rgba(96, 165, 250, 0.1);
  border: 1px solid rgba(96, 165, 250, 0.15);
}

.entry-type-badge.note {
  color: var(--warning);
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.15);
}

.entry-type-badge.save {
  color: #c084fc;
  background: rgba(192, 132, 252, 0.1);
  border: 1px solid rgba(192, 132, 252, 0.15);
}

.entry-type-badge.pr {
  color: #f97316;
  background: rgba(249, 115, 22, 0.1);
  border: 1px solid rgba(249, 115, 22, 0.15);
}

.entry-type-badge.operation_task {
  color: #a78bfa;
  background: rgba(167, 139, 250, 0.1);
  border: 1px solid rgba(167, 139, 250, 0.18);
}

/* Operation status badge in header */
.op-status-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-left: 4px;
}
.op-status-badge.todo        { color: var(--text-dim); background: rgba(113,113,122,0.15); border: 1px solid rgba(113,113,122,0.25); }
.op-status-badge.in_progress { color: #60a5fa; background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.25); }
.op-status-badge.open        { color: #4ade80; background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.25); }
.op-status-badge.closed      { color: var(--text-dim); background: rgba(100,116,139,0.1); border: 1px solid rgba(100,116,139,0.15); }

.op-meta-block {
  margin-top: 6px;
  padding: 5px 10px;
  border-left: 2px solid rgba(148,163,184,0.3);
  font-size: 11px;
  color: #94a3b8;
  line-height: 1.5;
}
.op-meta-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.op-meta-objective .op-meta-label  { color: #a3e635; }
.op-meta-objective                 { border-left-color: rgba(163,230,53,0.4); }
.op-meta-hint .op-meta-label       { color: #fbbf24; }
.op-meta-hint                      { border-left-color: rgba(251,191,36,0.4); }

.op-tasks {
  margin-top: 10px;
}
.op-task-row {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 4px 0;
  font-size: 12px;
  cursor: pointer;
}
.op-task-row:hover { background: var(--bg-hover); }
.op-task-row.done .op-task-desc { color: var(--text-dim); text-decoration: line-through; }
.op-task-status { font-size: 0.8em; }
.op-task-progress {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: 8px;
}

.entry-pr-block {
  grid-column: 1 / -1;
}

.entry-pr-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 4px;
  font-size: 0.7rem;
  color: var(--text-secondary);
}

.entry-pr-decision {
  margin-top: 6px;
  padding: 5px 8px;
  border-left: 2px solid rgba(251,191,36,0.4);
  font-size: 0.72rem;
  line-height: 1.5;
}

.entry-pr-decision-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 2px;
}

.entry-pr-intent .entry-pr-decision-label { color: #60a5fa; }
.entry-pr-rationale-block .entry-pr-decision-label { color: #a3e635; }
.entry-pr-rationale-block { border-left-color: rgba(163,230,53,0.4); }

/* Priority badge */
.priority-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.priority-highest { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
.priority-high    { background: rgba(251,146,60,0.2); color: #fb923c; border: 1px solid rgba(251,146,60,0.4); }
.priority-middle  { background: rgba(234,179,8,0.2);  color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
.priority-low     { background: rgba(148,163,184,0.2); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
.priority-lowest  { background: rgba(100,116,139,0.15); color: #64748b; border: 1px solid rgba(100,116,139,0.2); }

/* Entry info blocks (motivation / acceptance_criteria / behavior) */
.entry-info-block {
  margin-top: 6px;
  padding: 5px 10px;
  border-left: 2px solid rgba(148,163,184,0.3);
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}
.entry-info-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.entry-info-why   .entry-info-label { color: #60a5fa; }
.entry-info-ac    .entry-info-label { color: #a3e635; }
.entry-info-behavior .entry-info-label { color: #c084fc; }
.entry-info-why   { border-left-color: rgba(96,165,250,0.4); }
.entry-info-ac    { border-left-color: rgba(163,230,53,0.4); }
.entry-info-behavior { border-left-color: rgba(192,132,252,0.4); }

/* MS objective / acceptance_criteria */
.ms-objective {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 6px;
  font-style: italic;
}
.ms-ac {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 8px;
  padding: 4px 8px;
  border-left: 2px solid rgba(163,230,53,0.4);
}
.ms-ac-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #a3e635;
  margin-bottom: 2px;
}

/* Entry detail button */
.entry-info-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 10px;
  padding: 0 5px;
  height: 15px;
  margin-left: 6px;
  vertical-align: middle;
  line-height: 1;
  letter-spacing: 0.05em;
  transition: color 0.15s, border-color 0.15s;
}
.entry-info-btn:hover { color: var(--text-secondary); border-color: var(--text-dim); }

/* Entry detail modal */
.entry-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 10000;
  /* デフォルトは非表示。JS (renderEntryModal) が open 時に inline style.display='flex' をセット。
     以前は display:flex デフォルト + HTML 側 inline style="display:none" で隠していたが、
     Tauri WebKit で inline style が効かないケースが発生 (Web は OK)。CSS デフォルトを none に
     することで origin に依らず確実に閉じた状態で起動する (ms-46 e-740 follow-up)。 */
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.entry-modal {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  max-width: 560px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
}
.entry-modal-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-raised);
}
.entry-modal-title {
  font-size: 12px;
  color: var(--text-secondary);
  flex: 1;
}
.entry-modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 3px;
}
.entry-modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }
.entry-modal-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.entry-modal-desc {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
}
.entry-modal-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.entry-modal-field {
  padding: 7px 11px;
  border-left: 2px solid rgba(148,163,184,0.3);
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
}
.entry-modal-field-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.modal-field-why      .entry-modal-field-label { color: #60a5fa; }
.modal-field-why      { border-left-color: rgba(96,165,250,0.4); }
.modal-field-ac       .entry-modal-field-label { color: #a3e635; }
.modal-field-ac       { border-left-color: rgba(163,230,53,0.4); }
.modal-field-behavior .entry-modal-field-label { color: #c084fc; }
.modal-field-behavior { border-left-color: rgba(192,132,252,0.4); }
.modal-field-resolves .entry-modal-field-label { color: #f59e0b; }
.modal-field-resolves { border-left-color: rgba(245,158,11,0.4); }
.modal-field-detail   .entry-modal-field-label { color: var(--text-dim); }

.entry-pr-status {
  font-weight: 500;
}

.entry-pr-status.open { color: #60a5fa; }
.entry-pr-status.in_review { color: #fb923c; }
.entry-pr-status.approved { color: #a3e635; }
.entry-pr-status.merged { color: #a78bfa; }
.entry-pr-status.closed { color: var(--text-dim); }
.entry-pr-status.rejected { color: #f87171; }

.entry-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
}

.entry-desc {
  color: #f4f4f5;
  line-height: 1.6;
}

.entry.done .entry-desc {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--border);
}

/* Commits are historical records, not to-dos — no strikethrough */
.entry.entry-type-commit.done .entry-desc {
  text-decoration: none;
}

.entry-status-text {
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-left: 4px;
}

.entry-status-text.done { color: var(--done); }
.entry-status-text.todo { color: var(--todo); }
.entry-status-text.in_progress { color: var(--in-progress); }
.entry-status-text.in_review { color: #fb923c; }
.entry-status-text.approved { color: #a3e635; }
.entry-status-text.cancelled { color: var(--text-dim); }

.entry-date {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
  white-space: nowrap;
}

.entry-hash {
  font-size: 0.7rem;
  color: var(--accent-dim);
  margin-left: 4px;
}

/* ---- Entry Toggle (collapsible children) ---- */

.entry-toggle {
  cursor: pointer;
  user-select: none;
}

.entry-toggle > .entry-desc::before {
  content: '\25BC ';
  font-size: 0.6rem;
  color: var(--text-dim);
  display: inline-block;
}

.entry-toggle.collapsed > .entry-desc::before {
  content: '\25B6 ';
}

.entry-type-commit.entry-toggle .entry-desc::before,
.entry-type-commit.entry-toggle.collapsed .entry-desc::before {
  content: none;
}

.entry-child-count {
  font-size: 0.65rem;
  color: var(--accent);
  margin-left: 6px;
  padding: 1px 5px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 3px;
  font-weight: 500;
}

/* ---- Entry Detail ---- */

.entry-detail {
  grid-column: 3 / -1;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 0 2px;
  line-height: 1.5;
  border-left: 2px solid var(--border-subtle);
  padding-left: 10px;
  margin-top: 2px;
}

/* ---- Nested entries (under task) ---- */

.entry-children {
  grid-column: 1 / -1;
  padding-left: 18px;
}

.entry-children.hidden {
  display: none;
}

.entry-children .entry {
  border-bottom-color: transparent;
  padding: 3px 0;
}

/* ---- Tabs (Milestones / Reviews) ---- */

.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border-subtle);
}

.tab-btn {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}

.tab-btn:hover {
  color: var(--text-secondary);
}

.tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}

/* ---- Dependency Graph ---- */

.graph-section { padding: 24px 0; }

.graph-container {
  width: 100%;
  overflow-x: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 16px;
}

.graph-container svg { display: block; margin: 0 auto; }

.graph-node rect {
  rx: 6;
  ry: 6;
  stroke-width: 1.5;
  cursor: pointer;
  transition: filter 0.2s;
}

.graph-node:hover rect { filter: brightness(1.3); }

.graph-node text {
  font-family: var(--font-mono);
  font-size: 11px;
  fill: var(--text-primary);
  pointer-events: none;
}

.graph-node .node-id {
  font-size: 9px;
  fill: var(--text-dim);
}

.graph-node .node-progress {
  font-size: 9px;
  fill: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

.graph-edge {
  fill: none;
  stroke: var(--border);
  stroke-width: 1.5;
  marker-end: url(#arrowhead);
}

.graph-edge.cross-task {
  stroke-dasharray: 4 3;
  stroke: var(--text-dim);
}

.graph-empty {
  color: var(--text-dim);
  text-align: center;
  padding: 48px 0;
  font-size: 0.85rem;
}

.graph-legend {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  justify-content: center;
  flex-wrap: wrap;
}

.graph-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  color: var(--text-dim);
}

.graph-legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid var(--border);
}

/* ---- Retro Viewer ---- */

.retro-section {
  padding: 24px 0;
}

.retro-list {
  list-style: none;
}

.retro-item {
  padding: 10px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.retro-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.retro-item-week {
  font-size: 0.9rem;
  color: var(--text-primary);
}

.retro-item-date {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.retro-content {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 20px;
  white-space: pre-wrap;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--text-secondary);
  max-height: 70vh;

</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading"><div class="loading-bar"></div><div class="loading-text">Loading</div></div>
</div>
<div id="menu-root"></div>
<!-- Entry detail modal overlay (ms-46 e-740: shared with Web UI body L3695) -->
<div id="entry-detail-modal" class="entry-modal-overlay" style="display:none;" onclick="closeEntryModal()"></div>

<script>
// ============================================================
// DESKTOP LAYER (desktop/layer.js)
// ============================================================
// ============================================================
// DESKTOP-SPECIFIC: Tauri data layer
// Generated into desktop/dist/index.html by desktop/build.py
// ============================================================
const { invoke } = window.__TAURI__.core;

let pollTimer = null;
let lastProjectJson = null;
let cloudMode = false;

// Cloud WS live-update state (e-738). Web UI has equivalent in index.html;
// Tauri previously left this as "別タスク" comment in doSelectCloudProject
// after 3cebae5 removed the 2s polling, leaving cloud Tauri permanently stale.
let cloudWs = null;
let cloudWsReconnectTimer = null;
let cloudWsPingInterval = null;
let cloudWsReconnectAttempts = 0;
const CLOUD_WS_RECONNECT_MAX_MS = 30000;
const CLOUD_WS_API_HOST = 'beacon-ai.dev';

let state = {
  project: null, expanded: new Set(), lastUpdate: null, connected: false, error: null,
  activeTab: 'dashboard',
  showGraph: false, graphFilterDeps: true,
  retros: [], retroContent: null,
  documents: [], documentContent: null,
  hiddenStatuses: new Set(),
  hideEntryDone: new Set(),
  collapsedEntries: new Set(),
  sortAsc: true,
  searchQuery: '',
  showReleaseGraph: false,
  expandedDeployId: null,
  releasesSubTab: 'service',
  expandedPushId: null,
  cloudDiag: null,
  cloudProjectId: null,
  projectPath: null,
  // ms-46 e-745: Operations / Notes alignment with Web UI.
  // Operations は state.project.operations から read (追加 loader 不要)。
  // Notes はサーバー / CLI 経由で取得する必要があるため state に持つ。
  sessionNotes: [],
};

// ---- Data loading (Tauri invoke) ----

async function loadProject() {
  try {
    let json;
    if (cloudMode && state.cloudProjectId) {
      json = await invoke('cloud_load_project', { projectId: state.cloudProjectId });
    } else {
      json = await invoke('load_project_json');
    }
    if (!json) return;
    const data = JSON.parse(json);
    const newJson = JSON.stringify(data);
    if (newJson !== lastProjectJson) {
      lastProjectJson = newJson;
      state.project = data;
      state.lastUpdate = new Date();
      state.connected = true;
      state.error = null;
      renderOnDataChange();
    }
  } catch (e) {
    if (!state.error) {
      state.error = String(e);
      state.connected = false;
      stopPolling(); stopWatcher();
      renderProjectSelector();
    }
  }
}

async function loadDocuments() {
  try {
    if (cloudMode) {
      state.documents = JSON.parse(await invoke('cloud_list_documents'));
    } else {
      state.documents = JSON.parse(await invoke('get_documents', { scope: '' }));
    }
  } catch (e) { state.documents = []; }
}

async function loadRetros() {
  try {
    if (cloudMode) {
      state.retros = JSON.parse(await invoke('cloud_list_retros'));
    } else {
      state.retros = JSON.parse(await invoke('list_retros'));
    }
  } catch (e) { state.retros = []; }
}

async function loadRetroContent(week) {
  try {
    if (cloudMode) {
      state.retroContent = JSON.parse(await invoke('cloud_get_retro', { week }));
    } else {
      state.retroContent = JSON.parse(await invoke('get_retro_content', { week }));
    }
  } catch (e) { state.retroContent = { week, content: 'Failed to load.' }; }
  render();
}

// ms-46 e-745: session notes loader for Notes tab.
// Cloud mode: API 経由。Local mode は将来 beacon CLI 経由を追加するが、
// 現状 cloud のみサポート (band-aid)。
async function loadSessionNotes() {
  try {
    if (cloudMode) {
      state.sessionNotes = JSON.parse(await invoke('cloud_list_notes'));
    } else {
      state.sessionNotes = [];  // local mode は未対応 (e-745 follow-up)
    }
  } catch (e) {
    state.sessionNotes = [];
  }
}

async function loadDocumentContent(docId) {
  try {
    if (cloudMode) {
      state.documentContent = JSON.parse(await invoke('cloud_get_document', { docId }));
    } else {
      const content = await invoke('get_document_content', { docId });
      let title = docId, scope = 'memo', body = content;
      if (content.startsWith('---')) {
        const parts = content.split('---', 3);
        if (parts.length >= 3) {
          for (const line of parts[1].trim().split('\n')) {
            if (line.startsWith('scope:')) scope = line.split(':', 2)[1].trim();
          }
          body = parts[2].trim();
        }
      }
      const m = body.match(/^# (.+)/m);
      if (m) title = m[1];
      state.documentContent = { doc_id: docId, title, scope, content: body };
    }
  } catch (e) {
    state.documentContent = { doc_id: docId, title: 'Error', scope: 'memo', content: String(e) };
  }
  render();
}

function startPolling() { if (!pollTimer) pollTimer = setInterval(loadProject, 2000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ---- Cloud WebSocket (live updates) ----
// e-738: Tauri cloud mode previously had no live updates after 3cebae5
// removed the 2s polling. This subscribes to the server's project broadcast,
// mirroring Web UI behaviour in server/static/index.html.

async function connectCloudWebSocket(projectId) {
  closeCloudWebSocket();
  if (!projectId) return;

  let token;
  try {
    token = await invoke('cloud_get_auth_token');
  } catch (e) {
    state.connected = false;
    state.error = String(e);
    render();
    return;
  }

  const url = `wss://${CLOUD_WS_API_HOST}/ws/projects/${encodeURIComponent(projectId)}?token=${encodeURIComponent(token)}`;
  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    state.connected = false;
    state.error = `WS construct failed: ${e}`;
    render();
    return;
  }
  cloudWs = ws;

  ws.onopen = () => {
    cloudWsReconnectAttempts = 0;
    state.connected = true;
    state.error = null;
    if (state.project) render();
    if (cloudWsPingInterval) clearInterval(cloudWsPingInterval);
    cloudWsPingInterval = setInterval(() => {
      if (cloudWs && cloudWs.readyState === WebSocket.OPEN) cloudWs.send('ping');
    }, 30000);
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (_) { return; }
    if (msg.type !== 'project') return;
    const data = msg.data || {};
    const newJson = JSON.stringify(data);
    if (newJson === lastProjectJson) return;
    lastProjectJson = newJson;
    state.project = data;
    state.lastUpdate = new Date();
    state.connected = true;
    state.error = null;
    renderOnDataChange();
  };

  ws.onerror = () => {
    state.connected = false;
    if (state.project) render();
  };

  ws.onclose = async (ev) => {
    if (cloudWsPingInterval) { clearInterval(cloudWsPingInterval); cloudWsPingInterval = null; }
    cloudWs = null;
    state.connected = false;

    // 4401: token missing (we never sent one), 4403: token expired/invalid.
    // For 4403 attempt one silent refresh + immediate reconnect (no backoff
    // counter increment); for 4401 surface a clear "sign in" message.
    if (ev && ev.code === 4401) {
      state.error = 'Not signed in. Run `beacon auth login` to enable live updates.';
      if (state.project) render();
      return;
    }
    if (ev && ev.code === 4403) {
      try {
        await invoke('cloud_refresh_auth_token');
        // Reset attempts since refresh succeeded; reconnect immediately.
        cloudWsReconnectAttempts = 0;
        connectCloudWebSocket(projectId);
        return;
      } catch (e) {
        state.error = 'Session expired. Run `beacon auth login` to sign in again.';
        if (state.project) render();
        return;
      }
    }

    // Generic close (network blip, server restart): exponential backoff capped
    // at 30s, matching lib/store_api.py.
    if (!cloudMode || state.cloudProjectId !== projectId) return;
    cloudWsReconnectAttempts += 1;
    const delay = Math.min(1000 * (2 ** (cloudWsReconnectAttempts - 1)), CLOUD_WS_RECONNECT_MAX_MS);
    if (state.project) render();
    cloudWsReconnectTimer = setTimeout(() => {
      cloudWsReconnectTimer = null;
      if (cloudMode && state.cloudProjectId === projectId) {
        connectCloudWebSocket(projectId);
      }
    }, delay);
  };
}

function closeCloudWebSocket() {
  if (cloudWsReconnectTimer) { clearTimeout(cloudWsReconnectTimer); cloudWsReconnectTimer = null; }
  if (cloudWsPingInterval) { clearInterval(cloudWsPingInterval); cloudWsPingInterval = null; }
  if (cloudWs) {
    // Suppress reconnect: clear handler before close.
    cloudWs.onclose = null;
    cloudWs.onerror = null;
    try { cloudWs.close(); } catch (_) {}
    cloudWs = null;
  }
  cloudWsReconnectAttempts = 0;
}

let unlistenWatcher = null;
async function startWatcher() {
  if (unlistenWatcher) return;
  if (window.__TAURI__?.event) {
    unlistenWatcher = await window.__TAURI__.event.listen('beacon-changed', () => loadProject());
  }
}
function stopWatcher() { if (unlistenWatcher) { unlistenWatcher(); unlistenWatcher = null; } }

// F27: project-changed event — fired by Rust single-instance plugin when a
// second `open -a Beacon --args /path` lands. Clear current state and reload
// from the new project dir.
let unlistenProjectSwitch = null;
async function startProjectSwitchListener() {
  if (unlistenProjectSwitch) return;
  if (window.__TAURI__?.event) {
    unlistenProjectSwitch = await window.__TAURI__.event.listen('project-changed', async () => {
      // Clear in-flight watcher / state from previous project
      stopWatcher();
      closeCloudWebSocket();
      state.project = null;
      state.expanded.clear();
      lastProjectJson = '';
      state.cloudProjectId = null;
      cloudMode = false;
      state.connected = false;
      state.error = null;
      render();
      // Reload from the new project_dir set by Rust
      await loadProject();
      await startWatcher();
    });
  }
}

async function doSelectCloudProject(projectId) {
  closeCloudWebSocket();
  cloudMode = true;
  state.cloudProjectId = projectId;
  state.error = null; state.project = null; state.expanded.clear();
  state.documents = []; state.documentContent = null;
  state.retros = []; state.retroContent = null;
  state.activeTab = 'dashboard'; lastProjectJson = null;
  state.projectPath = 'cloud:' + projectId;
  try {
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render();
    }
    // e-738: subscribe to live updates via WS. Polling was removed in 3cebae5
    // because the 2s setInterval blocked the main thread; WS pushes instead
    // arrive on data change only, so no constant CPU/JSON-parse cost.
    connectCloudWebSocket(projectId);
  } catch (e) { state.error = String(e); renderProjectSelector(); }
}

async function doSelectProject(path) {
  try {
    cloudMode = false;
    state.cloudProjectId = null;
    closeCloudWebSocket();
    stopPolling(); stopWatcher();
    await invoke('set_project_dir', { dir: path });
    state.error = null; state.project = null; state.expanded.clear();
    state.documents = []; state.documentContent = null;
    state.retros = []; state.retroContent = null;
    state.activeTab = 'dashboard'; lastProjectJson = null;
    state.projectPath = path;
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startWatcher();
    }
  } catch (e) { state.error = String(e); renderProjectSelector(); }
}

// ---- Project selector ----

async function renderProjectSelector() {
  const app = document.getElementById('app');
  let localProjects = [], cloudProjects = [], authenticated = false;
  try { localProjects = await invoke('list_projects'); } catch (e) {}
  try { authenticated = await invoke('is_authenticated'); } catch (e) {}
  if (authenticated) {
    try {
      cloudProjects = JSON.parse(await invoke('cloud_list_projects'));
    } catch (e) { state.cloudError = String(e); }
  }
  const localOnly = localProjects.filter(p => p.mode === 'local');

  app.innerHTML = `
    <div class="open-prompt fade-in">
      <h1 style="font-family:var(--font-mono);font-size:2rem;font-weight:700;">Beacon</h1>
      <p style="font-size:0.8rem;color:var(--text-dim);font-style:italic;">Where humans and AI are bound together.</p>
      ${state.error ? `<p style="font-size:0.75rem;color:var(--cancelled);">${esc(state.error)}</p>` : ''}
      <div style="width:100%;max-width:480px;margin-top:24px;">
        ${localOnly.length > 0 ? `<div class="summary-label">Local Projects</div>
          ${localOnly.map(p => `<div class="project-item" data-action="select-project" data-path="${esc(p.path)}"><div class="project-item-name">${esc(p.name)}</div><div class="project-item-id">${esc(p.path)}</div></div>`).join('')}` : ''}
        ${cloudProjects.length > 0 ? `<div class="summary-label" style="margin-top:16px;">Cloud Projects</div>
          ${cloudProjects.filter(p => !p.archived).map(p => `<div class="project-item" data-action="select-cloud-project" data-project-id="${esc(p.project_id)}"><div class="project-item-name">${esc(p.name)} <span style="font-size:0.65rem;color:var(--info)">cloud</span></div><div class="project-item-id">${esc(p.project_id)}</div></div>`).join('')}` : ''}
        ${!authenticated && localOnly.length === 0 ? `<p style="color:var(--text-dim);font-size:0.8rem;margin-top:12px;">Run <code style="color:var(--accent)">beacon auth login</code> to access cloud projects,<br>or <code style="color:var(--accent)">beacon init</code> to create a local project.</p>` : ''}
        ${state.cloudError ? `<p style="color:var(--warning);font-size:0.75rem;margin-top:12px;">Cloud error: ${esc(state.cloudError)}<br><span style="color:var(--text-dim);">Run <code style="color:var(--accent)">beacon auth login</code> to refresh.</span></p>` : ''}
        ${state.cloudDiag ? `<pre style="color:var(--text-dim);font-size:0.65rem;margin-top:8px;white-space:pre-wrap;border:1px solid var(--border);padding:8px;border-radius:3px;">${esc(state.cloudDiag)}</pre>` : ''}
        <button data-action="cloud-diagnose" style="margin-top:12px;font-size:0.7rem;padding:3px 10px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text-dim);cursor:pointer;font-family:inherit;">Diagnose cloud</button>
      </div>
    </div>`;
  bindEvents();
}

// ---- Render ----

function render() {
  const app = document.getElementById('app');
  if (!state.project) return;
  const scrollY = window.scrollY;
  const p = state.project;
  const sorted = sortMilestones(p.milestones || []);
  const filtered = filterMilestones(sorted);
  const activeCount = (p.milestones || []).filter(m => m.status === 'in_progress').length;
  const doneCount = (p.milestones || []).filter(m => m.status === 'done').length;
  const retro = nextRetroDate(p.retro_day);

  app.innerHTML = `
    <header class="header fade-in">
      <div class="header-top">
        <button class="hamburger-btn" data-action="open-menu" title="Menu"><span></span><span></span><span></span></button>
        <span class="project-name">${esc(p.name)}</span>
        <span class="header-tag">beacon desktop</span>
        <div class="connection-status" title="${cloudMode ? 'live = cloud API watcher' : 'live = local file watcher'}">
          <div class="status-dot ${state.connected ? '' : 'offline'}"></div>
          <span>${state.connected ? 'live' : 'offline'}</span>
        </div>
      </div>
    </header>

    ${(p.objective || retro) ? `
    <div class="project-info fade-in stagger-1">
      ${p.objective ? `<div class="project-info-item"><span class="project-info-label">Objective</span><span class="project-info-value">${esc(p.objective)}</span></div>` : ''}
      ${retro ? `<div class="project-info-item${retro.isToday ? ' review-due' : ''}"><span class="project-info-label">${retro.isToday ? '⚠ Review Due Today' : 'Next Review'}</span><span class="project-info-value">${retro.date} (${esc(p.retro_day || 'friday')})</span></div>` : ''}
    </div>` : ''}

    <div class="tab-bar fade-in stagger-1">
      <button class="tab-btn ${state.activeTab === 'dashboard' ? 'active' : ''}" data-action="switch-tab" data-tab="dashboard">Milestones</button>
      <button class="tab-btn ${state.activeTab === 'documents' ? 'active' : ''}" data-action="switch-tab" data-tab="documents">Documents</button>

      <section class="milestones fade-in">

          <input class="ms-search-inline" id="search-input" type="search" placeholder="Search milestones, tasks, commits..." value="${esc(state.searchQuery)}" autocomplete="off">

        <div id="ms-list-container">${state.searchQuery.trim() ? renderSearchResults() : `
          <div class="filter-bar">

            ${FILTER_ORDER.map(s => `<button class="filter-btn ${!state.hiddenStatuses.has(s) ? 'on' : 'off'} ${FILTER_CSS_CLASS[s] || ''}" data-action="filter-status" data-status="${s}">${STATUS_LABELS[s] || s}</button>`).join('')}
            <button class="sort-toggle" data-action="toggle-sort">${state.sortAsc ? '↑ ms-1 first' : '↓ latest first'}</button>
          </div>
          ${filtered.map(ms => renderMilestoneCard(ms, 0)).join('')}
        `}</div>
      </section>`) : ''}

    ${state.activeTab === 'documents' ? renderDocumentsSection() : ''}
    ${state.activeTab === 'releases' ? renderReleasesSection() : ''}
    ${state.activeTab === 'operations' ? renderOperationsSection() : ''}
    ${state.activeTab === 'notes' ? renderNotesSection() : ''}

    <footer class="footer fade-in stagger-3">

        ${state.lastUpdate ? formatTime(state.lastUpdate) : ''}

        <button class="sort-toggle" data-action="export-json" style="font-size:0.65rem;">Export JSON</button>
      </div>

// ---- Menu ----

async function renderMenu() {
  let localProjects = [], cloudProjects = [];
  try { localProjects = await invoke('list_projects'); } catch (e) {}
  try {
    const auth = await invoke('is_authenticated');
    if (auth) cloudProjects = JSON.parse(await invoke('cloud_list_projects'));
  } catch (e) {}
  const localOnly = localProjects.filter(p => p.mode === 'local');
  const currentPath = state.projectPath || '';
  const root = document.getElementById('menu-root');
  root.innerHTML = `
    <div class="menu-overlay" data-action="close-menu"></div>
    <div class="menu-panel">
      <div class="menu-header"><span class="menu-title">Menu</span><button class="menu-close" data-action="close-menu">×</button></div>
      ${localOnly.length > 0 ? `<div class="menu-section">
        <div class="menu-section-title">Local Projects</div>
        ${localOnly.map(p => `<button class="menu-item ${p.path === currentPath ? 'current' : ''}" data-action="menu-select-project" data-path="${esc(p.path)}">${esc(p.name)}<div class="menu-item-sub">${esc(p.path)}</div></button>`).join('')}
      </div>` : ''}
      ${cloudProjects.length > 0 ? `<div class="menu-section">
        <div class="menu-section-title">Cloud Projects</div>
        ${cloudProjects.filter(p => !p.archived).map(p => `<button class="menu-item ${('cloud:' + p.project_id) === currentPath ? 'current' : ''}" data-action="menu-select-cloud-project" data-project-id="${esc(p.project_id)}">${esc(p.name)}<div class="menu-item-sub">${esc(p.project_id)}</div></button>`).join('')}
      </div>` : ''}
    </div>`;
  root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleAction));
}

function closeMenu() { document.getElementById('menu-root').innerHTML = ''; }

// ---- Event delegation ----

function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleAction);
  });
}

async function handleAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  if (action === 'toggle-entry' && e.target.closest('.entry-children')) return;
  e.stopPropagation();

  // First try SHARED common-action dispatcher (ms-46 e-726).
  // Returns true if handled — keeps platform handleAction focused on
  // data-source-specific cases.
  if (handleCommonAction(action, el)) return;

  switch (action) {
    // ---- Project selection (path-based for Tauri local) ----
    case 'select-project': await doSelectProject(el.dataset.path); break;
    case 'select-cloud-project': await doSelectCloudProject(el.dataset.projectId); break;
    case 'menu-select-project': closeMenu(); await doSelectProject(el.dataset.path); break;
    case 'menu-select-cloud-project': closeMenu(); await doSelectCloudProject(el.dataset.projectId); break;

    // ---- Data fetching (Tauri invoke; e-728 DataSource adapter で統一予定) ----
    case 'switch-tab': {
      state.activeTab = el.dataset.tab;
      state.showGraph = false;
      state.documentContent = null; state.retroContent = null;
      if (state.activeTab === 'documents') {
        const loads = [];
        if (state.documents.length === 0) loads.push(loadDocuments());
        if (state.retros.length === 0) loads.push(loadRetros());
        await Promise.all(loads);
      }
      if (state.activeTab === 'notes') {
        loadSessionNotes().then(() => render()).catch(() => {});
      }
      render(); break;
    }
    case 'open-document': await loadDocumentContent(el.dataset.docId); break;
    case 'open-retro': await loadRetroContent(el.dataset.week); break;

    // ---- Tauri-specific: clipboard URL format / commands ----
    case 'copy-doc-link': {
      const url = `https://beacon-ai.dev/?project=${state.cloudProjectId}#doc/${el.dataset.docId}`;
      await navigator.clipboard.writeText(url);
      el.textContent = 'Copied!';
      setTimeout(() => { el.textContent = 'Copy web link'; }, 1500);
      break;
    }
    case 'open-menu': await renderMenu(); break;
    case 'cloud-diagnose': {
      state.cloudDiag = 'Running...';
      renderProjectSelector();
      state.cloudDiag = await invoke('cloud_diagnose').catch(e => String(e));
      renderProjectSelector();
      break;
    }
    case 'export-json': await exportProject(); break;
    case 'archive-cloud-project': await archiveCloudProject(); break;
  }
}

// ---- Project actions ----

async function archiveCloudProject() {
  if (!state.cloudProjectId) return;
  if (!confirm('Archive this project? It will be hidden from the project list.')) return;
  try {
    await invoke('cloud_archive_project');
    closeMenu();
    state.cloudProjectId = null; state.project = null;
    renderProjectSelector();
  } catch (e) { alert('Failed to archive: ' + e); }
}

async function exportProject() {
  try {
    let project, documents = [], retros = [];
    if (cloudMode && state.cloudProjectId) {
      project = JSON.parse(await invoke('cloud_load_project', { projectId: state.cloudProjectId }));
      try { documents = JSON.parse(await invoke('cloud_list_documents')); } catch (e) {}
      try { retros = JSON.parse(await invoke('cloud_list_retros')); } catch (e) {}
    } else {
      project = JSON.parse(await invoke('load_project_json'));
      try { documents = JSON.parse(await invoke('get_documents', { scope: '' })); } catch (e) {}
      try { retros = JSON.parse(await invoke('list_retros')); } catch (e) {}
    }
    const blob = new Blob([JSON.stringify({ ...project, documents, retros }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `${state.cloudProjectId || 'project'}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) { alert('Export failed: ' + e); }
}

// ---- Reconnect (Tauri focus events) ----

function _tryReconnect() {
  if (!state.project) return;
  if (cloudMode) {
    // Polling 撤去 (上記 doSelectCloudProject 同様)。focus 復帰時に
    // 1 回だけ loadProject を呼んでスナップショットを取り直す。以降は静音。
    loadProject();
  } else {
    startWatcher();
    loadProject();
  }
}

if (window.__TAURI__?.event) {
  window.__TAURI__.event.listen('tauri://focus', _tryReconnect);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') _tryReconnect();
});

// ---- Init ----

async function init() {
  // F27: always listen for project-changed even before project loads — covers
  // the cold-start case where Beacon was launched via `open -a Beacon --args ...`
  // but the running instance later receives another launch with a different path.
  startProjectSwitchListener();
  try {
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startWatcher(); return;
    }
  } catch (e) {}
  renderProjectSelector();
}

if (window.__TAURI__) init();
else document.addEventListener('DOMContentLoaded', () => { if (window.__TAURI__) init(); });

// ---- Render Helpers ----

const STATUS_LABELS = {
  done: 'done', in_progress: 'active', observing: 'observing',
  todo: 'todo', waiting: 'waiting', cancelled: 'cancelled',
  in_review: 'in review', approved: 'approved',
};

const FILTER_ORDER = ['todo', 'in_progress', 'observing', 'waiting', 'done'];
const FILTER_CSS_CLASS = { todo: 'f-todo', in_progress: 'f-active', observing: 'f-observing', waiting: 'f-waiting', done: 'f-done' };

function statusBadge(status) {
  const label = STATUS_LABELS[status] || status;
  return `<div class="ms-status-badge"><div class="ms-status-icon ${status}"></div><span class="ms-status-text ${status}">${label}</span></div>`;
}

function entryTypeBadge(type) {
  const labels = { commit: 'commit', task: 'task', note: 'note', save: 'save', pr: 'PR', operation_task: 'op-task' };
  return `<span class="entry-type-badge ${type}">${labels[type] || type}</span>`;
}

function entryStatusText(entry) {
  if (entry.type === 'commit') return '';
  const label = STATUS_LABELS[entry.status] || entry.status;
  return `<span class="entry-status-text ${entry.status}">${label}</span>`;
}

let _currentMsId = null; // set during milestone card render

function renderEntry(entry) {
  if (_currentMsId && state.hideEntryDone.has(_currentMsId) && (entry.status === 'done' || entry.status === 'cancelled')) return '';

  const statusClass = entry.status === 'done' ? ' done' : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';
  const detail = entry.detail ? `<div class="entry-detail">${esc(entry.detail)}</div>` : '';
  let prMeta = '';
  if (entry.type === 'pr' && entry.meta) {
    const m = entry.meta;
    const prStatus = m.pr_status || 'open';
    const reviewStatus = m.review_status ? ` · review: ${m.review_status}` : '';
    const url = m.url ? ` · <a href="${esc(m.url)}" target="_blank" rel="noopener" style="color:inherit;opacity:0.7;">${esc(m.url.replace(/.*\/pull\//, '#'))}</a>` : '';
    const intent = m.intent
      ? `<div class="entry-pr-decision entry-pr-intent"><div class="entry-pr-decision-label">intent</div>${esc(m.intent)}</div>`
      : '';
    const rationale = m.review_rationale
      ? `<div class="entry-pr-decision entry-pr-rationale-block"><div class="entry-pr-decision-label">rationale</div>${esc(m.review_rationale)}</div>`
      : '';
    prMeta = `<div class="entry-pr-block"><div class="entry-pr-meta"><span class="entry-pr-status ${prStatus}">${prStatus}${reviewStatus}</span>${url}</div>${intent}${rationale}</div>`;
  }
  const priority = entry.meta?.priority;
  const priorityBadge = priority ? `<span class="priority-badge priority-${priority}">${priority}</span>` : '';

  const hasDetail = !!(entry.motivation || entry.acceptance_criteria || entry.behavior || entry.detail
    || entry.meta?.resolves || entry.meta?.hash);

  const statusText = entryStatusText(entry);
  const hasChildren = entry.entries?.length > 0;
  const childCount = hasChildren ? entry.entries.length : 0;
  const isCollapsed = state.collapsedEntries.has(entry.id);
  const toggleClass = (hasChildren && entry.type !== 'commit') ? ` entry-toggle${isCollapsed ? ' collapsed' : ''}` : '';

  let children = '';
  if (hasChildren) {
    const hiddenClass = isCollapsed ? ' hidden' : '';
    const filteredChildren = entry.entries.map(renderEntry).join('');
    children = `<div class="entry-children${hiddenClass}">${filteredChildren}</div>`;
  }

  const childBadge = hasChildren && isCollapsed ? `<span class="entry-child-count">${childCount}</span>` : '';

  // Rows with children: whole-row click = toggle expand; info button opens modal
  // Rows without children: whole-row click = open modal
  const rowAction = hasChildren
    ? `data-action="toggle-entry" data-entry-id="${entry.id}"`
    : `data-action="open-entry-detail" data-entry-id="${entry.id}" style="cursor:pointer;"`;

  const infoBtn = hasChildren
    ? `<button class="entry-info-btn" data-action="open-entry-detail" data-entry-id="${entry.id}">···</button>`
    : '';

  return `
    <div class="entry entry-type-${entry.type}${statusClass}${toggleClass}" ${rowAction}>
      ${entryTypeBadge(entry.type)}
      <span class="entry-id">${entry.id}</span>
      <span class="entry-desc">${esc(entry.description)}${hash}${statusText}${childBadge}${priorityBadge}${infoBtn}</span>
      <span class="entry-date">${entry.created_at || ''}</span>
      ${prMeta}
      ${children}
    </div>
  `;
}

function esc(s) {
  if (!s) return '';
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

/* e-587: header version badge.
 *   Shows "v0.4.0  +N commits since release" when the project has any push
 *   record with a semver. Returns empty string when:
 *     - the fetch hasn't completed yet (avoid layout flash)
 *     - the project has no pushed releases yet (silently hidden)
 * The badge is informational only — clicking it does nothing yet (clickable
 * UI is a separate future task to drill into the releases tab).
 */
function renderVersionBadge() {
  const v = state.projectVersion;
  if (!v || !v.tag) return '';
  const tag = esc(v.tag);
  const diff = v.commits_since_release || 0;
  const diffPart = diff > 0
    ? `<span class="vb-diff" title="${diff} commits pushed since this release">+${diff}</span>`
    : '';
  return `<span class="version-badge" title="Latest released semver per push records">${tag}${diffPart}</span>`;
}

function formatTime(date) {
  if (!date) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ---- Sort milestones by ID number ----

function msIdNum(ms) {
  const m = ms.id.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function sortMilestones(milestones) {
  return [...milestones].sort((a, b) => {
    const diff = msIdNum(a) - msIdNum(b);
    return state.sortAsc ? diff : -diff;
  });
}

// ---- Filter ----

function toggleStatusFilter(status) {
  if (state.hiddenStatuses.has(status)) {
    state.hiddenStatuses.delete(status);
  } else {
    state.hiddenStatuses.add(status);
  }
  render();
}

function showAllStatuses() {
  state.hiddenStatuses.clear();
  render();
}

function filterMilestones(milestones) {
  if (state.hiddenStatuses.size === 0) return milestones;
  return milestones.filter(ms => !state.hiddenStatuses.has(ms.status));
}

// ---- Next retro date ----

function nextRetroDate(retroDay) {
  const days = { monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, sunday: 0 };
  const target = days[(retroDay || 'friday').toLowerCase()];
  if (target === undefined) return null;
  const now = new Date();
  const current = now.getDay();
  if (current === target) return { date: now.toISOString().slice(0, 10), isToday: true };
  let diff = target - current;
  if (diff <= 0) diff += 7;
  const next = new Date(now);
  next.setDate(now.getDate() + diff);
  return { date: next.toISOString().slice(0, 10), isToday: false };
}

// ---- Render ----


function renderMilestoneCard(ms, index) {
  const isExpanded = state.expanded.has(ms.id);
  const entries = ms.entries || [];
  const activeClass = ms.status === 'in_progress' ? ' active' : '';
  const expandedClass = isExpanded ? ' expanded' : '';
  const tasksLabel = ms.total_tasks > 0 ? `${ms.done_tasks}/${ms.total_tasks}` : '';

  let bodyHtml = '';
  if (isExpanded && (entries.length > 0 || ms.description)) {
    _currentMsId = ms.id;
    const renderedEntries = entries.map(renderEntry).join('');
    _currentMsId = null;
    const hasDone = entries.some(e => e.status === 'done' || e.status === 'cancelled' || (e.entries || []).some(c => c.status === 'done' || c.status === 'cancelled'));
    const msHideDone = state.hideEntryDone.has(ms.id);
    const msObjective = ms.objective
      ? `<div class="ms-objective">${esc(ms.objective)}</div>`
      : '';
    const msAc = ms.acceptance_criteria
      ? `<div class="ms-ac"><div class="ms-ac-label">done when</div>${esc(ms.acceptance_criteria)}</div>`
      : '';
    bodyHtml = `
      <div class="ms-entries">
        ${hasDone ? `
        <div class="ms-entries-toolbar">
          <button class="entry-filter-btn ${msHideDone ? 'active' : ''}" data-action="toggle-hide-done" data-ms-id="${ms.id}">
            ${msHideDone ? 'show done' : 'hide done'}
          </button>
        </div>
        ` : ''}
        ${msObjective}${msAc}
        ${ms.description ? `<div class="ms-description">${esc(ms.description)}</div>` : ''}
        ${renderedEntries}
      </div>
    `;
  }

  const msPriorityBadge = ms.priority ? `<span class="priority-badge priority-${ms.priority}">${ms.priority}</span>` : '';
  return `
    <div class="ms-card${activeClass}${expandedClass}">
      <div class="ms-card-header" data-action="toggle-ms" data-ms-id="${ms.id}">
        ${statusBadge(ms.status)}
        <div class="ms-title-row">
          <span class="ms-id">${ms.id}</span>
          <span class="ms-title">${esc(ms.title)}${msPriorityBadge}</span>
        </div>
        <div class="ms-meta">
          ${tasksLabel ? `<span class="ms-tasks-text">${tasksLabel}</span>` : ''}
          <div class="ms-progress-bar">
            <div class="ms-progress-fill ${ms.status}" style="width: ${ms.progress || 0}%"></div>
          </div>
          <span class="ms-progress-text">${ms.progress || 0}%</span>
          ${entries.length > 0 ? `<span class="ms-expand-hint">\u25BE</span>` : ''}
        </div>
      </div>
      <div class="ms-body">${bodyHtml}</div>
    </div>
  `;
}

// ---- Retro ----

function renderRetroSection() {
  if (state.retroContent) {
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" data-action="close-retro">\u2190 back to list</span>
        <h3 style="font-size: 1rem; color: var(--text-primary); margin: 8px 0 16px;">${esc(state.retroContent.week)}</h3>
        <div class="retro-content">${esc(state.retroContent.content)}</div>
      </section>`;
  }
  if (state.retros.length === 0) {
    return `<section class="retro-section fade-in"><div class="retro-empty">No retrospective documents yet.</div></section>`;
  }
  return `
    <section class="retro-section fade-in">
      <ul class="retro-list">
        ${state.retros.map(r => `
          <li class="retro-item" data-action="open-retro" data-week="${esc(r.week)}">
            <span class="retro-item-week">${esc(r.week)}</span>
            <span class="retro-item-date">${r.updated_at ? r.updated_at.slice(0, 10) : ''}</span>
          </li>
        `).join('')}
      </ul>

}

async function switchTab(tab) {
  state.activeTab = tab;
  state.showGraph = false;
  state.retroContent = null;
  state.documentContent = null;
  if (tab === 'documents') {
    const loads = [];
    if (state.documents.length === 0)
      loads.push(api(`/api/projects/${state.projectId}/documents`).then(r => { state.documents = r; }).catch(() => {}));
    if (state.retros.length === 0)
      loads.push(api(`/api/projects/${state.projectId}/retros`).then(r => { state.retros = r; }).catch(() => {}));
    await Promise.all(loads);
  }
  if (tab === 'notes') {
    api(`/api/projects/${state.projectId}/notes`).then(r => { state.sessionNotes = r; render(); }).catch(() => {});
  }
  render();
}

async function openRetro(week) {
  try { state.retroContent = await api(`/api/projects/${state.projectId}/retros/${week}`); }
  catch (e) { state.retroContent = { week, content: 'Failed to load retro document.' }; }
  render();
}

function closeRetro() { state.retroContent = null; render(); }

// ---- Documents ----

function scopeBadge(scope) {
  const styles = {
    core: 'background: var(--accent); color: #fff;',
    spec: 'background: var(--border); color: var(--text-primary);',
    memo: 'background: transparent; color: var(--text-secondary); border: 1px solid var(--border);',
  };
  return `<span style="display:inline-block; font-size:0.65rem; padding:1px 6px; border-radius:3px; margin-right:6px; ${styles[scope] || styles.memo}">${(scope || 'memo').toUpperCase()}</span>`;
}

function renderSearchResults() {
  const q = state.searchQuery.toLowerCase().trim();
  if (!q) return '';
  const typeIcon = { task: '□', commit: '○', pr: 'PR', milestone: 'MS', save: '→' };
  const results = [];

  function searchEntries(entries, msId, msTitle) {
    for (const e of entries) {
      const desc = (e.description || '').toLowerCase();
      const detail = (e.detail || '').toLowerCase();
      if (desc.includes(q) || detail.includes(q)) {
        results.push({ msId, msTitle, entryId: e.id, type: e.type, status: e.status, description: e.description || '', date: e.date || e.created_at || '' });
      }
      if (e.entries) searchEntries(e.entries, msId, msTitle);
    }
  }

  for (const ms of (state.project?.milestones || [])) {
    const t = (ms.title || '').toLowerCase();
    if (t.includes(q)) results.push({ msId: ms.id, msTitle: ms.title, entryId: ms.id, type: 'milestone', status: ms.status, description: ms.title, date: '' });
    searchEntries(ms.entries || [], ms.id, ms.title || '');
  }

  if (!results.length) return `<div class="search-results"><div class="search-empty">No results for "${esc(state.searchQuery)}"</div></div>`;

  return `<div class="search-results">
    <div class="milestones-count" style="margin-bottom:8px">${results.length} result${results.length === 1 ? '' : 's'}</div>

    <div class="search-result-item" data-action="search-goto" data-ms-id="${esc(r.msId)}" data-entry-id="${esc(r.entryId)}">

  if (state.retros.length > 0) {

        <h4 style="font-size:0.75rem;color:var(--text-secondary);margin:0 0 6px;letter-spacing:0.05em;">○ REVIEWS</h4>

// ---- Dependency Graph ----

function buildGraph(milestones) {
  const nodes = [];
  const edges = [];
  const idSet = new Set();

  for (const ms of milestones) {
    if (ms.status === 'cancelled') continue;
    idSet.add(ms.id);
    nodes.push({
      id: ms.id,
      title: ms.title || '',
      status: ms.status || 'todo',
      progress: ms.progress || 0,
      depends_on: ms.depends_on || [],
    });
  }

  for (const n of nodes) {
    for (const dep of n.depends_on) {
      if (idSet.has(dep)) {
        edges.push({ from: n.id, to: dep, type: 'depends_on' });
      }
    }
  }

  // Cross-MS task references
  for (const ms of milestones) {
    if (ms.status === 'cancelled') continue;
    for (const entry of (ms.entries || [])) {
      const reqBy = (entry.meta || {}).requested_by || '';
      if (reqBy && idSet.has(reqBy)) {
        edges.push({ from: reqBy, to: ms.id, type: 'cross_task', task_id: entry.id || '' });
      }
    }
  }

  // Kahn's algorithm for waves
  const inDeg = {};
  for (const n of nodes) inDeg[n.id] = 0;
  for (const n of nodes) {
    for (const dep of n.depends_on) {
      if (dep in inDeg) inDeg[n.id]++;
    }
  }

  const waves = [];
  const remaining = { ...inDeg };
  while (Object.keys(remaining).length > 0) {
    const wave = Object.keys(remaining).filter(id => remaining[id] === 0).sort();
    if (wave.length === 0) {
      waves.push({ wave: waves.length + 1, milestones: Object.keys(remaining).sort(), cycle: true });
      break;
    }
    waves.push({ wave: waves.length + 1, milestones: wave });
    for (const id of wave) delete remaining[id];
    for (const n of nodes) {
      if (n.id in remaining) {
        for (const dep of n.depends_on) {
          if (wave.includes(dep)) remaining[n.id]--;
        }
      }
    }
  }

  return { nodes, edges, waves };
}
