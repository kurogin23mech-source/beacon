<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ================================================================
   BEACON — Terminal Noir Milestones v3
   ================================================================ */

:root {
  --bg-void: #0a0a0c;
  --bg-surface: #111114;
  --bg-raised: #18181c;
  --bg-hover: #1f1f24;
  --border: #2a2a30;
  --border-subtle: #1e1e24;
  --text-primary: #e4e4e8;
  --text-secondary: #a1a1aa;
  --text-dim: #71717a;
  --accent: #4ade80;
  --accent-dim: #166534;
  --accent-glow: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24;
  --info: #60a5fa;
  --done: #4ade80;
  --in-progress: #60a5fa;
  --observing: #a78bfa;
  --todo: #71717a;
  --waiting: #f97316;
  --cancelled: #ef4444;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
  --font-body: 'IBM Plex Mono', monospace;
  --scanline-opacity: 0.03;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-weight: 400;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 2px,
    rgba(0, 0, 0, var(--scanline-opacity)) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ---- Layout ---- */

.container {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---- Header ---- */

.header {
  padding: 40px 0 32px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.header::before {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 120px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 12px var(--accent);
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}

.project-name {
  font-family: var(--font-mono);
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.header-tag {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* e-587: project version badge in the header. Shown only when the project
   has at least one push record with a semver. Format: "v0.4.0  +N" */
.version-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--accent);
  background: var(--accent-glow, rgba(80,180,140,0.08));
  border: 1px solid var(--accent-dim, rgba(80,180,140,0.3));
  border-radius: 4px;
  letter-spacing: 0.02em;
}
.version-badge .vb-diff {
  color: var(--text-dim);
  font-size: 0.68rem;
}

.connection-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.offline {
  background: var(--cancelled);
  box-shadow: 0 0 6px var(--cancelled);
  animation: none;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---- Search (inline in milestones header) ---- */

.ms-search-inline {
  flex: 1;
  min-width: 0;
  background: var(--bg-raised);
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 0.75rem;
  color: var(--text-primary);
  font-family: var(--font-mono);
  outline: none;
}
.ms-search-inline:focus { border-color: var(--accent-dim); }
.ms-search-inline::placeholder { color: var(--text-dim); }
.global-search { display: flex; padding: 0 0 8px; }
.global-search .ms-search-inline { padding: 6px 12px; font-size: 0.8rem; }
.search-results { margin-top: 4px; }
.search-result-item {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 6px 10px;
  padding: 7px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  margin-bottom: 4px;
  background: var(--bg-surface);
  cursor: pointer;
  transition: border-color 0.15s;
}
.search-result-item:hover { border-color: var(--border); }
.search-result-type { font-size: 0.65rem; color: var(--text-dim); padding-top: 2px; }
.search-result-desc { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-result-ms { font-size: 0.65rem; color: var(--text-dim); grid-column: 2; }
.search-result-date { font-size: 0.65rem; color: var(--text-dim); text-align: right; }
.search-empty { padding: 16px 0; color: var(--text-dim); font-size: 0.8rem; text-align: center; }

/* ---- Releases subtabs ---- */
.releases-subtabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
.releases-subtab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 16px; font-size: 0.78rem; font-family: var(--font-mono); color: var(--text-dim); cursor: pointer; margin-bottom: -1px; }
.releases-subtab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
/* Push cards */
.push-card { padding: 10px 0 6px 10px; border-bottom: 1px solid var(--border-subtle); border-left: 3px solid #2a5080; }
.push-card:last-child { border-bottom: none; }
.push-card-header { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-wrap: wrap; }
.push-card-header:hover .push-id { color: var(--text-secondary); }
.push-icon { color: #4a9fd4; font-size: 0.85rem; }
.push-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }
.push-branch-badge { font-size: 0.6rem; color: #4a9fd4; background: rgba(74,159,212,0.1); padding: 1px 5px; border-radius: 2px; border: 1px solid rgba(74,159,212,0.25); }
.push-by { font-size: 0.7rem; color: var(--text-dim); }
.push-datetime { font-size: 0.7rem; color: var(--text-dim); margin-left: auto; }
.push-expand-arrow { font-size: 0.6rem; color: var(--text-dim); }
.push-summary { font-size: 0.78rem; color: var(--text-secondary); margin: 4px 0 4px 18px; line-height: 1.4; }
.push-commit-count { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); padding: 1px 6px; border: 1px solid var(--border-subtle); border-radius: 2px; }
.push-commit-list { margin: 8px 0 4px 18px; display: flex; flex-direction: column; gap: 3px; }
.push-commit-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.72rem; }
.push-commit-hash { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
.push-commit-msg { color: var(--text-secondary); }

/* ---- Releases / Deploy Timeline ---- */

.release-group-header { display: flex; align-items: center; gap: 10px; padding: 10px 0 8px; border-bottom: 1px solid var(--accent-dim); margin-bottom: 2px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent); }
.release-group-semver { background: var(--accent-glow); padding: 1px 6px; border-radius: 3px; font-size: 0.72rem; }
.deploy-card { padding: 10px 0 6px 10px; border-bottom: 1px solid var(--border-subtle); border-left: 3px solid transparent; }
.deploy-card:last-child { border-bottom: none; }
.deploy-card.is-major { border-left-color: var(--accent-dim); }
.deploy-card.is-minor { border-left-color: var(--border); }
.deploy-card-header { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-wrap: wrap; }
.deploy-card-header:hover .deploy-id { color: var(--text-secondary); }
.deploy-type-dot { font-size: 0.85rem; }
.deploy-type-dot.major { color: var(--accent); }
.deploy-type-dot.minor { color: var(--text-dim); }
.deploy-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }
.deploy-datetime { font-size: 0.7rem; color: var(--text-dim); margin-left: auto; }
.deploy-env-badge { font-size: 0.6rem; color: var(--text-dim); background: var(--bg-raised); padding: 1px 5px; border-radius: 2px; border: 1px solid var(--border-subtle); }
.deploy-env-filter { display: flex; gap: 4px; margin: 6px 0 10px; flex-wrap: wrap; }
.deploy-env-btn { font-size: 0.7rem; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border-subtle); background: var(--bg-raised); color: var(--text-dim); cursor: pointer; }
.deploy-env-btn.active { background: var(--accent-muted); color: var(--accent); border-color: var(--accent); }
.op-card { background: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 12px 16px; margin-bottom: 14px; }
.op-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.op-id { font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); }
.op-title { font-size: 0.88rem; color: var(--text); font-weight: 600; flex: 1; }
.op-badge { font-size: 0.65rem; padding: 1px 6px; border-radius: 3px; background: var(--bg-mid); color: var(--text-dim); }
.op-source { font-size: 0.7rem; color: var(--text-dim); font-family: var(--font-mono); }
.op-incident-count { font-size: 0.72rem; color: var(--warn,#f0b429); margin-left: auto; }
.op-section-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; margin-top: 8px; }
.op-run-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.78rem; padding: 2px 0; }
.op-run-date { color: var(--text-dim); font-family: var(--font-mono); font-size: 0.72rem; min-width: 72px; }
.op-run-batch { color: var(--text-dim); font-family: var(--font-mono); font-size: 0.72rem; }
.op-run-desc { color: var(--text); flex: 1; }
.op-empty { font-size: 0.75rem; color: var(--text-dim); font-style: italic; }
.op-incident { display: flex; align-items: baseline; gap: 6px; font-size: 0.78rem; padding: 3px 0; }
.op-incident-icon { font-size: 0.8rem; }
.op-incident-id { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); }
.op-incident-title { flex: 1; color: var(--text); }
.op-incident-date { font-size: 0.7rem; color: var(--text-dim); }
.note-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.82rem; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
.note-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); min-width: 36px; }
.note-ctx { font-size: 0.7rem; color: var(--accent); font-family: var(--font-mono); }
.note-text { flex: 1; color: var(--text); }
.deploy-expand-arrow { font-size: 0.6rem; color: var(--text-dim); }
.deploy-desc { font-size: 0.78rem; color: var(--text-secondary); margin: 4px 0 4px 18px; line-height: 1.4; }
.deploy-ms-badges { margin: 4px 0 0 18px; display: flex; flex-wrap: wrap; gap: 4px; }
.release-ms-badge { font-family: var(--font-mono); font-size: 0.65rem; padding: 1px 6px; border: 1px solid var(--border-subtle); border-radius: 2px; color: var(--text-dim); }
.release-ms-badge-completion { font-family: var(--font-mono); font-size: 0.65rem; padding: 1px 6px; border: 1px solid var(--accent-dim); border-radius: 2px; color: var(--accent); background: var(--accent-glow); }
.release-ms-badge-patch { font-family: var(--font-mono); font-size: 0.65rem; padding: 1px 6px; border: 1px solid #9a7000; border-radius: 2px; color: #c89000; background: rgba(180,120,0,0.07); }
.deploy-minor-group { margin-left: 20px; padding-left: 12px; border-left: 2px solid var(--border-subtle); }

/* Deploy expanded detail */
.deploy-detail { margin: 8px 0 4px 18px; display: flex; flex-direction: column; gap: 6px; }
.deploy-ms-block { border-radius: 3px; overflow: hidden; }
.deploy-ms-block-header { display: flex; align-items: center; gap: 8px; padding: 5px 10px; flex-wrap: wrap; }
.deploy-ms-block.completion .deploy-ms-block-header { background: var(--accent-glow); border-left: 3px solid var(--accent); }
.deploy-ms-block.patch .deploy-ms-block-header { background: rgba(180,120,0,0.07); border-left: 3px solid #9a7000; }
.deploy-ms-block.untracked .deploy-ms-block-header { background: var(--bg-raised); border-left: 3px solid var(--border); }
.deploy-ms-type-label { font-size: 0.6rem; padding: 1px 6px; border-radius: 2px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
.deploy-ms-block.completion .deploy-ms-type-label { background: rgba(0,200,120,0.15); color: var(--accent); }
.deploy-ms-block.patch .deploy-ms-type-label { background: rgba(180,120,0,0.2); color: #c89000; }
.deploy-ms-block.untracked .deploy-ms-type-label { color: var(--text-dim); border: 1px dashed var(--border-subtle); }
.deploy-ms-block-id { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-dim); }
.deploy-ms-block-title { font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
.deploy-commit-list { padding: 4px 10px 6px; display: flex; flex-direction: column; gap: 4px; }
.deploy-commit-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.deploy-commit-label { font-size: 0.58rem; padding: 0 5px; border-radius: 2px; background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--border-subtle); white-space: nowrap; }
.deploy-commit-eid { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim); min-width: 36px; }
.deploy-commit-desc { flex: 1; min-width: 120px; color: var(--text-secondary); font-size: 0.72rem; }
.deploy-commit-hash { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); background: var(--bg-raised); padding: 0 4px; border-radius: 2px; }

/* ---- Hamburger Menu ---- */

.hamburger-btn {
  background: none;
  border: 1px solid transparent;
  border-radius: 3px;
  cursor: pointer;
  padding: 4px 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color 0.2s;
}

.hamburger-btn:hover {
  border-color: var(--border);
}

.hamburger-btn span {
  display: block;
  width: 16px;
  height: 1.5px;
  background: var(--text-dim);
  transition: background 0.2s;
}

.hamburger-btn:hover span {
  background: var(--text-secondary);
}

.menu-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  animation: fade-overlay 0.15s ease;
}

@keyframes fade-overlay {
  from { opacity: 0; }
  to { opacity: 1; }
}

.menu-panel {
  position: fixed;
  top: 0;
  left: 0;
  width: 300px;
  max-width: 80vw;
  height: 100vh;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  z-index: 1001;
  padding: 24px;
  overflow-y: auto;
  animation: slide-in 0.2s ease;
}

@keyframes slide-in {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

.menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
}

.menu-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.menu-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.2s;
}

.menu-close:hover {
  color: var(--text-primary);
}

.menu-section {
  margin-bottom: 20px;
}

.menu-section-title {
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.menu-item {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 4px;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.85rem;
  text-align: left;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}

.menu-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
  color: var(--text-primary);
}

.menu-item.current {
  border-color: var(--accent-dim);
  color: var(--accent);
}

.menu-item-sub {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.menu-user {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  word-break: break-all;
}

/* ---- Header chrome (mock parity v3): Settings button + Avatar + account
   menu) ---- */

.header-spacer { flex: 1; }

.header-settings-btn {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.75rem;
}
.header-settings-btn:hover {
  background: var(--bg-raised);
  color: var(--text-primary);
  border-color: var(--accent-dim);
}

.header-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  cursor: pointer;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  color: #0a0a0c;
  user-select: none;
  margin-left: 8px;
}
.header-avatar:hover { filter: brightness(1.1); }

/* Backdrop covers the page while the dropdown is open — closes the menu
   on click (= modal-style dismiss), and lifts the menu's z-index above
   project content (the Objective block was painting over the popup). */
.account-menu-backdrop {
  position: fixed;
  inset: 0;
  background: transparent;
  display: none;
  z-index: 1500;
}
.account-menu-backdrop.open { display: block; }

.account-menu {
  position: fixed;
  top: 56px;
  right: 14px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  min-width: 280px;
  padding: 10px 0 6px;
  font-size: 0.78rem;
  display: none;
  z-index: 1600;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
}
.account-menu.open { display: block; }
.account-menu-head {
  padding: 6px 14px;
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  text-transform: uppercase;
}
.account-menu-email {
  padding: 0 14px 10px;
  color: var(--text-primary);
  word-break: break-all;
  font-size: 0.78rem;
}
/* ---- Profile modal section (ms-82 e-1972) ----
   Avatar-opened Profile editor consolidating display_name + email + Sign out. */
.account-menu-profile-row {
  padding: 8px 14px 10px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.account-menu-profile-row .label {
  font-size: 0.62rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.account-menu-profile-row input {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 0.78rem;
  padding: 5px 8px;
  border-radius: 3px;
  width: 100%;
}
.account-menu-profile-row .actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.account-menu-profile-row .save-btn {
  background: var(--accent);
  color: #000;
  border: 0;
  padding: 5px 12px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  cursor: pointer;
}
.account-menu-profile-row .save-msg {
  color: var(--text-dim);
  font-size: 0.68rem;
}
.account-menu-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--text-primary);
  background: transparent;
  border: none;
  font-family: var(--font-body);
  font-size: 0.78rem;
}
.account-menu-item:hover { background: var(--bg-hover); }
.account-menu-item.danger { color: var(--danger, #ef4444); }

/* Sidebar mock-parity additions: online-agent rows mirror the mock's
   ONLINE AGENTS section. */
.sidebar-agent-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 4px;
  font-size: 0.7rem;
}
.sidebar-agent-row .agent-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
  flex-shrink: 0;
  margin-top: 5px;
}
.sidebar-agent-row.muted .agent-dot { background: var(--text-dim); box-shadow: none; }
.sidebar-agent-row .agent-meta { flex: 1; line-height: 1.4; }
.sidebar-agent-row .agent-id {
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.7rem;
}
.sidebar-agent-row .agent-where {
  display: block;
  color: var(--text-dim);
  font-size: 0.6rem;
}

/* ---- Settings overlay (mock parity v3): two-tab full-page panel ---- */

.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  z-index: 1100;
  justify-content: center;
  padding: 40px 24px;
  overflow-y: auto;
}
.settings-overlay.open { display: flex; }

.settings-panel {
  background: var(--bg-void);
  border: 1px solid var(--border);
  border-radius: 6px;
  width: 100%;
  max-width: 880px;
  height: max-content;
  padding: 18px 22px 26px;
}
.settings-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.settings-head .brand-block {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 1.05rem;
}
.settings-head .label { color: var(--text-secondary); font-size: 0.85rem; }
.settings-head .spacer { flex: 1; }
.settings-close {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 0.78rem;
}
.settings-close:hover { background: var(--bg-hover); color: var(--text-primary); }

.settings-tabs {
  display: flex;
  gap: 22px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}
.settings-tabs .tab {
  font-size: 0.8rem;
  padding-bottom: 8px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  color: var(--text-secondary);
  background: transparent;
  border-top: none; border-left: none; border-right: none;
  font-family: var(--font-mono);
}
.settings-tabs .tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.settings-section { margin-bottom: 26px; }
.settings-section .label {
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.settings-invite-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.settings-invite-row input.email { flex: 1; }
.settings-invite-row input,
.settings-invite-row select {
  font-family: var(--font-mono);
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 0.75rem;
}
.settings-invite-row button.primary {
  background: var(--accent);
  color: #0a0a0c;
  border: 1px solid var(--accent);
  font-weight: 600;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
}

.settings-member-row {
  display: grid;
  grid-template-columns: 1fr 110px 30px;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.78rem;
}
.settings-member-row .email { color: var(--text-primary); word-break: break-all; }
.settings-member-row .role-tag {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
}
.settings-member-row .x {
  color: var(--text-dim);
  cursor: pointer;
  text-align: center;
}
.settings-member-row .x:hover { color: var(--danger, #ef4444); }

.settings-agents-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.75rem;
}
.settings-agents-table th {
  text-align: left;
  font-weight: 400;
  color: var(--text-dim);
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
}
.settings-agents-table td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}
.settings-agents-table .session-avatar {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
  margin-right: 8px;
}
.settings-agents-table tr.muted .session-avatar {
  background: var(--text-dim);
  box-shadow: none;
}
.settings-agents-table .session-id {
  color: var(--text-primary);
  font-family: var(--font-mono);
}
.settings-agents-table .actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

/* ---- Project Info Block ---- */

.project-info {
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.project-info-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.project-info-label {
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.project-info-value {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.project-info-item.review-due .project-info-label {
  color: var(--warning);
}

.project-info-item.review-due .project-info-value {
  color: var(--warning);
  font-weight: 500;
}

/* ---- Summary Block ---- */

.summary-block {
  padding: 20px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.summary-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.summary-text {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.7;
}

/* ---- Filter Bar ---- */

.filter-bar {
  display: flex;
  gap: 6px;
  padding: 16px 0 0;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s, opacity 0.2s;
}

/* Active (visible) state — colored per status */
.filter-btn.on {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

.filter-btn.on.f-todo { color: var(--todo); border-color: var(--todo); background: rgba(113,113,122,0.08); }
.filter-btn.on.f-active { color: var(--in-progress); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.08); }
.filter-btn.on.f-observing { color: var(--observing); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
.filter-btn.on.f-done { color: var(--done); border-color: var(--accent-dim); background: var(--accent-glow); }
.filter-btn.on.f-waiting { color: var(--waiting); border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.08); }
.filter-btn.on.f-cancelled { color: var(--cancelled); border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }

/* Off (hidden) state */
.filter-btn.off {
  color: var(--text-dim);
  opacity: 0.4;
  border-color: var(--border-subtle);
  background: transparent;
}

.filter-btn.off:hover {
  opacity: 0.7;
}

.filter-btn.f-all {
  color: var(--text-dim);
  border-color: var(--border-subtle);
}

.filter-btn.f-all:hover {
  color: var(--text-secondary);
  border-color: var(--border);
}

/* ---- Sort Toggle ---- */

.sort-toggle {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 4px 10px;
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
  margin-left: auto;
}

.sort-toggle:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

/* ---- Milestone List ---- */

.milestones {
  padding: 24px 0;
}

.milestones-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.milestones-title {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.milestones-count {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ---- Milestone Card ---- */

.ms-card {
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 8px;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
}

.ms-card:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.ms-card.active {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.ms-card-header {
  padding: 12px 16px;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}

.ms-status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.ms-status-icon {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ms-status-icon.done { background: var(--done); box-shadow: 0 0 4px rgba(74, 222, 128, 0.3); }
.ms-status-icon.in_progress { background: var(--in-progress); box-shadow: 0 0 4px rgba(96, 165, 250, 0.3); animation: pulse-dot 2s ease-in-out infinite; }
.ms-status-icon.observing { background: var(--observing); box-shadow: 0 0 4px rgba(167, 139, 250, 0.3); }
.ms-status-icon.todo { background: var(--todo); }
.ms-status-icon.waiting { background: var(--waiting); }
.ms-status-icon.cancelled { background: var(--cancelled); }

.ms-status-text {
  font-size: 0.65rem;
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-weight: 500;
}

.ms-status-text.done { color: var(--done); }
.ms-status-text.in_progress { color: var(--in-progress); }
.ms-status-text.observing { color: var(--observing); }
.ms-status-text.todo { color: var(--todo); }
.ms-status-text.waiting { color: var(--waiting); }
.ms-status-text.cancelled { color: var(--cancelled); }

.ms-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}

.ms-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ms-title {
  font-size: 0.9rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.ms-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.ms-progress-bar {
  width: 80px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.ms-progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s ease;
}

.ms-progress-fill.done { background: var(--done); }
.ms-progress-fill.in_progress { background: var(--in-progress); }
.ms-progress-fill.observing { background: var(--observing); }
.ms-progress-fill.todo { background: var(--todo); }

.ms-progress-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 32px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ms-expand-hint {
  font-size: 0.65rem;
  color: var(--text-dim);
  transition: transform 0.2s;
}

@media (max-width: 500px) {
  .ms-meta { gap: 8px; }
  .ms-progress-bar { width: 40px; }
  .ms-tasks-text { display: none; }
  .ms-status-text { display: none; }
  .sort-toggle { display: none; }
  .ms-card-header { gap: 8px; }
}

.ms-card.expanded .ms-title {
  white-space: normal;
  overflow: visible;
}

.ms-card.expanded .ms-expand-hint {
  transform: rotate(180deg);
}

.ms-tasks-text {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* ---- Milestone Expanded ---- */

.ms-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

/* ms-43 / e-2304: drop the 8000px max-height clamp on the expanded body.
 * Previously `max-height: 8000px` + inherited `overflow: hidden` silently
 * truncated MS cards that grew taller than 8000px (= ms-43 with 160 entries
 * easily exceeded the cap; bottom rows were in the DOM but unreachable).
 * Using `max-height: none` lets the body grow to fit all entries and lets
 * the outer page scroll handle navigation. The collapse animation still
 * runs on close (max-height transitions from a computed pixel value down
 * to 0). Open transition is instant — acceptable trade-off for guaranteed
 * full visibility of all entries. Same rule lives in desktop/dist/index.html
 * (separate update path via e-2253 pattern). */
.ms-card.expanded .ms-body {
  max-height: none;
  overflow: visible;
}

.ms-entries {
  padding: 0 16px 12px;
  border-top: 1px solid var(--border-subtle);
}

.ms-entries-toolbar {
  display: flex;
  align-items: center;
  padding: 8px 0 4px;
  gap: 8px;
}

.entry-filter-btn {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 2px 8px;
  border: 1px solid var(--border-subtle);
  border-radius: 2px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}

.entry-filter-btn:hover {
  border-color: var(--border);
  color: var(--text-secondary);
}

.entry-filter-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: var(--accent-glow);
}

.ms-description {
  padding: 8px 0 4px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-style: italic;
}

/* ---- Entry Row ---- */

.entry {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 8px;
  padding: 6px 0;
  align-items: start;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.85rem;
}

.entry:last-child { border-bottom: none; }

.entry-type-badge {
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  padding: 1px 5px;
  border-radius: 2px;
  line-height: 1.8;
  white-space: nowrap;
}

.entry-type-badge.commit {
  color: var(--accent);
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid rgba(74, 222, 128, 0.15);
}

.entry-type-badge.task {
  color: var(--info);
  background: rgba(96, 165, 250, 0.1);
  border: 1px solid rgba(96, 165, 250, 0.15);
}

.entry-type-badge.note {
  color: var(--warning);
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.15);
}

.entry-type-badge.save {
  color: #c084fc;
  background: rgba(192, 132, 252, 0.1);
  border: 1px solid rgba(192, 132, 252, 0.15);
}

.entry-type-badge.pr {
  color: #f97316;
  background: rgba(249, 115, 22, 0.1);
  border: 1px solid rgba(249, 115, 22, 0.15);
}

.entry-type-badge.operation_task {
  color: #a78bfa;
  background: rgba(167, 139, 250, 0.1);
  border: 1px solid rgba(167, 139, 250, 0.18);
}

/* Operation status badge in header */
.op-status-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-left: 4px;
}
.op-status-badge.todo        { color: var(--text-dim); background: rgba(113,113,122,0.15); border: 1px solid rgba(113,113,122,0.25); }
.op-status-badge.in_progress { color: #60a5fa; background: rgba(96,165,250,0.15); border: 1px solid rgba(96,165,250,0.25); }
.op-status-badge.open        { color: #4ade80; background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.25); }
.op-status-badge.closed      { color: var(--text-dim); background: rgba(100,116,139,0.1); border: 1px solid rgba(100,116,139,0.15); }

.op-meta-block {
  margin-top: 6px;
  padding: 5px 10px;
  border-left: 2px solid rgba(148,163,184,0.3);
  font-size: 11px;
  color: #94a3b8;
  line-height: 1.5;
}
.op-meta-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.op-meta-objective .op-meta-label  { color: #a3e635; }
.op-meta-objective                 { border-left-color: rgba(163,230,53,0.4); }
.op-meta-hint .op-meta-label       { color: #fbbf24; }
.op-meta-hint                      { border-left-color: rgba(251,191,36,0.4); }

.op-tasks {
  margin-top: 10px;
}
.op-task-row {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 4px 0;
  font-size: 12px;
  cursor: pointer;
}
.op-task-row:hover { background: var(--bg-hover); }
.op-task-row.done .op-task-desc { color: var(--text-dim); text-decoration: line-through; }
.op-task-status { font-size: 0.8em; }
.op-task-progress {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: 8px;
}

.entry-pr-block {
  grid-column: 1 / -1;
}

.entry-pr-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 4px;
  font-size: 0.7rem;
  color: var(--text-secondary);
}

.entry-pr-decision {
  margin-top: 6px;
  padding: 5px 8px;
  border-left: 2px solid rgba(251,191,36,0.4);
  font-size: 0.72rem;
  line-height: 1.5;
}

.entry-pr-decision-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 2px;
}

.entry-pr-intent .entry-pr-decision-label { color: #60a5fa; }
.entry-pr-rationale-block .entry-pr-decision-label { color: #a3e635; }
.entry-pr-rationale-block { border-left-color: rgba(163,230,53,0.4); }

/* Priority badge */
.priority-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.priority-highest { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
.priority-high    { background: rgba(251,146,60,0.2); color: #fb923c; border: 1px solid rgba(251,146,60,0.4); }
.priority-middle  { background: rgba(234,179,8,0.2);  color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
.priority-low     { background: rgba(148,163,184,0.2); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
.priority-lowest  { background: rgba(100,116,139,0.15); color: #64748b; border: 1px solid rgba(100,116,139,0.2); }

/* ms-162 — task 締切バッジ (task 行に出す。超過は赤で強調) */
.entry-deadline {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  margin-left: 6px;
  border-radius: 3px;
  vertical-align: middle;
  font-family: var(--font-mono);
  background: rgba(148,163,184,0.12);
  color: var(--text-secondary);
}
.entry-deadline.overdue {
  background: rgba(239,68,68,0.15);
  color: #f87171;
  font-weight: 600;
}

/* ms-162 — target 詳細のサブタブ (work-item / evidence / decision) */
.tgt-detail-tabs {
  display: flex;
  gap: 4px;
  margin: 8px 0 6px;
  border-bottom: 1px solid var(--border);
}
.tgt-detail-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 10px;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.tgt-detail-tab:hover { color: var(--text-secondary); }
.tgt-detail-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}
.tgt-detail-count {
  display: inline-block;
  min-width: 15px;
  padding: 0 4px;
  border-radius: 7px;
  background: rgba(148,163,184,0.15);
  color: var(--text-dim);
  font-size: 9px;
  text-align: center;
}
.tgt-detail-tab.active .tgt-detail-count {
  background: rgba(74,222,128,0.18);
  color: var(--accent);
}
.tgt-detail-panel { padding-top: 2px; }
.tgt-detail-empty {
  font-size: 11px;
  color: var(--text-dim);
  padding: 10px 4px;
}

/* e-976: reason auto-link + missing-reason marker styling.
 * Goal: stay subtle in the entry row (no layout jolt) and slightly more
 * legible inside the modal where the reason text actually shows.
 */
.entry-reason-missing {
  display: inline-block;
  font-size: 10px;
  color: #b45309;
  background: rgba(180, 83, 9, 0.12);
  border: 1px solid rgba(180, 83, 9, 0.3);
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.02em;
}
.entry-reason-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}
.entry-reason-text a {
  color: var(--accent, #60a5fa);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.entry-reason-text a.entry-link {
  color: var(--accent, #60a5fa);
  cursor: pointer;
}

/* Member badges on milestone cards (ms-43 e-767). */
.member-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  vertical-align: middle;
  color: #94a3b8;
  background: rgba(148,163,184,0.12);
  border: 1px solid rgba(148,163,184,0.25);
  letter-spacing: 0.02em;
}
.member-badge .mb-label { color: #64748b; margin-right: 4px; text-transform: uppercase; font-size: 9px; }
.member-badge.is-self { color: var(--accent); background: var(--accent-glow); border-color: var(--accent-dim); }

/* Entry info blocks (motivation / acceptance_criteria / behavior) */
.entry-info-block {
  margin-top: 6px;
  padding: 5px 10px;
  border-left: 2px solid rgba(148,163,184,0.3);
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.5;
}
.entry-info-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.entry-info-why   .entry-info-label { color: #60a5fa; }
.entry-info-ac    .entry-info-label { color: #a3e635; }
.entry-info-behavior .entry-info-label { color: #c084fc; }
.entry-info-why   { border-left-color: rgba(96,165,250,0.4); }
.entry-info-ac    { border-left-color: rgba(163,230,53,0.4); }
.entry-info-behavior { border-left-color: rgba(192,132,252,0.4); }

/* MS objective / acceptance_criteria */
.ms-objective {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 6px;
  font-style: italic;
}
.ms-ac {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 8px;
  padding: 4px 8px;
  border-left: 2px solid rgba(163,230,53,0.4);
}
.ms-ac-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #a3e635;
  margin-bottom: 2px;
}

/* ms-162 e-5833 — decision-log panel (ms-154 decision-arm stream) */
.dec-log {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.dec-log-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #c084fc;
  margin-bottom: 6px;
}
.dec-count {
  display: inline-block;
  min-width: 16px;
  padding: 0 5px;
  margin-left: 4px;
  border-radius: 8px;
  background: rgba(192,132,252,0.18);
  color: #c084fc;
  font-size: 10px;
  text-align: center;
}
.dec-event {
  padding: 6px 8px;
  margin-bottom: 6px;
  border-left: 2px solid rgba(192,132,252,0.45);
  background: rgba(192,132,252,0.04);
  border-radius: 0 4px 4px 0;
}
.dec-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}
.dec-kind {
  font-size: 10px;
  font-weight: 600;
  color: #c084fc;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.dec-by {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(148,163,184,0.15);
  color: #94a3b8;
}
/* autonomous-AI = 人間未確認の単独判断 = 最も監査価値が高い。目立たせる。 */
.dec-by-autonomous-AI {
  background: rgba(251,191,36,0.16);
  color: #fbbf24;
  font-weight: 600;
}
.dec-by-AI-proposed-human-chose { background: rgba(96,165,250,0.15); color: #60a5fa; }
.dec-by-human-delegated { background: rgba(163,230,53,0.15); color: #a3e635; }
.dec-when { font-size: 10px; color: #64748b; }
.dec-id { font-size: 10px; color: #475569; margin-left: auto; font-family: monospace; }
.dec-what { font-size: 12px; color: #e2e8f0; line-height: 1.4; }
.dec-why, .dec-context, .dec-evidence, .dec-related {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 3px;
  line-height: 1.4;
}
.dec-flabel {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #64748b;
  margin-right: 5px;
}
.dec-ev-link {
  display: inline-block;
  margin-right: 6px;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(148,163,184,0.1);
  color: #cbd5e1;
  font-family: monospace;
  font-size: 10px;
}

/* ms-162 e-5834 — generic targets[] cross-class overview (read-only) */
.targets-section { margin-top: 4px; }
.tgt-synth-note {
  font-size: 11px;
  color: #94a3b8;
  padding: 6px 8px;
  margin-bottom: 8px;
  border-left: 2px solid rgba(251,191,36,0.4);
  background: rgba(251,191,36,0.05);
  line-height: 1.5;
}
.tgt-list { display: flex; flex-direction: column; gap: 4px; }
.tgt-empty { font-size: 12px; color: var(--text-dim); padding: 8px; }
.tgt-row {
  display: grid;
  grid-template-columns: 80px 62px 1fr auto auto 44px 60px;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 12px;
}
.tgt-prio { text-align: center; }
.tgt-kind {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  text-align: center;
  padding: 2px 4px;
  border-radius: 3px;
  background: rgba(148,163,184,0.15);
  color: #94a3b8;
}
.tgt-kind-milestone { background: rgba(96,165,250,0.15); color: #60a5fa; }
.tgt-kind-opportunity { background: rgba(74,222,128,0.15); color: #4ade80; }
.tgt-id { font-family: monospace; font-size: 11px; color: var(--text-dim); }
.tgt-label { color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tgt-status { font-size: 11px; color: var(--text-secondary); }
.tgt-wi { font-size: 11px; color: var(--text-dim); text-align: right; font-family: monospace; }
.tgt-bar { height: 5px; background: var(--border-subtle); border-radius: 3px; overflow: hidden; }
.tgt-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

/* ms-162 e-5835 — root target 合成の header (objective + summary + arms rollup) */
.root-header {
  margin-bottom: 12px;
  padding: 12px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
}
.root-hdr-top { display: flex; align-items: baseline; gap: 8px; }
.root-hdr-kind {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 2px 5px;
  border-radius: 3px;
  background: rgba(148,163,184,0.15);
  color: #94a3b8;
  flex: none;
}
.root-hdr-objective { font-size: 13px; color: var(--text-primary); line-height: 1.5; }
.root-hdr-rollup { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.root-hdr-pct { font-size: 12px; font-family: monospace; color: var(--accent); font-weight: 600; flex: none; }
.root-hdr-bar { flex: 1; height: 5px; background: var(--border-subtle); border-radius: 3px; overflow: hidden; }
.root-hdr-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
.root-hdr-count { font-size: 11px; font-family: monospace; color: var(--text-dim); flex: none; }
.root-hdr-arms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.root-arm-chip {
  font-size: 10px;
  font-family: monospace;
  color: var(--text-secondary);
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-base);
}
.root-arm-k { color: var(--text-dim); margin-right: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
.root-hdr-summary { font-size: 11px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; }
.root-hdr-summary-label {
  display: block;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-dim);
  margin-bottom: 2px;
}

/* Entry detail button */
.entry-info-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 10px;
  padding: 0 5px;
  height: 15px;
  margin-left: 6px;
  vertical-align: middle;
  line-height: 1;
  letter-spacing: 0.05em;
  transition: color 0.15s, border-color 0.15s;
}
.entry-info-btn:hover { color: var(--text-secondary); border-color: var(--text-dim); }

/* Entry detail modal */
.entry-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 10000;
  /* デフォルトは非表示。JS (renderEntryModal) が open 時に inline style.display='flex' をセット。
     以前は display:flex デフォルト + HTML 側 inline style="display:none" で隠していたが、
     Tauri WebKit で inline style が効かないケースが発生 (Web は OK)。CSS デフォルトを none に
     することで origin に依らず確実に閉じた状態で起動する (ms-46 e-740 follow-up)。 */
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.entry-modal {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  max-width: 560px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.7);
}
.entry-modal.entry-modal-wide {
  max-width: 880px;
  max-height: 88vh;
}
.entry-modal-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-raised);
}
.entry-modal-title {
  font-size: 12px;
  color: var(--text-secondary);
  flex: 1;
}
.entry-modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 3px;
}
.entry-modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }
.entry-modal-body {
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.entry-modal-desc {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.6;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-subtle);
}
.entry-modal-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.entry-modal-field {
  padding: 7px 11px;
  border-left: 2px solid rgba(148,163,184,0.3);
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
}
.entry-modal-field-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.modal-field-why      .entry-modal-field-label { color: #60a5fa; }
.modal-field-why      { border-left-color: rgba(96,165,250,0.4); }
.modal-field-ac       .entry-modal-field-label { color: #a3e635; }
.modal-field-ac       { border-left-color: rgba(163,230,53,0.4); }
.modal-field-behavior .entry-modal-field-label { color: #c084fc; }
.modal-field-behavior { border-left-color: rgba(192,132,252,0.4); }
.modal-field-resolves .entry-modal-field-label { color: #f59e0b; }
.modal-field-resolves { border-left-color: rgba(245,158,11,0.4); }
.modal-field-detail   .entry-modal-field-label { color: var(--text-dim); }

.entry-pr-status {
  font-weight: 500;
}

.entry-pr-status.open { color: #60a5fa; }
.entry-pr-status.in_review { color: #fb923c; }
.entry-pr-status.approved { color: #a3e635; }
.entry-pr-status.merged { color: #a78bfa; }
.entry-pr-status.closed { color: var(--text-dim); }
.entry-pr-status.rejected { color: #f87171; }

.entry-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
}

.entry-desc {
  color: #f4f4f5;
  line-height: 1.6;
}

.entry.done .entry-desc {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--border);
}

/* Commits are historical records, not to-dos — no strikethrough */
.entry.entry-type-commit.done .entry-desc {
  text-decoration: none;
}

.entry-status-text {
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-left: 4px;
}

.entry-status-text.done { color: var(--done); }
.entry-status-text.todo { color: var(--todo); }
.entry-status-text.in_progress { color: var(--in-progress); }
.entry-status-text.in_review { color: #fb923c; }
.entry-status-text.approved { color: #a3e635; }
.entry-status-text.cancelled { color: var(--text-dim); }

/* ms-162 e-5836 — cancelled work-item は取消線 + 「取消」タグ + 淡色で行に状態を出す
   (営業側 .comm-row.cancelled と同じ L2 型)。取消線は説明文 (.entry-desc-text) だけ
   に掛け、タグ・バッジには掛けない。 */
.entry.cancelled { opacity: 0.75; }
.entry.cancelled .entry-desc-text {
  color: var(--text-dim);
  text-decoration: line-through;
  text-decoration-color: var(--border);
}
.entry-cancelled-tag {
  display: inline-block;
  font-size: 0.6rem;
  color: var(--cancelled);
  border: 1px solid rgba(239, 68, 68, 0.4);
  border-radius: 3px;
  padding: 0 4px;
  margin-left: 6px;
}
/* ms-162 e-5836 — 基本 evidence: この work-item を閉じた commit のバッジ。
   done 行の取消線が横切らないよう inline-block で装飾コンテキストを分ける。 */
.entry-evidence {
  display: inline-block;
  font-size: 0.62rem;
  font-family: monospace;
  color: var(--done);
  margin-left: 6px;
  text-decoration: none;
}

.entry-date {
  font-size: 0.7rem;
  color: var(--text-dim);
  line-height: 1.8;
  white-space: nowrap;
}

.entry-hash {
  font-size: 0.7rem;
  color: var(--accent-dim);
  margin-left: 4px;
}

/* ---- Entry Toggle (collapsible children) ---- */

.entry-toggle {
  cursor: pointer;
  user-select: none;
}

.entry-toggle > .entry-desc::before {
  content: '\25BC ';
  font-size: 0.6rem;
  color: var(--text-dim);
  display: inline-block;
}

.entry-toggle.collapsed > .entry-desc::before {
  content: '\25B6 ';
}

.entry-type-commit.entry-toggle .entry-desc::before,
.entry-type-commit.entry-toggle.collapsed .entry-desc::before {
  content: none;
}

.entry-child-count {
  font-size: 0.65rem;
  color: var(--accent);
  margin-left: 6px;
  padding: 1px 5px;
  background: var(--accent-dim);
  border: 1px solid var(--accent-dim);
  border-radius: 3px;
  font-weight: 500;
}

/* ---- Entry Detail ---- */

.entry-detail {
  grid-column: 3 / -1;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 0 2px;
  line-height: 1.5;
  border-left: 2px solid var(--border-subtle);
  padding-left: 10px;
  margin-top: 2px;
}

/* ---- Nested entries (under task) ---- */

.entry-children {
  grid-column: 1 / -1;
  padding-left: 18px;
}

.entry-children.hidden {
  display: none;
}

.entry-children .entry {
  border-bottom-color: transparent;
  padding: 3px 0;
}

/* ---- Tabs (Milestones / Reviews) ---- */

.tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border-subtle);
}

.tab-btn {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
}

.tab-btn:hover {
  color: var(--text-secondary);
}

.tab-btn.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}

/* ---- Retro Viewer ---- */

.retro-section {
  padding: 24px 0;
}

.retro-list {
  list-style: none;
}

.retro-item {
  padding: 10px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  background: var(--bg-surface);
  transition: border-color 0.2s, background 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.retro-item:hover {
  border-color: var(--border);
  background: var(--bg-raised);
}

.retro-item-week {
  font-size: 0.9rem;
  color: var(--text-primary);
}

.retro-item-date {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.retro-content {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 20px;
  white-space: pre-wrap;
  font-size: 0.85rem;
  line-height: 1.7;
  color: var(--text-secondary);
  max-height: 70vh;
  overflow-y: auto;
}

.doc-content {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 20px 24px;
  font-size: 0.85rem;
  line-height: 1.8;
  color: var(--text-secondary);
  max-height: 70vh;
  overflow-y: auto;
}
.doc-content h1, .doc-content h2, .doc-content h3, .doc-content h4 {
  color: var(--text-primary); font-weight: 600; margin: 1.2em 0 0.4em;
}
.doc-content h1 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.doc-content h2 { font-size: 0.95rem; }
.doc-content h3 { font-size: 0.88rem; }
.doc-content p { margin: 0 0 0.8em; }
.doc-content ul, .doc-content ol { margin: 0 0 0.8em; padding-left: 1.6em; }
.doc-content li { margin-bottom: 0.25em; }
.doc-content code {
  background: var(--bg-raised); border: 1px solid var(--border); border-radius: 3px;
  padding: 1px 5px; font-size: 0.8em; color: var(--accent); font-family: 'JetBrains Mono', monospace;
}
.doc-content pre {
  background: var(--bg-raised); border: 1px solid var(--border); border-radius: 4px;
  padding: 12px 16px; overflow-x: auto; margin: 0 0 0.8em;
}
.doc-content pre code { background: none; border: none; padding: 0; color: var(--text-secondary); }
.doc-content blockquote {
  border-left: 3px solid var(--accent-dim); margin: 0 0 0.8em;
  padding: 4px 0 4px 12px; color: var(--text-dim);
}
.doc-content a { color: var(--info); text-decoration: underline; }
.doc-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.doc-content table { border-collapse: collapse; width: 100%; margin: 0 0 0.8em; font-size: 0.82rem; }
.doc-content th { color: var(--text-primary); border-bottom: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.doc-content td { border-bottom: 1px solid var(--border-subtle); padding: 4px 8px; }
.doc-content strong { color: var(--text-primary); }

.retro-back {
  font-size: 0.8rem;
  color: var(--text-dim);
  cursor: pointer;
  margin-bottom: 12px;
  display: inline-block;
  transition: color 0.2s;
}

.retro-back:hover {
  color: var(--text-secondary);
}

.retro-empty {
  text-align: center;
  padding: 40px 0;
  color: var(--text-dim);
  font-size: 0.85rem;
}

/* ---- Footer ---- */

.footer {
  padding: 24px 0 40px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.footer-left {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

.footer-tagline {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-style: italic;
  letter-spacing: 0.03em;
}

.footer-right {
  font-size: 0.75rem;
  color: var(--text-dim);
  flex-shrink: 0;
}

/* ---- Loading State ---- */

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  flex-direction: column;
  gap: 16px;
}

.loading-bar {
  width: 120px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.loading-bar::after {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  animation: loading-slide 1.2s ease-in-out infinite;
}

@keyframes loading-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.loading-text {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---- Error State ---- */

.error-state {
  text-align: center;
  padding: 80px 0;
  color: var(--text-dim);
  font-size: 0.9rem;
}

.error-state .error-icon {
  font-size: 1.5rem;
  margin-bottom: 12px;
  color: var(--cancelled);
}

/* ---- Fade-in animations ---- */

.fade-in {
  animation: fade-in 0.4s ease both;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }

/* ---- Project selector ---- */

.project-selector {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 20px;
}

.project-list {
  list-style: none;
  width: 100%;
  max-width: 480px;
}

.project-item {
  padding: 12px 16px;
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: var(--bg-surface);
}

.project-item:hover {
  border-color: var(--accent-dim);
  background: var(--accent-glow);
}

.project-item-name {
  font-size: 0.95rem;
  color: var(--text-primary);
}

.project-item-id {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ---- Login Screen ---- */

.login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 24px;
}

.login-logo {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.login-tagline {
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  font-style: italic;
  margin-top: -16px;
}

.login-divider {
  width: 60px;
  height: 1px;
  background: var(--border);
  position: relative;
}

.login-divider::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 20px;
  height: 1px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

#g_id_signin {
  margin-top: 8px;
}

.login-note {
  font-size: 0.75rem;
  color: var(--text-dim);
  max-width: 280px;
  text-align: center;
  line-height: 1.6;
}

.empty-state-note {
  font-size: 0.85rem;
  color: var(--text-dim);
  max-width: 360px;
  text-align: center;
  line-height: 1.7;
  margin: 4px 0;
}
.empty-state-note a {
  color: var(--accent);
  text-decoration: none;
}
.empty-state-note a:hover {
  text-decoration: underline;
}
.empty-state-code {
  font-family: var(--font-mono);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 24px;
  color: var(--accent);
  font-size: 0.95rem;
  letter-spacing: 0.02em;
  margin: 0;
}
.empty-state-btn {
  font-family: var(--font-mono);
  background: var(--accent-glow);
  border: 1px solid rgba(74, 222, 128, 0.4);
  border-radius: 4px;
  padding: 8px 18px;
  color: var(--accent);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s;
}
.empty-state-btn:hover {
  background: rgba(74, 222, 128, 0.18);
}
.empty-state-btn-link {
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  cursor: pointer;
  padding: 4px 8px;
}
.empty-state-btn-link:hover {
  color: var(--text-primary);
  text-decoration: underline;
}

/* Setup prompt disclosure (empty-state) — copy/paste install prompt block */
.setup-prompt-block {
  width: 100%;
  max-width: 480px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-surface);
}
.setup-prompt-summary {
  cursor: pointer;
  padding: 12px 16px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  list-style: none;
}
.setup-prompt-summary::-webkit-details-marker { display: none; }
.setup-prompt-summary::after {
  content: '▸';
  color: var(--text-dim);
  font-size: 0.8rem;
  transition: transform 0.15s;
}
details[open] > .setup-prompt-summary::after { transform: rotate(90deg); }
.setup-prompt-summary:hover { background: var(--bg-hover); }
.setup-prompt-body { padding: 0 16px 16px 16px; }
.setup-prompt-hint {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin: 4px 0 10px;
  line-height: 1.6;
}
.setup-prompt-pre {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  background: var(--bg-void);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 12px;
  color: var(--text-secondary);
  max-height: 240px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0;
}
.setup-prompt-actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.setup-prompt-copy {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  background: var(--accent-glow);
  border: 1px solid rgba(74, 222, 128, 0.4);
  color: var(--accent);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
}
.setup-prompt-copy:hover { background: rgba(74, 222, 128, 0.18); }
.setup-prompt-status {
  font-size: 0.72rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.setup-prompt-badge {
  display: inline-block;
  margin-left: 8px;
  font-size: 0.65rem;
  padding: 2px 6px;
  border-radius: 3px;
  background: var(--bg-hover);
  color: var(--text-dim);
  border: 1px solid var(--border);
  vertical-align: middle;
}
.setup-prompt-placeholder {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
  background: var(--bg-void);
  border: 1px dashed var(--border);
  border-radius: 4px;
  padding: 20px;
  text-align: center;
}

/* =================================================================
   Trek detail page (ms-69 / e-1659 v2 — mock parity refactor)
   ================================================================= */

/* Crumb back-link. Same row as page title so the user sees "where am I → click to leave". */
.trek-crumb {
  font-size: 0.7rem;
  color: var(--text-secondary);
  margin-bottom: 18px;
  cursor: pointer;
  display: inline-block;
}
.trek-crumb:hover { color: var(--accent); }

.trek-head { margin-bottom: 18px; }
.trek-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.trek-title-text {
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--text-primary);
}
.trek-badge {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 2px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.trek-badge.persistent { color: #a78bfa; border-color: #a78bfa; }
.trek-badge.temporary { color: var(--info, #60a5fa); border-color: var(--info, #60a5fa); }
.trek-badge.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-glow);
}
.trek-badge.archived { color: var(--text-dim); }
.trek-badge.planning { color: var(--text-secondary); }

/* ms-86 v2 / e-2126 — trek-id badge in title (small, monospace, dim).
   Replaces the legacy "trek-meta Trek ID" row by surfacing the id inline
   next to the title so URL / CLI integrations stay possible without a
   dedicated metadata block. */
.trek-id-badge {
  font-family: var(--font-mono, monospace);
  font-size: 0.68rem;
  color: var(--text-dim);
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  letter-spacing: 0;
}

.trek-stats {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ms-97 / e-2608 — Leader session id row (trek-head 内、 trek-stats の下)。
   等幅で sid を見せるので request-invite の宛先 / leader_review 権限の所在が
   1 行で読み取れる。 hover で tooltip に完全な sid を出す (= title 属性)。 */
.trek-leader-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 0.72rem;
  margin-top: 6px;
}
.trek-leader-label {
  color: var(--text-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 0.6rem;
}
.trek-leader-sid {
  font-family: var(--font-mono, monospace);
  color: var(--accent);
  word-break: break-all;
}

/* ms-97 / e-2608 — Project-wide scope warning bar。 narrowing key (milestone /
   operation / task) を持たない scope entry がある trek に表示し、 自律権限が
   project 全体に染み出すリスクを user に周知する。 STOP card より控えめな
   amber 系で、 「危険ではないが要対応」 のトーンに収める。 */
.trek-warning-bar {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  margin: 16px 0 22px;
  border: 1px solid var(--warning, #fbbf24);
  background: rgba(251,191,36,0.08);
  border-radius: 4px;
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.55;
}
.trek-warning-bar .icon {
  font-size: 1.2rem;
  color: var(--warning, #fbbf24);
  flex-shrink: 0;
  line-height: 1.2;
}
.trek-warning-bar .text { flex: 1; }
.trek-warning-bar .text strong {
  display: block;
  color: var(--warning, #fbbf24);
  font-size: 0.85rem;
  margin-bottom: 4px;
  font-weight: 600;
}
.trek-warning-bar code {
  font-family: var(--font-mono, monospace);
  font-size: 0.72rem;
  color: var(--text-primary);
  background: var(--bg-surface, var(--bg-raised));
  padding: 1px 6px;
  border-radius: 2px;
  border: 1px solid var(--border-subtle);
}
.trek-warning-bar-entries {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.trek-warning-chip {
  display: inline-block;
  padding: 2px 8px;
  font-size: 0.7rem;
  font-family: var(--font-mono, monospace);
  color: var(--text-secondary);
  background: rgba(251,191,36,0.12);
  border: 1px solid rgba(251,191,36,0.4);
  border-radius: 3px;
}

/* ms-97 / e-2609 — Pending scope-add / scope-remove approval surface。
   Trek detail の WHY ブロックの上に出る action panel。 1 click で approve
   or reject を server に投げる経路で、 backend が pending_user_approval
   state を取り扱う e-2611 land 後に自動で出現する。 */
.trek-pending-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.trek-pending-row {
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-surface, var(--bg-raised));
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.trek-pending-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.trek-pending-action {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 2px 8px;
  border-radius: 2px;
  text-transform: uppercase;
}
.trek-pending-action.add {
  color: var(--accent);
  border: 1px solid var(--accent);
  background: rgba(96,165,250,0.08);
}
.trek-pending-action.remove {
  color: var(--danger, #ef4444);
  border: 1px solid var(--danger, #ef4444);
  background: rgba(239,68,68,0.06);
}
.trek-pending-entry {
  font-family: var(--font-mono, monospace);
  font-size: 0.78rem;
  color: var(--text-primary);
  word-break: break-all;
}
.trek-pending-blanket-tag {
  font-size: 0.65rem;
  font-family: var(--font-mono, monospace);
  color: var(--text-dim);
  padding: 1px 6px;
  border: 1px dashed var(--border);
  border-radius: 2px;
}
.trek-pending-sub {
  font-size: 0.7rem;
  color: var(--text-dim);
}
.trek-pending-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.trek-pending-approve, .trek-pending-reject {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  padding: 6px 16px;
  border-radius: 3px;
  cursor: pointer;
}
.trek-pending-approve {
  background: var(--accent);
  color: #0a0a0c;
  border: 1px solid var(--accent);
}
.trek-pending-approve:hover:not(:disabled) {
  background: var(--accent-bright, var(--accent));
}
.trek-pending-reject {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.trek-pending-reject:hover:not(:disabled) {
  border-color: var(--danger, #ef4444);
  color: var(--danger, #ef4444);
}
.trek-pending-approve:disabled, .trek-pending-reject:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.trek-pending-reason {
  flex: 1;
  min-width: 180px;
  background: var(--bg-base, var(--bg-surface));
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  padding: 6px 8px;
  font-size: 0.72rem;
  font-family: var(--font-body);
}

.trek-meta {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 6px 14px;
  font-size: 0.78rem;
  margin: 14px 0 24px;
}
.trek-meta .k { color: var(--text-dim); }
.trek-meta .v { color: var(--text-primary); }
.trek-meta .v .session-id {
  font-family: var(--font-mono, monospace);
  color: var(--accent);
}
.trek-meta .v .sub {
  color: var(--text-dim);
  font-size: 0.72rem;
  margin-left: 8px;
}

/* STOP card — prominent red, always rendered on active trek so the
   "kill switch" is one click away.
   ms-86 / e-2221 — mockups/trek-detail.html L131-141 halt-block と同じ
   max-width 700px + center 揃え。 leaf 全幅に広げると視線が走らないので
   画面幅の半分程度に絞り、 icon + content + STOP button の 3 横並びが
   読みやすいリズムに収める。 */
.trek-stop-card {
  border: 1px solid var(--danger, #ef4444);
  background: rgba(239,68,68,0.06);
  border-radius: 6px;
  padding: 20px;
  margin: 22px auto;
  max-width: 700px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.trek-stop-card .icon { font-size: 1.8rem; }
.trek-stop-card .text { flex: 1; font-size: 0.78rem; color: var(--text-secondary); }
.trek-stop-card .text strong {
  display: block;
  color: var(--danger, #ef4444);
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
  font-weight: 600;
}
.trek-stop-card button {
  background: var(--danger, #ef4444);
  color: #0a0a0c;
  border: 1px solid var(--danger, #ef4444);
  padding: 10px 24px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  cursor: pointer;
  border-radius: 3px;
}
.trek-stop-card button:hover { background: #ff5f5f; }
.trek-stop-card.halted { background: rgba(251,191,36,0.08); border-color: var(--warning, #fbbf24); }
.trek-stop-card.halted .text strong { color: var(--warning, #fbbf24); }
.trek-stop-card.halted button { background: var(--warning, #fbbf24); border-color: var(--warning, #fbbf24); }

/* Archive card — same height but visually subordinate to STOP. */
.trek-archive-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 12px;
  margin-bottom: 18px;
  font-size: 0.75rem;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-surface, var(--bg-raised));
}
.trek-archive-card .ico { color: var(--text-dim); }
.trek-archive-card .text { flex: 1; }
.trek-archive-card .text strong { color: var(--text-primary); }

/* Section block — used by SCOPE / MEMBERS / CLAIMS / ACTIVITY / SUMMARIES. */
.trek-section { margin: 24px 0; }
.trek-section-title {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.trek-section-title .right {
  margin-left: auto;
  font-size: 0.62rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

/* CLI hint block — used at the bottom of each section. */
.trek-cli-hint {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin: 6px 0 22px;
  padding-left: 8px;
  border-left: 2px solid var(--border);
  font-family: var(--font-mono, monospace);
}
.trek-cli-hint code {
  display: block;
  color: var(--text-secondary);
  padding: 1px 0;
}

/* Placeholder shown for sections whose backing feature is not yet shipped
   (= "this section will populate when e-XXXX lands"). */
.trek-coming-soon {
  font-size: 0.72rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 8px 12px;
  border: 1px dashed var(--border);
  border-radius: 3px;
}

/* ms-86 v2 layout (mockups/trek-detail.html / e-2126) — wireframe reflow:
   WHY (goal_state) / TREK TASKS (MS accordion + 5-state badges) /
   MEMBERS & AGENTS (table) / ACTIVITY (real task-state stream). */

/* WHY block — narrow blue left rule, soft accent tint background. */
.trek-why-block {
  border-left: 3px solid var(--accent);
  background: rgba(96,165,250,0.04);
  padding: 14px 18px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.7;
  border-radius: 0 4px 4px 0;
  margin-bottom: 18px;
}
.trek-why-block.empty {
  border-left-color: var(--border);
  background: transparent;
  color: var(--text-dim);
  font-style: italic;
  font-size: 0.75rem;
}

/* TREK TASKS — MS accordion + leaf rows + 5-state badges. */
.trek-task-row {
  border: 1px solid rgba(74,222,128,0.22);
  border-radius: 4px;
  padding: 12px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.1s, background 0.1s;
}
.trek-task-row:hover { border-color: rgba(74,222,128,0.45); background: rgba(74,222,128,0.02); }
.trek-task-row.expanded { border-color: rgba(74,222,128,0.45); background: rgba(74,222,128,0.02); }
.trek-task-row.leaf { border-color: rgba(96,165,250,0.22); }
.trek-task-row.leaf:hover { border-color: rgba(96,165,250,0.5); background: rgba(96,165,250,0.03); }
.trek-task-row.state-leader_review { border-color: rgba(167,139,250,0.35); }
.trek-task-row.state-leader_review:hover { border-color: rgba(167,139,250,0.6); }
.trek-task-row.state-user_review { border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.03); }
.trek-task-row.state-done { opacity: 0.55; }

.trek-task-row-head {
  display: grid;
  grid-template-columns: 18px 60px 1fr 160px 110px;
  gap: 14px;
  align-items: center;
}
.trek-task-chevron { color: var(--text-dim); font-size: 0.75rem; text-align: center; user-select: none; }
.trek-task-chevron-spacer { width: 18px; }
.trek-task-tk-id {
  font-family: var(--font-mono, monospace);
  color: var(--success, #4ade80);
  font-size: 0.78rem;
  font-weight: 600;
}
.trek-task-row.leaf .trek-task-tk-id { color: var(--accent); }
.trek-task-desc {

}
.trek-task-project-tag {

  border: 1px solid var(--border-subtle, var(--border));

}
.trek-task-ms-id {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-family: var(--font-mono, monospace);
  flex-shrink: 0;
}
.trek-task-name {
  color: var(--text-primary);

  text-overflow: ellipsis;
  white-space: nowrap;
}
.trek-task-assignee {

  font-family: var(--font-mono, monospace);
  text-align: right;
}
.trek-task-state {
  text-align: right;
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.trek-task-state.working { color: var(--success, #4ade80); }
.trek-task-state.todo { color: var(--text-dim); }
.trek-task-state.leader_review { color: #93c5fd; }
.trek-task-state.user_review { color: var(--warning, #fbbf24); }
.trek-task-state.done { color: var(--text-dim); text-decoration: line-through; }

.trek-task-children {

}
.trek-task-show-done-btn {

  cursor: pointer;
  margin-bottom: 10px;
  font-family: var(--font-mono, monospace);

}
.trek-task-show-done-btn:hover { background: rgba(74,222,128,0.08); }
/* hide mode (= done タスク表示中) は done と視覚揃えるため gray にする */
.trek-task-show-done-btn.hide-mode {
  border-color: var(--border-subtle, var(--border));

}
.trek-task-show-done-btn.hide-mode:hover { background: rgba(160,160,170,0.06); }
.trek-child-task {
  display: grid;
  grid-template-columns: 56px 90px 1fr 100px;
  gap: 10px;
  padding: 5px 0;
  font-size: 0.72rem;
  color: var(--text-secondary);
  align-items: baseline;
}
.trek-child-task-tag {
  color: var(--accent);
  font-size: 0.62rem;
  padding: 2px 6px;
  border: 1px solid rgba(96,165,250,0.4);
  border-radius: 2px;
  text-align: center;
  background: rgba(96,165,250,0.05);

}
/* done タスクの TASK タグは grayout (= todo / working 等と視覚分離) */
.trek-child-task[data-task-state="done"] .trek-child-task-tag {

}

.trek-child-task-desc { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.trek-tasks-empty {

/* MEMBERS & AGENTS — table layout (rowspan grouping for same email). */
.trek-members-table {

  margin-top: 4px;
}
.trek-members-table th {

  letter-spacing: 0.08em;

}

}
.trek-members-table tr.continued td:not(.member-email-cell) {

  border-top: none;
}
.trek-members-table tr.continued td.member-email-cell {
