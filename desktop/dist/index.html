// Short session id rendering: keep prefix + suffix, elide middle.
// "sv-77e81553-1781222638255-547f2dcd" → "sv-77e815...547f2dcd"
function _trekShortSessionId(sid) {
  if (!sid) return '';
  const s = String(sid);
  if (s.length <= 22) return s;
  return s.slice(0, 10) + '…' + s.slice(-8);
}

// ms-86 / e-2133 — Trek-local 番号化: raw session_id (= sv-77...2b4d312b) 表示を
// Trek 単位の s-N (1-origin) に置換し、 読み手に短くて識別しやすい id を提示する。
//
// 番号付与ルール (= AC4 不変・一意・client/server 一致):
//   1. trek.members を joined_at 昇順 (同値時 email lex 昇順)
//   2. 各 member について leader_session_id (= leader 行) を最優先で 1 つ、
//      続いて state.openTrekMemberSessions[email] の live session を
//      created_at + session_id 昇順で
//   3. halt.issued_by_session_id が含まれていなければ末尾に追加
//   4. 並んだ順に s-1, s-2, ... を 1-origin で割り当てる
//
// returns: Map<session_id, "s-N">
function _trekLocalSessionMap(t) {
  const m = new Map();
  if (!t) return m;
  const ordered = [];
  const seen = new Set();
  const push = (sid) => {
    if (!sid) return;
    const s = String(sid);
    if (seen.has(s)) return;
    seen.add(s);
    ordered.push(s);
  };
  const members = Array.isArray(t.members) ? t.members.slice() : [];
  members.sort((a, b) => {
    const aj = (a && a.joined_at) ? String(a.joined_at) : '';
    const bj = (b && b.joined_at) ? String(b.joined_at) : '';
    if (aj !== bj) return aj < bj ? -1 : 1;
    const ae = (a && a.email) ? String(a.email) : '';
    const be = (b && b.email) ? String(b.email) : '';
    return ae < be ? -1 : 1;
  });
  const liveByEmail = (typeof state !== 'undefined' && state && state.openTrekMemberSessions) || {};
  for (const mem of members) {
    if (!mem || !mem.email) continue;
    if (mem.role === 'leader' && t.leader_session_id) {
      push(t.leader_session_id);
    }
    const live = Array.isArray(liveByEmail[mem.email]) ? liveByEmail[mem.email].slice() : [];
    live.sort((a, b) => {
      const ac = (a && a.created_at) ? String(a.created_at) : '';
      const bc = (b && b.created_at) ? String(b.created_at) : '';
      if (ac !== bc) return ac < bc ? -1 : 1;
      const asid = (a && a.session_id) ? String(a.session_id) : '';
      const bsid = (b && b.session_id) ? String(b.session_id) : '';
      return asid < bsid ? -1 : 1;
    });
    for (const s of live) {
      if (s && s.session_id) push(s.session_id);
    }
  }
  if (t.halt && t.halt.issued_by_session_id) {
    push(t.halt.issued_by_session_id);
  }
  ordered.forEach((sid, i) => m.set(sid, `s-${i + 1}`));
  return m;
}

// ms-86 / e-2133 — session reference の汎用レンダラ。
//   1. 局所番号 (= s-N) を表示
//   2. 不明 session (= members[] に居ない、 ex: halt 発火時の外部 session) は
//      _trekShortSessionId fallback
//   3. tooltip (= title 属性) で実 session id 全文を hover 表示
//   4. クリックで実 session id を clipboard コピー + toast 表示
//      → handleCommonAction の 'copy-trek-sid' で配線
function _trekRenderSessionRef(t, sid) {
  if (!sid) return '';
  const fullSid = String(sid);
  const map = _trekLocalSessionMap(t);
  const localLabel = map.get(fullSid);
  const displayLabel = localLabel || _trekShortSessionId(fullSid);
  const tooltip = localLabel
    ? `${fullSid} (click to copy)`
    : `${fullSid} (click to copy) — このセッションは Trek members に居ません (= 外部/離脱 session)`;
  return `<span class="trek-session-ref" data-action="copy-trek-sid" data-sid="${esc(fullSid)}" title="${esc(tooltip)}">${esc(displayLabel)}</span>`;
}

// ms-86 / e-2133 — minimal toast helper. 画面下中央に 1.5 秒だけ出して fade out。
let _beaconToastTimer = null;
function _beaconShowToast(text) {
  try {
    let el = document.getElementById('beacon-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'beacon-toast';
      el.className = 'beacon-toast';
      document.body.appendChild(el);
    }
    el.textContent = text;
    requestAnimationFrame(() => el.classList.add('show'));
    if (_beaconToastTimer) clearTimeout(_beaconToastTimer);
    _beaconToastTimer = setTimeout(() => {
      try { el.classList.remove('show'); } catch (_e) {}
    }, 1500);
  } catch (_e) { /* noop — toast は best-effort */ }
}

function _trekBadgeClass(s) {
  if (s === 'active') return 'active';
  if (s === 'planning') return 'planning';
  if (s === 'archived') return 'archived';
  return '';
}

// ms-86 v2 (= e-2126 mockup) — TREK TASKS / MEMBERS table / RECENT ACTIVITY helpers.
//
// _trekTaskStateLabel — return the 5-state token for a scope entry, looking
// it up in trek_doc.task_states. Defaults to "todo" when the executor has
// not stamped yet (= same default as lib/trek.get_task_state).
function _trekTaskStateLabel(t, taskId) {
  const states = t.task_states || {};
  const entry = states[taskId] || {};
  const raw = entry.state || 'todo';
  // Mirror lib/trek.LEGACY_TASK_STATE_MIGRATIONS so legacy data still renders.
  if (raw === 'waiting-review') return 'leader_review';
  return raw;
}

// _trekTaskAssignee — short session id of whoever last stamped the task
// state. Returns '' when nobody has touched it yet so the column reads as
// "unassigned" (= dash) instead of an empty cell.
function _trekTaskAssignee(t, taskId) {
  const entry = (t.task_states || {})[taskId] || {};
  return entry.updated_by_session_id || '';
}

// _trekLookupTaskInProject — best-effort lookup of a task entry inside the
// currently loaded project tree. Returns null for cross-project scope (we
// can't reach into another project's milestones from the WS payload). The
// caller falls back to rendering the bare scope id.
function _trekLookupTaskInProject(taskId) {
  const proj = state.project || {};
  const milestones = proj.milestones || [];
  function walk(entries) {
    for (const e of entries || []) {
      if (e && e.id === taskId) return e;
      const hit = walk(e && e.entries);
      if (hit) return hit;
    }
    return null;
  }
  for (const ms of milestones) {
    const hit = walk(ms.entries || []);
    if (hit) return { entry: hit, ms_id: ms.id, ms_title: ms.title || '' };
  }
  for (const op of (proj.operations || [])) {
    const hit = walk(op.entries || []);
    if (hit) return { entry: hit, op_id: op.id, op_title: op.title || '' };
  }
  return null;
}

// _trekLookupMilestoneInProject — same idea but for a milestone scope row.
// Returns { ms, tasks } where tasks is the list of leaf entries under that
// milestone (= task type only, skipping commit/save/etc.) so the accordion
// can render them.
function _trekLookupMilestoneInProject(msId) {
  const proj = state.project || {};
  const ms = (proj.milestones || []).find(x => x.id === msId);
  if (!ms) return null;
  const tasks = [];
  function walk(entries) {
    for (const e of entries || []) {
      if (e && e.type === 'task') tasks.push(e);
      walk(e && e.entries);
    }
  }
  walk(ms.entries || []);
  return { ms, tasks };
}

// _renderTrekChildTask — accordion child row inside an MS scope entry.
// Reads the trek-internal state from task_states (with fallback to entry
// status) so the badge reflects the 5-state machine, not the project-wide
// done/todo distinction.
function _renderTrekChildTask(t, taskEntry) {
  const stState = _trekTaskStateLabel(t, taskEntry.id);
  // If the executor never stamped the task, fall back to the project status
  // so a "done" entry doesn't render as "todo" before any Trek interaction.
  const effective = ((t.task_states || {})[taskEntry.id])
    ? stState
    : (taskEntry.status === 'done' ? 'done' : 'todo');
  const desc = taskEntry.description || '';
  // ms-86 / e-2223 — accordion 展開時の MS 配下 task 行もクリックで既存
  // entry-detail-modal を開く (= openEntryDetail / findEntryInProject 流用、
  // motivation / acceptance_criteria / state transitions を表示)。
  return `
    <div class="trek-child-task" data-task-state="${esc(effective)}"
         data-action="open-entry-detail" data-entry-id="${esc(taskEntry.id || '')}">
      <span class="trek-child-task-tag">task</span>
      <span class="trek-child-task-id">${esc(taskEntry.id || '')}</span>
      <span class="trek-child-task-desc" title="${esc(desc)}">${esc(desc)}</span>
      <span class="trek-task-state ${esc(effective)}">${esc(effective)}</span>
    </div>`;
}

// _renderTrekTaskRow — top-level row inside TREK TASKS for a scope entry.
// Three shapes:
//   - { project, milestone } → expandable MS parent (chevron + child accordion)
//   - { project, task }       → leaf task (no chevron)
//   - { project, operation }  → leaf-like row pointing at the operation
// The slotIndex argument feeds the t-N label so rows have a stable visual
// id even before claim primitives (ms-55) ship.
function _renderTrekTaskRow(t, s, slotIndex) {
  const slotLabel = 't-' + (slotIndex + 1);
  const pid = s.project || '';
  const projTag = pid ? `<span class="trek-task-project-tag">${esc(pid.split('-')[0].toUpperCase())}</span>` : '';
  // Leaf task row.
  // ms-86 / e-2223 — task leaf 行クリックで既存 entry-detail-modal を overlay
  // 表示する (= mockup L504-532 click for detail UX)。 既存 openEntryDetail
  // helper をそのまま流用するため data-action="open-entry-detail" + data-entry-id
  // を leaf 全体に付ける。 MS / Op 行 (= chevron 持ち) は trek-scope-toggle 側
  // で扱うので modal は開かない。 lookup 失敗 (= cross-project scope の task)
  // は entry id だけでも modal 側 findEntryInProject が null を返して silent
  // skip するため、 wiring は付けっぱなしで安全。
  if (s.task) {
    const lookup = _trekLookupTaskInProject(s.task);
    const desc = (lookup && lookup.entry && lookup.entry.description) || s.task;
    const stState = _trekTaskStateLabel(t, s.task);
    const effective = ((t.task_states || {})[s.task])
      ? stState
      : (lookup && lookup.entry && lookup.entry.status === 'done' ? 'done' : 'todo');
    const assignee = _trekTaskAssignee(t, s.task);
    const refLabel = lookup && lookup.ms_id ? lookup.ms_id : s.task;
    return `
      <div class="trek-task-row leaf state-${esc(effective)}"
           data-action="open-entry-detail" data-entry-id="${esc(s.task)}">
        <div class="trek-task-row-head">
          <div class="trek-task-chevron-spacer"></div>
          <div class="trek-task-tk-id">${esc(slotLabel)}</div>
          <div class="trek-task-desc">
            ${projTag}
            <span class="trek-task-ms-id">${esc(refLabel)}</span>
            <span class="trek-task-name" title="${esc(desc)}">${esc(desc)}</span>
          </div>
          <div class="trek-task-assignee">${assignee ? esc(_trekShortSessionId(assignee)) : '—'}</div>
          <div class="trek-task-state ${esc(effective)}">${esc(effective)}</div>
        </div>
      </div>`;
  }
  // Operation row (treated as leaf for now).
  if (s.operation) {
    return `
      <div class="trek-task-row leaf">
        <div class="trek-task-row-head">
          <div class="trek-task-chevron-spacer"></div>
          <div class="trek-task-tk-id">${esc(slotLabel)}</div>
          <div class="trek-task-desc">
            ${projTag}
            <span class="trek-task-ms-id">${esc(s.operation)}</span>
            <span class="trek-task-name">Operation in scope</span>
          </div>
          <div class="trek-task-assignee">—</div>
          <div class="trek-task-state todo">operation</div>
        </div>
      </div>`;
  }
  // Milestone (= expandable parent).
  if (s.milestone) {
    const lookup = _trekLookupMilestoneInProject(s.milestone);
    const msTitle = (lookup && lookup.ms && lookup.ms.title) || '';
    const tasks = lookup ? lookup.tasks : [];
    // Pick a representative state for the parent: the "most-advanced active"
    // child wins so the leader can see at a glance whether anything is in
    // flight under this milestone.
    let parentState = 'todo';
    const stateOrder = ['working', 'leader_review', 'user_review', 'todo', 'done'];
    for (const cand of stateOrder) {
      if (tasks.some(tk => _trekTaskStateLabel(t, tk.id) === cand
            || (!((t.task_states || {})[tk.id]) && cand === 'todo' && tk.status !== 'done'))) {
        parentState = cand;
        break;
      }
    }
    // Hide children that are already done by default; the show-done button
    // surfaces them on click. We pre-split into pending / done so the
    // template stays readable.
    const pendingChildren = [];
    const doneChildren = [];
    for (const tk of tasks) {
      const eff = ((t.task_states || {})[tk.id])
        ? _trekTaskStateLabel(t, tk.id)
        : (tk.status === 'done' ? 'done' : 'todo');
      if (eff === 'done') doneChildren.push(tk);
      else pendingChildren.push(tk);
    }
    // Assignee for the parent row: most recent stamper across child task_states.
    let parentAssignee = '';
    let parentTs = '';
    for (const tk of tasks) {
      const ent = (t.task_states || {})[tk.id] || {};
      const at = ent.updated_at || '';
      if (at && at > parentTs) { parentTs = at; parentAssignee = ent.updated_by_session_id || ''; }
    }
    // ms-86 / e-2222 — accordion 展開は state.openTrekExpanded (= Set keyed by
    // ms-id) で制御。 default は折りたたみ (= mockup L460 t-1 row が collapsed
    // で並ぶ姿に揃える)。 chevron / row head クリックで toggle される。
    const expanded = state.openTrekExpanded && state.openTrekExpanded.has(s.milestone);
    return `
      <div class="trek-task-row ${expanded ? 'expanded' : ''} state-${esc(parentState)}">
        <div class="trek-task-row-head" data-action="trek-scope-toggle" data-ms="${esc(s.milestone)}">
          <div class="trek-task-chevron">${expanded ? '▾' : '▸'}</div>
          <div class="trek-task-tk-id">${esc(slotLabel)}</div>
          <div class="trek-task-desc">
            ${projTag}
            <span class="trek-task-ms-id">${esc(s.milestone)}</span>
            <span class="trek-task-name" title="${esc(msTitle)}">${esc(msTitle || '(milestone not loaded)')}</span>
          </div>
          <div class="trek-task-assignee">${parentAssignee ? esc(_trekShortSessionId(parentAssignee)) : '—'}</div>
          <div class="trek-task-state ${esc(parentState)}">${esc(parentState)}</div>
        </div>
        ${expanded ? `
          <div class="trek-task-children">
            ${doneChildren.length ? `<button class="trek-task-show-done-btn" data-action="trek-toggle-done" data-ms="${esc(s.milestone)}">show ${doneChildren.length} done</button>` : ''}
            ${pendingChildren.map(tk => _renderTrekChildTask(t, tk)).join('')}
          </div>` : ''}
      </div>`;
  }
  // Project-wide scope (no narrower ref) — surface as a context row.
  return `
    <div class="trek-task-row leaf">
      <div class="trek-task-row-head">
        <div class="trek-task-chevron-spacer"></div>
        <div class="trek-task-tk-id">${esc(slotLabel)}</div>
        <div class="trek-task-desc">
          ${projTag}
          <span class="trek-task-ms-id">—</span>
          <span class="trek-task-name">&lt;project-wide scope&gt;</span>
        </div>
        <div class="trek-task-assignee">—</div>
        <div class="trek-task-state todo">scope</div>
      </div>
    </div>`;
}

// _renderTrekMembersTable — v2 mockup table: user / session / role / task
// columns with rowspan grouping for users that hold multiple sessions
// inside the same trek (= same email × N session_ids).
function _renderTrekMembersTable(t) {
  const members = t.members || [];
  if (!members.length) {
    return `<div class="trek-coming-soon">No members yet.</div>`;
  }
  // Build a per-task index so each member row can show which slot they hold.
  // The slot index matches the order TREK TASKS renders rows, keeping the
  // visual cross-reference consistent (= t-1 in MEMBERS == t-1 in TASKS).
  const scope = t.scope || [];
  const taskSlot = new Map();    // taskId → slot label
  const msSlot = new Map();      // msId → slot label (parent rows)
  scope.forEach((s, i) => {
    const slot = 't-' + (i + 1);
    if (s.task) taskSlot.set(s.task, slot);
    if (s.milestone) msSlot.set(s.milestone, slot);
  });
  function taskLinksForSession(sid) {
    const slots = new Set();
    for (const [taskId, ent] of Object.entries(t.task_states || {})) {
      if (ent && ent.updated_by_session_id === sid) {
        if (taskSlot.has(taskId)) slots.add(taskSlot.get(taskId));
        else {
          // Walk back from task → milestone to find a parent slot.
          const lookup = _trekLookupTaskInProject(taskId);
          if (lookup && lookup.ms_id && msSlot.has(lookup.ms_id)) {
            slots.add(msSlot.get(lookup.ms_id));
          }
        }
      }
    }
    return Array.from(slots).sort();
  }
  // Group members by email so each user gets one "user" cell with rowspan.
  const ordered = [
    ...members.filter(m => m.role === 'leader'),
    ...members.filter(m => m.role !== 'leader' && m.joined_at),
    ...members.filter(m => !m.joined_at),
  ];
  const byEmail = new Map();
  for (const m of ordered) {
    const key = m.email || m.user_id || '(unknown)';
    if (!byEmail.has(key)) byEmail.set(key, []);
    byEmail.get(key).push(m);
  }
  const leaderSid = t.leader_session_id || '';
  const rows = [];
  for (const [email, group] of byEmail.entries()) {
    group.forEach((m, idx) => {
      const sid = m.session_id || '';
      const isFirstRow = idx === 0;
      const isLeader = m.role === 'leader' || (sid && sid === leaderSid);
      const isInvited = !m.joined_at;
      const roleHtml = isInvited
        ? `<span class="role-invited">invited</span>`
        : isLeader
          ? `<span class="role-leader">LEADER</span>`
          : `<span class="role-member">member</span>`;
      const slots = sid ? taskLinksForSession(sid) : [];
      const taskCell = slots.length
        ? `<span class="task-link">${slots.map(esc).join(', ')}</span>`
        : `<span class="task-link none">—</span>`;
      // ms-86 / e-2133: session cell は Trek-local 番号 (= s-N) badge で表示。
      // hover で実 session id tooltip、 click で clipboard コピー + toast。
      const sessionCell = sid
        ? _trekRenderSessionRef(t, sid)
        : `<span class="session-full">(no session yet)</span>`;
      rows.push(`
        <tr class="${isFirstRow ? '' : 'continued'}">
          ${isFirstRow
            ? `<td class="member-email member-email-cell" rowspan="${group.length}">${esc(email)}</td>`
            : ''}
          <td>${sessionCell}</td>
          <td>${roleHtml}</td>
          <td>${taskCell}</td>
        </tr>`);
    });
  }
  return `
    <table class="trek-members-table">
      <thead>
        <tr>
          <th>user</th>
          <th>session</th>
          <th>role</th>
          <th>task</th>
        </tr>
      </thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
}

// _renderTrekRecentActivity — populate RECENT ACTIVITY from the real
// task_states transition timestamps (= best available signal until e-1696
// lands a dedicated activity stream). Sorts most-recent first and caps at
// 10 rows so the section stays scannable.
function _renderTrekRecentActivity(t) {
  const events = [];
  for (const [taskId, ent] of Object.entries(t.task_states || {})) {
    if (!ent || !ent.updated_at) continue;
    events.push({
      ts: ent.updated_at,
      task_id: taskId,
      state: ent.state || 'todo',
      note: ent.note || '',
      sid: ent.updated_by_session_id || '',
    });
  }
  if (t.halt && t.halt.issued_at) {
    events.push({
      ts: t.halt.issued_at,
      kind: 'halt',
      reason: t.halt.reason || '',
      sid: t.halt.issued_by_session_id || '',
    });
  }
  events.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  if (!events.length) {
    return `<div class="trek-coming-soon">
      No activity recorded yet. State transitions and halt events surface
      here automatically — a richer feed (commits / DMs / scope changes)
      lands with e-1696.
    </div>`;
  }
  const shown = events.slice(0, 10);
  return shown.map(ev => {
    const ts = (ev.ts || '').slice(0, 16).replace('T', ' ');
    if (ev.kind === 'halt') {
      return `
        <div class="trek-activity-row-v2">
          <div class="activity-ts">${esc(ts)}</div>
          <div class="activity-icon">⛔</div>
          <div class="activity-text" title="${esc(ev.reason)}">halt — ${esc(ev.reason || '(no reason)')}</div>
        </div>`;
    }
    const icon = ev.state === 'done' ? '✓'
      : ev.state === 'working' ? '▸'
      : ev.state === 'leader_review' ? '👀'
      : ev.state === 'user_review' ? '⏸'
      : '○';
    const noteSuffix = ev.note ? ' — ' + ev.note : '';
    const text = `state ${ev.state} — ${ev.task_id}${noteSuffix}`;
    return `
      <div class="trek-activity-row-v2">
        <div class="activity-ts">${esc(ts)}</div>
        <div class="activity-icon">${icon}</div>
        <div class="activity-text" title="${esc(text)}">${esc(text)}</div>
      </div>`;
  }).join('') + (events.length > shown.length
    ? `<div style="margin-top:6px;font-size:0.7rem;color:var(--text-dim);">${events.length - shown.length} older event(s) hidden.</div>`
    : '');
}

function _renderTrekDetail(t) {
  const members = t.members || [];
  const scope = t.scope || [];
  const halted = !!t.halt;
  const projectsInScope = new Set(scope.map(s => s.project).filter(Boolean));
  const workItemsInScope = scope.filter(s => s.milestone || s.operation || s.task).length;

  const creatorEmail = (t.creator_actor || {}).email || '';
  const leaderSid = t.leader_session_id || '';

  // ms-86 v2 layout (= mockups/trek-detail.html, e-2126):
  // - drop project subpage decorations (breadcrumb / trek-meta / archive card)
  // - WebUI 哲学への return: 全 CLI hints を削除、 read-only 監査 view に統一
  // - keep: HEADER (= trek title + halted pill) / WHY / HALT / TREK TASKS /
  //   MEMBERS table / PULSE-ACK / RECENT ACTIVITY
  // STOP / HALT card: no CLI hint text — operation は CLI + Skill (= Claude
  // Code) 経由、 ボタンは将来 fetch で叩く placeholder。
  let stopCardHtml = '';
  if (t.status === 'active') {
    if (halted) {
      const haltedReason = (t.halt && t.halt.reason) ? esc(t.halt.reason) : '(no reason given)';
      // ms-86 / e-2133: halt 発令 session は Trek-local 番号 (= s-N) badge で表示。
      const haltedByHtml = _trekRenderSessionRef(t, (t.halt && t.halt.issued_by_session_id) || '');
      const haltedAt = ((t.halt && t.halt.issued_at) || '').slice(0, 16).replace('T', ' ');
      stopCardHtml = `
        <div class="trek-stop-card halted">
          <span class="icon">⏸</span>
          <div class="text">
            <strong>HALTED — sessions are paused</strong>
            reason: ${haltedReason}<br>
            issued by ${haltedByHtml} at ${esc(haltedAt)}.
          </div>
          <button data-action="trek-resume-noop" data-trek="${esc(t.trek_id)}">Resume</button>
        </div>`;
    } else {
      stopCardHtml = `
        <div class="trek-stop-card">
          <span class="icon">🚨</span>
          <div class="text">
            <strong>STOP THIS TREK</strong>
            All joined sessions halt before their next tool call and persist their state.
          </div>
          <button data-action="trek-stop-noop" data-trek="${esc(t.trek_id)}">STOP</button>
        </div>`;
    }
  }

  const goalState = (t.goal_state || '').trim();
  const whyHtml = goalState
    ? `<div class="trek-why-block">${esc(goalState)}</div>`
    : `<div class="trek-why-block empty">No goal_state set yet.</div>`;

  return `
    <section class="fade-in trek-detail-v2">

      <div class="trek-head">
        <div class="trek-title-row">
          <span class="trek-title-text">${esc(t.title || '')}</span>
          <span class="trek-id-badge" title="${esc(t.trek_id)}">${esc(t.trek_id)}</span>
          ${halted ? `<span class="trek-badge" style="color:var(--warning,#fbbf24);border-color:var(--warning,#fbbf24);">⚠ halted</span>` : ''}
        </div>
        <div class="trek-stats">
          ${projectsInScope.size} project${projectsInScope.size === 1 ? '' : 's'} · ${workItemsInScope} work item${workItemsInScope === 1 ? '' : 's'} · ${members.length} member${members.length === 1 ? '' : 's'}
        </div>
      </div>

      <!-- WHY (= goal_state) -->
      <div class="trek-section">
        <div class="trek-section-title"><span>WHY</span></div>
        ${whyHtml}
      </div>

      ${stopCardHtml}

      <!-- TREK TASKS — MS accordion + leaf rows, 5-state badges -->
      <div class="trek-section">
        <div class="trek-section-title">

  html += `

// ms-43 e-631: cross-entity search rendering.
// When state.searchResults is populated (server response), render the unified
// list with facet chips. Otherwise fall back to a local milestones-only walk
// so the UI is never blank during the first request or offline.
const SEARCH_TYPE_ICON = {
  task: '□', commit: '○', pr: 'PR', save: '→',
  milestone: 'MS', operation: 'OP', operation_task: 'OT',
  run: 'R·', incident: 'INC',
  document: 'DOC', push: 'PUSH', deploy: 'DEP',
};

const SEARCH_TYPE_LABEL = {
  task: 'Tasks', commit: 'Commits', pr: 'PRs', save: 'Saves',
  milestone: 'Milestones', operation: 'Operations', operation_task: 'Op tasks',
  run: 'Runs', incident: 'Incidents',
  document: 'Documents', push: 'Pushes', deploy: 'Deploys',
};

// Order used to group results (most "primary" first).
const SEARCH_TYPE_ORDER = [
  'milestone', 'task', 'pr', 'commit', 'save',
  'document', 'operation', 'incident', 'operation_task', 'run',
  'push', 'deploy',
];

function _localSearchFallback(q) {
  // ms-46 e-1228: walk milestones + nested entries (incl. Operations) and match
  // against entry id / ms id / op id alongside description/detail, mirroring
  // the server-side `lib/search.search_project` "id is also matched by `q` as a
  // substring" contract. Web UI receives the server response over REST and
  // rarely hits this path; Tauri (no `dataSource.searchProject`) relies on this
  // walk for every search, so id-based queries like "e-1228" must resolve here
  // too, otherwise Task entries silently fall out of Tauri search results.
  const results = [];
  function walk(entries, parentScope) {
    // parentScope: { ms_id, ms_title } or { op_id, op_title } depending on
    // which container we descended from. Either may be undefined when the
    // entity has no parent (top-level).
    for (const e of entries) {
      const desc = (e.description || '').toLowerCase();
      const detail = (e.detail || '').toLowerCase();
      const id = (e.id || '').toLowerCase();
      if (desc.includes(q) || detail.includes(q) || id.includes(q)) {
        results.push({
          entity_type: e.type || 'task',
          id: e.id, title: e.description || '',
          snippet: e.description || '',
          ms_id: parentScope?.ms_id, ms_title: parentScope?.ms_title,
          op_id: parentScope?.op_id, op_title: parentScope?.op_title,
          status: e.status,
          created_at: e.date || e.created_at || '',
        });
      }
      if (e.entries) walk(e.entries, parentScope);
    }
  }
  for (const ms of (state.project?.milestones || [])) {
    const t = (ms.title || '').toLowerCase();
    const msId = (ms.id || '').toLowerCase();
    if (t.includes(q) || msId.includes(q)) {
      results.push({
        entity_type: 'milestone', id: ms.id, title: ms.title,
        snippet: ms.title, ms_id: ms.id, ms_title: ms.title,
        status: ms.status, created_at: '',
      });
    }
    walk(ms.entries || [], { ms_id: ms.id, ms_title: ms.title || '' });
  }
  // ms-46 e-1228: Operations live in a sibling collection but the server search
  // walks them too (lib/search.search_project line 129+). Mirror that so id-
  // based lookups for Operation entries (operation_task / run_record /
  // incident) also resolve in the Tauri local fallback.
  for (const op of (state.project?.operations || [])) {
    const t = (op.title || '').toLowerCase();
    const opId = (op.id || '').toLowerCase();
    if (t.includes(q) || opId.includes(q)) {
      results.push({
        entity_type: 'operation', id: op.id, title: op.title,
        snippet: op.title, op_id: op.id, op_title: op.title,
        status: op.status, created_at: '',
      });
    }
    walk(op.entries || [], { op_id: op.id, op_title: op.title || '' });
  }
  return results;
}

function _renderFacetChips() {
  const counts = state.searchFacets?.type || {};
  const allCount = Object.values(counts).reduce((a, b) => a + b, 0);
  const isAll = state.searchTypeFilter.size === 0;
  const chips = [
    `<button class="filter-btn ${isAll ? 'on' : 'off'}" data-action="search-filter-type" data-type="">all <span style="opacity:0.6">${allCount}</span></button>`,
  ];
  for (const t of SEARCH_TYPE_ORDER) {
    const c = counts[t] || 0;
    if (!c) continue;
    const on = state.searchTypeFilter.has(t);
    chips.push(
      `<button class="filter-btn ${on ? 'on' : 'off'}" data-action="search-filter-type" data-type="${esc(t)}">` +
      `${esc(SEARCH_TYPE_LABEL[t] || t)} <span style="opacity:0.6">${c}</span></button>`
    );
  }
  return `<div class="filter-bar" style="margin: 4px 0 8px;">${chips.join('')}</div>`;
}

function renderSearchResults() {
  const q = state.searchQuery.trim();
  if (!q) return '';

  // Prefer server response; fall back to local walk while loading.
  let results = state.searchResults;
  let fallback = false;
  if (!Array.isArray(results)) {
    results = _localSearchFallback(q.toLowerCase());
    fallback = true;
  }

  // Apply client-side type filter on top of the server response so toggling
  // chips doesn't require a round-trip.
  if (state.searchTypeFilter.size > 0) {
    results = results.filter(r => state.searchTypeFilter.has(r.entity_type));
  }

  const facetChipsHTML = fallback ? '' : _renderFacetChips();
  const loadingHint = state.searchLoading
    ? ' <span style="color:var(--text-dim);font-size:0.7rem;">searching...</span>'
    : '';
  const total = fallback ? results.length : state.searchTotal;
  const countHTML = `<div class="milestones-count" style="margin-bottom:6px">${results.length} of ${total} result${total === 1 ? '' : 's'}${loadingHint}</div>`;

  if (!results.length) {
    return `<div class="search-results">
      ${countHTML}
      ${facetChipsHTML}
      <div class="search-empty">No results for "${esc(state.searchQuery)}"</div>
    </div>`;
  }

  // Group by entity_type so the user can scan by category.
  const grouped = {};
  for (const r of results) {
    const t = r.entity_type || 'task';
    (grouped[t] = grouped[t] || []).push(r);
  }
  const sectionsHTML = SEARCH_TYPE_ORDER
    .filter(t => grouped[t]?.length)
    .map(t => {
      const items = grouped[t].map(r => {
        const date = (r.updated_at || r.created_at || '').slice(0, 10);
        const ctx = r.ms_id ? `${esc(r.ms_id)}${r.ms_title ? ': ' + esc(r.ms_title) : ''}` :
                    r.op_id ? `${esc(r.op_id)}${r.op_title ? ': ' + esc(r.op_title) : ''}` :
                    r.scope ? `scope:${esc(r.scope)}` : '';
        const dataAction =
          t === 'document' ? 'search-open-document' :
          t === 'milestone' ? 'search-goto' :
          'search-goto';
        const dataAttrs =
          t === 'document' ? `data-doc-id="${esc(r.id)}"` :
          `data-ms-id="${esc(r.ms_id || '')}" data-entry-id="${esc(r.id)}"`;
        const snippet = r.snippet || r.title || '';
        return `
        <div class="search-result-item" data-action="${dataAction}" ${dataAttrs}>
          <span class="search-result-type">${esc(SEARCH_TYPE_ICON[t] || '?')}</span>
          <span class="search-result-desc">${esc(snippet)}</span>
          <span class="search-result-date">${esc(date)}</span>
          <span class="search-result-ms">${ctx}</span>
        </div>`;
      }).join('');
      return `
      <section style="margin-bottom: 10px;">
        <div style="font-size:0.7rem;color:var(--text-dim);margin:6px 0 4px;letter-spacing:0.05em;text-transform:uppercase;">
          ${esc(SEARCH_TYPE_LABEL[t] || t)} (${grouped[t].length})
        </div>
        ${items}
      </section>`;
    }).join('');

  return `<div class="search-results">
    ${countHTML}
    ${facetChipsHTML}
    ${sectionsHTML}
  </div>`;
}

function renderDocumentsSection() {
  if (state.documentContent) {
    const scope = state.documentContent.scope || 'memo';
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" data-action="close-document">\u2190 back to list</span>
        <button data-action="copy-doc-link" data-doc-id="${esc(state.documentContent.doc_id)}" style="float:right;font-size:0.72rem;padding:3px 10px;background:var(--bg-raised);border:1px solid var(--border);border-radius:3px;color:var(--text-secondary);cursor:pointer;font-family:inherit;">Copy link</button>
        <h3 style="font-size: 1rem; color: var(--text-primary); margin: 8px 0 16px;">${scopeBadge(scope)}${esc(state.documentContent.title)}</h3>
        <div class="doc-content">${marked.parse(state.documentContent.content || '')}</div>
      </section>`;
  }
  // ms-46 e-750: pull the retro detail-view early-return up alongside the
  // document detail-view above so it can never strand a partially built html
  // string lower in the function. The Documents tab hosts two independent
  // collections (state.documents and state.retros); the previous code bailed
  // out with "No documents yet." the moment state.documents was empty, which
  // silently hid every retro even after loadRetros had populated
  // state.retros (the W22 symptom in e-750). Both collections are now peers:
  // each section is built only when its collection has data, and the empty
  // placeholder is reserved for the case where *both* are empty.
  if (state.retroContent) {
    return `
      <section class="retro-section fade-in">
        <span class="retro-back" data-action="close-retro">← back to Documents</span>
        <h3 style="font-size:1rem;color:var(--text-primary);margin:8px 0 16px;">${esc(state.retroContent.week)}</h3>
        <div class="retro-content">${esc(state.retroContent.content)}</div>
      </section>`;
  }

  // Scope chips (exclusive). Body / title search is handled by the global
  // search bar at the top of the shell; this section just helps users browse
  // a single scope at a time.
  const scopeFilter = state.documentsScopeFilter || '';
  const order = ['core', 'spec', 'memo', 'retro', 'report'];
  const grouped = {};
  for (const s of order) grouped[s] = [];
  let scopeCounts = { core: 0, spec: 0, memo: 0, retro: 0, report: 0 };
  for (const d of state.documents) {
    const s = d.scope || 'memo';
    scopeCounts[s] = (scopeCounts[s] || 0) + 1;
    if (!grouped[s]) grouped[s] = [];
    if (!scopeFilter || s === scopeFilter) grouped[s].push(d);
  }
  const totalMatches = Object.values(grouped).reduce((a, b) => a + b.length, 0);
  const labels = { core: '\u2605 CORE', spec: '\u25CB SPEC', memo: '\u25CB MEMO', retro: '\u25CB RETRO', report: '\u25CB REPORT' };

  const scopeChip = (s) => {
    const c = scopeCounts[s] || 0;
    if (!c) return '';
    const on = scopeFilter === s;
    return `<button class="filter-btn ${on ? 'on' : 'off'}" data-action="documents-filter-scope" data-scope="${s}">${(labels[s] || s).replace(/^[\u2605\u25CB]\s*/, '')} <span style="opacity:0.6">${c}</span></button>`;
  };
  const allChip = `<button class="filter-btn ${scopeFilter ? 'off' : 'on'}" data-action="documents-filter-scope" data-scope="">all</button>`;

  let html = '';

  if (state.documents.length > 0) {
    html += `
      <section class="retro-section fade-in" style="margin-bottom: 8px;">
        <div class="milestones-header" style="margin-bottom: 4px;">
          <span class="milestones-title">Documents</span>
          <span class="milestones-count">${state.documents.length} total${scopeFilter ? ` / ${totalMatches} shown` : ''}</span>
        </div>
        <div class="filter-bar" style="margin: 4px 0 0;">
          ${allChip}${order.map(scopeChip).join('')}
        </div>
      </section>
    `;

    for (const s of order) {
      if (grouped[s].length === 0) continue;
      html += `
        <section class="retro-section fade-in" style="margin-bottom: 12px;">
          <h4 style="font-size: 0.75rem; color: var(--text-secondary); margin: 0 0 6px; letter-spacing: 0.05em;">${labels[s]}</h4>
          <ul class="retro-list">
            ${grouped[s].map(d => `
              <li class="retro-item" data-action="open-document" data-doc-id="${esc(d.doc_id)}">
                <span class="retro-item-week">${esc(d.title)}</span>
                <span class="retro-item-date">${d.updated_at ? d.updated_at.slice(0, 10) : ''}</span>
              </li>
            `).join('')}
          </ul>
        </section>`;
    }
    if (totalMatches === 0 && scopeFilter) {
      html += `<section class="retro-section fade-in"><div class="retro-empty">No documents in scope "${esc(scopeFilter)}".</div></section>`;
    }
  }

  // Reviews section (retros). Rendered independently of state.documents so a
  // project with only retros (or one whose loadDocuments race lost to
  // loadRetros) still surfaces every week.
  if (state.retros.length > 0) {
    html += `
      <section class="retro-section fade-in" style="margin-bottom:12px;">
        <h4 style="font-size:0.75rem;color:var(--text-secondary);margin:0 0 6px;letter-spacing:0.05em;">○ REVIEWS</h4>
        <ul class="retro-list">
          ${state.retros.map(r => `
            <li class="retro-item" data-action="open-retro" data-week="${esc(r.week)}">
              <span class="retro-item-week">${esc(r.week)}</span>
              <span class="retro-item-date">${r.updated_at ? r.updated_at.slice(0, 10) : ''}</span>
            </li>
          `).join('')}
        </ul>
      </section>`;
  }
  if (!html) return `<section class="retro-section fade-in"><div class="retro-empty">No documents yet.</div></section>`;
  return html;
}

// Build hash → beacon entry map from all milestone entries
function buildHashEntryMap(project) {
  const map = {};
  function scan(entries) {
    for (const e of entries) {
      if (e.type === 'commit') {
        const h = (e.meta || {}).hash || '';
        if (h) map[h] = { id: e.id || '', description: e.description || '', hash: h };
      }
      if (e.entries) scan(e.entries);
    }
  }
  for (const ms of project.milestones || []) scan(ms.entries || []);
  return map;
}

function lookupEntry(hashMap, shortHash) {
  if (!shortHash) return null;
  if (hashMap[shortHash]) return hashMap[shortHash];
  for (const [k, v] of Object.entries(hashMap)) {
    if (k.startsWith(shortHash) || shortHash.startsWith(k)) return v;
  }
  return null;
}

function renderReleasesSection() {
  const p = state.project;
  const subtabs = `<div class="releases-subtabs">
    <button class="releases-subtab-btn ${state.releasesSubTab === 'service' ? 'active' : ''}" data-action="switch-releases-tab" data-subtab="service">Service</button>
    <button class="releases-subtab-btn ${state.releasesSubTab === 'code' ? 'active' : ''}" data-action="switch-releases-tab" data-subtab="code">Code</button>
  </div>`;

  if (state.releasesSubTab === 'code') {
    return `<section class="retro-section fade-in"><div>${subtabs}${renderCodeReleasesTab(p)}</div></section>`;
  }

  const allDeps = p?.deployments || [];
  const releases = {};
  for (const r of (p?.releases || [])) releases[r.id] = r;

  if (allDeps.length === 0) {
    return `<section class="retro-section fade-in"><div>${subtabs}
      <div class="retro-empty">No deployments recorded yet.<br>
        <span style="font-size:0.75rem;color:var(--text-dim)">Run <code>beacon deploy record</code> after each deploy.</span>
      </div></div>
    </section>`;
  }

  const hashMap = buildHashEntryMap(p);
  const msTitle = id => p?.milestones?.find(m => m.id === id)?.title || id;

  // Build deploy-id → release mapping (from release.deploy_ids only, not from deploy.linked_release)
  const deployToRelease = {};
  for (const r of Object.values(releases)) {
    for (const id of (r.deploy_ids || [])) deployToRelease[id] = r;
  }

  // Collect unique environments for filter buttons
  const envSet = new Set(allDeps.map(d => d.environment || 'prod'));
  const envList = [...envSet].sort();

  // Filter by selected environment
  const filtered = state.selectedDeployEnv
    ? allDeps.filter(d => (d.environment || 'prod') === state.selectedDeployEnv)
    : allDeps;

  // Sort newest first
  const sorted = filtered.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function deployDetail(d) {
    const mcMap = d.milestone_commits;
    if (!mcMap || !Object.keys(mcMap).length) {
      const badges = (d.milestones || []).map(id =>
        `<span class="release-ms-badge">${esc(id)}</span>`).join('');
      return badges ? `<div class="deploy-ms-badges">${badges}</div>` : '';
    }
    const newlyDone = new Set(d.newly_completed_ms || []);
    // completions first, patches after
    const sorted = Object.entries(mcMap).sort(([a],[b]) =>
      (newlyDone.has(b)?1:0) - (newlyDone.has(a)?1:0));
    let h = '<div class="deploy-detail">';
    for (const [msId, hashes] of sorted) {
      const completion = newlyDone.has(msId);
      // Minor deploys cannot have MS release
      const blockType = (d.type === 'minor') ? 'patch' : (completion ? 'completion' : 'patch');
      h += `<div class="deploy-ms-block ${blockType}">
        <div class="deploy-ms-block-header">
          <span class="deploy-ms-type-label">${blockType === 'completion' ? 'MS release' : 'MS patch'}</span>
          <span class="deploy-ms-block-id">${esc(msId)}</span>
          <span class="deploy-ms-block-title">${esc(msTitle(msId))}</span>
        </div>
        <div class="deploy-commit-list">`;
      for (const hash of hashes) {
        const entry = lookupEntry(hashMap, hash);
        h += `<div class="deploy-commit-row">
          <span class="deploy-commit-label">commit</span>
          <span class="deploy-commit-eid">${esc(entry?.id || '')}</span>
          <span class="deploy-commit-desc">${esc(entry?.description || hash)}</span>
          <code class="deploy-commit-hash">${esc(hash.slice(0,7))}</code>
        </div>`;
      }
      h += `</div></div>`;
    }
    const unassigned = d.unassigned_commits || [];
    if (unassigned.length) {
      h += `<div class="deploy-ms-block untracked">
        <div class="deploy-ms-block-header"><span class="deploy-ms-type-label">untracked</span></div>
        <div class="deploy-commit-list">`;
      for (const hash of unassigned) {
        h += `<div class="deploy-commit-row">
          <span class="deploy-commit-label">commit</span>
          <code class="deploy-commit-hash">${esc(hash.slice(0,7))}</code>
        </div>`;
      }
      h += `</div></div>`;
    }
    return h + '</div>';
  }

  function deployCard(d) {
    const isMajor = d.type === 'major';
    const expanded = state.expandedDeployId === d.id;
    const dot = `<span class="deploy-type-dot ${isMajor?'major':'minor'}">${isMajor?'◉':'○'}</span>`;
    // e-1274: show top-level version tag (e.g. v0.22.0) when present so
    // reviewers can cross-reference releases without expanding the card.
    const verBadge = d.version ? `<span class="release-group-semver">${esc(d.version)}</span>` : '';
    let h = `<div class="deploy-card ${isMajor?'is-major':'is-minor'}" data-action="expand-deploy" data-deploy-id="${esc(d.id)}" style="cursor:pointer;">
      <div class="deploy-card-header">
        ${dot}
        <span class="deploy-id">${esc(d.id)}</span>
        ${verBadge}
        <span class="deploy-env-badge">${esc(d.environment||'prod')}</span>
        <span class="deploy-datetime">${esc(fmtDate(d.date))}</span>
        <span class="deploy-expand-arrow">${expanded?'▲':'▼'}</span>
      </div>
      <div class="deploy-desc">${esc(d.description||'')}</div>`;
    if (expanded) {
      h += deployDetail(d);
    } else {
      const newlyDone = new Set(d.newly_completed_ms || []);
      const badges = (d.milestones||[]).map(id => {
        const isCompletion = d.type !== 'minor' && newlyDone.has(id);
        const isPatch = !isCompletion;
        const cls = isCompletion ? 'release-ms-badge-completion' : 'release-ms-badge-patch';
        return `<span class="${cls}">${esc(id)}</span>`;
      }).join('');
      if (badges) h += `<div class="deploy-ms-badges">${badges}</div>`;
    }
    return h + '</div>';
  }

  // Env filter bar (only shown when multiple environments exist)
  const envFilter = envList.length > 1 ? `<div class="deploy-env-filter">
    <button class="deploy-env-btn ${!state.selectedDeployEnv ? 'active' : ''}" data-action="switch-deploy-env" data-env="">All</button>
    ${envList.map(e => `<button class="deploy-env-btn ${state.selectedDeployEnv === e ? 'active' : ''}" data-action="switch-deploy-env" data-env="${esc(e)}">${esc(e)}</button>`).join('')}
  </div>` : '';

  let html = `<section class="retro-section fade-in"><div>${subtabs}${envFilter}`;

  // Render purely chronologically; insert release header before the first deploy in that release
  const shownReleases = new Set();
  for (const d of sorted) {
    const rel = deployToRelease[d.id];
    if (rel && !shownReleases.has(rel.id)) {
      shownReleases.add(rel.id);
      const sv = rel.semver ? `<span class="release-group-semver">${esc(rel.semver)}</span>` : '';
      html += `<div class="release-group-header"><span>${esc(rel.id)}</span>${sv}</div>`;
    }
    html += deployCard(d);
  }

  return html + `</div></section>`;
}

function renderCodeReleasesTab(p) {
  const pushes = (p?.pushes || []).slice().sort((a, b) =>
    (b.pushed_at || '').localeCompare(a.pushed_at || ''));

  if (!pushes.length) {
    return `<div class="retro-empty">No push records yet.<br>
      <span style="font-size:0.75rem;color:var(--text-dim)">Run <code>beacon push record</code> after each push.</span>
    </div>`;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  return pushes.map(push => {
    const expanded = state.expandedPushId === push.id;
    const commits = push.commits || [];
    // e-1274: top-level version tag (e.g. v0.22.0) when present.
    const pushVerBadge = push.version ? `<span class="release-group-semver">${esc(push.version)}</span>` : '';
    let h = `<div class="push-card" data-action="expand-push" data-push-id="${esc(push.id)}" style="cursor:pointer;">
      <div class="push-card-header">
        <span class="push-icon">↑</span>
        <span class="push-id">${esc(push.id)}</span>
        ${pushVerBadge}
        <span class="push-branch-badge">${esc(push.branch || 'main')}</span>
        ${push.pushed_by ? `<span class="push-by">${esc(push.pushed_by)}</span>` : ''}
        <span class="push-commit-count">${push.commit_count || commits.length} commits</span>
        <span class="push-datetime">${esc(fmtDate(push.pushed_at))}</span>
        <span class="push-expand-arrow">${expanded ? '▲' : '▼'}</span>
      </div>
      ${push.summary ? `<div class="push-summary">${esc(push.summary)}</div>` : ''}`;
    if (expanded && commits.length) {
      h += `<div class="push-commit-list">`;
      for (const c of commits) {
        h += `<div class="push-commit-row">
          <code class="push-commit-hash">${esc(c.hash || '')}</code>
          <span class="push-commit-msg">${esc(c.message || '')}</span>
        </div>`;
      }
      h += `</div>`;
    }
    return h + `</div>`;
  }).join('');
}



function renderOperationsSection() {
  const p = state.project;
  const allOps = p.operations || [];
  const activeOps = allOps.filter(o => o.status === 'open');
  const pendingOps = allOps.filter(o => o.status === 'todo' || o.status === 'in_progress');
  const closedOps = allOps.filter(o => o.status === 'closed');

  const runIcon = s => s === 'ok' ? '✓' : s === 'warning' ? '⚠' : s === 'error' ? '✗' : '?';
  const runColor = s => s === 'ok' ? 'var(--green)' : s === 'warning' ? 'var(--warn,#f0b429)' : s === 'error' ? 'var(--red,#e55)' : 'var(--text-dim)';

  const renderOp = (op) => {
    const entries = op.entries || [];
    const opTasks = entries.filter(e => e.type === 'operation_task');
    const opTasksDone = opTasks.filter(t => t.status === 'done').length;
    const runs = entries.filter(e => e.type === 'run_record').slice(-5).reverse();
    const incidents = entries.filter(e => e.type === 'incident' && e.status === 'open');
    const resolvedIncidents = entries.filter(e => e.type === 'incident' && e.status === 'resolved');

    const status = op.status || 'open';
    const statusBadge = `<span class="op-status-badge ${status}">${status}</span>`;
    const priorityBadge = op.priority ? `<span class="priority-badge priority-${op.priority}">${op.priority}</span>` : '';

    const objectiveBlock = op.objective
      ? `<div class="op-meta-block op-meta-objective"><div class="op-meta-label">objective</div>${esc(op.objective)}</div>` : '';
    const hintBlock = op.activation_hint
      ? `<div class="op-meta-block op-meta-hint"><div class="op-meta-label">activation hint</div>${esc(op.activation_hint)}</div>` : '';

    const opTasksHtml = opTasks.length ? `
      <div class="op-tasks">
        <div class="op-section-label">OperationTasks <span class="op-task-progress">(${opTasksDone}/${opTasks.length} done)</span></div>
        ${opTasks.map(t => {
          const isDone = t.status === 'done';
          const icon = isDone ? '●' : '○';
          const pri = t.meta?.priority ? `<span class="priority-badge priority-${t.meta.priority}">${t.meta.priority}</span>` : '';
          return `<div class="op-task-row ${isDone ? 'done' : ''}" data-action="open-entry-detail" data-entry-id="${esc(t.id)}">
            <span class="op-task-status">${icon}</span>
            <span class="op-task-desc">${esc(t.description||'')}</span>
            ${pri}
          </div>`;
        }).join('')}
      </div>` : '';

    const runsHtml = (status === 'open') ? `
      <div class="op-runs">
        <div class="op-section-label">Run Records</div>
        ${runs.length ? runs.map(r => `
          <div class="op-run-row">
            <span style="color:${runColor(r.status)};font-size:0.85em;">${runIcon(r.status)}</span>
            <span class="op-run-date">${localDate(r.date)}</span>
            <span class="op-run-batch">${esc(r.batch||'')}</span>
            <span class="op-run-desc">${esc(r.description||'')}</span>
          </div>`).join('') : '<div class="op-empty">No runs yet</div>'}
      </div>` : '';

    const incidentsHtml = incidents.map(i => `
      <div class="op-incident open">
        <span class="op-incident-icon">⚠</span>
        <span class="op-incident-id">[${esc(i.id)}]</span>
        <span class="op-incident-title">${esc(i.title||'')}</span>
        <span class="op-incident-date">${(i.opened_at||'').slice(0,10)}</span>
      </div>`).join('');

    const resolvedHtml = resolvedIncidents.slice(-3).map(i => `
      <div class="op-incident resolved">
        <span class="op-incident-icon" style="color:var(--text-dim)">✓</span>
        <span class="op-incident-id">[${esc(i.id)}]</span>
        <span class="op-incident-title" style="color:var(--text-dim)">${esc(i.title||'')}</span>
        <span class="op-incident-date">${(i.resolved_at||'').slice(0,10)}</span>
      </div>`).join('');

    return `
    <div class="op-card">
      <div class="op-header">
        <span class="op-id">${esc(op.id)}</span>
        <span class="op-title">${esc(op.title||'')}</span>
        ${statusBadge}
        ${priorityBadge}
        <span class="op-badge">${esc((op.schedule||{}).frequency||'')}</span>
        <span class="op-source">${esc(op.log_source||'')}</span>
        ${incidents.length ? `<span class="op-incident-count">⚠ ${incidents.length}</span>` : ''}
      </div>
      ${objectiveBlock}${hintBlock}
      ${opTasksHtml}
      ${runsHtml}
      ${incidents.length || resolvedIncidents.length ? `
      <div class="op-incidents">
        <div class="op-section-label">Incidents</div>
        ${incidentsHtml}${resolvedHtml}
      </div>` : ''}
      ${renderRelatedTreksWidget('operation', op.id)}
    </div>`;
  };

  const summary = [
    activeOps.length ? `${activeOps.length} active` : '',
    pendingOps.length ? `${pendingOps.length} pending` : '',
    closedOps.length ? `${closedOps.length} closed` : '',
  ].filter(Boolean).join(' · ');

  return `<section class="retro-section fade-in">
    <div style="margin-bottom:12px;font-size:0.78rem;color:var(--text-dim);">
      ${summary || 'No operations.'}
    </div>
    ${activeOps.map(renderOp).join('')}
    ${pendingOps.length ? `
    <details open style="margin-top:16px;">
      <summary style="font-size:0.75rem;color:var(--text-dim);cursor:pointer;">Pending Operations (${pendingOps.length})</summary>
      <div style="margin-top:8px;">${pendingOps.map(renderOp).join('')}</div>

    ${closedOps.length ? `

      <div style="margin-top:8px;opacity:0.6;">${closedOps.map(renderOp).join('')}</div>
    </details>` : ''}
  </section>`;
}
