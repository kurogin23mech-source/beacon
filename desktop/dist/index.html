  changeMemberRole: async (pid, email, role) => JSON.parse(
    await invoke('cloud_change_member_role', { projectId: pid, args: { email, role } }),
  ),
  removeMember: async (pid, email) => JSON.parse(
    await invoke('cloud_remove_member', { projectId: pid, args: { email } }),
  ),
  // ms-78 e-1803 (= token-based invitation) — Tauri parity for the
  // "Generate invite URL" flow. createInvitation returns { invitation, url,
  // expires_at } where `url` includes the plaintext token (= shown to the
  // owner once, never returned again by listInvitations).
  createInvitation: async (pid, email, role) => JSON.parse(
    await invoke('cloud_create_invitation', { projectId: pid, args: { email, role } }),
  ),
  listInvitations: async (pid) => JSON.parse(
    await invoke('cloud_list_invitations', { projectId: pid }),
  ),
  cancelInvitation: async (pid, invitationId) => JSON.parse(
    await invoke('cloud_cancel_invitation', { projectId: pid, args: { invitationId } }),
  ),
  // ms-78 e-1804 — Public landing endpoints. previewInvitation does NOT need
  // an auth token (= Rust drops the Authorization header); acceptInvitation
  // requires the caller to be signed in.
  previewInvitation: async (token) => JSON.parse(
    await invoke('cloud_preview_invitation', { args: { token } }),
  ),
  acceptInvitation: async (token, displayName) => JSON.parse(
    await invoke('cloud_accept_invitation', { args: { token, displayName: displayName || '' } }),
  ),
  // ms-72 e-1774 — Project archive / unarchive. Maps to existing Rust
  // commands (`cloud_archive_project` / `cloud_unarchive_project`) when
  // running cloud mode. Local Tauri mode is project-archive-free (= local
  // projects are managed via filesystem moves, not a flag).
  setProjectArchived: async (_pid, action) => {
    if (!cloudMode) {
      throw new Error('Local projects cannot be archived from the UI. Move the project folder instead.');
    }
    if (action === 'archive') {
      await invoke('cloud_archive_project');
    } else if (action === 'unarchive') {
      await invoke('cloud_unarchive_project');
    } else {
      throw new Error(`Unknown archive action: ${action}`);
    }
  },
};

function startPolling() { if (!pollTimer) pollTimer = setInterval(loadProject, 2000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ---- Cloud WebSocket (live updates) ----
// e-738: Tauri cloud mode previously had no live updates after 3cebae5
// removed the 2s polling. This subscribes to the server's project broadcast,
// mirroring Web UI behaviour in server/static/index.html.

async function connectCloudWebSocket(projectId) {
  closeCloudWebSocket();
  if (!projectId) return;

  let token;
  try {
    token = await invoke('cloud_get_auth_token');
  } catch (e) {
    state.connected = false;
    state.error = String(e);
    render();
    return;
  }

  const apiUrl = await getApiUrl();
  const wsHost = apiUrlToWsHost(apiUrl);
  const url = `wss://${wsHost}/ws/projects/${encodeURIComponent(projectId)}?token=${encodeURIComponent(token)}`;
  let ws;
  try {
    ws = new WebSocket(url);
  } catch (e) {
    state.connected = false;
    state.error = `WS construct failed: ${e}`;
    render();
    return;
  }
  cloudWs = ws;

  ws.onopen = () => {
    cloudWsReconnectAttempts = 0;
    state.connected = true;
    state.error = null;
    // Targeted DOM update for the offline → live indicator. A full render()
    // here repaints the entire shell right after the initial dashboard
    // render, which the user sees as a 1-frame flash. The connection dot is
    // the only thing that actually changes on open, so update it directly
    // and leave the rest of the DOM untouched. (ms-43 follow-up)
    const dot = document.querySelector('.status-dot');
    if (dot) dot.classList.remove('offline');
    const label = document.querySelector('.connection-label');
    if (label) label.textContent = 'live';
    if (cloudWsPingInterval) clearInterval(cloudWsPingInterval);
    cloudWsPingInterval = setInterval(() => {
      if (cloudWs && cloudWs.readyState === WebSocket.OPEN) cloudWs.send('ping');
    }, 30000);
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch (_) { return; }
    // ms-43 e-809: route document_change frames through the SHARED
    // applyDocumentChange (built into desktop/dist from server/static/index.html
    // by desktop/build.py) so Documents tab parity with Web UI is automatic.
    if (msg.type === 'document_change') {
      if (typeof applyDocumentChange === 'function') applyDocumentChange(msg.data);
      return;
    }
    if (msg.type !== 'project') return;
    const data = msg.data || {};
    const newJson = JSON.stringify(data);
    if (newJson === lastProjectJson) return;
    lastProjectJson = newJson;
    state.project = data;
    state.lastUpdate = new Date();
    state.connected = true;
    state.error = null;
    renderOnDataChange();
  };

  ws.onerror = () => {
    state.connected = false;
    if (state.project) render();
  };

  ws.onclose = async (ev) => {
    if (cloudWsPingInterval) { clearInterval(cloudWsPingInterval); cloudWsPingInterval = null; }
    cloudWs = null;
    state.connected = false;

    // Server-side close codes (server/app.py @ ws_project):
    //   4401: token missing — surface "sign in" message, do not retry.
    //   4403 reason="token_expired_or_invalid": refresh the token and
    //        reconnect once. If refresh fails, prompt re-sign-in.
    //   4403 reason="forbidden": user has no role on this project
    //        (e-1252). MUST NOT retry — reconnecting is futile and just
    //        loops against the auth gate.
    //   4404: the project doesn't exist (e-1252). Stop reconnecting and
    //        surface a clear "project not found" message.
    if (ev && ev.code === 4401) {
      state.error = 'Not signed in. Run `beacon auth login` to enable live updates.';
      if (state.project) render();
      return;
    }
    if (ev && ev.code === 4404) {
      state.error = 'This project does not exist or has been deleted.';
      if (state.project) render();
      return;
    }
    if (ev && ev.code === 4403) {
      if (ev.reason === 'forbidden') {
        state.error = 'You do not have access to this project. Ask the owner to invite you.';
        if (state.project) render();
        return;
      }
      // token_expired_or_invalid: try one silent refresh.
      try {
        await invoke('cloud_refresh_auth_token');
        // Reset attempts since refresh succeeded; reconnect immediately.
        cloudWsReconnectAttempts = 0;
        connectCloudWebSocket(projectId);
        return;
      } catch (e) {
        state.error = 'Session expired. Run `beacon auth login` to sign in again.';
        if (state.project) render();
        return;
      }
    }

    // Generic close (network blip, server restart): exponential backoff capped
    // at 30s, matching lib/store_api.py.
    if (!cloudMode || state.cloudProjectId !== projectId) return;
    cloudWsReconnectAttempts += 1;
    const delay = Math.min(1000 * (2 ** (cloudWsReconnectAttempts - 1)), CLOUD_WS_RECONNECT_MAX_MS);
    if (state.project) render();
    cloudWsReconnectTimer = setTimeout(() => {
      cloudWsReconnectTimer = null;
      if (cloudMode && state.cloudProjectId === projectId) {
        connectCloudWebSocket(projectId);
      }
    }, delay);
  };
}

function closeCloudWebSocket() {
  if (cloudWsReconnectTimer) { clearTimeout(cloudWsReconnectTimer); cloudWsReconnectTimer = null; }
  if (cloudWsPingInterval) { clearInterval(cloudWsPingInterval); cloudWsPingInterval = null; }
  if (cloudWs) {
    // Suppress reconnect: clear handler before close.
    cloudWs.onclose = null;
    cloudWs.onerror = null;
    try { cloudWs.close(); } catch (_) {}
    cloudWs = null;
  }
  cloudWsReconnectAttempts = 0;
}

let unlistenWatcher = null;
async function startWatcher() {
  if (unlistenWatcher) return;
  if (window.__TAURI__?.event) {
    unlistenWatcher = await window.__TAURI__.event.listen('beacon-changed', () => loadProject());
  }
}
function stopWatcher() { if (unlistenWatcher) { unlistenWatcher(); unlistenWatcher = null; } }

// F27: project-changed event — fired by Rust single-instance plugin when a
// second `open -a Beacon --args /path` lands. Clear current state and reload
// from the new project dir.
let unlistenProjectSwitch = null;
async function startProjectSwitchListener() {
  if (unlistenProjectSwitch) return;
  if (window.__TAURI__?.event) {
    unlistenProjectSwitch = await window.__TAURI__.event.listen('project-changed', async () => {
      // Clear in-flight watcher / state from previous project
      stopWatcher();
      closeCloudWebSocket();
      state.project = null;
      state.expanded.clear();
      lastProjectJson = '';
      state.cloudProjectId = null;
      cloudMode = false;
      state.connected = false;
      state.error = null;
      render();
      // Reload from the new project_dir set by Rust
      await loadProject();
      await startWatcher();
    });
  }
}

async function doSelectCloudProject(projectId) {
  closeCloudWebSocket();
  cloudMode = true;
  state.cloudProjectId = projectId;
  state.error = null; state.project = null; state.expanded.clear();
  state.documents = []; state.documentContent = null;
  state.retros = []; state.retroContent = null;
  state.activeTab = 'dashboard'; lastProjectJson = null;
  state.projectPath = 'cloud:' + projectId;
  // ms-43 e-1023: reset search state on project switch so a query typed in
  // project A doesn't silently filter project B.
  state.searchQuery = '';
  state.searchResults = null;
  state.searchFacets = { type: {}, status: {}, priority: {}, scope: {} };
  state.searchTotal = 0;
  state.searchLoading = false;
  state.searchTypeFilter = 'all';
  const _searchInput = document.getElementById('search-input');
  if (_searchInput) _searchInput.value = '';
  try {
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render();
    }
    // e-738: subscribe to live updates via WS. Polling was removed in 3cebae5
    // because the 2s setInterval blocked the main thread; WS pushes instead
    // arrive on data change only, so no constant CPU/JSON-parse cost.
    connectCloudWebSocket(projectId);
  } catch (e) { state.error = String(e); renderProjectSelector(); }
}

async function doSelectProject(path) {
  try {
    cloudMode = false;
    state.cloudProjectId = null;
    closeCloudWebSocket();
    stopPolling(); stopWatcher();
    await invoke('set_project_dir', { dir: path });
    state.error = null; state.project = null; state.expanded.clear();
    state.documents = []; state.documentContent = null;
    state.retros = []; state.retroContent = null;
    state.activeTab = 'dashboard'; lastProjectJson = null;
    state.projectPath = path;
    // ms-43 e-1023: reset search state on project switch so a query typed in
    // project A doesn't silently filter project B.
    state.searchQuery = '';
    state.searchResults = null;
    state.searchFacets = { type: {}, status: {}, priority: {}, scope: {} };
    state.searchTotal = 0;
    state.searchLoading = false;
    state.searchTypeFilter = 'all';
    const _searchInput = document.getElementById('search-input');
    if (_searchInput) _searchInput.value = '';
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startWatcher();
    }
  } catch (e) { state.error = String(e); renderProjectSelector(); }
}

      cloudProjects = JSON.parse(await invoke('cloud_list_projects'));
    } catch (e) { state.cloudError = String(e); }
  }
  const localOnly = localProjects.filter(p => p.mode === 'local');

  app.innerHTML = `
    <div class="open-prompt fade-in">
      <h1 style="font-family:var(--font-mono);font-size:2rem;font-weight:700;">Beacon</h1>

        ${localOnly.length > 0 ? `<div class="summary-label">Local Projects</div>

        ${!authenticated && localOnly.length === 0 ? `<p style="color:var(--text-dim);font-size:0.8rem;margin-top:12px;">Run <code style="color:var(--accent)">beacon auth login</code> to access cloud projects,<br>or <code style="color:var(--accent)">beacon init</code> to create a local project.</p>` : ''}
        ${state.cloudError ? `<p style="color:var(--warning);font-size:0.75rem;margin-top:12px;">Cloud error: ${esc(state.cloudError)}<br><span style="color:var(--text-dim);">Run <code style="color:var(--accent)">beacon auth login</code> to refresh.</span></p>` : ''}

// ---- Menu ----

async function renderMenu() {
  let localProjects = [], cloudProjects = [];
  try { localProjects = await invoke('list_projects'); } catch (e) {}
  try {
    const auth = await invoke('is_authenticated');
    if (auth) cloudProjects = JSON.parse(await invoke('cloud_list_projects'));
  } catch (e) {}
  const localOnly = localProjects.filter(p => p.mode === 'local');
  const currentPath = state.projectPath || '';
  const root = document.getElementById('menu-root');
  root.innerHTML = `
    <div class="menu-overlay" data-action="close-menu"></div>
    <div class="menu-panel">
      <div class="menu-header"><span class="menu-title">Menu</span><button class="menu-close" data-action="close-menu">×</button></div>
      ${localOnly.length > 0 ? `<div class="menu-section">
        <div class="menu-section-title">Local Projects</div>
        ${localOnly.map(p => `<button class="menu-item ${p.path === currentPath ? 'current' : ''}" data-action="menu-select-project" data-path="${esc(p.path)}">${esc(p.name)}<div class="menu-item-sub">${esc(p.path)}</div></button>`).join('')}
      </div>` : ''}
      ${cloudProjects.length > 0 ? `<div class="menu-section">
        <div class="menu-section-title">Cloud Projects</div>
        ${cloudProjects.filter(p => !p.archived).map(p => `<button class="menu-item ${('cloud:' + p.project_id) === currentPath ? 'current' : ''}" data-action="menu-select-cloud-project" data-project-id="${esc(p.project_id)}">${esc(p.name)}<div class="menu-item-sub">${esc(p.project_id)}</div></button>`).join('')}
      </div>` : ''}
    </div>`;
  root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleAction));
}

function closeMenu() { document.getElementById('menu-root').innerHTML = ''; }

// ---- Event delegation ----

function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleAction);
  });
}

async function handleAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  if (action === 'toggle-entry' && e.target.closest('.entry-children')) return;
  e.stopPropagation();

  // ms-72 e-1779 — Tauri-specific account-menu intercepts BEFORE the SHARED
  // dispatcher gets them. SHARED's `goto-admin` calls `gotoAdmin()` which
  // does `window.location.assign('/admin')`; inside the Tauri webview that
  // navigates AWAY from the app shell and breaks the session, so we open
  // the Web admin URL in an external browser via the system shell instead.
  // SHARED has no `logout` case at all (Web's `logout()` lives in SKIP), so
  // we own the Tauri sign-out path here: clear credentials.json via
  // cloud_logout and bounce back to the project selector. The case
  // statements below mirror the names so scripts/check-frontend-drift.py
  // sees handleAction "covers" both actions; the actual work is dispatched
  // into the switch via TAURI_PLATFORM_INTERCEPTS so the SHARED dispatcher
  // never sees them.
  const TAURI_PLATFORM_INTERCEPTS = new Set(['goto-admin', 'logout']);
  if (!TAURI_PLATFORM_INTERCEPTS.has(action)) {
    // First try SHARED common-action dispatcher (ms-46 e-726).
    // Returns true if handled — keeps platform handleAction focused on
    // data-source-specific cases.
    if (handleCommonAction(action, el)) return;
  }

  switch (action) {
    case 'goto-admin': {
      try { if (typeof closeAccountMenu === 'function') closeAccountMenu(); } catch (_) {}
      const apiUrl = await getApiUrl();
      const url = `${apiUrl}/admin`;
      try {
        // Prefer tauri-plugin-shell so the link opens in the user's default
        // browser. If the plugin isn't available (= older builds) fall back
        // to clipboard + alert so the user can still reach the page.
        if (window.__TAURI__?.shell?.open) {
          await window.__TAURI__.shell.open(url);
        } else {
          await navigator.clipboard.writeText(url);
          alert(`Admin URL copied to clipboard:\n${url}`);
        }
      } catch (err) {
        alert(`Failed to open Admin URL (${url}): ${err}`);
      }
      break;
    }
    case 'logout': {
      try { if (typeof closeAccountMenu === 'function') closeAccountMenu(); } catch (_) {}
      try {
        await invoke('cloud_logout');
      } catch (err) {
        alert(`Sign out failed: ${err}`);
        break;
      }
      // Clear app shell state so the next render lands on the project selector
      // instead of a stale dashboard. Mirrors Web's logout() which closes the
      // WS and re-renders the login screen.
      closeCloudWebSocket();
      stopPolling();
      stopWatcher();
      cloudMode = false;
      state.cloudProjectId = null;
      state.project = null;
      state.expanded.clear();
      lastProjectJson = null;
      state.projectPath = null;
      state.error = null;
      renderProjectSelector();
      break;
    }

    // ---- Project selection (path-based for Tauri local) ----
    case 'select-project': await doSelectProject(el.dataset.path); break;
    case 'select-cloud-project': await doSelectCloudProject(el.dataset.projectId); break;
    case 'menu-select-project': closeMenu(); await doSelectProject(el.dataset.path); break;
    case 'menu-select-cloud-project': closeMenu(); await doSelectCloudProject(el.dataset.projectId); break;

    // Note: switch-tab / open-document / open-retro are handled by
    // handleCommonAction (SHARED) via `dataSource`. See ms-46 e-728.

    // ---- Tauri-specific: clipboard URL format / commands ----
    case 'copy-doc-link': {
      // ms-64 / e-1461: profile-aware deep link to the Web UI.
      const apiUrl = await getApiUrl();
      const url = `${apiUrl}/?project=${state.cloudProjectId}#doc/${el.dataset.docId}`;
      await navigator.clipboard.writeText(url);
      el.textContent = 'Copied!';
      setTimeout(() => { el.textContent = 'Copy web link'; }, 1500);
      break;
    }
    case 'open-menu': await renderMenu(); break;
    case 'cloud-diagnose': {
      state.cloudDiag = 'Running...';
      renderProjectSelector();
      state.cloudDiag = await invoke('cloud_diagnose').catch(e => String(e));
      renderProjectSelector();
      break;
    }
    case 'export-json': await exportProject(); break;
    case 'archive-cloud-project': await archiveCloudProject(); break;
  }
}

// ---- Project actions ----

async function archiveCloudProject() {
  if (!state.cloudProjectId) return;
  if (!confirm('Archive this project? It will be hidden from the project list.')) return;
  try {
    await invoke('cloud_archive_project');
    closeMenu();
    state.cloudProjectId = null; state.project = null;
    renderProjectSelector();
  } catch (e) { alert('Failed to archive: ' + e); }
}

async function exportProject() {
  try {
    let project, documents = [], retros = [];
    if (cloudMode && state.cloudProjectId) {
      project = JSON.parse(await invoke('cloud_load_project', { projectId: state.cloudProjectId }));
      try { documents = JSON.parse(await invoke('cloud_list_documents')); } catch (e) {}
      try { retros = JSON.parse(await invoke('cloud_list_retros')); } catch (e) {}
    } else {
      project = JSON.parse(await invoke('load_project_json'));
      try { documents = JSON.parse(await invoke('get_documents', { scope: '' })); } catch (e) {}
      try { retros = JSON.parse(await invoke('list_retros')); } catch (e) {}
    }
    const blob = new Blob([JSON.stringify({ ...project, documents, retros }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `${state.cloudProjectId || 'project'}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) { alert('Export failed: ' + e); }
}

// ---- Reconnect (Tauri focus events) ----

function _tryReconnect() {
  if (!state.project) return;
  if (cloudMode) {
    // ms-46 e-755: cloud mode の focus 復帰では WS を主軸にする (Web と同じ
    // パターン)。loadProject() を呼ぶと REST が生データを返して state.project
    // (WS 経由で届いた enriched 版 — total_tasks/done_tasks 等を含む) を
    // 上書きしてしまう。WS が生きていれば何もしない。落ちていれば WS で
    // 再接続すると server が initial enriched data を改めて送り直してくれる。
    if (cloudWs && cloudWs.readyState === WebSocket.OPEN) return;
    connectCloudWebSocket(state.cloudProjectId);
  } else {
    // local mode は invoke('load_project_json') + file watcher 経由で、
    // server enrichment とは別経路 (CLI の count_task_status を後段で再現する
    // 必要はあるが本タスク範囲外)。
    startWatcher();
    loadProject();
  }
}

if (window.__TAURI__?.event) {
  window.__TAURI__.event.listen('tauri://focus', _tryReconnect);
}
document.addEventListener('visibilitychange', () => {

});

// ---- Init ----

async function init() {
  // F27: always listen for project-changed even before project loads — covers
  // the cold-start case where Beacon was launched via `open -a Beacon --args ...`
  // but the running instance later receives another launch with a different path.
  startProjectSwitchListener();
  try {
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startWatcher(); return;
    }
  } catch (e) {}
  renderProjectSelector();
}

if (window.__TAURI__) init();
else document.addEventListener('DOMContentLoaded', () => { if (window.__TAURI__) init(); });

// ms-43 e-809: apply a single document-change delta emitted by the server's
// WS broadcast so the Documents tab stays reactive instead of being a
// "fetch-on-open" snapshot.
//
// Two reasons this is its own function (not inlined into ws.onmessage):
//  1) Tauri (desktop/layer.js) maintains a separate WS connection; both
//     sides should mutate state identically, so the logic lives in SHARED.
//  2) The "re-render only when active" check is non-obvious — keeping it
//     in one place means a future bug fix touches one site, not two.
//
// payload schema: { op: "add"|"update"|"delete", doc_id, scope, title,
//                   updated_at, milestone? }
function applyDocumentChange(payload) {
  if (!payload || !payload.doc_id) return;
  const docs = Array.isArray(state.documents) ? state.documents : [];
  const idx = docs.findIndex(d => d.doc_id === payload.doc_id);
  if (payload.op === 'delete') {
    if (idx >= 0) docs.splice(idx, 1);
  } else {
    // The list endpoint returns only the lightweight summary shape
    // {doc_id, title, scope, updated_at, milestone?}. Mirror that here so
    // a later loadDocuments() round trip won't reshape entries differently.
    const entry = {
      doc_id: payload.doc_id,
      title: payload.title || '',
      scope: payload.scope || 'memo',
      updated_at: payload.updated_at || '',
    };
    if (payload.milestone) entry.milestone = payload.milestone;
    if (idx >= 0) {
      docs[idx] = entry;
    } else {
      // Newest-first ordering matches list_documents (order_by updated_at
      // DESC); a freshly-saved doc has the latest updated_at so it goes
      // at the head.
      docs.unshift(entry);
    }
  }
  state.documents = docs;
  state.lastUpdate = new Date();
  // Re-render only when the user is actually looking at the Documents
  // tab — for any other tab the state mutation is enough; the next
  // switchTab('documents') will see the fresh list without a fetch.
  if (state.activeTab === 'documents' && !state.documentContent) {
    renderOnDataChange();
  }
}

const STATUS_LABELS = {
  done: 'done', in_progress: 'active', observing: 'observing',
  todo: 'todo', waiting: 'waiting', cancelled: 'cancelled',
  in_review: 'in review', approved: 'approved',
};

const FILTER_ORDER = ['todo', 'in_progress', 'observing', 'waiting', 'done', 'cancelled'];
const FILTER_CSS_CLASS = { todo: 'f-todo', in_progress: 'f-active', observing: 'f-observing', waiting: 'f-waiting', done: 'f-done', cancelled: 'f-cancelled' };

// UTC ISO ('...Z' / '...+09:00') → viewer's local YYYY-MM-DD. Empty/invalid passes through.
function localDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 10);
  return d.toLocaleDateString('sv-SE');
}

function statusBadge(status) {
  const label = STATUS_LABELS[status] || status;
  return `<div class="ms-status-badge"><div class="ms-status-icon ${status}"></div><span class="ms-status-text ${status}">${label}</span></div>`;
}

function entryTypeBadge(type) {
  const labels = { commit: 'commit', task: 'task', note: 'note', save: 'save', pr: 'PR', operation_task: 'op-task' };
  return `<span class="entry-type-badge ${type}">${labels[type] || type}</span>`;
}

function entryStatusText(entry) {
  if (entry.type === 'commit') return '';
  const label = STATUS_LABELS[entry.status] || entry.status;
  return `<span class="entry-status-text ${entry.status}">${label}</span>`;
}

let _currentMsId = null; // set during milestone card render

function renderEntry(entry) {
  if (_currentMsId) {
    // Hide done if user toggled "hide done" ON
    if (state.hideEntryDone.has(_currentMsId) && entry.status === 'done') return '';
    // Hide cancelled by default; show if user toggled "show cancelled" ON
    if (entry.status === 'cancelled' && !state.showCancelled.has(_currentMsId)) return '';
  }

  const statusClass = entry.status === 'done' ? ' done' : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';
  const detail = entry.detail ? `<div class="entry-detail">${esc(entry.detail)}</div>` : '';
  let prMeta = '';
  if (entry.type === 'pr' && entry.meta) {
    const m = entry.meta;
    const prStatus = m.pr_status || 'open';
    const reviewStatus = m.review_status ? ` · review: ${m.review_status}` : '';
    const url = m.url ? ` · <a href="${esc(m.url)}" target="_blank" rel="noopener" style="color:inherit;opacity:0.7;">${esc(m.url.replace(/.*\/pull\//, '#'))}</a>` : '';
    const intent = m.intent
      ? `<div class="entry-pr-decision entry-pr-intent"><div class="entry-pr-decision-label">intent</div>${esc(m.intent)}</div>`
      : '';
    const rationale = m.review_rationale
      ? `<div class="entry-pr-decision entry-pr-rationale-block"><div class="entry-pr-decision-label">rationale</div>${esc(m.review_rationale)}</div>`
      : '';
    prMeta = `<div class="entry-pr-block"><div class="entry-pr-meta"><span class="entry-pr-status ${prStatus}">${prStatus}${reviewStatus}</span>${url}</div>${intent}${rationale}</div>`;
  }
  const priority = entry.meta?.priority;
  const priorityBadge = priority ? `<span class="priority-badge priority-${priority}">${priority}</span>` : '';
  // e-976: warn-marker for done/cancelled entries with no reason recorded.
  const reasonMissing = reasonMissingBadge(entry);

  const hasDetail = !!(entry.motivation || entry.acceptance_criteria || entry.behavior || entry.detail
    || entry.meta?.resolves || entry.meta?.hash);

  const statusText = entryStatusText(entry);
  const hasChildren = entry.entries?.length > 0;
  const childCount = hasChildren ? entry.entries.length : 0;
  const isCollapsed = state.collapsedEntries.has(entry.id);
  const toggleClass = (hasChildren && entry.type !== 'commit') ? ` entry-toggle${isCollapsed ? ' collapsed' : ''}` : '';

  let children = '';
  if (hasChildren) {
    const hiddenClass = isCollapsed ? ' hidden' : '';
    const filteredChildren = entry.entries.map(renderEntry).join('');
    children = `<div class="entry-children${hiddenClass}">${filteredChildren}</div>`;
  }

  const childBadge = hasChildren && isCollapsed ? `<span class="entry-child-count">${childCount}</span>` : '';

  // Rows with children: whole-row click = toggle expand; info button opens modal
  // Rows without children: whole-row click = open modal
  const rowAction = hasChildren
    ? `data-action="toggle-entry" data-entry-id="${entry.id}"`
    : `data-action="open-entry-detail" data-entry-id="${entry.id}" style="cursor:pointer;"`;

  const infoBtn = hasChildren
    ? `<button class="entry-info-btn" data-action="open-entry-detail" data-entry-id="${entry.id}">···</button>`
    : '';

  // ms-78 / e-1909 — author column. Empty for older entries without
  // meta.author and no legacy actor either, in which case we omit the
  // span entirely so the row layout stays clean.
  const authorLabel = renderEntryAuthor(entry);
  const authorSpan = authorLabel
    ? `<span class="entry-author" style="color:var(--text-dim);font-size:0.65rem;margin-right:6px;">${authorLabel}</span>`
    : '';

  return `
    <div class="entry entry-type-${entry.type}${statusClass}${toggleClass}" ${rowAction}>
      ${entryTypeBadge(entry.type)}
      <span class="entry-id">${entry.id}</span>
      <span class="entry-desc">${esc(entry.description)}${hash}${statusText}${reasonMissing}${childBadge}${priorityBadge}${infoBtn}</span>
      ${authorSpan}
      <span class="entry-date">${entry.created_at || ''}</span>
      ${prMeta}
      ${children}
    </div>
  `;
}

function esc(s) {
  if (!s) return '';
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

/* ms-78 / e-1909 — human-friendly label for an author / member row.
 *
 * Returns escaped HTML where display_name is the primary label and email
 * goes in a small dim suffix. When display_name is empty / missing we
 * fall back to email alone — that matches the legacy author column and
 * keeps the column from emitting nothing for un-prompted users.
 *
 * The Settings > Members tab uses an inlined copy of this helper (= it
 * predates the SHARED extraction). New call sites (commit author column,
 * task created-by column, CLI mirror) should use this top-level version
 * so any future tweak lands in one place.
 */
function renderName(displayName, email) {
  const dn = (displayName || '').trim();
  const em = (email || '').trim();
  if (!dn) return esc(em);
  if (!em) return esc(dn);
  return `${esc(dn)} <span style="color:var(--text-dim);font-size:0.65rem;">${esc(em)}</span>`;
}

/* ms-78 / e-1909 — author label for a commit / task entry.
 *
 * Pulls from meta.author (= server-rich identity {user_id, email,
 * display_name} stamped by /api/projects/{pid}/log + entry create) and
 * falls back to legacy meta.actor (= machine/agent pair for older
 * commits). Returns empty string when neither is present so the
 * caller can skip rendering entirely.
 */
function renderEntryAuthor(entry) {
  const author = entry?.meta?.author;
  if (author && (author.display_name || author.email)) {
    return renderName(author.display_name, author.email);
  }
  // Legacy actor fallback: agent string (e.g. "mac-claude") is the best
  // human-readable label we have for pre-e-1909 commits.
  const actor = entry?.meta?.actor;
  if (actor && actor.agent) {
    return esc(actor.agent);
  }
  return '';
}

/* e-976: auto-link `PR #N` and `e-XXX` patterns inside reason strings
 * (done_reason / cancel_reason / restore_reason).
 *
 * Contract:
 *   1. The input is treated as untrusted plain text. We HTML-escape FIRST,
 *      then apply link substitutions to the escaped string. The patterns
 *      `PR #N` and `e-XXX` survive HTML escape unchanged (no &/</> in them)
 *      so the substitution is safe; never reverse the order or XSS slips in.
 *   2. `PR #N` → external GitHub pull URL. Repo URL is best-effort: prefers
 *      `window.BEACON_REPO_URL` when the server wires it in (TODO), else
 *      defaults to the Beacon repo. Owner/repo plumbing is a follow-up task.
 *   3. `e-XXX` → in-app entry link. Uses `data-entry-id` so the existing
 *      entry-modal handler can pick it up via delegated click. When the
 *      handler isn't on this page, the anchor degrades gracefully (the
 *      hash navigates but nothing happens — acceptable for now).
 */
function autoLinkReason(text) {
  if (!text) return '';
  // 1. HTML-escape (untrusted input → safe HTML).
  let html = esc(text);
  // 2. PR #N → GitHub PR link.
  //    TODO(e-976 follow-up): plumb BEACON_REPO_URL through server config so
  //    per-project repos work correctly; current default is the Beacon repo.
  const repoUrl = (window.BEACON_REPO_URL || 'https://github.com/kurogin23mech-source/beacon')
    .replace(/\/$/, '');
  html = html.replace(/\b(PR\s*#?)(\d+)\b/g, (_m, prefix, num) =>
    `<a href="${repoUrl}/pull/${num}" target="_blank" rel="noopener">${prefix}${num}</a>`
  );
  // 3. e-XXX → in-app entry link (handled by existing open-entry-detail
  //    delegation when present; bare anchor otherwise).
  html = html.replace(/\b(e-\d+)\b/g, (_m, id) =>
    `<a href="#entry/${id}" data-action="open-entry-detail" data-entry-id="${id}" class="entry-link">${id}</a>`
  );
  return html;
}

/* e-976: render a single reason field (done/cancel/restore) on entry modal.
 * Returns empty string when the entry has no matching reason; the caller
 * decides whether to show the "reason missing" badge instead.
 */
function renderReasonField(entry, key, label) {
  const reason = entry?.meta?.[key];
  if (!reason) return '';
  return (
    `<div class="entry-modal-field modal-field-reason">` +
    `<div class="entry-modal-field-label">${label}</div>` +
    `<div class="entry-reason-text">${autoLinkReason(reason)}</div>` +
    `</div>`
  );
}

/* e-976: small marker for done/cancelled entries whose reason is empty —
 * surfaces historic gaps without breaking layout. Returns empty string
 * when the entry has a reason or isn't in a status that requires one.
 */
function reasonMissingBadge(entry) {
  if (!entry) return '';
  const status = entry.status;
  const meta = entry.meta || {};
  if (status === 'done' && !meta.done_reason) {
    return `<span class="entry-reason-missing" title="done_reason missing">⚠ no reason</span>`;
  }
  if (status === 'cancelled' && !meta.cancel_reason) {
    return `<span class="entry-reason-missing" title="cancel_reason missing">⚠ no reason</span>`;
  }
  return '';
}

/* e-587: header version badge.
 *   Shows "v0.4.0  +N commits since release" when the project has any push
 *   record with a semver. Returns empty string when:
 *     - the fetch hasn't completed yet (avoid layout flash)

 * UI is a separate future task to drill into the releases tab).

// Current viewer's email. Set in Web via OAuth (state.auth.email); Tauri has
// no per-user concept yet — returns '' so the "is self" highlight just doesn't
// activate there (graceful degradation; the bare badges still render).
function currentUserEmail() {
  return (state && state.auth && state.auth.email) || '';
}

// Trim an email for compact display ("alice@example.com" → "alice").
// Falls back to the original string when it's not an email-like value.
function shortName(value) {
  if (!value) return '';
  const s = String(value);
  const at = s.indexOf('@');
  return at > 0 ? s.slice(0, at) : s;
}

function renderMemberBadges(ms) {
  if (!ms) return '';
  const me = currentUserEmail();
  const parts = [];
  if (ms.owner) {
    const selfCls = me && ms.owner === me ? ' is-self' : '';
    parts.push(`<span class="member-badge${selfCls}" title="owner: ${esc(ms.owner)}"><span class="mb-label">owner</span>${esc(shortName(ms.owner))}</span>`);
  }
  if (ms.assignee && ms.assignee !== ms.owner) {
    const selfCls = me && ms.assignee === me ? ' is-self' : '';
    parts.push(`<span class="member-badge${selfCls}" title="assignee: ${esc(ms.assignee)}"><span class="mb-label">→</span>${esc(shortName(ms.assignee))}</span>`);
  }

}

function renderVersionBadge() {
  const v = state.projectVersion;
  if (!v || !v.tag) return '';
  const tag = esc(v.tag);
  const diff = v.commits_since_release || 0;
  const diffPart = diff > 0
    ? `<span class="vb-diff" title="${diff} commits pushed since this release">+${diff}</span>`
    : '';
  return `<span class="version-badge" title="Latest released semver per push records">${tag}${diffPart}</span>`;
}

// Client-side derivation of project version from pushes — mirrors
// server/app.py:get_project_version. Used by Tauri (which has no API fetch
// path for /version) and works for any caller that has state.project loaded.
function computeProjectVersion(project) {
  if (!project) return { tag: '', commits_since_release: 0, total_pushes: 0 };
  const pushes = Array.isArray(project.pushes) ? project.pushes : [];
  const sortable = pushes
    .filter(p => p && typeof p === 'object')
    .map(p => [p.pushed_at || '', p])
    .sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0));
  let tag = '', latestAt = '', commitsSince = 0;
  for (const [, p] of sortable) {
    const sem = p.semver || (p.meta && p.meta.semver) || '';
    if (sem) { tag = sem; latestAt = p.pushed_at || ''; break; }
    commitsSince += p.commit_count || 0;
  }
  return {
    latest_pushed_semver: tag,
    latest_pushed_at: latestAt,
    commits_since_release: commitsSince,
    total_pushes: pushes.length,
    tag,
  };
}

function formatTime(date) {
  if (!date) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ---- Sort milestones by ID number ----

function msIdNum(ms) {
  const m = ms.id.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function sortMilestones(milestones) {
  return [...milestones].sort((a, b) => {
    const diff = msIdNum(a) - msIdNum(b);
    return state.sortAsc ? diff : -diff;
  });
}

// ---- Filter ----

function toggleStatusFilter(status) {
  if (state.hiddenStatuses.has(status)) {
    state.hiddenStatuses.delete(status);
  } else {
    state.hiddenStatuses.add(status);
  }
  render();
}

function showAllStatuses() {
  state.hiddenStatuses.clear();
  render();
}

function filterMilestones(milestones) {
  if (state.hiddenStatuses.size === 0) return milestones;
  return milestones.filter(ms => !state.hiddenStatuses.has(ms.status));
}

// ---- Next retro date ----

function nextRetroDate(retroDay) {
  const days = { monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6, sunday: 0 };
  const target = days[(retroDay || 'friday').toLowerCase()];
  if (target === undefined) return null;
  const now = new Date();
  const current = now.getDay();
  if (current === target) return { date: now.toISOString().slice(0, 10), isToday: true };
  let diff = target - current;
  if (diff <= 0) diff += 7;
  const next = new Date(now);
  next.setDate(now.getDate() + diff);
  return { date: next.toISOString().slice(0, 10), isToday: false };
}

/**
 * renderShell (ms-46 e-743): single-source-of-truth shell HTML.
 * Tab-bar, section dispatch, header/footer are defined here once and used
 * by both Web (this file) and Tauri (desktop/dist/index.html via build.py).
 * Platform-specific differences are read from `PLATFORM` declared in the
 * SKIP block (Web) or in desktop/layer.js (Tauri).

// ms-46 e-757: client-side fallback for task counts. Mirrors server-side
// `count_task_status` (lib/core.py). Cloud WS / REST normally arrive with
// `total_tasks` / `done_tasks` already populated by `_enrich_project`, but
// Tauri local mode reads project.json directly via invoke and gets no
// enrichment. Computing here ensures the count always renders.
function countTasksRecursive(entries) {
  let total = 0, done = 0;
  for (const e of entries || []) {
    if (e.type === 'task' || e.type === 'commit' || e.type === 'pr') {
      total++;
      if (e.status === 'done' || e.status === 'cancelled') done++;
    }
    if (e.entries && e.entries.length) {
      const sub = countTasksRecursive(e.entries);
      total += sub.total;
      done += sub.done;
    }
  }
  return { total, done };
}

function renderMilestoneCard(ms, index) {

  let msTotal = ms.total_tasks;

  const tasksLabel = msTotal > 0 ? `${msDone}/${msTotal}` : '';

  let bodyHtml = '';

async function switchTab(tab) {
  state.activeTab = tab;
  state.retroContent = null;
  state.documentContent = null;
  // ms-69 / e-1659 v3: switching tabs leaves any open trek detail and
  // returns the user to the project view (trek detail is a sidebar-driven
  // standalone page, not a tab in the project chrome).
  // ms-86 / e-2220 — accordion / show-done 状態も Trek を閉じる経路で必ず
  // クリアする (= 別 Trek を後で開いた時に前 Trek の expand 状態が漏れない)。
  state.openTrekId = null;
  state.openTrekDocs = [];
  state.openTrekExpanded = new Set();
  state.openTrekShowDone = new Set();
  if (tab === 'documents') {
    const loads = [];
    if (state.documents.length === 0) loads.push(dataSource.loadDocuments().catch(() => {}));
    if (state.retros.length === 0) loads.push(dataSource.loadRetros().catch(() => {}));
    await Promise.all(loads);
  }
  if (tab === 'operations') {
    // ms-69 / e-1664: pre-warm related-treks for every operation on the
    // project so the widget renders immediately as the op cards paint.
    // Skip ops we already have cached.
    const ops = (state.project && state.project.operations) || [];
    const missing = ops.filter(o => state.relatedTreks['op:' + o.id] === undefined);
    if (missing.length) {
      Promise.all(missing.map(o => dataSource.loadRelatedTreks('operation', o.id)))
        .then(() => render())
        .catch(() => {});
    }
  }
  if (tab === 'notes') {
    // ms-57 e-1041: Session tab carries two sub-views (notes/logs). Kick
    // off both loads in parallel so toggling between them is instant.
    Promise.all([
      dataSource.loadSessionNotes(),
      dataSource.loadSessionLogs(),
    ]).then(() => render()).catch(() => {});
  }
  render();
}

//
// Shown once per browser when:

//   - the user has not dismissed the prompt before (= localStorage key
//     `beacon_display_name_prompt_dismissed_at` absent).
//
// The dismiss is durable so closing the banner counts as "I'll do it
// later from Settings", matching AC 3's "1 回だけ" requirement.
function _shouldShowDisplayNamePrompt() {
  if (!state.auth || !state.auth.email) return false;
  if (!state.myProfile) return false;
  if ((state.myProfile.display_name || '').trim()) return false;
  try {
    if (localStorage.getItem('beacon_display_name_prompt_dismissed_at')) return false;
  } catch (_) { /* private mode → show it once per page load */ }

}

  const root = document.getElementById('display-name-prompt');

  if (!_shouldShowDisplayNamePrompt()) { root.innerHTML = ''; root.style.display = 'none'; return; }

  root.style.display = 'block';
  root.innerHTML = `
    <div style="position:fixed;top:60px;right:24px;z-index:1000;
                background:var(--bg-surface);border:1px solid var(--border);

      </div>

        Your author column currently shows ${esc(email)}.

      </div>
      <div style="display:flex;gap:6px;flex-direction:column;">
        <input id="display-name-prompt-input" type="text" maxlength="60"
               placeholder="e.g. Taro Yamada"

        <div style="display:flex;gap:6px;">
          <button data-action="display-name-prompt-save"
                  style="background:var(--accent);color:#000;border:0;padding:5px 12px;border-radius:3px;font-family:var(--font-mono);font-size:0.7rem;cursor:pointer;flex:1;">

          <button data-action="display-name-prompt-dismiss"
                  style="background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:5px 12px;border-radius:3px;font-family:var(--font-mono);font-size:0.7rem;cursor:pointer;">
            Later
          </button>
        </div>
      </div>
    </div>`;
  // Wire actions (data-action handler is global; direct binding here ensures
  // the bus fires even when the prompt sits outside the main #app subtree).
  const saveBtn = root.querySelector('[data-action="display-name-prompt-save"]');
  const dismissBtn = root.querySelector('[data-action="display-name-prompt-dismiss"]');
  if (saveBtn) saveBtn.addEventListener('click', _displayNamePromptSave);
  if (dismissBtn) dismissBtn.addEventListener('click', _displayNamePromptDismiss);
}

async function _displayNamePromptSave() {
  const input = document.getElementById('display-name-prompt-input');
  const value = ((input && input.value) || '').trim();
  if (!value) {
    // Empty value → treat as dismiss (= user opted to skip).
    _displayNamePromptDismiss();
    return;
  }
  try {
    const res = await dataSource.updateMyProfile(value);
    state.myProfile = state.myProfile || {};
    state.myProfile.display_name = (res && typeof res.display_name === 'string')
      ? res.display_name : value;
  } catch (_) {
    // Best-effort — even on error, mark dismissed so we don't spam.
  }
  _displayNamePromptDismiss();
}

function _displayNamePromptDismiss() {
  try {
    localStorage.setItem(
      'beacon_display_name_prompt_dismissed_at',
      new Date().toISOString()
    );
  } catch (_) { /* private mode — prompt will return on reload, acceptable */ }
  renderDisplayNamePrompt();
}

function _renderSettingsAgentsTab() {
  const treks = state.treks || [];
  const allSessions = state.onlineSessions || [];
  const filter = state.settingsFilterTrek || '';
  // Only show the caller's own sessions (= "My Agents & Treks" tab).
  // We filter by the auth email rather than trusting the server-side
  // endpoint to be strict — defense in depth.
  const myEmail = (state.auth && state.auth.email) || '';
  const mySessions = allSessions.filter(s => {
    const email = (s.actor && s.actor.email) || '';
    return !myEmail || email === myEmail;
  });
  const userTreks = (email) => {
    return treks.filter(t => (t.members || []).some(m => m.email === email
                                                      && m.joined_at));
  };
  const filtered = filter
    ? mySessions.filter(s => {
        const email = (s.actor && s.actor.email) || '';
        return userTreks(email).some(t => t.trek_id === filter);
      })
    : mySessions;
  const rowHtml = (s) => {
    const sid = s.session_id || '';
    const sidShort = _trekShortSessionId(sid);
    const email = (s.actor && s.actor.email) || '';
    const proj = s.project_name || s.project_id || '';
    const ts = (s.last_active || s.created_at || '').slice(0, 16).replace('T', ' ');
    const treksForSession = userTreks(email);
    const trekLabel = treksForSession.length
      ? treksForSession.map(t => t.title).join(' / ')
      : '—';
    const muted = !!s.shutdown;
    return `
      <tr class="${muted ? 'muted' : ''}">
        <td><span class="session-avatar"></span><span class="session-id">${esc(sidShort)}</span></td>
        <td>${esc(proj)}</td>
        <td>${esc(trekLabel)}</td>
        <td>${esc(ts)}</td>
      </tr>`;
  };
  return `
    <div class="settings-section">
      <div class="label" style="margin-bottom:4px;">
        ${esc(myEmail || 'You')} — online sessions
        <span class="beacon-tooltip" data-tooltip="Lists only your own online sessions. Filter by Trek. Leave a Trek from the terminal (beacon trek leave).">
          <span class="beacon-tooltip-icon">?</span>
        </span>
      </div>
      <div style="margin-bottom:12px;">
        <select id="settings-filter-trek" data-action="settings-set-filter-trek">
          <option value="">All</option>
          ${treks.map(t => `<option value="${esc(t.trek_id)}" ${filter === t.trek_id ? 'selected' : ''}>${esc(t.title || t.trek_id)}</option>`).join('')}
        </select>
      </div>
      <table class="settings-agents-table">
        <thead>
          <tr>
            <th style="width:30%">Session</th>
            <th>Project</th>
            <th>Trek</th>
            <th>Started / last active</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.length
            ? filtered.map(rowHtml).join('')
            : '<tr><td colspan="4" style="color:var(--text-dim);font-style:italic;text-align:center;padding:12px;">No sessions match this filter.</td></tr>'}
        </tbody>
      </table>
    </div>`;
}

function renderSettings() {
  const root = document.getElementById('settings-root');
  if (!root) return;
  root.classList.toggle('open', !!state.settingsOpen);
  if (!state.settingsOpen) { root.innerHTML = ''; return; }
  const tab = state.settingsTab || 'members';
  root.innerHTML = `
    <div class="settings-panel" onclick="event.stopPropagation()">
      <div class="settings-head">
        <div class="brand-block"><span style="font-size:1rem;">☰</span> Beacon <span class="label">Settings</span></div>
        <span class="spacer"></span>
        <button class="settings-close" data-action="close-settings">×</button>
      </div>
      <div class="settings-tabs">
        <button class="tab ${tab === 'members' ? 'active' : ''}" data-action="settings-set-tab" data-tab="members">Projects &amp; Members</button>
        <button class="tab ${tab === 'agents' ? 'active' : ''}" data-action="settings-set-tab" data-tab="agents">My Agents &amp; Treks</button>
        <button class="tab ${tab === 'audit' ? 'active' : ''}" data-action="settings-set-tab" data-tab="audit">Audit</button>
      </div>
      ${tab === 'members'
        ? _renderSettingsMembersTab()
        : tab === 'audit'
        ? _renderSettingsAuditTab()
        : _renderSettingsAgentsTab()}
    </div>
  `;
  // Close on overlay click (= outside panel)
  root.addEventListener('click', (ev) => {
    if (ev.target === root) closeSettings();
  }, { once: true });
  root.querySelectorAll('[data-action]').forEach(el => {
    if (el.tagName === 'SELECT' && el.dataset.action === 'settings-switch-project') {
      el.addEventListener('change', handleAction);
    } else {
      el.addEventListener('click', handleAction);
    }
  });
  // Hook the trek filter dropdown
  const sel = document.getElementById('settings-filter-trek');
  if (sel) sel.addEventListener('change', (e) => {
    state.settingsFilterTrek = e.target.value;
    renderSettings();
  });
  // Members tab: load the project members directly into our slot.
  if (tab === 'members' && state.projectId) {
    _settingsLoadMemberList();
    // ms-78 e-1803 — Owner-only pending invitations list. Non-owner calls
    // return 403 and silently render nothing (see _settingsLoadInvitationList).
    if (state.myIsOwner) _settingsLoadInvitationList();
  }
  // Audit tab (ms-70 / e-1718): load DM approval history into its slot.
  // Same "load directly into target slot" pattern as the Members tab — the
  // initial renderSettings() shows a "Loading…" placeholder; the fetch
  // completes and we paint rows in place without re-rendering the whole
  // settings panel.
  if (tab === 'audit' && state.projectId) {
    _settingsLoadDmApprovalHistory();
  }
}

// Settings > Members: fetch + render into #settings-member-list.
// Only owner sees role-change / remove controls; editor / viewer see the
// member list as read-only. The list reflects the **viewed** project
// (= settings dropdown selection), not necessarily the currently-opened one.
async function _settingsLoadMemberList() {
  const dst = document.getElementById('settings-member-list');
  if (!dst) return;
  const pid = _settingsViewedProjectId();
  if (!pid) {
    dst.innerHTML = '<div class="menu-user" style="color:var(--text-dim);">No project selected.</div>';
    return;
  }
  try {
    const data = await dataSource.loadProjectMembers(pid);
    const myEmail = (state.auth && state.auth.email) || '';
    // Confirm owner-grant via both myRole resolution AND server-reported
    // owner email — defense in depth.
    const isOwner = (state.myIsOwner === true)
      && !!myEmail && data.owner_email === myEmail;
    // ms-78 e-1807 — render a human-friendly label: display_name (large)
    // + email (small dim). When display_name is empty we fall back to email
    // alone, matching the legacy view.
    const renderName = (displayName, email) => {
      const dn = (displayName || '').trim();
      if (!dn) return esc(email || '');
      return `${esc(dn)} <span style="color:var(--text-dim);font-size:0.65rem;">${esc(email || '')}</span>`;
    };
    let html = '';
    if (data.owner_email) {
      html += `
        <div class="settings-member-row">
          <span class="email">${renderName(data.owner_display_name, data.owner_email)}${data.owner_email === myEmail ? ' <span style="color:var(--text-dim);font-size:0.6rem;">(you)</span>' : ''}</span>
          <span class="role-tag">owner</span>
          <span></span>
        </div>`;
    }
    for (const m of (data.members || [])) {
      const isMe = m.email === myEmail;
      html += `
        <div class="settings-member-row">
          <span class="email">${renderName(m.display_name, m.email)}${isMe ? ' <span style="color:var(--text-dim);font-size:0.6rem;">(you)</span>' : ''}</span>
          ${isOwner
            ? `<select data-action="settings-change-role" data-email="${esc(m.email)}"
                       style="background:var(--bg-surface);border:1px solid var(--border);color:var(--text-primary);font-size:0.7rem;padding:1px 4px;border-radius:3px;cursor:pointer;">
                 <option value="viewer" ${m.role === 'viewer' ? 'selected' : ''}>viewer</option>
                 <option value="editor" ${m.role === 'editor' ? 'selected' : ''}>editor</option>
               </select>`
            : `<span class="role-tag" style="color:var(--text-dim);">${esc(m.role)}</span>`}
          ${isOwner
            ? `<span class="x" data-action="settings-remove-member" data-email="${esc(m.email)}">×</span>`
            : '<span></span>'}
        </div>`;
    }
    if (!html) {
      html = '<div class="menu-user" style="color:var(--text-dim);">No members.</div>';
    }
    dst.innerHTML = html;
    dst.querySelectorAll('[data-action]').forEach(el => {
      const act = el.dataset.action;
      if (act === 'settings-change-role') {
        el.addEventListener('change', _settingsChangeRole);
      } else if (act === 'settings-remove-member') {
        el.addEventListener('click', _settingsRemoveMember);
      }
    });
  } catch (e) {
    dst.innerHTML = `<div class="menu-user" style="color:var(--text-dim);">Failed to load members (${esc(e.message || 'error')}).</div>`;
  }
}

// ms-78 e-1803 — Token-based invitation. Owner submits email + role; server
// returns a one-shot plaintext token + URL. We surface the URL with a copy
// button so the inviter can paste it into Slack / email / DM.
//
// The legacy "directly add an existing Beacon user as member" path is
// deliberately replaced — invitations now go through the /join/<token>
// landing flow so the invitee gets the Claude Code setup prompt (UC11-F6).
async function _settingsInviteMember() {
  const emailEl = document.getElementById('settings-invite-email');
  const roleEl = document.getElementById('settings-invite-role');
  const msg = document.getElementById('settings-invite-msg');
  const urlBox = document.getElementById('settings-invite-url-box');
  const email = (emailEl && emailEl.value || '').trim();
  const role = (roleEl && roleEl.value) || 'viewer';
  const pid = _settingsViewedProjectId();
  if (!email) { if (msg) msg.textContent = 'email is required'; return; }
  if (msg) msg.textContent = 'Generating invite URL…';
  try {
    const res = await dataSource.createInvitation(pid, email, role);
    const url = res.url || '';
    if (msg) msg.textContent =
      `Invite URL for ${esc(email)} (${esc(role)}) — expires ${(res.expires_at || '').slice(0,10)}`;
    if (emailEl) emailEl.value = '';
    if (urlBox) {
      urlBox.style.display = 'block';
      urlBox.innerHTML = `
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
          <span style="flex:1;min-width:200px;">${esc(url)}</span>
          <button data-action="settings-copy-invite-url" data-url="${esc(url)}"
                  style="background:var(--accent);color:#000;border:0;padding:4px 10px;
                         border-radius:3px;font-family:var(--font-mono);font-size:0.7rem;
                         cursor:pointer;">Copy</button>
        </div>
        <div style="margin-top:6px;color:var(--text-dim);font-size:0.65rem;line-height:1.4;">
          Share this link with ${esc(email)} to add them as a Beacon project member.
          (GitHub repo access is separate — use <code>gh repo edit --add-collaborator</code>.)
          The link is shown only once. If you lose it, cancel and regenerate.
        </div>
      `;
      // Hook the copy button (innerHTML resets data-action wires).
      const copyBtn = urlBox.querySelector('[data-action="settings-copy-invite-url"]');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(url);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
          } catch (_) {
            copyBtn.textContent = '(copy failed — select manually)';
          }
        });
      }
    }
    _settingsLoadInvitationList();
  } catch (e) {
    if (msg) msg.textContent = e.message || 'Error';
  }
}

// ms-78 e-1803 — Pending invitations list. Owner-only. Each row shows email,
// role, who issued it, and an x button to cancel.
async function _settingsLoadInvitationList() {
  const dst = document.getElementById('settings-invitation-list');
  if (!dst) return;
  const pid = _settingsViewedProjectId();
  if (!pid) { dst.innerHTML = ''; return; }
  try {
    const data = await dataSource.listInvitations(pid);
    const items = data.invitations || [];
    if (!items.length) {
      dst.innerHTML = '';
      return;
    }
    let html = `
      <div style="font-size:0.7rem;color:var(--text-dim);
                  margin:0 0 4px;text-transform:uppercase;letter-spacing:0.04em;">
        Pending invitations
      </div>`;
    for (const inv of items) {
      const exp = (inv.expires_at || '').slice(0, 10);
      html += `
        <div class="settings-member-row" style="opacity:0.85;">
          <span class="email">${esc(inv.email)}
            <span style="color:var(--text-dim);font-size:0.6rem;">expires ${esc(exp)}</span>
          </span>
          <span class="role-tag" style="color:var(--text-dim);">${esc(inv.role)}</span>
          <span class="x" data-action="settings-cancel-invitation"
                data-id="${esc(inv.id)}"
                title="Cancel invitation">×</span>
        </div>`;
    }
    dst.innerHTML = html;
    dst.querySelectorAll('[data-action="settings-cancel-invitation"]').forEach(el => {
      el.addEventListener('click', _settingsCancelInvitation);
    });
  } catch (e) {
    // Non-owner callers get 403 — silently render nothing (handled by isOwner gate).
    dst.innerHTML = '';
  }
}

async function _settingsCancelInvitation(ev) {
  const id = ev.currentTarget.dataset.id;
  if (!id) return;
  if (!window.confirm('Cancel this invitation?')) return;
  const pid = _settingsViewedProjectId();
  try {
    await dataSource.cancelInvitation(pid, id);

    window.alert(e.message || 'Error');

}

async function _settingsChangeRole(e) {

async function _settingsRemoveMember(e) {

  const pid = _settingsViewedProjectId();

async function _settingsArchiveProject() {
  // Archive acts on the project currently visible in Settings (= dropdown
  // selection), which may be the active project or one the user is peeking at.
  const pid = _settingsViewedProjectId();
  if (!pid) return;
  const isViewingActive = (pid === state.projectId);
  const targetArchived = isViewingActive
    ? !!(state.project && state.project.archived)
    : false;  // Without loading the target project's archived flag here we
              // assume not-archived; the server enforces correctness.
  const action = targetArchived ? 'unarchive' : 'archive';
  if (!window.confirm(`${action === 'archive' ? 'Archive' : 'Unarchive'} project "${pid}"?`)) return;
  try {
    await dataSource.setProjectArchived(pid, action);
    if (isViewingActive) {
      // Active project changed archived state — refresh project list, reload
      // current project, close settings so the user sees the result.
      if (typeof dataSource.loadProjects === 'function') {
        try { await dataSource.loadProjects(); } catch (_e) {}
      }
      if (typeof loadProject === 'function') {
        try { await loadProject(); } catch (_e) {}
      }
      closeSettings();
      render();
    } else {
      // Peeked project: refresh own project list so archived flag updates,
      // then repaint settings (still viewing peeked project).
      if (typeof dataSource.loadProjects === 'function') {
        try { await dataSource.loadProjects(); } catch (_e) {}
      }
      renderSettings();
    }
  } catch (err) {
    window.alert(err.message || 'Error');
  }
}
