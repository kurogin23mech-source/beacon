<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beacon Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ============================================================
     SHARED CSS (identical to server/static/index.html)
     ============================================================ -->
<style>
:root {
  --bg-void: #0a0a0c; --bg-surface: #111114; --bg-raised: #18181c; --bg-hover: #1f1f24;
  --border: #2a2a30; --border-subtle: #1e1e24;
  --text-primary: #e4e4e8; --text-secondary: #a1a1aa; --text-dim: #71717a;
  --accent: #4ade80; --accent-dim: #166534; --accent-glow: rgba(74, 222, 128, 0.08);
  --warning: #fbbf24; --info: #60a5fa;
  --done: #4ade80; --in-progress: #60a5fa; --observing: #a78bfa; --todo: #71717a; --waiting: #f97316; --cancelled: #ef4444;
  --save: #c084fc;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace; --font-body: 'IBM Plex Mono', monospace;
  --scanline-opacity: 0.03;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; -webkit-font-smoothing: antialiased; }
body { background: var(--bg-void); color: var(--text-primary); font-family: var(--font-body); font-weight: 400; line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
body::after { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,var(--scanline-opacity)) 2px, rgba(0,0,0,var(--scanline-opacity)) 4px); pointer-events: none; z-index: 9999; }
.container { max-width: 960px; margin: 0 auto; padding: 0 24px; }
.header { padding: 40px 0 32px; border-bottom: 1px solid var(--border); position: relative; }
.header::before { content: ''; position: absolute; bottom: -1px; left: 0; width: 120px; height: 1px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.project-name { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
.header-tag { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.connection-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-dim); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse-dot 2s ease-in-out infinite; }
.status-dot.offline { background: var(--cancelled); box-shadow: 0 0 6px var(--cancelled); animation: none; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.summary-block { padding: 20px 0; border-bottom: 1px solid var(--border-subtle); }
.summary-label { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.summary-text { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.7; }
.filter-bar { display: flex; gap: 6px; padding: 16px 0 0; flex-wrap: wrap; align-items: center; }
.filter-btn { font-family: var(--font-mono); font-size: 0.75rem; padding: 4px 10px; border: 1px solid var(--border-subtle); border-radius: 3px; background: transparent; cursor: pointer; transition: all 0.2s; }
.filter-btn.on { border-color: var(--accent-dim); color: var(--accent); background: var(--accent-glow); }
.filter-btn.on.f-todo { color: var(--todo); border-color: var(--todo); background: rgba(113,113,122,0.08); }
.filter-btn.on.f-active { color: var(--in-progress); border-color: rgba(96,165,250,0.4); background: rgba(96,165,250,0.08); }
.filter-btn.on.f-observing { color: var(--observing); border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }
.filter-btn.on.f-done { color: var(--done); border-color: var(--accent-dim); background: var(--accent-glow); }
.filter-btn.on.f-waiting { color: var(--waiting); border-color: rgba(249,115,22,0.4); background: rgba(249,115,22,0.08); }
.filter-btn.off { color: var(--text-dim); opacity: 0.4; }
.filter-btn.off:hover { opacity: 0.7; }
.sort-toggle { font-family: var(--font-mono); font-size: 0.75rem; padding: 4px 10px; border: 1px solid var(--border-subtle); border-radius: 3px; background: transparent; color: var(--text-dim); cursor: pointer; margin-left: auto; }
.sort-toggle:hover { border-color: var(--border); color: var(--text-secondary); }
.milestones { padding: 24px 0; }
.milestones-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.milestones-title { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
.milestones-count { font-size: 0.8rem; color: var(--text-dim); }
.ms-card { border: 1px solid var(--border-subtle); border-radius: 4px; margin-bottom: 8px; background: var(--bg-surface); transition: border-color 0.2s, background 0.2s; overflow: hidden; }
.ms-card:hover { border-color: var(--border); background: var(--bg-raised); }
.ms-card.active { border-color: var(--accent-dim); background: var(--accent-glow); }
.ms-card-header { padding: 12px 16px; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.ms-status-badge { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.ms-status-icon { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.ms-status-icon.done { background: var(--done); box-shadow: 0 0 4px rgba(74,222,128,0.3); }
.ms-status-icon.in_progress { background: var(--in-progress); box-shadow: 0 0 4px rgba(96,165,250,0.3); animation: pulse-dot 2s ease-in-out infinite; }
.ms-status-icon.observing { background: var(--observing); box-shadow: 0 0 4px rgba(167,139,250,0.3); }
.ms-status-icon.todo { background: var(--todo); }
.ms-status-icon.waiting { background: var(--waiting); }
.ms-status-icon.cancelled { background: var(--cancelled); }
.ms-status-text { font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500; }
.ms-status-text.done { color: var(--done); } .ms-status-text.in_progress { color: var(--in-progress); }
.ms-status-text.observing { color: var(--observing); } .ms-status-text.todo { color: var(--todo); }
.ms-status-text.waiting { color: var(--waiting); } .ms-status-text.cancelled { color: var(--cancelled); }
.ms-title-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.ms-id { font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; }
.ms-title { font-size: 0.9rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ms-meta { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.ms-progress-bar { width: 80px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.ms-progress-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.ms-progress-fill.done { background: var(--done); } .ms-progress-fill.in_progress { background: var(--in-progress); }
.ms-progress-fill.observing { background: var(--observing); } .ms-progress-fill.todo { background: var(--todo); }
.ms-progress-text { font-size: 0.75rem; color: var(--text-dim); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.ms-expand-hint { font-size: 0.65rem; color: var(--text-dim); transition: transform 0.2s; }
.ms-card.expanded .ms-expand-hint { transform: rotate(180deg); }
.ms-tasks-text { font-size: 0.75rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.ms-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.ms-card.expanded .ms-body { max-height: 8000px; }
.ms-entries { padding: 0 16px 12px; border-top: 1px solid var(--border-subtle); }
.ms-entries-toolbar { display: flex; align-items: center; padding: 8px 0 4px; gap: 8px; }
.entry-filter-btn { font-family: var(--font-mono); font-size: 0.65rem; padding: 2px 8px; border: 1px solid var(--border-subtle); border-radius: 2px; background: transparent; color: var(--text-dim); cursor: pointer; }
.entry-filter-btn:hover { border-color: var(--border); color: var(--text-secondary); }
.entry-filter-btn.active { border-color: var(--accent-dim); color: var(--accent); background: var(--accent-glow); }
.ms-description { padding: 8px 0 4px; color: var(--text-secondary); font-size: 0.85rem; font-style: italic; }
.entry { display: grid; grid-template-columns: auto auto 1fr auto; gap: 8px; padding: 6px 0; align-items: start; border-bottom: 1px solid var(--border-subtle); font-size: 0.85rem; }
.entry:last-child { border-bottom: none; }
.entry-type-badge { font-size: 0.65rem; font-weight: 500; padding: 1px 5px; border-radius: 2px; line-height: 1.8; white-space: nowrap; }
.entry-type-badge.commit { color: var(--accent); background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.15); }
.entry-type-badge.task { color: var(--info); background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.15); }
.entry-type-badge.note { color: var(--warning); background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.15); }
.entry-type-badge.save { color: var(--save); background: rgba(192,132,252,0.1); border: 1px solid rgba(192,132,252,0.15); }
.entry-type-badge.pr { color: #f97316; background: rgba(249,115,22,0.1); border: 1px solid rgba(249,115,22,0.15); }
.entry-pr-block { grid-column: 1 / -1; }
.entry-pr-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 0.7rem; color: var(--text-secondary); }
.entry-pr-decision { margin-top: 6px; padding: 5px 8px; border-left: 2px solid rgba(251,191,36,0.4); font-size: 0.72rem; line-height: 1.5; }
.entry-pr-decision-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 2px; }
.entry-pr-intent .entry-pr-decision-label { color: #60a5fa; }
.entry-pr-rationale-block .entry-pr-decision-label { color: #a3e635; }
.entry-pr-rationale-block { border-left-color: rgba(163,230,53,0.4); }
.entry-pr-status { font-weight: 500; }
.entry-pr-status.open { color: #60a5fa; } .entry-pr-status.in_review { color: #fb923c; }
.entry-pr-status.approved { color: #a3e635; } .entry-pr-status.merged { color: #a78bfa; }
.entry-pr-status.closed { color: var(--text-dim); }
.entry-id { font-size: 0.7rem; color: var(--text-dim); line-height: 1.8; }
.entry-desc { color: #f4f4f5; line-height: 1.6; }
.entry.done .entry-desc { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border); }
.entry.entry-type-commit.done .entry-desc { text-decoration: none; }
.entry-status-text { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.03em; text-transform: uppercase; margin-left: 4px; }
.entry-status-text.done { color: var(--done); } .entry-status-text.todo { color: var(--todo); } .entry-status-text.in_progress { color: var(--in-progress); }
.entry-status-text.in_review { color: #fb923c; } .entry-status-text.approved { color: #a3e635; } .entry-status-text.cancelled { color: var(--text-dim); }
.entry-date { font-size: 0.7rem; color: var(--text-dim); line-height: 1.8; white-space: nowrap; }
.entry-hash { font-size: 0.7rem; color: var(--accent-dim); margin-left: 4px; }
.entry-toggle { cursor: pointer; user-select: none; }
.entry-toggle .entry-desc::before { content: '\25BC '; font-size: 0.6rem; color: var(--text-dim); }
.entry-toggle.collapsed .entry-desc::before { content: '\25B6 '; }
.entry-type-commit.entry-toggle .entry-desc::before,
.entry-type-commit.entry-toggle.collapsed .entry-desc::before { content: none; }
.entry-child-count { font-size: 0.65rem; color: var(--accent); margin-left: 6px; padding: 1px 5px; background: var(--accent-dim); border: 1px solid var(--accent-dim); border-radius: 3px; }
.entry-detail { grid-column: 3 / -1; font-size: 0.8rem; color: var(--text-dim); padding: 4px 0 2px; line-height: 1.5; border-left: 2px solid var(--border-subtle); padding-left: 10px; margin-top: 2px; }
.entry-children { grid-column: 1 / -1; padding-left: 18px; }
.entry-children.hidden { display: none; }
.entry-children .entry { border-bottom-color: transparent; padding: 3px 0; }
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border-subtle); }
.tab-btn { font-family: var(--font-mono); font-size: 0.8rem; padding: 10px 20px; border: none; background: transparent; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--text-primary); border-bottom-color: var(--accent); }
.graph-section { padding: 24px 0; }
.graph-container { width: 100%; overflow-x: auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 16px; }
.graph-container svg { display: block; margin: 0 auto; }
.graph-node rect { rx: 6; ry: 6; stroke-width: 1.5; cursor: pointer; transition: filter 0.2s; }
.graph-node:hover rect { filter: brightness(1.3); }
.graph-node text { font-family: var(--font-mono); font-size: 11px; fill: var(--text-primary); pointer-events: none; }
.graph-node .node-id { font-size: 9px; fill: var(--text-dim); }
.graph-node .node-progress { font-size: 9px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
.graph-edge { fill: none; stroke: var(--border); stroke-width: 1.5; marker-end: url(#arrowhead); }
.graph-edge.cross-task { stroke-dasharray: 4 3; stroke: var(--text-dim); }
.graph-empty { color: var(--text-dim); text-align: center; padding: 48px 0; font-size: 0.85rem; }
.graph-legend { display: flex; gap: 16px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
.graph-legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-dim); }
.graph-legend-swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
.retro-section { padding: 24px 0; }
.retro-list { list-style: none; }
.retro-item { padding: 10px 16px; border: 1px solid var(--border-subtle); border-radius: 4px; margin-bottom: 6px; cursor: pointer; background: var(--bg-surface); transition: border-color 0.2s, background 0.2s; display: flex; justify-content: space-between; align-items: center; }
.retro-item:hover { border-color: var(--border); background: var(--bg-raised); }
.retro-item-week { font-size: 0.9rem; color: var(--text-primary); }
.retro-item-date { font-size: 0.75rem; color: var(--text-dim); }
/* ---- Narrow window (side-by-side with terminal) ---- */
@media (max-width: 500px) {
  .container { padding: 0 12px; }
  .header { padding: 20px 0 14px; }
  .project-name { font-size: 1.1rem; }
  .header-tag { display: none; }
  .tab-btn { padding: 8px 10px; font-size: 0.72rem; }
  .ms-status-text { display: none; }
  .ms-progress-bar { width: 48px; }
  .ms-meta { gap: 8px; }
  .ms-card-header { padding: 10px 12px; gap: 8px; }
  .ms-title { font-size: 0.82rem; }
  .sort-toggle { display: none; }
  .milestones-header { flex-wrap: wrap; gap: 6px; }
  .entry { grid-template-columns: auto 1fr auto; gap: 4px; font-size: 0.8rem; }
  .entry-id { display: none; }
  .entry-date { display: none; }
  .summary-text { font-size: 0.82rem; }
  .milestones { padding: 16px 0; }
}
@media (max-width: 420px) {
  .ms-progress-bar { display: none; }
  .ms-progress-text { display: none; }
  .filter-bar { gap: 4px; }
  .filter-btn { padding: 3px 7px; font-size: 0.7rem; }
}
.retro-content { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 20px; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.7; color: var(--text-secondary); max-height: 70vh; overflow-y: auto; }
.doc-content { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 20px 24px; font-size: 0.85rem; line-height: 1.8; color: var(--text-secondary); max-height: 70vh; overflow-y: auto; }
.doc-content h1, .doc-content h2, .doc-content h3, .doc-content h4 { color: var(--text-primary); font-weight: 600; margin: 1.2em 0 0.4em; }
.doc-content h1 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.doc-content h2 { font-size: 0.95rem; } .doc-content h3 { font-size: 0.88rem; }
.doc-content p { margin: 0 0 0.8em; } .doc-content ul, .doc-content ol { margin: 0 0 0.8em; padding-left: 1.6em; } .doc-content li { margin-bottom: 0.25em; }
.doc-content code { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 0.8em; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
.doc-content pre { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; overflow-x: auto; margin: 0 0 0.8em; }
.doc-content pre code { background: none; border: none; padding: 0; color: var(--text-secondary); }
.doc-content blockquote { border-left: 3px solid var(--accent-dim); margin: 0 0 0.8em; padding: 4px 0 4px 12px; color: var(--text-dim); }
.doc-content a { color: var(--info); text-decoration: underline; } .doc-content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.doc-content table { border-collapse: collapse; width: 100%; margin: 0 0 0.8em; font-size: 0.82rem; }
.doc-content th { color: var(--text-primary); border-bottom: 1px solid var(--border); padding: 4px 8px; text-align: left; } .doc-content td { border-bottom: 1px solid var(--border-subtle); padding: 4px 8px; }
.doc-content strong { color: var(--text-primary); }
.retro-back { font-size: 0.8rem; color: var(--text-dim); cursor: pointer; margin-bottom: 12px; display: inline-block; }
.retro-back:hover { color: var(--text-secondary); }
.retro-empty { text-align: center; padding: 40px 0; color: var(--text-dim); font-size: 0.85rem; }
.footer { padding: 24px 0 40px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
.footer-left { font-size: 0.75rem; color: var(--text-dim); } .footer-tagline { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }
.footer-right { font-size: 0.75rem; color: var(--text-dim); }
.loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; flex-direction: column; gap: 16px; }
.loading-bar { width: 120px; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
.loading-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 1px; animation: loading-slide 1.2s ease-in-out infinite; }
@keyframes loading-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
.loading-text { font-size: 0.8rem; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.fade-in { animation: fade-in 0.4s ease both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; } .stagger-3 { animation-delay: 0.15s; }
.project-item { padding: 12px 16px; border: 1px solid var(--border-subtle); border-radius: 4px; margin-bottom: 6px; cursor: pointer; background: var(--bg-surface); transition: border-color 0.2s, background 0.2s; }
.project-item:hover { border-color: var(--accent-dim); background: var(--accent-glow); }
.project-item-name { font-size: 0.95rem; color: var(--text-primary); }
.project-item-id { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
.open-prompt { display: flex; align-items: center; justify-content: center; min-height: 80vh; flex-direction: column; gap: 16px; }
.hamburger-btn { background: none; border: 1px solid transparent; border-radius: 3px; cursor: pointer; padding: 4px 6px; display: flex; flex-direction: column; gap: 3px; transition: border-color 0.2s; }
.hamburger-btn:hover { border-color: var(--border); }
.hamburger-btn span { display: block; width: 16px; height: 1.5px; background: var(--text-dim); transition: background 0.2s; }
.hamburger-btn:hover span { background: var(--text-secondary); }
.menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; animation: fade-overlay 0.15s ease; }
@keyframes fade-overlay { from { opacity: 0; } to { opacity: 1; } }
.menu-panel { position: fixed; top: 0; left: 0; width: 300px; max-width: 80vw; height: 100vh; background: var(--bg-surface); border-right: 1px solid var(--border); z-index: 1001; padding: 24px; overflow-y: auto; animation: slide-in 0.2s ease; }
@keyframes slide-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle); }
.menu-title { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
.menu-close { background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; padding: 4px 8px; }
.menu-close:hover { color: var(--text-primary); }
.menu-section { margin-bottom: 20px; }
.menu-section-title { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.menu-item { display: block; width: 100%; padding: 8px 12px; border: 1px solid var(--border-subtle); border-radius: 4px; margin-bottom: 4px; cursor: pointer; background: transparent; color: var(--text-secondary); font-family: var(--font-body); font-size: 0.85rem; text-align: left; transition: all 0.2s; }
.menu-item:hover { border-color: var(--border); background: var(--bg-raised); color: var(--text-primary); }
.menu-item.current { border-color: var(--accent-dim); color: var(--accent); }
.menu-item-sub { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="loading"><div class="loading-bar"></div><div class="loading-text">Loading</div></div>
</div>
<div id="menu-root"></div>

<script>
// ============================================================
// DESKTOP-SPECIFIC: Data layer (Tauri invoke)
// ============================================================
const { invoke } = window.__TAURI__.core;

let pollTimer = null;
let lastProjectJson = null;
let cloudMode = false;  // true when viewing a cloud project

async function loadProject() {
  try {
    let json;
    if (cloudMode && state.cloudProjectId) {
      json = await invoke('cloud_load_project', { projectId: state.cloudProjectId });
    } else {
      json = await invoke('load_project_json');
    }
    if (!json) return;
    const data = JSON.parse(json);
    const newJson = JSON.stringify(data);
    if (newJson !== lastProjectJson) {
      lastProjectJson = newJson;
      state.project = data;
      state.lastUpdate = new Date();
      state.connected = true;
      state.error = null;
      render();
    }
  } catch (e) {
    if (!state.error) {
      state.error = String(e);
      state.connected = false;
      stopPolling();
      stopWatcher();
      renderProjectSelector();
    }
  }
}

async function loadDocuments() {
  try {
    if (cloudMode) {
      const json = await invoke('cloud_list_documents');
      state.documents = JSON.parse(json);
    } else {
      const json = await invoke('get_documents', { scope: '' });
      state.documents = JSON.parse(json);
    }
  } catch (e) { state.documents = []; }
}

async function loadRetros() {
  try {
    if (cloudMode) {
      const json = await invoke('cloud_list_retros');
      state.retros = JSON.parse(json);
    } else {
      const json = await invoke('list_retros');
      state.retros = JSON.parse(json);
    }
  } catch (e) { state.retros = []; }
}

async function loadRetroContent(week) {
  try {
    if (cloudMode) {
      const json = await invoke('cloud_get_retro', { week });
      state.retroContent = JSON.parse(json);
    } else {
      const json = await invoke('get_retro_content', { week });
      state.retroContent = JSON.parse(json);
    }
  } catch (e) { state.retroContent = { week, content: 'Failed to load.' }; }
  render();
}

async function loadDocumentContent(docId) {
  try {
    if (cloudMode) {
      const json = await invoke('cloud_get_document', { docId });
      const doc = JSON.parse(json);
      state.documentContent = doc;
    } else {
      const content = await invoke('get_document_content', { docId });
      let title = docId, scope = 'memo', body = content;
      if (content.startsWith('---')) {
        const parts = content.split('---', 3);
        if (parts.length >= 3) {
          for (const line of parts[1].trim().split('\n')) {
            if (line.startsWith('scope:')) scope = line.split(':',2)[1].trim();
          }
          body = parts[2].trim();
        }
      }
      const m = body.match(/^# (.+)/m);
      if (m) title = m[1];
      state.documentContent = { doc_id: docId, title, scope, content: body };
    }
  } catch (e) {
    state.documentContent = { doc_id: docId, title: 'Error', scope: 'memo', content: String(e) };
  }
  render();
}

function startPolling() { if (!pollTimer) pollTimer = setInterval(loadProject, 2000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

let unlistenWatcher = null;
async function startWatcher() {
  if (unlistenWatcher) return;
  if (window.__TAURI__ && window.__TAURI__.event) {
    unlistenWatcher = await window.__TAURI__.event.listen('beacon-changed', () => loadProject());
  }
}
function stopWatcher() { if (unlistenWatcher) { unlistenWatcher(); unlistenWatcher = null; } }

async function doSelectCloudProject(projectId) {
  cloudMode = true;
  state.cloudProjectId = projectId;
  state.error = null; state.project = null; state.expanded.clear();
  state.documents = []; state.documentContent = null;
  state.retros = []; state.retroContent = null;
  state.activeTab = 'dashboard'; lastProjectJson = null;
  state.projectPath = 'cloud:' + projectId;
  try {
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startPolling();
    }
  } catch (e) { state.error = String(e); renderProjectSelector(); }
}

async function doSelectProject(path) {
  try {
    cloudMode = false;
    state.cloudProjectId = null;
    stopPolling(); stopWatcher();
    await invoke('set_project_dir', { dir: path });
    state.error = null; state.project = null; state.expanded.clear();
    state.documents = []; state.documentContent = null;
    state.retros = []; state.retroContent = null;
    state.activeTab = 'dashboard'; lastProjectJson = null;
    state.projectPath = path;
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startWatcher();
    }
  } catch (e) { state.error = String(e); renderProjectSelector(); }
}

async function renderProjectSelector() {
  const app = document.getElementById('app');
  let localProjects = [];
  let cloudProjects = [];
  let authenticated = false;
  try { localProjects = await invoke('list_projects'); } catch (e) {}
  try { authenticated = await invoke('is_authenticated'); } catch (e) {}
  if (authenticated) {
    try {
      const json = await invoke('cloud_list_projects');
      cloudProjects = JSON.parse(json);
    } catch (e) {
      console.error('cloud_list_projects error:', e);
      // Show error in UI for debugging
      state.cloudError = String(e);
    }
  }
  const localOnly = localProjects.filter(p => p.mode === 'local');

  app.innerHTML = `
    <div class="open-prompt fade-in">
      <h1 style="font-family:var(--font-mono);font-size:2rem;font-weight:700;">Beacon</h1>
      <p style="font-size:0.8rem;color:var(--text-dim);font-style:italic;">Where humans and AI are bound together.</p>
      ${state.error ? `<p style="font-size:0.75rem;color:var(--cancelled);">${esc(state.error)}</p>` : ''}
      <div style="width:100%;max-width:480px;margin-top:24px;">
        ${localOnly.length > 0 ? `<div class="summary-label">Local Projects</div>
          ${localOnly.map(p => `<div class="project-item" data-action="select-project" data-path="${esc(p.path)}"><div class="project-item-name">${esc(p.name)}</div><div class="project-item-id">${esc(p.path)}</div></div>`).join('')}` : ''}
        ${cloudProjects.length > 0 ? `<div class="summary-label" style="margin-top:16px;">Cloud Projects</div>
          ${cloudProjects.map(p => `<div class="project-item" data-action="select-cloud-project" data-project-id="${esc(p.project_id)}"><div class="project-item-name">${esc(p.name)} <span style="font-size:0.65rem;color:var(--info)">cloud</span></div><div class="project-item-id">${esc(p.project_id)}</div></div>`).join('')}` : ''}
        ${!authenticated && localOnly.length === 0 ? `<p style="color:var(--text-dim);font-size:0.8rem;margin-top:12px;">Run <code style="color:var(--accent)">beacon auth login</code> to access cloud projects,<br>or <code style="color:var(--accent)">beacon init</code> to create a local project.</p>` : ''}
        ${state.cloudError ? `<p style="color:var(--warning);font-size:0.75rem;margin-top:12px;">Cloud error: ${esc(state.cloudError)}<br><span style="color:var(--text-dim);">Run <code style="color:var(--accent)">beacon auth login</code> to refresh.</span></p>` : ''}
        ${state.cloudDiag ? `<pre style="color:var(--text-dim);font-size:0.65rem;margin-top:8px;white-space:pre-wrap;border:1px solid var(--border);padding:8px;border-radius:3px;">${esc(state.cloudDiag)}</pre>` : ''}
        <button data-action="cloud-diagnose" style="margin-top:12px;font-size:0.7rem;padding:3px 10px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text-dim);cursor:pointer;font-family:inherit;">Diagnose cloud</button>
      </div>
    </div>`;
  bindEvents();
}

// ============================================================
// SHARED: State & helpers (from Web UI)
// ============================================================
let state = {
  project: null, expanded: new Set(), lastUpdate: null, connected: false, error: null,
  activeTab: 'dashboard', documents: [], documentContent: null,
  retros: [], retroContent: null,
  hiddenStatuses: new Set(), hideEntryDone: new Set(), collapsedEntries: new Set(), sortAsc: true,
  showGraph: false, graphFilterDeps: true,
  cloudDiag: null,
};

const STATUS_LABELS = { done: 'done', in_progress: 'active', observing: 'observing', todo: 'todo', waiting: 'waiting', cancelled: 'cancelled', in_review: 'in review', approved: 'approved' };
const FILTER_ORDER = ['todo', 'in_progress', 'observing', 'waiting', 'done'];
const FILTER_CSS = { todo: 'f-todo', in_progress: 'f-active', observing: 'f-observing', waiting: 'f-waiting', done: 'f-done' };

function esc(s) { if (!s) return ''; const el = document.createElement('span'); el.textContent = s; return el.innerHTML; }
function formatTime(d) { return d ? d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : ''; }
function msIdNum(ms) { const m = ms.id.match(/(\d+)/); return m ? parseInt(m[1]) : 0; }
function sortMilestones(ms) { return [...ms].sort((a,b) => state.sortAsc ? msIdNum(a)-msIdNum(b) : msIdNum(b)-msIdNum(a)); }
function filterMilestones(ms) { return state.hiddenStatuses.size === 0 ? ms : ms.filter(m => !state.hiddenStatuses.has(m.status)); }
function countTasks(entries) { let t=0,d=0; for(const e of entries){if(e.type==='task'){t++;if(e.status==='done')d++;}if(e.entries){const c=countTasks(e.entries);t+=c.total;d+=c.done;}} return{total:t,done:d}; }
function statusBadge(s) { return `<div class="ms-status-badge"><div class="ms-status-icon ${s}"></div><span class="ms-status-text ${s}">${STATUS_LABELS[s]||s}</span></div>`; }
function entryTypeBadge(t) { return `<span class="entry-type-badge ${t}">${t}</span>`; }
function entryStatusText(e) {
  if (e.type==='commit'||e.type==='save'||e.type==='pr') return '';
  return `<span class="entry-status-text ${e.status}">${STATUS_LABELS[e.status]||e.status}</span>`;
}

// ============================================================
// SHARED: Rendering (from Web UI, onclick removed → data-action)
// ============================================================
let _currentMsId = null;

function renderEntry(entry) {
  if (_currentMsId && state.hideEntryDone.has(_currentMsId) && (entry.status === 'done' || entry.status === 'cancelled')) return '';
  const statusClass = entry.status === 'done' ? ' done' : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0,7)}</span>` : '';
  const src = entry.type==='save'&&entry.meta?.source ? `<span class="entry-hash">[${esc(entry.meta.source)}]</span>` : '';
  const detail = entry.detail ? `<div class="entry-detail">${esc(entry.detail)}</div>` : '';
  let prMeta = '';
  if (entry.type === 'pr' && entry.meta) {
    const m = entry.meta;
    const prStatus = m.pr_status || 'open';
    const reviewStatus = m.review_status ? ` · review: ${m.review_status}` : '';
    const url = m.url ? ` · <a href="${esc(m.url)}" target="_blank" rel="noopener" style="color:inherit;opacity:0.7;">${esc(m.url.replace(/.*\/pull\//, '#'))}</a>` : '';
    const intent = m.intent
      ? `<div class="entry-pr-decision entry-pr-intent"><div class="entry-pr-decision-label">intent</div>${esc(m.intent)}</div>`
      : '';
    const rationale = m.review_rationale
      ? `<div class="entry-pr-decision entry-pr-rationale-block"><div class="entry-pr-decision-label">rationale</div>${esc(m.review_rationale)}</div>`
      : '';
    prMeta = `<div class="entry-pr-block"><div class="entry-pr-meta"><span class="entry-pr-status ${prStatus}">${prStatus}${reviewStatus}</span>${url}</div>${intent}${rationale}</div>`;
  }
  const hasKids = entry.entries?.length > 0;
  const collapsed = state.collapsedEntries.has(entry.id);
  const toggle = hasKids ? ` entry-toggle${collapsed?' collapsed':''}` : '';
  let kids = '';
  if (hasKids) kids = `<div class="entry-children${collapsed?' hidden':''}">${entry.entries.map(renderEntry).join('')}</div>`;
  const badge = hasKids && collapsed ? `<span class="entry-child-count">${entry.entries.length}</span>` : '';
  return `<div class="entry entry-type-${entry.type}${statusClass}${toggle}" ${hasKids?`data-action="toggle-entry" data-entry-id="${entry.id}"`:''}>
    ${entryTypeBadge(entry.type)}<span class="entry-id">${entry.id}</span>
    <span class="entry-desc">${esc(entry.description)}${hash}${src}${entryStatusText(entry)}${badge}</span>
    <span class="entry-date">${entry.created_at||''}</span>${prMeta}${detail}${kids}
  </div>`;
}

function renderMilestoneCard(ms) {
  const expanded = state.expanded.has(ms.id);
  const entries = ms.entries || [];
  const {total, done} = countTasks(entries);
  const tasksLabel = total > 0 ? `${done}/${total}` : '';
  let body = '';
  if (expanded && (entries.length > 0 || ms.description)) {
    _currentMsId = ms.id;
    const rendered = entries.map(renderEntry).join('');
    _currentMsId = null;
    const hasDone = entries.some(e => e.status==='done' || e.status==='cancelled');
    const hiding = state.hideEntryDone.has(ms.id);
    body = `<div class="ms-entries">
      ${hasDone ? `<div class="ms-entries-toolbar"><button class="entry-filter-btn ${hiding?'active':''}" data-action="toggle-hide-done" data-ms-id="${ms.id}">${hiding?'show done':'hide done'}</button></div>` : ''}
      ${ms.description ? `<div class="ms-description">${esc(ms.description)}</div>` : ''}
      ${rendered}</div>`;
  }
  return `<div class="ms-card${ms.status==='in_progress'?' active':''}${expanded?' expanded':''}">
    <div class="ms-card-header" data-action="toggle-ms" data-ms-id="${ms.id}">
      ${statusBadge(ms.status)}
      <div class="ms-title-row"><span class="ms-id">${ms.id}</span><span class="ms-title">${esc(ms.title)}</span></div>
      <div class="ms-meta">
        ${tasksLabel?`<span class="ms-tasks-text">${tasksLabel}</span>`:''}
        <div class="ms-progress-bar"><div class="ms-progress-fill ${ms.status}" style="width:${ms.progress||0}%"></div></div>
        <span class="ms-progress-text">${ms.progress||0}%</span>
        ${entries.length>0?'<span class="ms-expand-hint">\u25BE</span>':''}
      </div>
    </div>
    <div class="ms-body">${body}</div>
  </div>`;
}

function scopeBadge(s) {
  const c = {core:'background:var(--accent);color:#fff;',spec:'background:var(--border);color:var(--text-primary);',memo:'background:transparent;color:var(--text-secondary);border:1px solid var(--border);'};
  return `<span style="display:inline-block;font-size:0.65rem;padding:1px 6px;border-radius:3px;margin-right:6px;${c[s]||c.memo}">${(s||'memo').toUpperCase()}</span>`;
}

function renderDocumentsSection() {
  if (state.documentContent) {
    const copyBtn = cloudMode && state.cloudProjectId
      ? `<button data-action="copy-doc-link" data-doc-id="${esc(state.documentContent.doc_id)}" style="float:right;font-size:0.72rem;padding:3px 10px;background:var(--bg-raised);border:1px solid var(--border);border-radius:3px;color:var(--text-secondary);cursor:pointer;font-family:inherit;">Copy web link</button>`
      : '';
    return `<section class="retro-section fade-in">
      <span class="retro-back" data-action="close-document">\u2190 back</span>
      ${copyBtn}
      <h3 style="font-size:1rem;color:var(--text-primary);margin:8px 0 16px;">${scopeBadge(state.documentContent.scope)}${esc(state.documentContent.title)}</h3>
      <div class="doc-content">${marked.parse(state.documentContent.content || '')}</div>
    </section>`;
  }
  if (state.documents.length === 0) return `<section class="retro-section fade-in"><div class="retro-empty">No documents yet.</div></section>`;
  const order = ['core','spec','memo'], grouped = {};
  for (const s of order) grouped[s] = [];
  for (const d of state.documents) { (grouped[d.scope||'memo'] = grouped[d.scope||'memo']||[]).push(d); }
  const labels = {core:'\u2605 CORE',spec:'\u25CB SPEC',memo:'\u25CB MEMO'};
  let html = '';
  for (const s of order) {
    if (!grouped[s]||grouped[s].length===0) continue;
    html += `<section class="retro-section fade-in" style="margin-bottom:12px;">
      <h4 style="font-size:0.75rem;color:var(--text-secondary);margin:0 0 6px;letter-spacing:0.05em;">${labels[s]}</h4>
      <ul class="retro-list">${grouped[s].map(d => `<li class="retro-item" data-action="open-document" data-doc-id="${esc(d.doc_id)}"><span class="retro-item-week">${esc(d.title)}</span><span class="retro-item-date">${d.updated_at?d.updated_at.slice(0,10):''}</span></li>`).join('')}</ul>
    </section>`;
  }
  return html;
}

function renderRetrosSection() {
  if (state.retroContent) {
    return `<section class="retro-section fade-in">
      <span class="retro-back" data-action="close-retro">\u2190 back</span>
      <h3 style="font-size:1rem;color:var(--text-primary);margin:8px 0 16px;">${esc(state.retroContent.week)}</h3>
      <div class="retro-content">${esc(state.retroContent.content)}</div>
    </section>`;
  }
  if (state.retros.length === 0) return `<section class="retro-section fade-in"><div class="retro-empty">No review documents yet.</div></section>`;
  return `<section class="retro-section fade-in"><ul class="retro-list">
    ${state.retros.map(r => `<li class="retro-item" data-action="open-retro" data-week="${esc(r.week)}"><span class="retro-item-week">${esc(r.week)}</span><span class="retro-item-date">${r.updated_at?r.updated_at.slice(0,10):''}</span></li>`).join('')}
  </ul></section>`;
}

// ---- Dependency Graph ----

function buildGraph(milestones) {
  const nodes = [], edges = [], idSet = new Set();
  for (const ms of milestones) {
    if (ms.status === 'cancelled') continue;
    idSet.add(ms.id);
    nodes.push({ id: ms.id, title: ms.title||'', status: ms.status||'todo', progress: ms.progress||0, depends_on: ms.depends_on||[] });
  }
  for (const n of nodes) for (const dep of n.depends_on) if (idSet.has(dep)) edges.push({ from: n.id, to: dep, type: 'depends_on' });
  for (const ms of milestones) {
    if (ms.status === 'cancelled') continue;
    for (const entry of (ms.entries||[])) {
      const reqBy = (entry.meta||{}).requested_by||'';
      if (reqBy && idSet.has(reqBy)) edges.push({ from: reqBy, to: ms.id, type: 'cross_task', task_id: entry.id||'' });
    }
  }
  const inDeg = {}; for (const n of nodes) inDeg[n.id] = 0;
  for (const n of nodes) for (const dep of n.depends_on) if (dep in inDeg) inDeg[n.id]++;
  const waves = [], remaining = {...inDeg};
  while (Object.keys(remaining).length > 0) {
    const wave = Object.keys(remaining).filter(id => remaining[id]===0).sort();
    if (wave.length === 0) { waves.push({ wave: waves.length+1, milestones: Object.keys(remaining).sort(), cycle: true }); break; }
    waves.push({ wave: waves.length+1, milestones: wave });
    for (const id of wave) delete remaining[id];
    for (const n of nodes) if (n.id in remaining) for (const dep of n.depends_on) if (wave.includes(dep)) remaining[n.id]--;
  }
  return { nodes, edges, waves };
}

const GRAPH_STATUS_COLORS = { done:'#166534', in_progress:'#1e3a5f', todo:'#2a2a30', waiting:'#44403c', observing:'#3b2f4a' };
const GRAPH_STATUS_STROKES = { done:'#4ade80', in_progress:'#60a5fa', todo:'#71717a', waiting:'#fbbf24', observing:'#a78bfa' };

function renderGraphSection() {
  const p = state.project;
  const header = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;"><span class="retro-back" data-action="hide-graph">← back</span><button class="sort-toggle" data-action="toggle-graph-filter" style="font-size:0.7rem;">${state.graphFilterDeps?'deps only ✓':'show all'}</button></div>`;
  if (!p || !p.milestones || p.milestones.length === 0) return `<section class="graph-section fade-in">${header}<div class="graph-empty">No milestones.</div></section>`;
  const fullGraph = buildGraph(p.milestones);
  if (fullGraph.edges.length === 0) return `<section class="graph-section fade-in">${header}<div class="graph-empty">No dependencies defined yet.<br><span style="font-size:0.7rem;color:var(--text-dim)">Use <code>beacon milestone depends ms-X --on ms-Y</code> to add.</span></div></section>`;
  let milestones = p.milestones;
  if (state.graphFilterDeps) {
    const connected = new Set();
    for (const e of fullGraph.edges) { connected.add(e.from); connected.add(e.to); }
    milestones = milestones.filter(ms => connected.has(ms.id));
  }
  const graph = state.graphFilterDeps ? buildGraph(milestones) : fullGraph;
  if (graph.edges.length === 0) return `<section class="graph-section fade-in">${header}<div class="graph-empty">No dependencies defined yet.</div></section>`;
  const nodeW = 180, nodeH = 52, waveGap = 60, nodeGap = 16, padX = 40, padY = 32;
  const pos = {};
  let maxRow = 0;
  for (const w of graph.waves) maxRow = Math.max(maxRow, w.milestones.length);
  for (let wi = 0; wi < graph.waves.length; wi++) {
    const wave = graph.waves[wi]; const count = wave.milestones.length;
    const startY = (maxRow - count) * (nodeH + nodeGap) / 2;
    for (let ni = 0; ni < count; ni++) pos[wave.milestones[ni]] = { x: padX + wi*(nodeW+waveGap), y: padY + startY + ni*(nodeH+nodeGap) };
  }
  const svgW = padX*2 + graph.waves.length*(nodeW+waveGap) - waveGap;
  const svgH = padY*2 + maxRow*(nodeH+nodeGap) - nodeGap;
  let edgeSvg = '';
  for (const e of graph.edges) {
    const from = pos[e.from], to = pos[e.to]; if (!from || !to) continue;
    const x1=to.x+nodeW, y1=to.y+nodeH/2, x2=from.x, y2=from.y+nodeH/2;
    const cx1=x1+(x2-x1)*0.4, cx2=x1+(x2-x1)*0.6;
    const cls = e.type==='cross_task'?' cross-task':'';
    edgeSvg += `<path class="graph-edge${cls}" d="M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}" />`;
  }
  let nodeSvg = '';
  for (const n of graph.nodes) {
    const pp = pos[n.id]; if (!pp) continue;
    const fill = GRAPH_STATUS_COLORS[n.status]||GRAPH_STATUS_COLORS.todo;
    const stroke = GRAPH_STATUS_STROKES[n.status]||GRAPH_STATUS_STROKES.todo;
    const titleTrunc = n.title.length > 20 ? n.title.slice(0,19)+'\u2026' : n.title;
    nodeSvg += `<g class="graph-node" transform="translate(${pp.x},${pp.y})"><rect width="${nodeW}" height="${nodeH}" fill="${fill}" stroke="${stroke}" /><text class="node-id" x="8" y="16">${esc(n.id)}</text><text x="8" y="32">${esc(titleTrunc)}</text><text class="node-progress" x="${nodeW-8}" y="16" text-anchor="end">${n.progress}%</text></g>`;
  }
  let waveSvg = '';
  for (let wi = 0; wi < graph.waves.length; wi++) {
    const x = padX + wi*(nodeW+waveGap) + nodeW/2;
    waveSvg += `<text x="${x}" y="18" text-anchor="middle" fill="var(--text-dim)" font-size="10" font-family="var(--font-mono)">wave ${graph.waves[wi].wave}${graph.waves[wi].cycle?' (cycle)':''}</text>`;
  }
  const legendItems = [{label:'done',color:GRAPH_STATUS_STROKES.done},{label:'in_progress',color:GRAPH_STATUS_STROKES.in_progress},{label:'todo',color:GRAPH_STATUS_STROKES.todo},{label:'observing',color:GRAPH_STATUS_STROKES.observing},{label:'waiting',color:GRAPH_STATUS_STROKES.waiting}];
  return `<section class="graph-section fade-in">${header}<div class="graph-container">
    <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--border)" /></marker></defs>
      ${waveSvg}${edgeSvg}${nodeSvg}
    </svg></div>
    <div class="graph-legend">${legendItems.map(l=>`<div class="graph-legend-item"><div class="graph-legend-swatch" style="background:${l.color}"></div>${l.label}</div>`).join('')}</div>
  </section>`;
}

async function renderMenu() {
  let localProjects = [];
  let cloudProjects = [];
  try { localProjects = await invoke('list_projects'); } catch(e) {}
  try {
    const auth = await invoke('is_authenticated');
    if (auth) {
      const json = await invoke('cloud_list_projects');
      cloudProjects = JSON.parse(json);
    }
  } catch(e) {}
  const localOnly = localProjects.filter(p => p.mode === 'local');
  const currentPath = state.projectPath || '';
  const root = document.getElementById('menu-root');
  root.innerHTML = `
    <div class="menu-overlay" data-action="close-menu"></div>
    <div class="menu-panel">
      <div class="menu-header"><span class="menu-title">Menu</span><button class="menu-close" data-action="close-menu">\u00d7</button></div>
      ${localOnly.length > 0 ? `<div class="menu-section">
        <div class="menu-section-title">Local Projects</div>
        ${localOnly.map(p => `
          <button class="menu-item ${p.path===currentPath?'current':''}" data-action="menu-select-project" data-path="${esc(p.path)}">
            ${esc(p.name)}
            <div class="menu-item-sub">${esc(p.path)}</div>
          </button>
        `).join('')}
      </div>` : ''}
      ${cloudProjects.length > 0 ? `<div class="menu-section">
        <div class="menu-section-title">Cloud Projects</div>
        ${cloudProjects.map(p => `
          <button class="menu-item ${('cloud:'+p.project_id)===currentPath?'current':''}" data-action="menu-select-cloud-project" data-project-id="${esc(p.project_id)}">
            ${esc(p.name)}
            <div class="menu-item-sub">${esc(p.project_id)}</div>
          </button>
        `).join('')}
      </div>` : ''}
    </div>`;
  root.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', handleAction));
}

function closeMenu() {
  document.getElementById('menu-root').innerHTML = '';
}

function render() {
  const app = document.getElementById('app');
  if (!state.project) return;
  const scrollY = window.scrollY;
  const p = state.project;
  const sorted = sortMilestones(p.milestones || []);
  const filtered = filterMilestones(sorted);
  const activeCount = (p.milestones||[]).filter(m=>m.status==='in_progress').length;
  const doneCount = (p.milestones||[]).filter(m=>m.status==='done').length;

  app.innerHTML = `
    <header class="header fade-in"><div class="header-top">
      <button class="hamburger-btn" data-action="open-menu" title="Menu"><span></span><span></span><span></span></button>
      <span class="project-name">${esc(p.name)}</span><span class="header-tag">beacon desktop</span>
      <div class="connection-status"><div class="status-dot ${state.connected?'':'offline'}"></div><span>${state.connected?'watching':'disconnected'}</span></div>
    </div></header>
    <div class="tab-bar fade-in stagger-1">
      <button class="tab-btn ${state.activeTab==='dashboard'?'active':''}" data-action="switch-tab" data-tab="dashboard">Milestones</button>
      <button class="tab-btn ${state.activeTab==='retros'?'active':''}" data-action="switch-tab" data-tab="retros">Reviews</button>
      <button class="tab-btn ${state.activeTab==='documents'?'active':''}" data-action="switch-tab" data-tab="documents">Documents</button>
    </div>
    ${state.activeTab==='dashboard' ? (state.showGraph ? renderGraphSection() : `
      ${p.summary?`<section class="summary-block fade-in"><div class="summary-label">Session Context</div><div class="summary-text">${esc(p.summary)}</div></section>`:''}
      <section class="milestones fade-in">
        <div class="milestones-header"><span class="milestones-title">Milestones</span><span class="milestones-count">${activeCount} active \u00b7 ${doneCount}/${(p.milestones||[]).length} done</span><button class="sort-toggle" data-action="show-graph" style="margin-left:auto;">Graph \u2192</button></div>
        <div class="filter-bar">
          <button class="filter-btn f-all ${state.hiddenStatuses.size===0?'on':'off'}" data-action="filter-all">all</button>
          ${FILTER_ORDER.map(s=>`<button class="filter-btn ${!state.hiddenStatuses.has(s)?'on':'off'} ${FILTER_CSS[s]||''}" data-action="filter-status" data-status="${s}">${STATUS_LABELS[s]}</button>`).join('')}
          <button class="sort-toggle" data-action="toggle-sort">${state.sortAsc?'\u2191 ms-1 first':'\u2193 latest first'}</button>
        </div>
        ${filtered.map(ms=>renderMilestoneCard(ms)).join('')}
      </section>`) : ''}
    ${state.activeTab==='retros' ? renderRetrosSection() : ''}
    ${state.activeTab==='documents' ? renderDocumentsSection() : ''}
    <footer class="footer fade-in stagger-3"><div class="footer-left"><div>${cloudMode?'cloud':'local'}</div><div class="footer-tagline">Where humans and AI are bound together.</div></div><div class="footer-right" style="display:flex;align-items:center;gap:12px;">${state.lastUpdate?formatTime(state.lastUpdate):''}<button class="sort-toggle" data-action="export-json" style="font-size:0.65rem;">Export JSON</button></div></footer>
  `;
  window.scrollTo(0, scrollY);
  bindEvents();
}

// ============================================================
// DESKTOP-SPECIFIC: Event delegation (replaces inline onclick)
// ============================================================
function bindEvents() {
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleAction);
  });
}

async function handleAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  // Don't propagate from child entries
  if (action === 'toggle-entry' && e.target.closest('.entry-children')) return;
  e.stopPropagation();

  switch (action) {
    case 'select-project': doSelectProject(el.dataset.path); break;
    case 'toggle-ms':
      const msId = el.dataset.msId;
      state.expanded.has(msId) ? state.expanded.delete(msId) : state.expanded.add(msId);
      render(); break;
    case 'toggle-entry':
      const eid = el.dataset.entryId;
      state.collapsedEntries.has(eid) ? state.collapsedEntries.delete(eid) : state.collapsedEntries.add(eid);
      render(); break;
    case 'toggle-hide-done':
      const mid = el.dataset.msId;
      state.hideEntryDone.has(mid) ? state.hideEntryDone.delete(mid) : state.hideEntryDone.add(mid);
      render(); break;
    case 'filter-status':
      const s = el.dataset.status;
      state.hiddenStatuses.has(s) ? state.hiddenStatuses.delete(s) : state.hiddenStatuses.add(s);
      render(); break;
    case 'filter-all': state.hiddenStatuses.clear(); render(); break;
    case 'toggle-sort': state.sortAsc = !state.sortAsc; render(); break;
    case 'switch-tab':
      state.activeTab = el.dataset.tab;
      state.showGraph = false;
      state.documentContent = null; state.retroContent = null;
      if (state.activeTab === 'documents' && state.documents.length === 0) await loadDocuments();
      if (state.activeTab === 'retros' && state.retros.length === 0) await loadRetros();
      render(); break;
    case 'show-graph': state.showGraph = true; render(); break;
    case 'hide-graph': state.showGraph = false; render(); break;
    case 'toggle-graph-filter': state.graphFilterDeps = !state.graphFilterDeps; render(); break;
    case 'open-document': await loadDocumentContent(el.dataset.docId); break;
    case 'close-document': state.documentContent = null; render(); break;
    case 'copy-doc-link': {
      const url = `https://beacon-ai.dev/?project=${state.cloudProjectId}#doc/${el.dataset.docId}`;
      await navigator.clipboard.writeText(url);
      el.textContent = 'Copied!';
      setTimeout(() => { el.textContent = 'Copy web link'; }, 1500);
      break;
    }
    case 'open-retro': await loadRetroContent(el.dataset.week); break;
    case 'close-retro': state.retroContent = null; render(); break;
    case 'open-menu': await renderMenu(); break;
    case 'close-menu': closeMenu(); break;
    case 'menu-select-project': closeMenu(); await doSelectProject(el.dataset.path); break;
    case 'menu-select-cloud-project': closeMenu(); await doSelectCloudProject(el.dataset.projectId); break;
    case 'select-cloud-project': await doSelectCloudProject(el.dataset.projectId); break;
    case 'cloud-diagnose':
      state.cloudDiag = 'Running...';
      renderProjectSelector();
      state.cloudDiag = await invoke('cloud_diagnose').catch(e => String(e));
      renderProjectSelector();
      break;
    case 'export-json': await exportProject(); break;
  }
}

async function exportProject() {
  try {
    let project, documents = [], retros = [];
    if (cloudMode && state.cloudProjectId) {
      project = JSON.parse(await invoke('cloud_load_project', { projectId: state.cloudProjectId }));
      try { documents = JSON.parse(await invoke('cloud_list_documents')); } catch(e) {}
      try { retros = JSON.parse(await invoke('cloud_list_retros')); } catch(e) {}
    } else {
      project = JSON.parse(await invoke('load_project_json'));
      try { documents = JSON.parse(await invoke('get_documents', { scope: '' })); } catch(e) {}
      try { retros = JSON.parse(await invoke('list_retros')); } catch(e) {}
    }
    const fullExport = { ...project, documents, retros };
    const blob = new Blob([JSON.stringify(fullExport, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.cloudProjectId || 'project'}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) { alert('Export failed: ' + e); }
}

// Reconnect when window regains focus
function _tryReconnect() {
  if (!state.project) return;
  if (cloudMode) {
    // Cloud mode: resume polling if stopped, and trigger immediate load
    if (!pollTimer) startPolling();
    loadProject();
  } else {
    // Local mode: restart watcher and reload
    startWatcher();
    loadProject();
  }
}
// Tauri window focus event
if (window.__TAURI__?.event) {
  window.__TAURI__.event.listen('tauri://focus', _tryReconnect);
}
// Web visibilitychange fallback (also useful for web-view scenarios)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') _tryReconnect();
});

// ============================================================
// DESKTOP-SPECIFIC: Init
// ============================================================
async function init() {
  try {
    await loadProject();
    if (state.project) {
      for (const ms of state.project.milestones || []) {
        if (ms.status === 'in_progress') state.expanded.add(ms.id);
      }
      render(); startWatcher(); return;
    }
  } catch (e) {}
  renderProjectSelector();
}

if (window.__TAURI__) init();
else document.addEventListener('DOMContentLoaded', () => { if (window.__TAURI__) init(); });


</script>
</body>
