function renderMsListArea() {
  if (!state.project) return;
  const container = document.getElementById('ms-list-container');
  if (!container) {
    // The shell hasn't been mounted yet (e.g. WS pushed project data while
    // we're still on the loading screen). Promote to a full render so the
    // UI catches up; partial render alone would silently no-op and leave
    // the user stranded on "loading".
    //
    // Exception: if the user is mid-IME composition, a full render would
    // destroy the search input and force-confirm what they've typed. Defer
    // until compositionend.
    if (_isComposing) {
      _pendingDataRender = render;
      return;
    }
    render();

// Scroll detection caveats:
//   - scroll events DON'T bubble by default → window-only listener misses
//     events from nested scroll containers. Use `capture: true` on document
//     to catch scroll on any element.

  // verbatim until the user explicitly closes it.

  // document / retro viewer. While the user is reading a doc (or a retro),

    state.searchTotal = 0;
    state.searchLoading = false;

    renderMainContentArea();

        if (navigator.clipboard) navigator.clipboard.writeText(cmd);
      } catch (_e) { /* noop */ }
      window.alert('Run this command in your terminal:\n\n' + cmd + '\n\n(copied to clipboard)');
      return true;
    }
    // ms-86 / e-2222 — TREK TASKS の MS / Op 行 chevron 経由の accordion
    // 開閉。 mockup L460-502 の collapsed / expanded 状態を user 操作で切替。
    case 'trek-scope-toggle': {
      const msId = el.dataset.ms || '';
      if (!msId) return true;
      if (!state.openTrekExpanded) state.openTrekExpanded = new Set();
      if (state.openTrekExpanded.has(msId)) state.openTrekExpanded.delete(msId);
      else state.openTrekExpanded.add(msId);
      render();
      return true;
    }
    // ms-86 / e-2224 — accordion 内 「show done」 ボタン。 ms-id 単位で
    // done 状態 task の inline 表示を toggle (= 別 MS の done 表示が同時に
    // 切り替わらないよう、 state は Set keyed by ms-id で保持)。
    case 'trek-toggle-done': {
      const msId = el.dataset.ms || '';
      if (!msId) return true;
      if (!state.openTrekShowDone) state.openTrekShowDone = new Set();
      if (state.openTrekShowDone.has(msId)) state.openTrekShowDone.delete(msId);
      else state.openTrekShowDone.add(msId);
      render();
      return true;
    }
    // ms-86 / e-2226 — ACTIVITY section "show all" / "show fewer" toggle.
    // Single boolean (= one open Trek at a time), reset by openTrek /
    // closeTrek / tab switch so expansion doesn't bleed across treks.
    case 'trek-activity-toggle-expand': {
      state.openTrekActivityExpanded = !state.openTrekActivityExpanded;
      render();
      return true;
    }
  }
  return false;
}

// ---- Entry detail modal (ms-46 e-740: moved into SHARED so Tauri can use it too) ----

function findEntryById(id, entries) {
  for (const e of entries || []) {
    if (e.id === id) return e;
    const found = findEntryById(id, e.entries);
    if (found) return found;
  }
  return null;
}

function findEntryInProject(id) {
  for (const ms of state.project?.milestones || []) {
    const found = findEntryById(id, ms.entries || []);
    if (found) return { entry: found, ms };
  }
  for (const op of state.project?.operations || []) {
    const found = findEntryById(id, op.entries || []);
    if (found) return { entry: found, op };
  }
  return null;
}

function openEntryDetail(entryId) {
  const result = findEntryInProject(entryId);
  if (!result) return;
  state.openEntryId = entryId;
  renderEntryModal(result.entry, result.ms || result.op);
  // ms-69 / e-1664: lazy-load related treks for this task entry. When the
  // data lands, re-render the modal so the widget appears (or stays empty,
  // in which case the widget is silent).
  if (state.relatedTreks['task:' + entryId] === undefined) {
    dataSource.loadRelatedTreks('task', entryId).then(() => {
      // Only re-render the modal if it's still showing the same entry.
      if (state.openEntryId === entryId) {
        renderEntryModal(result.entry, result.ms || result.op);
      }
    });
  }
}

function renderEntryModal(entry, parent) {
  const overlay = document.getElementById('entry-detail-modal');
  if (!overlay) return;

  const priority = entry.meta?.priority;
  const priorityBadge = priority ? `<span class="priority-badge priority-${priority}">${priority}</span>` : '';
  const hash = entry.meta?.hash ? `<span class="entry-hash">${entry.meta.hash.slice(0, 7)}</span>` : '';

  const motivation = entry.motivation
    ? `<div class="entry-modal-field modal-field-why"><div class="entry-modal-field-label">why</div>${esc(entry.motivation)}</div>` : '';
  const ac = entry.acceptance_criteria
    ? `<div class="entry-modal-field modal-field-ac"><div class="entry-modal-field-label">done when</div>${esc(entry.acceptance_criteria)}</div>` : '';
  const behavior = entry.behavior
    ? `<div class="entry-modal-field modal-field-behavior"><div class="entry-modal-field-label">behavior</div>${esc(entry.behavior)}</div>` : '';
  const resolves = entry.meta?.resolves
    ? `<div class="entry-modal-field modal-field-resolves"><div class="entry-modal-field-label">resolves</div>${esc(entry.meta.resolves)}</div>` : '';
  const detail = entry.detail
    ? `<div class="entry-modal-field modal-field-detail"><div class="entry-modal-field-label">detail</div>${esc(entry.detail)}</div>` : '';
  // e-976: surface done/cancel/restore reasons in modal with PR #N / e-XXX auto-links.
  const doneReason = renderReasonField(entry, 'done_reason', 'done reason');
  const cancelReason = renderReasonField(entry, 'cancel_reason', 'cancel reason');
  const restoreReason = renderReasonField(entry, 'restore_reason', 'restore reason');
  const reasonMissing = reasonMissingBadge(entry);

  const statusText = entryStatusText(entry);
  const msLabel = parent ? `<span style="color:var(--text-dim);font-size:11px;">${esc(parent.id)}</span>` : '';

  // ms-78 / e-1909 — show the human author in the modal (= clickable rows
  // surface display_name; the modal pins both display_name and email).
  const authorLabel = renderEntryAuthor(entry);
  const authorField = authorLabel
    ? `<div class="entry-modal-field modal-field-author"><div class="entry-modal-field-label">author</div>${authorLabel}</div>`
    : '';

  overlay.innerHTML = `
    <div class="entry-modal" onclick="event.stopPropagation()">
      <div class="entry-modal-header">
        ${entryTypeBadge(entry.type)}
        <span class="entry-modal-title">${esc(entry.id)}${hash} ${msLabel}</span>
        <button class="entry-modal-close" data-action="close-entry-modal">✕</button>
      </div>
      <div class="entry-modal-body">
        <div class="entry-modal-desc">${esc(entry.description)}</div>
        <div class="entry-modal-meta">${priorityBadge}${statusText}${reasonMissing}</div>
        ${authorField}${motivation}${ac}${behavior}${resolves}${detail}${doneReason}${cancelReason}${restoreReason}
        ${renderRelatedTreksWidget('task', entry.id)}
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
  overlay.querySelector('[data-action="close-entry-modal"]')?.addEventListener('click', closeEntryModal);
  overlay.querySelectorAll('[data-action="trek-jump-from-widget"]').forEach(node => {
    node.addEventListener('click', handleAction);
  });
}

function closeEntryModal() {
  state.openEntryId = null;
  const overlay = document.getElementById('entry-detail-modal');
  if (overlay) overlay.style.display = 'none';
}

// Document overlay (ms-43 e-796): open Markdown doc on top of current view
// without disturbing search / Documents list state. Used by search hits.
async function openDocumentOverlay(docId) {
  try {
    await dataSource.loadDocumentContent(docId);
    state.documentOverlay = state.documentContent;
    state.documentContent = null;
  } catch (e) {
    state.documentOverlay = { doc_id: docId, title: 'Error', content: 'Failed to load document.', scope: 'memo' };
  }
  renderDocumentOverlay();
}

function renderDocumentOverlay() {
  const overlay = document.getElementById('document-overlay-modal');
  if (!overlay) return;
  const d = state.documentOverlay;
  if (!d) { overlay.style.display = 'none'; overlay.innerHTML = ''; return; }
  const scope = d.scope || 'memo';
  overlay.innerHTML = `
    <div class="entry-modal entry-modal-wide" onclick="event.stopPropagation()">
      <div class="entry-modal-header">
        <span class="entry-modal-title">${scopeBadge(scope)}${esc(d.title || d.doc_id)}</span>
        <button class="entry-modal-close" data-action="close-document-overlay">✕</button>
      </div>
      <div class="entry-modal-body">
        <div class="doc-content">${renderDocBody(d.content)}</div>
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
  overlay.querySelector('[data-action="close-document-overlay"]')?.addEventListener('click', closeDocumentOverlay);
}

function closeDocumentOverlay() {
  state.documentOverlay = null;
  const overlay = document.getElementById('document-overlay-modal');
  if (overlay) { overlay.style.display = 'none'; overlay.innerHTML = ''; }
}

// ms-70 / e-1718 — DM approval history (audit) row rendering.
//
// Lives inside the SHARED region so the Web build (server/static/index.html)
// and the Tauri build (desktop/dist/index.html generated by desktop/build.py)
// render the same audit table from the same source of truth. If the Tauri
// side ever wires up a Rust loader, it can reuse this helper unchanged.
//
// Read-only by design: per SPEC 設計方針 3 the approve/deny decision is
// made exclusively in the terminal Claude Code via `beacon dm respond`.
// The Web UI is the *aftermath* view — who decided what, when. There is
// no approve / deny button here and there must never be one (= violating
// the terminal-only invariant would let a curious browser tab smuggle a
// decision past the receiver's own typing).
//
// ``rows`` is the array returned by GET /api/projects/{pid}/dm/approval/history
// (server-side: db.list_decided_approvals). Each row is the 7-field
// sidecar shape; we surface 6 of them (sender / receiver / status /
// decision_at / decision_by / event_id) and omit ``created_at`` to keep
// the table scannable — created_at differs from decision_at only by the
// elapsed-pending time, which is rarely useful for human audit.
function renderDmApprovalHistoryRows(rows) {
  if (!Array.isArray(rows) || rows.length === 0) {
    return '<div class="menu-user" style="color:var(--text-dim);padding:12px;font-style:italic;">No approval history yet (= no DM actions have been approved or denied).</div>';
  }
  const head = `
    <thead>
      <tr>
        <th style="width:90px;">status</th>
        <th>sender</th>
        <th>receiver</th>
        <th style="width:140px;">decided at</th>
        <th>decided by</th>
        <th style="width:120px;">event_id</th>
      </tr>
    </thead>`;
  const body = rows.map(r => {
    const status = r.approval_status || '';
    const sender = r.sender_user_id || '';
    const receiver = r.receiver_user_id || '';
    const decidedAt = r.decision_at || '';
    const decidedBy = r.decision_by || '';
    const eid = r.event_id || '';
    // Color-tag approved / denied so the eye can sweep the column. Inline
    // styles only — no new CSS class needed (= minimal blast radius).
    const statusColor = status === 'approved'
      ? 'color:#7fb389;'
      : status === 'denied'
      ? 'color:#c97a7a;'
      : 'color:var(--text-dim);';
    return `
      <tr>
        <td><span style="${statusColor}font-weight:600;">${esc(status)}</span></td>
        <td><span style="font-size:0.72rem;">${esc(sender)}</span></td>
        <td><span style="font-size:0.72rem;">${esc(receiver)}</span></td>
        <td><span style="font-size:0.7rem;color:var(--text-dim);">${esc(decidedAt)}</span></td>
        <td><span style="font-size:0.72rem;">${esc(decidedBy)}</span></td>
        <td><span style="font-size:0.65rem;color:var(--text-dim);font-family:var(--font-mono,monospace);">${esc(eid)}</span></td>
      </tr>`;
  }).join('');
  return `
    <table class="settings-table">
      ${head}
      <tbody>${body}</tbody>
    </table>`;
}
</script>
