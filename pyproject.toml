# =============================================================================
#  Beacon - Python packaging manifest
# =============================================================================
#
#  This file enables `pipx install beacon` (and `pip install -e .`) so Beacon
#  can be installed across all OSes — including Windows, where the legacy
#  `bin/beacon` bash entry-point does not work.
#
#  STATUS: ms-44 e-695 scaffold — the Python entry-point currently delegates
#  to the existing `bin/beacon` shell script when bash is available, and falls
#  back to a direct `lib/commands.py` dispatch for the subset of commands that
#  are already Python-native (`--version`, `status`, `help`).
#
#  Full bash-to-Python conversion is tracked under e-695 and will land in a
#  later session. This scaffold is enough for:
#    - PyPI publishing  (CI: .github/workflows/release-build.yml)
#    - `pipx install beacon` succeeding on macOS / Linux / Windows
#    - `beacon --version` returning the version on all OSes
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. ms-64: PyPI 上の "beacon" / "beacon-cli" は無関係の
# 他作者が先に取得済だったため、我々の公開チャネル (= beacon-ai.dev) と整合する
# "beacon-ai" を採用。内部の CLI 実体名は引き続き "beacon" (= 利用者は
# `pipx install beacon-ai` の後に `beacon --help` で叩く形)。
name = "beacon-ai"
# Sourced dynamically from lib/commands.py:__version__ to keep a single source
# of truth. Update there to bump the version.
dynamic = ["version"]
description = "AI-driven milestone tracker for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "r-kida2", email = "kurogin23mech@gmail.com" },
]
keywords = ["ai", "claude-code", "milestone", "project-management", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# Core mode has no Python deps. Cloud features pull in google-auth via the
# `cloud` extra (`pipx install 'beacon[cloud]'`).
dependencies = []

[project.optional-dependencies]
cloud = [
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.29.0",
]
# Codex DM-wake (= ms-93). The receive daemon's url transport
# (codex-receive-loop --app-server-url ws://...) needs `websockets` to wake the
# Codex TUI on DM receipt; without it DMs still arrive but only catch up on the
# next prompt (pull-only). NOTE: the daemon runs under system python3, so this
# extra alone does not guarantee the daemon's interpreter has it — bin/bcodex
# also pre-flight-checks and warns at launch (e-2536).
codex = [
    "websockets>=12",
]
dev = [
    "build>=1.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/r-kida2/beacon"
Repository = "https://github.com/r-kida2/beacon"
Issues = "https://github.com/r-kida2/beacon/issues"

[project.scripts]
# Cross-platform entry-point. On macOS/Linux this delegates to `bin/beacon`
# (bash) when present so existing behaviour is identical; on Windows (no bash)
# it falls back to the Python dispatch in `beacon_cli/main.py`.
beacon = "beacon_cli.main:main"
# Cross-platform Claude Code launcher with the Beacon DM channel pre-wired
# (ms-54 e-1328). Mirrors `bin/bclaude` (bash) and `bin/bclaude.cmd` so
# `pip install beacon` installs `bclaude` / `bclaude.exe` into the user's
# Scripts dir — critical for Windows + pipx paths where the bash/cmd
# wrappers aren't on PATH.
bclaude = "beacon_cli.bclaude:main"
# Cross-platform project-root walk-up helper (ms-62 / e-1512). Mirrors
# `bin/beacon-find-root` (POSIX shell) so the Skills shipped under
# `skills/*.md` can call `beacon-find-root` as their bootstrap
# prerequisite check regardless of how beacon was installed (raw git
# clone vs `pipx install beacon` vs `pip install --user beacon`).
beacon-find-root = "beacon_cli.find_root:main"
# Cross-platform PostToolUse / PostCompact hook entry-points (ms-44 e-777).
# Translated from bin/*.sh so Claude Code on Windows can register them by
# absolute path in ~/.claude/settings.json without needing a bash interpreter.
beacon-hook-post-commit = "beacon_cli.hooks.post_commit:main"
beacon-hook-postcompact = "beacon_cli.hooks.postcompact:main"
beacon-hook-save = "beacon_cli.hooks.save_hook:main"
# Stop hook: context-usage threshold monitor (ms-44 e-854). Bash original is
# bin/context-usage-monitor.sh; the Python entry-point unblocks Windows where
# bash/jq are unavailable.
beacon-hook-context-monitor = "beacon_cli.hooks.context_monitor:main"
# PostToolUse: surface STOP signals (ms-55 e-1721). Reads the
# halt-request.json the bus inbox hook drops on disk and injects it as
# additionalContext so the AI sees the halt request after each tool call.
beacon-hook-halt-check = "beacon_cli.hooks.halt_check:main"
# SessionStart: beacon の自動アップデート (ms-103)。bclaude 起動時に 1 日 1 回 PyPI を
# 見て新版があれば install 方法別に detached で更新する (更新後 smoke + 失敗時
# ロールバック / 公開後 24h 熟成待ち付き)。BEACON_AUTO_UPDATE=0 で無効化。
beacon-hook-session-start = "beacon_cli.hooks.session_start:main"

# -----------------------------------------------------------------------------
# Packaging layout
# -----------------------------------------------------------------------------
# Beacon's legacy layout has `lib/*.py` files (NOT a Python package — no
# __init__.py) plus `bin/beacon` (bash). We introduce a thin `beacon_cli/`
# Python package on top of this without disturbing the existing layout.
#
#   beacon_cli/
#     __init__.py
#     main.py            # entry-point dispatcher (bash shim + Python fallback)
#     _version.py        # source of truth for __version__
#     dispatch.py        # PowerShell-native command tree
#     hooks/             # Python translations of bin/*.sh (cross-platform)
#     _bundled_lib/      # populated at install time with copies of lib/
#     _bundled_skills/   # populated at install time with copies of skills/
#
# `lib/` and `skills/` are remapped into the package via setuptools
# `package_dir` so a wheel install carries everything `commands.py` /
# `cmd_skill_install` needs.
# -----------------------------------------------------------------------------

[tool.setuptools]
packages = [
    "beacon_cli",
    "beacon_cli.hooks",
    "beacon_cli.skills_helpers",
    "beacon_cli._bundled_lib",
    "beacon_cli._bundled_skills",
    "beacon_cli._bundled_channel",
    "beacon_cli._bundled_scripts",
]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "beacon_cli._version.__version__" }

[tool.setuptools.package-dir]
"beacon_cli._bundled_lib" = "lib"
"beacon_cli._bundled_skills" = "skills"
# ms-54 e-1169: ship channel/ bus.mjs + package.json so pipx users can run
# `beacon channel install`. node_modules is generated at runtime via
# _ensure_channel_node_modules() — shipping it in the wheel would be
# platform-fragile (native deps, symlinks, large size).
"beacon_cli._bundled_channel" = "channel"
# ms-93 e-3209: ship scripts/ so a pipx/brew wheel carries the Codex DM
# daemon (codex-receive-loop.py) + hooks (codex-inbox-hook.py and
# codex-post-tool-use-hook.py). Without
# this, `codex plugin add beacon` copies plugins/beacon/ verbatim but the
# daemon scripts live at repo-root scripts/ (outside the plugin subtree),
# so the bridge cannot find codex-receive-loop.py and the daemon fails to
# start. The bridge resolves this bundled dir via `beacon __codex-script-root__`.
"beacon_cli._bundled_scripts" = "scripts"

[tool.setuptools.package-data]
"beacon_cli._bundled_lib" = [
    "*.py",
    "*.json",
    "*.example",
]
"beacon_cli._bundled_skills" = [
    "*.md",
    "_*.md",
    "**/*.md",
]
"beacon_cli._bundled_channel" = [
    "*.mjs",
    "package.json",
    "package-lock.json",
]
"beacon_cli._bundled_scripts" = [
    "*.py",
]
beacon_cli = [
    "_bundled_bin/beacon",
    "_bundled_bin/*.sh",
]
