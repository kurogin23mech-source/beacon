ShortDescription: AI-driven milestone tracker for Claude Code sessions.
Description: |-
  Beacon is a milestone-driven project tracker designed for Claude Code (and
  any AI agent) workflows. It records commits, decisions, and AI-evaluated
  progress so that sessions can hand off cleanly without losing context.

  Beacon Desktop is the local-mode UI for projects that don't need cloud sync.
  It bundles the Beacon CLI so non-developers never have to touch a terminal.

