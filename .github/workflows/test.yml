name: Test (pytest)

# Runs the Python test suite on every PR + push to main so a "tests fail" PR
# can no longer be merged silently. Created under ms-61 / e-1904 because the
# ms-84 e-2326 WS-push repair work (2026-06-23) required 3 sequential deploys
# and each one needed `pytest tests/test_api.py` hand-driven from local; a
# missed regression in one of those passes could have shipped to prod.
#
# DESIGN NOTES
#   - pyproject.toml declares pytest under [project.optional-dependencies] dev,
#     so `pip install -e .[dev]` is the canonical install path (mirrors what a
#     developer does locally).
#   - tests/ has ~700 files. pytest auto-discovers the test_* pattern from the
#     repo root, and tests/conftest.py holds what the whole suite shares: the
#     sys.path setup, the human-session / test-mode env declarations, and the
#     autouse guards that keep a test from writing the repo's own .beacon/
#     (ms-166 e-6621 — that leak is what made parallel runs safe to turn on).
#   - Python 3.11 matches the lint-docs.yml setup so a single Python version is
#     used across all CI workflows (avoids 3.9-only regression noise).
#   - This workflow runs independently of GitHub branch protection — even
#     without protection rules, a red check is visible on the PR page.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs on the same ref when a newer commit lands. Saves
  # CI minutes on rapid push cycles (typical during fix iteration).
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # ms-166 e-6811: headroom above the measured parallel runtime, not a target.
    # The ceiling used to be the same 15 minutes the serial suite took, so growth
    # showed up as a cancelled job rather than a slow one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # ms-170 e-6362 レビュー由来: 盤の読み取りは Python と Go の二重実装で、
      # 両者がズレないことの唯一の歯止めが tests/test_go_viewer_parity_ms170.py の
      # 突き合わせ。だが Go が無い環境ではその Go 側が丸ごと skip され、CI は緑の
      # まま Go 版だけ静かにズレていた。ここで Go を入れてビューワーを建てておくと、
      # 同じ pytest 実行内で needs_go_only の突き合わせが走り、Go 側 drift も CI で
      # 捕まる (固定データ tests/fixtures/viewer_parity + golden に突き合わせる)。
      - uses: actions/setup-go@v5
        with:
          go-version-file: viewer/go.mod
          cache-dependency-path: viewer/go.sum

      - name: Build the Go viewer (for parity tests)
        run: go build -o viewer ./...
        working-directory: viewer

      - name: Install package with dev + server runtime deps
        # `-e .[dev]` pulls pytest + ruff from pyproject.toml's dev extra.
        # Cloud extras (google-auth*) are pulled in from requirements.txt.
        # server/requirements.txt is the canonical runtime dep list for the
        # FastAPI app (fastapi / uvicorn / google-cloud-firestore etc.) —
        # tests that import server/app.py need these or pytest fails at the
        # collection stage with ``ModuleNotFoundError: No module named
        # 'fastapi'`` (= e-2349, observed on PR #213 first CI run and every
        # PR after until this fix). pyyaml is the one yaml caller
        # (tests/test_ws_push_cross_instance.py); inline-install it here
        # rather than add a test-only dep to a runtime requirements file.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cloud]"
          python -m pip install -r requirements.txt
          python -m pip install -r server/requirements.txt
          python -m pip install pyyaml httpx

      - name: Run pytest
        # ms-166 e-6816: PARALLEL, with the worker count PINNED. ~13min -> ~5min.
        #
        # History. e-6811 left this serial because the suite under `-n auto`
        # produced 5 failures + 18 errors that did not reproduce when the same
        # files ran alone (measured 2026-10-01) — cross-file shared state, and
        # turning it on then would have traded a legible timeout for flakes that
        # change identity every run (a flake teaches people to re-run instead of
        # to look). e-6816 did that work; what it found and fixed:
        #
        #   * the repo-.beacon leak guard excused transients by FILE NAME, so a
        #     second atomic writer blamed tests that touch nothing (2c05e3ad)
        #   * a stderr comparison picked up a gRPC fork-handler line written in
        #     the child between fork and exec (c200b0a3)
        #   * a readyz test had been green for 37 days off a leaked orphan
        #     server holding its fixed port, its own server never binding, plus
        #     a read of a file a BACKGROUND process writes (902c6bbc)
        #
        # Why `-n 4` and not `-n auto`. Measured 2026-10-05 on a 10-core laptop:
        #
        #   -n 4,    2 runs (fixed order + random order):  10141 passed, 0 failed
        #   -n auto (= 10 workers), 3 runs: ONE failure each run, a DIFFERENT
        #     test every time. Two of the three were the same root cause and it
        #     is not ours: `git push` itself died, SIGTRAP once and SIGABRT once,
        #     with empty stdout/stderr. Apple git aborting under heavy concurrent
        #     use, not suite state — each test passes alone.
        #
        # So `-n auto` ties the condition to the runner's core count: today's
        # 2-4-core runner behaves like -n 4, a bigger one starts crashing git and
        # the failure names a different innocent test every run. Pinning keeps CI
        # reproducible against the number this was actually measured at, which is
        # the same property the three fixes above were about. Raise it only with
        # a measurement at the new number, and keep the measurements in THIS
        # comment (pyproject.toml deliberately holds none — see its xdist entry).
        run: pytest tests/ -n 4 -q

  frontend-drift:
    # ms-160 e-5808: make the Web/Tauri frontend-drift guard a hard CI stop.
    # The checker already supported --strict (exit 1) but nothing ran it in CI,
    # so a PR that desynced server/static and desktop/dist only produced a local
    # pre-commit WARNING and merged green. This job runs it strict on every PR +
    # push to main. It uses only the Python stdlib, so no install step is needed
    # (fast, independent of the pytest job).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Web/Tauri frontend drift (strict)
        run: python3 scripts/check-frontend-drift.py --strict
