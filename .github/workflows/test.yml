name: Test (pytest)

# Runs the Python test suite on every PR + push to main so a "tests fail" PR
# can no longer be merged silently. Created under ms-61 / e-1904 because the
# ms-84 e-2326 WS-push repair work (2026-06-23) required 3 sequential deploys
# and each one needed `pytest tests/test_api.py` hand-driven from local; a
# missed regression in one of those passes could have shipped to prod.
#
# DESIGN NOTES
#   - pyproject.toml declares pytest under [project.optional-dependencies] dev,
#     so `pip install -e .[dev]` is the canonical install path (mirrors what a
#     developer does locally).
#   - tests/ has ~210 files and no conftest.py — pytest auto-discovers the test_*
#     pattern from the repo root.
#   - Python 3.11 matches the lint-docs.yml setup so a single Python version is
#     used across all CI workflows (avoids 3.9-only regression noise).
#   - This workflow runs independently of GitHub branch protection — even
#     without protection rules, a red check is visible on the PR page.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs on the same ref when a newer commit lands. Saves
  # CI minutes on rapid push cycles (typical during fix iteration).
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package with dev + server runtime deps
        # `-e .[dev]` pulls pytest + ruff from pyproject.toml's dev extra.
        # Cloud extras (google-auth*) are pulled in from requirements.txt.
        # server/requirements.txt is the canonical runtime dep list for the
        # FastAPI app (fastapi / uvicorn / google-cloud-firestore etc.) —
        # tests that import server/app.py need these or pytest fails at the
        # collection stage with ``ModuleNotFoundError: No module named
        # 'fastapi'`` (= e-2349, observed on PR #213 first CI run and every
        # PR after until this fix). pyyaml is the one yaml caller
        # (tests/test_ws_push_cross_instance.py); inline-install it here
        # rather than add a test-only dep to a runtime requirements file.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cloud]"
          python -m pip install -r requirements.txt
          python -m pip install -r server/requirements.txt
          python -m pip install pyyaml httpx

      - name: Run pytest
        run: pytest tests/ -q

  frontend-drift:
    # ms-160 e-5808: make the Web/Tauri frontend-drift guard a hard CI stop.
    # The checker already supported --strict (exit 1) but nothing ran it in CI,
    # so a PR that desynced server/static and desktop/dist only produced a local
    # pre-commit WARNING and merged green. This job runs it strict on every PR +
    # push to main. It uses only the Python stdlib, so no install step is needed
    # (fast, independent of the pytest job).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Web/Tauri frontend drift (strict)
        run: python3 scripts/check-frontend-drift.py --strict
