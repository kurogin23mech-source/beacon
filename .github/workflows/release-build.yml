name: Release Build (CLI + Desktop, all OS)

# ============================================================================
# DRAFT — ms-44 e-696
#
# Cross-platform release pipeline. This workflow builds the Beacon Desktop
# app (Tauri) AND the Beacon CLI Python package on macOS / Windows / Linux
# runners, then uploads the artifacts to a GitHub Release.
#
# It is intentionally NOT triggered automatically yet. Trigger manually
# (`workflow_dispatch`) for the first dry-run, or push a `release-v*` tag
# once the pipeline is verified.
#
# Existing `desktop-release.yml` handles `desktop-v*` tags for Desktop only.
# This workflow is the "all-in-one" successor; the two will be consolidated
# once cli-only PyPI publishing is confirmed.
# ============================================================================

on:
  push:
    tags:
      # ms-52 e-954: release.yml creates `v*` tags (semver convention), so
      # this workflow must accept them — otherwise the artifact build chain
      # is silently skipped on every release. `release-v*` is kept for
      # backward compatibility with explicit all-build tag pushes.
      - 'v*'
      - 'release-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (skip GitHub Release creation)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # CLI: sdist + wheel on a single runner (pure Python)
  # --------------------------------------------------------------------------
  build-cli:
    name: Build CLI (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-cli-dist
          path: dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # CLI smoke test on each OS (#e-778 e-773)
  #
  # Verifies that the wheel we just built actually installs and runs on each
  # target OS — catches platform-specific regressions in the Python entry-
  # point (encoding, file locking, subprocess env, hook resolver, …) BEFORE
  # they reach end users. Also doubles as the structural validation for the
  # WinGet manifest path (e-773): running `beacon doctor` on windows-latest
  # is the same code path WinGet runs after install.
  # --------------------------------------------------------------------------
  smoke-cli:
    name: Smoke CLI (${{ matrix.os }})
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: beacon-cli-dist
          path: dist

      - name: Install via pip (cross-platform proxy for pipx)
        run: python -m pip install --upgrade dist/*.whl
        shell: bash

      - name: Verify entry point
        # Each invocation exits non-zero if the dispatcher couldn't load —
        # which is exactly the failure mode the encoding / fcntl bugs hit.
        # Windows shell runs in cp932 by default; we DELIBERATELY do not set
        # PYTHONUTF8 here so we catch any regression where stdout reconfigure
        # didn't propagate to a subprocess child (#19 follow-up).
        run: |
          beacon --version
          beacon --help
          beacon doctor || true   # doctor exits non-zero when project missing — acceptable here
        shell: bash
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          # macOS-x64 (Intel) is intentionally dropped: GitHub Actions
          # macos-13 runner availability is extremely scarce (jobs queue for
          # hours), which blocks the aggregate upload step on every release
          # and prevents .dmg/.AppImage/.msi from ever attaching to the
          # GitHub Release on time. Beacon's mac user base is Apple Silicon —
          # add macOS-x64 back if a real Intel user reports needing it.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Desktop App
        working-directory: desktop
        run: tauri build --target ${{ matrix.target }}

      - name: Compute artifact SHA-256
        shell: bash
        working-directory: desktop/src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          for f in $(find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) 2>/dev/null); do
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" > "$f.sha256"
            else
              sha256sum "$f" > "$f.sha256"
            fi
          done
        continue-on-error: true

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beacon-desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sha256
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sha256
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sha256
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sha256
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sha256
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # Aggregate: upload all artifacts to a GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-cli, build-desktop]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Beacon ${{ github.ref_name }}
          draft: true   # Maintainer reviews artifacts before publishing
          prerelease: false
          files: artifacts/**/*
          generate_release_notes: true

  # --------------------------------------------------------------------------
  # PyPI publish — ms-44 e-1190
  #
  # Publishes the CLI wheel + sdist to PyPI so `pipx upgrade beacon` works on
  # Windows / Linux end-user machines (the existing dogfood path on macOS is
  # Homebrew, which already mirrors via release.yml + the tap repo). Before
  # this job existed, every release shipped CLI changes to brew but left
  # pip/pipx users on the previous version — Win 351910cd hit exactly this
  # gap on 2026-06-07 when verifying ead9d5d.
  #
  # Trigger: `v*` tags created by release.yml. The legacy `release-v*` is
  # kept compatible by the same wildcard on `on.push.tags` above; this gate
  # narrows to `v*` because release.yml is the canonical 1-button path.
  #
  # Auth: uses PyPI Trusted Publishing (OIDC) — no long-lived token to
  # rotate. Requires a one-time registration on PyPI:
  #   pypi.org → Account settings → Publishing → Add a new pending publisher
  #     Owner:    kurogin23mech-source
  #     Repo:     beacon
  #     Workflow: release-build.yml
  #     Env:      pypi
  #
  # Safety: depends on BOTH `build-cli` AND `smoke-cli`. `smoke-cli` installs
  # the just-built wheel and runs `beacon doctor` on ubuntu/macos/windows
  # before this job is allowed to publish. A broken wheel can't reach PyPI
  # (which is irreversible — published artifacts can be yanked but not
  # re-uploaded for the same version).
  publish-pypi:
    name: Publish CLI to PyPI
    needs: [build-cli, smoke-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi   # GitHub Environment is where the maintainer pins
                        # protection rules (required reviewers, branch gates)
                        # to PyPI's trusted publisher contract.
    permissions:
      id-token: write   # Trusted Publishing exchanges this for a short-lived
                        # PyPI upload token. NO long-lived secret in the repo.
    steps:
      - name: Download CLI artifacts (sdist + wheel from build-cli)
        uses: actions/download-artifact@v4
        with:
          name: beacon-cli-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Default settings push to https://upload.pypi.org/legacy/.
        # If a future test should land on TestPyPI first, set:
        #   with:
        #     repository-url: https://test.pypi.org/legacy/
        # in a separate `publish-pypi-test` job gated on a different tag
        # prefix (e.g. `testpypi-v*`).
