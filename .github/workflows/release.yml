name: Release (CLI metadata + Homebrew tap)

# Runs scripts/release.py in CI: bump __version__ (lib/commands.py +
# beacon_cli/_version.py), push main, tag, create the GitHub release, update the
# Homebrew formula sha256, mirror it to the homebrew-beacon tap, and prepend a
# CHANGELOG entry. This was the last maintainer-side manual step in the release
# CORE doc (工程 13/14) — see docs/RELEASE_CI_SETUP.md.
#
# Relationship to the other release workflows (release CORE doc propagation map):
#   * release-build.yml    — builds CLI wheel + Desktop bundles (Tauri) on
#                            `release-v*` tags. Artifacts.
#   * deploy-cloud-run.yml — deploys server / Web UI to Cloud Run (工程 12).
#   * THIS workflow        — version/tag/formula/tap/CHANGELOG metadata (工程 13/14).
#
# SAFE TO MERGE: `workflow_dispatch` only, so it never fires on its own. It also
# requires the TAP_PUSH_TOKEN secret (a PAT with write access to the
# homebrew-beacon tap repo); without it the run fails fast with a clear message.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version tag (e.g. v0.7.3). Blank = auto-detect from commit prefixes.'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run (no commits / tags / pushes / tap mirror)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # push the bump commit + tag, create the GitHub release

concurrency:
  group: beacon-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history for version auto-detection)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # persist-credentials (default true) keeps the GITHUB_TOKEN on the
          # origin remote so release.py's `git push origin main` + tag push work.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config user.name  "beacon-release-bot"
          git config user.email "beacon-release-bot@users.noreply.github.com"

      - name: Guard — TAP_PUSH_TOKEN must be set
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "::error::TAP_PUSH_TOKEN secret is not set — cannot mirror the Homebrew formula. See docs/RELEASE_CI_SETUP.md."
            exit 1
          fi

      - name: Clone Homebrew tap with write credentials
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/kurogin23mech-source/homebrew-beacon.git" .tap
          git -C .tap config user.name  "beacon-release-bot"
          git -C .tap config user.email "beacon-release-bot@users.noreply.github.com"

      - name: Run release pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # used by `gh release create`
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--tap-path "$PWD/.tap" -y)
          if [ -n "$INPUT_VERSION" ]; then args+=(--version "$INPUT_VERSION"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          echo "Running: scripts/release.py ${args[*]}"
          python scripts/release.py "${args[@]}"

      - name: Fan out to downstream workflows (deploy-cloud-run)
        # GitHub deliberately suppresses workflow runs for pushes made with
        # GITHUB_TOKEN (loop guard). release.yml just pushed the version bump
        # + tag with GITHUB_TOKEN, so deploy-cloud-run.yml does NOT fire on
        # its own — production API would still serve the previous version
        # (e-953). Dispatch it explicitly and wait for completion so this run
        # surfaces deploy failures instead of silently succeeding.
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Read the version from the tag scripts/release.py just created.
          # NOTE: an earlier version of this step did
          #   python -c 'from lib.commands import __version__; print(__version__)'
          # which fails in CI because lib/commands.py imports a peer module
          # (`from store import get_store`) that bin/beacon normally puts on
          # sys.path. The bare `python -c` invocation does not, so the import
          # raises ModuleNotFoundError and the entire fan-out aborts after
          # the metadata release already published the tag — exactly the
          # 5-channel mismatch CORE doc rMlHx9n0LYFJ2kWIQELi P1 warns about
          # (caught by the v0.9.0 dogfood, ms-52 e-960).
          # `git describe` is dependency-free and reads the very tag that
          # release.py just pushed.
          set -o pipefail
          NEW_VERSION="$(git describe --tags --abbrev=0 --match='v[0-9]*' | sed 's/^v//')"
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Could not read released version from git describe — fan-out cannot proceed."
            exit 1
          fi
          echo "Released CLI version: ${NEW_VERSION}"

          # Capture the existing latest deploy run id (so we can wait on the NEW one).
          PREV_DEPLOY_ID="$(gh run list --workflow=deploy-cloud-run.yml --limit 1 --json databaseId -q '.[0].databaseId // 0')"

          echo "::group::Dispatch deploy-cloud-run.yml on main"
          gh workflow run deploy-cloud-run.yml --ref main
          echo "::endgroup::"

          # Poll for the newly dispatched run to appear (gh workflow run is async).
          NEW_DEPLOY_ID=""
          for i in $(seq 1 20); do
            sleep 3
            CANDIDATE="$(gh run list --workflow=deploy-cloud-run.yml --limit 1 --json databaseId -q '.[0].databaseId // 0')"
            if [ "$CANDIDATE" != "$PREV_DEPLOY_ID" ] && [ "$CANDIDATE" != "0" ]; then
              NEW_DEPLOY_ID="$CANDIDATE"
              break
            fi
          done
          if [ -z "$NEW_DEPLOY_ID" ]; then
            echo "::warning::deploy-cloud-run.yml dispatch did not surface a new run within 60s. Maintainer should re-trigger manually."
            exit 0
          fi
          echo "Watching deploy-cloud-run.yml run #${NEW_DEPLOY_ID}"
          gh run watch "$NEW_DEPLOY_ID" --exit-status || {
            echo "::error::deploy-cloud-run.yml run #${NEW_DEPLOY_ID} failed. Cloud Run deploy did not reach the new version."
            exit 1
          }

          # Confirm the bump actually reached production (CACHE_BUST 連携 — the
          # deploy uses the commit SHA so a successful run guarantees the new
          # image was built, but we double-check /health version to surface
          # rare misroutes / cache anomalies).
          HEALTH_OK=0
          for i in $(seq 1 20); do
            CURRENT="$(curl -fsS https://beacon-ai.dev/health | python -c 'import sys,json; print(json.load(sys.stdin).get("version","unknown"))')" || CURRENT="unreachable"
            if [ "$CURRENT" = "$NEW_VERSION" ]; then
              echo "production /health reports version ${CURRENT} — release reached prod"
              HEALTH_OK=1
              break
            fi
            echo "waiting for /health=${NEW_VERSION} (got '${CURRENT}', $i/20)"
            sleep 6
          done
          if [ "$HEALTH_OK" != "1" ]; then
            echo "::error::/health never reported version ${NEW_VERSION}. Investigate Cloud Run revision routing."
            exit 1
          fi

      - name: Fan out to downstream workflows (release-build, Tauri + wheel)
        # Same GITHUB_TOKEN loop-guard story as the deploy fan-out: the v* tag
        # was created with GITHUB_TOKEN so release-build.yml does NOT fire on
        # its tag-push trigger. Dispatch is the equivalent path (ms-52 e-954).
        # FIRE-AND-FORGET: the matrix builds Tauri on 4 OS targets and takes
        # ~10–30 min, so we don't block release.yml on it. Release artifacts
        # attach to the draft GitHub Release whenever release-build.yml
        # finishes; if it fails the maintainer can re-dispatch from Actions.
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Read the version from the tag scripts/release.py just created.
          # NOTE: an earlier version of this step did
          #   python -c 'from lib.commands import __version__; print(__version__)'
          # which fails in CI because lib/commands.py imports a peer module
          # (`from store import get_store`) that bin/beacon normally puts on
          # sys.path. The bare `python -c` invocation does not, so the import
          # raises ModuleNotFoundError and the entire fan-out aborts after
          # the metadata release already published the tag — exactly the
          # 5-channel mismatch CORE doc rMlHx9n0LYFJ2kWIQELi P1 warns about
          # (caught by the v0.9.0 dogfood, ms-52 e-960).
          # `git describe` is dependency-free and reads the very tag that
          # release.py just pushed.
          NEW_VERSION="$(git describe --tags --abbrev=0 --match='v[0-9]*' | sed 's/^v//')"
          NEW_TAG="v${NEW_VERSION}"
          echo "::group::Dispatch release-build.yml on ${NEW_TAG} (fire-and-forget)"
          if gh workflow run release-build.yml --ref "${NEW_TAG}" -f dry_run=false; then
            echo "release-build.yml dispatched on ${NEW_TAG}. Artifacts will appear on the draft GitHub Release when the matrix completes."
          else
            echo "::warning::Failed to dispatch release-build.yml on ${NEW_TAG}. Maintainer should run it manually from Actions."
          fi
          echo "::endgroup::"
