name: Deploy API to Cloud Run

# Deploys the server (FastAPI) + Web UI to Cloud Run — release CORE doc 工程 12,
# previously the only fully-manual production-reflection step. See
# docs/RELEASE_CI_SETUP.md for the one-time GCP Workload Identity Federation
# setup (no long-lived service-account keys are stored).
#
# SAFE TO MERGE: the deploy job is gated on the `GCP_PROJECT` repo *variable*
# being set, so it is skipped (no-op) until the maintainer configures GCP.
# CACHE_BUST is keyed on the commit SHA so Cloud Build never reuses a stale
# `lib/` copy layer (the e-712 class of bug where Python changes silently don't
# reach the image).

on:
  # ms-102 — RETIRED. ms-96 でバックエンドを VPS へ移行し Cloud Run は使っていない。
  # main への push で死んだ Cloud Run 環境へ空デプロイが飛ぶのを止めるため、push
  # トリガーを無効化した。本番デプロイは .github/workflows/deploy-vps.yml が担う。
  # ファイル自体は履歴 / 万一 Cloud Run へ戻す判断のため残す (workflow_dispatch のみ)。
  # push:
  #   branches: [main]
  #   paths:
  #     - 'server/**'
  #     - 'lib/**'
  #     - 'pyproject.toml'
  #     - 'Dockerfile'
  #     - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag attached to this deploy (e.g. v0.22.0). Optional; release.yml passes it during fan-out so the beacon deploy record can cross-reference the release (e-1274).'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    # Gate: skip entirely until GCP is configured. `vars.GCP_PROJECT` is a repo
    # variable (Settings → Secrets and variables → Actions → Variables).
    if: ${{ vars.GCP_PROJECT != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Record release tag (e-1274)
        # Surface the release tag (e.g. v0.22.0) into the workflow log + step
        # summary so reviewers can cross-reference this deploy with the release
        # without having to guess from timestamps. release.yml passes the tag
        # via workflow_dispatch input; direct path-trigger pushes leave it
        # blank (no associated tag — show "(none)" to make the absence loud).
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_VERSION:-(none)}"
          echo "beacon release tag for this deploy: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloud Run
        # Canonical command from the release CORE doc. --build-arg is NOT valid
        # for gcloud (Docker-CLI flag); --set-build-env-vars is the correct one.
        # CACHE_BUST is mandatory — see the workflow header.
        #
        # ms-84 / e-2303 — WS push 構造修復 (応急処置 A → 部分緩和):
        #   旧来は --max-instances=1 で物理的に single-instance に固定し、
        #   server/app.py の `_ws_connections` (= process-local dict, L6942)
        #   が multi-instance 環境で HTTP POST 着地 instance と WS connection
        #   instance が分離する経路 (= 着地 instance の _ws_connections が空で
        #   _broadcast_project_after_write が early return する) を回避していた。
        #
        # ms-95 / e-2448 (= 2026-06-25): 1 人運用でも fork や armed mode 等の
        #   多 session 利用が普通になり、 1 instance の CPU が飽和して 429 が
        #   多発する経路 (= e-2420 / e-2445 と同根) が観察された。 user 側で
        #   先行的に Cloud Run console で max-instances を 3 に上げて緩和した
        #   ため、 yaml もそれに合わせる (= console 変更が次の deploy で消えな
        #   いようにする)。
        #
        #   trade-off: max-instances=3 にすると _ws_connections の cross-
        #   instance 同期不在で WS broadcast の一部 instance loss が発生し得る。
        #   1 人運用 + 短時間 dogfood では着地確率が高く実害は軽微だが、 本格
        #   解消は別 task (= ms-95 e-2448 follow-up) の Pub/Sub fanout 実装で
        #   行う。 SPEC は beacon doc `ms-84 / e-2303 SPEC: WS push 構造修復`
        #   を case B (= Pub/Sub) で更新予定。
        #
        # ms-84 / e-2322 — Cloud Run request timeout 延長 (e-2303 続き):
        #   Cloud Run の request timeout default は 5 分 (300 秒)。 WebSocket は
        #   1 connection = 1 request 扱いで 5 分で server 側自動切断 → client
        #   onclose → 3 秒後 reconnect の周期 loop が起き、 write タイミングが
        #   reconnect の dead window にハマると broadcast が live client に届かず
        #   live 反映が体感できなくなる (= 2026-06-23 dogfood で e-2303 + 30 日
        #   session 反映後も WS push が出ない症状の真因)。 --timeout=3600 で
        #   60 分 (Cloud Run の最大値) に延長し、 通常使用での reconnect 頻度を
        #   12 倍緩和する。 60 分超 idle / heartbeat 欠落 の根本修復は別 task
        #   (= ms-46 e-766 reconnect 戦略 SHARED 化) で扱う。
        run: |
          gcloud run deploy beacon-api-prod \
            --source . \
            --project "${{ vars.GCP_PROJECT }}" \
            --region asia-northeast1 \
            --set-build-env-vars=CACHE_BUST=${{ github.sha }} \
            --min-instances=1 \
            --max-instances=3 \
            --timeout=3600 \
            --quiet

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://beacon-ai.dev/health | grep -q '"status"'; then
              echo "health OK"
              exit 0
            fi
            echo "waiting for health... ($i/10)"
            sleep 6
          done
          echo "::error::health check did not pass after deploy"
          exit 1
