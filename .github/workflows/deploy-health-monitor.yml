name: Deploy health monitor (ms-105 e-3230)

# Independent watchdog for the 2026-07-10 incident: the pull-deploy (VPS polls
# main and self-updates) stalled for 3 days and was noticed only by accident.
# This runs on GitHub's infra — OUTSIDE the monitored VPS — so a fully-down box
# is still caught (a monitor on the box can't report its own outage).
#
# Every ~10 min it fetches production's live git revision from /api/version,
# compares it to the `deployed-prod` git tag — the deploy marker moved by
# `beacon deploy record` to the rev we intended to deploy (with a grace window
# so an in-flight deploy isn't misread as stuck) — and on a stuck / unreachable
# prod sends a beacon-bus DM to the deploying session (or the owner's live
# session). See scripts/deploy-health-monitor.py + lib/deploy_health.py.
#
# Why the marker, not origin/main HEAD (the original basis): the VPS pull-timer
# that made prod auto-track main was disabled 2026-07-28, so "prod behind main"
# became the normal state and reddened this job every tick. The marker is a
# git-native truth source for "what prod should serve" independent of whether
# auto-deploy is on, readable here token-free.
#
# Required repo configuration (Settings → Secrets and variables → Actions):
#   * secret  BEACON_DEPLOY_MONITOR_TOKEN — a beacon cloud id-token the CLI uses
#             to send the DM. Without it detection still runs but the send fails
#             (the job then goes red, which is itself a visible signal).
#   * variable BEACON_OWNER_USER_ID       — fallback DM recipient (project owner
#             user_id) when no session sits at the deployed revision.
#   * variable BEACON_PROD_URL (optional) — defaults to https://beacon-ai.dev
#
# Caveat (design): the beacon-bus backend is co-located with prod, so a fully
# DOWN box can't receive the DM (the bus is down too). This covers the
# stuck-deploy class (server up, serving stale code = the actual incident); a
# total outage needs an external channel (Discord/email), out of scope here.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}

# Serialize runs so an overlapping tick can't double-alert; cancel the older.
concurrency:
  group: deploy-health-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags: the monitor resolves the `deployed-prod` tag and
          # does an ancestry check (prod behind the marker = stuck vs ahead =
          # unrecorded deploy), which needs prod's — possibly older — rev present.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Install the repo so the `beacon` CLI (used to resolve live sessions and
      # send the DM) is on PATH. Detection itself only imports lib/deploy_health.
      - name: Install beacon CLI
        run: pip install -e .

      # ms-145 e-5318: surface a mis-wired notification path NOW, as a standing
      # warning on the run — instead of discovering it only during a real outage
      # when the alert DM silently fails to send. Non-failing on purpose: the fix
      # is a human action in repo Settings (the token is a secret, never in code),
      # so a warning that persists until configured is the right forcing function.
      - name: Preflight — notification path configured?
        env:
          TOKEN: ${{ secrets.BEACON_DEPLOY_MONITOR_TOKEN }}
          OWNER: ${{ vars.BEACON_OWNER_USER_ID }}
        run: |
          ok=1
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Deploy monitor: alert token unset::BEACON_DEPLOY_MONITOR_TOKEN secret is empty — outage detection still runs, but the alert DM cannot be sent. Set it in Settings → Secrets and variables → Actions (see workflow header). ms-145 e-5318"
            ok=0
          fi
          if [ -z "$OWNER" ]; then
            echo "::warning title=Deploy monitor: owner fallback unset::BEACON_OWNER_USER_ID variable is empty — alerts have no fallback recipient when no session sits at the deployed rev. Set it as a repo variable. ms-145 e-5318"
            ok=0
          fi
          [ "$ok" = 1 ] && echo "notification path configured (token + owner present)"
          exit 0

      # Persist the "last alerted rev" between runs so a persistent stuck deploy
      # alerts once per rev, not every 10 minutes.
      - name: Restore alert dedup state
        uses: actions/cache@v4
        with:
          path: .beacon/.deploy-health-alerted
          key: deploy-health-alerted-${{ github.run_id }}
          restore-keys: |
            deploy-health-alerted-

      - name: Run monitor
        env:
          BEACON_PROD_URL: ${{ vars.BEACON_PROD_URL }}
          BEACON_OWNER_USER_ID: ${{ vars.BEACON_OWNER_USER_ID }}
          BEACON_CLOUD_ID_TOKEN: ${{ secrets.BEACON_DEPLOY_MONITOR_TOKEN }}
          # Single source of truth for the marker ref name — the script reads it
          # via argparse's env default, so the literal lives here only (was also
          # hardcoded in a --marker-ref flag; maintainability review 2026-07-30).
          BEACON_DEPLOY_MARKER_REF: deployed-prod
        run: |
          python3 scripts/deploy-health-monitor.py \
            --prod-url "${BEACON_PROD_URL:-https://beacon-ai.dev}" \
            --owner-user-id "${BEACON_OWNER_USER_ID:-}" \
            --state-file .beacon/.deploy-health-alerted

      # e-1391 (ms-66) — twin watchdog for the periodic TICK (Trek/Operation
      # autonomy driver), a different silent-death mode than a stale deploy: the
      # box can be serving fresh code yet no longer ticking (the migration
      # incident). Reuses the same infra/secrets; separate dedup state so a dead
      # tick and a stuck deploy alert independently.
      - name: Restore tick-health dedup state
        uses: actions/cache@v4
        with:
          path: .beacon/.tick-health-alerted
          key: tick-health-alerted-${{ github.run_id }}
          restore-keys: |
            tick-health-alerted-

      - name: Run tick monitor
        env:
          BEACON_PROD_URL: ${{ vars.BEACON_PROD_URL }}
          BEACON_OWNER_USER_ID: ${{ vars.BEACON_OWNER_USER_ID }}
          BEACON_CLOUD_ID_TOKEN: ${{ secrets.BEACON_DEPLOY_MONITOR_TOKEN }}
        run: |
          python3 scripts/tick-health-monitor.py \
            --prod-url "${BEACON_PROD_URL:-https://beacon-ai.dev}" \
            --owner-user-id "${BEACON_OWNER_USER_ID:-}" \
            --state-file .beacon/.tick-health-alerted
