<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beacon 盤</title>
<style>
  :root {
    color-scheme: light dark;
    --line: color-mix(in srgb, currentColor 14%, transparent);
    --dim: color-mix(in srgb, currentColor 55%, transparent);
    --faint: color-mix(in srgb, currentColor 8%, transparent);
    --live: #3fb950;
    --active: #58a6ff;
    --idle: #8b949e;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 60px;
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 1100px; margin-inline: auto;
  }

  /* --- 見出し --- */
  header { margin-bottom: 18px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .objective { color: var(--dim); font-size: 13px; }
  /* 前回までの経緯。長いので折り返しつつ、主役の邪魔をしない濃さにする。 */
  .summary {
    color: var(--dim); font-size: 12px; margin-top: 6px;
    padding-left: 10px; border-left: 2px solid var(--line);
  }
  .meta { color: var(--dim); font-size: 11px; margin-top: 6px; }
  .meta b { font-weight: 600; }

  /* --- 稼働帯 --- */
  .band {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 16px 0 6px;
    background: var(--faint);
  }
  .band-title {
    font-size: 11px; letter-spacing: .08em; color: var(--dim);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .sessions { display: flex; gap: 10px; flex-wrap: wrap; }
  .session {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; min-width: 190px; flex: 1 1 200px;
    background: color-mix(in srgb, currentColor 3%, transparent);
  }
  .session .who { font-weight: 600; font-size: 13px; }
  .session .sub { color: var(--dim); font-size: 11px; }
  .session .target {
    display: inline-block; margin-top: 6px; font-size: 12px;
    padding: 1px 7px; border-radius: 4px;
    background: color-mix(in srgb, var(--active) 18%, transparent);
  }
  .session .commit {
    margin-top: 5px; font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 5px; vertical-align: 1px; background: var(--idle);
  }
  .dot.on { background: var(--live); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* --- 一覧 --- */
  .rows { margin-top: 4px; }
  .row {
    border-bottom: 1px solid var(--line);
    padding: 9px 4px;
    display: grid; grid-template-columns: 74px 1fr 128px 96px;
    gap: 12px; align-items: center;
    cursor: pointer;
  }
  .row:hover { background: var(--faint); }
  .row .id { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done { color: var(--dim); }
  .who-badge {
    font-size: 11px; padding: 1px 7px; border-radius: 4px;
    background: color-mix(in srgb, var(--active) 18%, transparent);
    white-space: nowrap;
  }
  /* このマシンで拾ったセッションは、Beacon の名簿と見分けが付くようにする。 */
  .session.local { border-style: dashed; }
  /* 推測で出しているものは、確かなものと見分けが付くようにする。 */
  .target.guess {
    background: transparent; border: 1px dashed var(--line);
  }
  .qmark { font-size: 10px; opacity: .7; }
  .who-badge.guess { background: transparent; border: 1px dashed var(--line); }
  .nobody { font-size: 11px; color: var(--dim); }
  .bar { height: 5px; border-radius: 3px; background: var(--faint); position: relative; }
  .bar span {
    display: block; height: 100%; border-radius: 3px;
    background: currentColor; opacity: .45;
  }
  .count { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* --- 詳細 --- */
  .detail { padding: 4px 4px 14px 74px; border-bottom: 1px solid var(--line); }
  .item {
    display: grid; grid-template-columns: 68px 1fr 78px;
    gap: 10px; padding: 3px 0; font-size: 12.5px;
  }
  .item .iid { color: var(--dim); font-variant-numeric: tabular-nums; }
  .item.done { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1px; }
  .item .kind { font-size: 11px; color: var(--dim); }
  .loading { color: var(--dim); font-size: 12px; padding: 6px 0; }

  /* --- 折りたたみ --- */
  .group { margin-top: 18px; }
  .group > summary {
    cursor: pointer; color: var(--dim); font-size: 12px;
    padding: 6px 0; list-style: none;
  }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: "▶ "; font-size: 10px; }
  .group[open] > summary::before { content: "▼ "; }

  .notice {
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border-radius: 8px; padding: 9px 12px; margin: 14px 0;
    font-size: 12.5px;
  }
  .linkish {
    font: inherit; font-size: 11px; color: inherit; opacity: .8;
    background: transparent; border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 8px; cursor: pointer;
  }
  .linkish:hover { opacity: 1; background: var(--faint); }
  .err { color: #f85149; }
  .empty { color: var(--dim); font-size: 12.5px; padding: 4px 0; }
  .section-title {
    font-size: 11px; letter-spacing: .08em; color: var(--dim);
    text-transform: uppercase; margin: 22px 0 4px;
  }
</style>

<div id="app"><p class="loading">読み込み中…</p></div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 開いている詳細を覚えておく。自動更新で勝手に閉じると、読んでいる最中に
// 消えてしまい使い物にならないため。
const opened = new Set();
let lastBoard = null;
// 直前に描いた盤の中身。**変わっていなければ画面に触らない**。
// 5 秒ごとに作り直すと、見ている最中に点滅して読めなくなる (2026-09-09 の指摘)。
let lastBoardJSON = "";
// 開いた詳細の中身を覚えておく。画面を作り直したときに取り直さず戻せるようにする。
const detailCache = new Map();
// いま何を読んでいるか (盤の形には含めない情報なので、別に持つ)。
let viewerState = {};
// 選ぶ画面を開いている間は自動更新を止める。止めないと、入力している最中に
// 盤へ戻されてしまう。
let pickerOpen = false;
// 開いている組 (未着手 / 完了 / ドキュメント)。**画面を作り直しても開いたままにする。**
// ローカルセッションの最終活動時刻は数秒ごとに変わるため盤は頻繁に更新される。
// 状態を引き継がないと、読んでいる最中に組が閉じてしまう (2026-09-09 の指摘)。
const openGroups = new Set();

// 経過時間の表示だけを、画面を作り直さずに書き換える。
function updateTimes() {
  for (const el of document.querySelectorAll("[data-ts]")) {
    el.textContent = ago(el.dataset.ts);
  }
}

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return Math.floor(s) + " 秒前";
  if (s < 3600) return Math.floor(s / 60) + " 分前";
  if (s < 86400) return Math.floor(s / 3600) + " 時間前";
  return Math.floor(s / 86400) + " 日前";
}

function sessionCard(s) {
  const commit = s.branch || s.head_subject
    ? `<div class="commit">${esc(s.branch)}${
        s.head_subject ? " · " + esc(s.head_subject) : ""}</div>`
    : "";
  return `<div class="session">
    <div class="who"><span class="dot ${s.live ? "on" : ""}"></span>${esc(s.who) || "(不明)"}</div>
    <div class="sub">${esc(s.agent)}${s.machine ? " · " + esc(s.machine) : ""}</div>
    ${s.target ? `<div class="target">${esc(s.target)}</div>` : ""}
    ${commit}
    <div class="sub">${s.live ? "稼働中" : "停止"}${s.last_active
      ? ` · <span data-ts="${esc(s.last_active)}">${ago(s.last_active)}</span>`
      : ""}</div>
  </div>`;
}

// このマシンで拾ったセッションの札。Beacon の名簿とは見分けが付く形にする
// (届く範囲が違うので、同じ見た目にしてはいけない)。
function localCard(s) {
  // 呼び名が分かるものは呼び名を主役にする (どのセッションかを人が識別できる)。
  const head = s.name || s.tool;
  const sub = s.name ? s.tool : "";
  // 状態は道具が申告しているものをそのまま出す (作業中 / 待機)。
  const state = s.state === "busy" ? "作業中"
              : s.state === "idle" ? "待機中"
              : s.running ? "起動中" : "停止";
  return `<div class="session local">
    <div class="who"><span class="dot ${
      s.state === "busy" ? "on" : s.running ? "on" : ""}"></span>${esc(head)}</div>
    ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
    ${s.title ? `<div class="sub">${esc(s.title)}</div>` : ""}
    ${s.target_guess ? `<div class="target guess"
      title="ブランチ名からの推測です。Beacon に名乗っていないセッションには担当が付きません"
      >${esc(s.target_guess)} <span class="qmark">推測</span></div>` : ""}
    ${s.branch ? `<div class="commit">${esc(s.branch)}</div>` : ""}
    <div class="commit" title="${esc(s.directory)}">${esc(s.directory)}</div>
    <div class="sub">${esc(state)}${s.last_active
      ? ` · <span data-ts="${esc(s.last_active)}">${ago(s.last_active)}</span>`
      : ""}</div>
  </div>`;
}

// どの対象に誰が付いているかを引ける形にする。
function sessionsByTarget(board) {
  const map = {};
  for (const s of board.sessions || []) {
    if (!s.target) continue;
    (map[s.target] = map[s.target] || []).push(s);
  }
  return map;
}

// rosterKnown: セッションの名簿が取れているか。
//
// 取れていないときに「無人」と出してはいけない。放置されているのではなく
// **こちらから見えていないだけ**であり、見えていないものを「無い」と誤認させるのは
// このプロジェクトが繰り返し戦ってきた病理そのもの (doc lM9gHMOAm8VK2xZGKfEe)。
function targetRow(t, owners, rosterKnown, guessed) {
  const w = t.work_items || {};
  const pct = w.total ? Math.round(w.done / w.total * 100) : 0;
  // 名乗っている担当。確かな情報。
  const named = owners.map(
    o => `<span class="who-badge">${esc(o.who.split("@")[0])}</span>`);
  // ブランチ名からの推測。確かなものと見分けが付く形で添える。
  const guesses = (guessed[t.id] || []).map(
    g => `<span class="who-badge guess"
            title="ブランチ名からの推測です">${esc(g)}</span>`);
  const who = named.length || guesses.length
    ? named.concat(guesses).join(" ")
    : (rosterKnown && t.is_open ? `<span class="nobody">無人</span>` : "");
  return `<div class="row ${t.is_done ? "done" : ""}" data-id="${esc(t.id)}">
      <div class="id">${esc(t.id)}</div>
      <div class="label" title="${esc(t.label)}">${esc(t.label)}</div>
      <div><div class="bar"><span style="width:${pct}%"></span></div>
           <div class="count">${w.done}/${w.total} · ${esc(t.status)}</div></div>
      <div>${who}</div>
    </div>
    <div class="detail" id="d-${esc(t.id)}" hidden></div>`;
}

async function loadDetail(id) {
  const box = document.getElementById("d-" + id);
  if (!box) return;
  box.hidden = false;
  // 一度読んだものは覚えてあるので、まずそれを戻す。画面を作り直した直後でも
  // 「読み込み中…」を挟まずに済み、点滅しない。
  if (detailCache.has(id)) {
    box.innerHTML = detailCache.get(id);
    box.dataset.loaded = "1";
    return;
  }
  box.innerHTML = `<p class="loading">読み込み中…</p>`;
  try {
    const r = await fetch("/api/target/" + encodeURIComponent(id));
    const d = await r.json();
    if (d.error) { box.innerHTML = `<p class="err">${esc(d.error)}</p>`; return; }
    const items = d.items || [];
    // 子の記録も描く。消化数は入れ子まで数えているので、ここで親だけ描くと
    // 「17 件表示なのに 24 件中」のように食い違って見える。
    const row = (i, depth) => `<div class="item ${i.is_done ? "done" : ""}">
          <div class="iid" style="padding-left:${depth * 12}px">${esc(i.id)}</div>
          <div>${esc(i.description)}</div>
          <div class="kind">${esc(i.type)} · ${esc(i.status)}</div>
        </div>` + (i.children || []).map(c => row(c, depth + 1)).join("");
    const html = items.length
      ? items.map(i => row(i, 0)).join("")
      : `<p class="empty">記録はありません。</p>`;
    detailCache.set(id, html);
    box.innerHTML = html;
    box.dataset.loaded = "1";
  } catch (e) {
    box.innerHTML = `<p class="err">詳細を読めませんでした: ${esc(e)}</p>`;
  }
}

function wireRows() {
  for (const row of document.querySelectorAll(".row")) {
    row.onclick = () => {
      const id = row.dataset.id;
      const box = document.getElementById("d-" + id);
      if (opened.has(id)) { opened.delete(id); box.hidden = true; }
      else { opened.add(id); loadDetail(id); }
    };
  }
  // 更新をまたいでも、開いていた詳細は開いたままにする。
  // ただし **中身が変わっていない限り取り直さない**。毎回取り直すと、読んでいる
  // 最中に「読み込み中…」へ戻って点滅する (2026-09-09 の指摘)。
  for (const id of opened) {
    const box = document.getElementById("d-" + id);
    if (box) box.hidden = false;
    if (!box || !box.dataset.loaded) loadDetail(id);
  }
}

// 一度に描く行数。対象が数百件あるプロジェクトでは、全部描くと開いた瞬間に
// 固まる (2026-09-09 の指摘)。畳んでいる組は **開くまで描かない**。
const PAGE_SIZE = 50;

// 畳んだ組。中身は開いたときに初めて描く。
function group(key, title, rows) {
  if (!rows.length) return "";
  return `<details class="group" data-group="${key}"${openGroups.has(key) ? " open" : ""}>
    <summary>${esc(title)} (${rows.length})</summary>
    <div class="rows" id="g-${key}"></div>
  </details>`;
}

// 組の中身を描く。多いときは少しずつ足す。
function fillGroup(key, rows, owners, rosterKnown, guessed) {
  const box = document.getElementById("g-" + key);
  if (!box || box.dataset.filled) return;
  let shown = 0;
  const more = () => {
    const slice = rows.slice(shown, shown + PAGE_SIZE);
    shown += slice.length;
    const html = slice.map(t => targetRow(t, owners[t.id] || [], rosterKnown, guessed)).join("");
    const btn = box.querySelector(".more");
    if (btn) btn.remove();
    box.insertAdjacentHTML("beforeend", html);
    if (shown < rows.length) {
      box.insertAdjacentHTML("beforeend",
        `<button class="more linkish" style="margin:10px 0;">
           のこり ${rows.length - shown} 件を表示</button>`);
      box.querySelector(".more").onclick = more;
    }
    wireRows();
  };
  more();
  box.dataset.filled = "1";
}

function render(board) {
  lastBoard = board;
  const p = board.project || {}, g = board.progress || {};
  const src = board.source || {};
  const owners = sessionsByTarget(board);

  const targets = board.targets || [];
  // 既定は「進行中」と「担当者が付いているもの」。残りは畳んでおく。
  const focus = targets.filter(t => t.status === "in_progress" || owners[t.id]);
  const todo = targets.filter(t => !focus.includes(t) && t.is_open);
  const closed = targets.filter(t => !t.is_open);

  const sessions = board.sessions || [];
  const local = board.local_sessions || [];
  const docs = board.documents || [];
  const ops = board.operations || [];
  const rels = board.releases || [];
  const deps = board.deployments || [];
  // 終わらない仕事のうち、いま回っているものだけを表に出す (閉じたものは畳む)。
  const opsOpen = ops.filter(o => o.status === "open" || o.status === "in_progress");
  // 1 件でも名簿が取れていれば「誰も付いていない対象」は本当に無人と言える。
  // 1 件も無いときは、名簿そのものが取れていないだけの可能性が高い。
  const rosterKnown = sessions.length > 0;
  // ブランチ名から推測した担当。どの対象に、どのセッションが乗っているか。
  const guessed = {};
  for (const s of local) {
    if (!s.target_guess) continue;
    (guessed[s.target_guess] = guessed[s.target_guess] || [])
      .push(s.name || s.tool);
  }
  const notice = board.unsupported
    ? `<div class="notice">${esc(board.unsupported.reason)}
         (${board.unsupported.target_class_count} 件:
          ${(board.unsupported.target_class_names || []).map(esc).join(" / ")})</div>`
    : "";

  document.getElementById("app").innerHTML = `
    <header>
      <h1>${esc(p.name)}</h1>
      <div class="objective">${esc(p.objective)}</div>
      ${p.summary ? `<div class="summary">${esc(p.summary)}</div>` : ""}
      <div class="meta">
        <b>${g.total}</b> 対象 · 完了 <b>${g.done}</b> · 進行中 <b>${g.open}</b>
        &nbsp;·&nbsp; 取得元: ${esc(src.kind)}${
          src.project_id ? " / " + esc(src.project_id) : ""}
        &nbsp;·&nbsp; 職種: ${esc(p.profession)}
        &nbsp;·&nbsp; <button id="switch" class="linkish">別のプロジェクトを開く</button>
      </div>
    </header>

    ${notice}

    <div class="band">
      <div class="band-title">Beacon に名乗っているセッション ${sessions.length}</div>
      ${sessions.length
        ? `<div class="sessions">${sessions.map(sessionCard).join("")}</div>`
        : `<p class="empty">名乗っているセッションがありません。
             このプロジェクトがクラウドに結び付いていないか、ログインしていないか、
             いま誰も Beacon に名乗って作業していないかのいずれかです。
             <br>このため、下の一覧でも担当の有無は表示していません
             (「誰も居ない」と「見えていない」を区別できないため)。</p>`}
    </div>

    ${local.length ? `<div class="band">
      <div class="band-title">このマシンで動いているセッション ${local.length}</div>
      <div class="sessions">${local.map(localCard).join("")}</div>
      <p class="empty" style="margin-top:8px;">Beacon に名乗っていないセッションを、
        このマシンの記録から拾ったものです。<b>他のマシンの分は見えません</b>
        (何も送っていないため、届く経路がありません)。</p>
    </div>` : ""}

    ${opsOpen.length ? `<div class="band">
      <div class="band-title">回り続けている仕事 ${opsOpen.length}</div>
      <div class="sessions">${opsOpen.map(o => `<div class="session">
        <div class="who">${esc(o.title)}</div>
        <div class="sub">${esc(o.id)}${o.frequency ? " · " + esc(o.frequency) : ""}</div>
        <div class="sub">${esc(o.status)}</div>
      </div>`).join("")}</div>
      <p class="empty" style="margin-top:8px;">マイルストーンは「いつか終わるもの」ですが、
        監視や定期実行は終わりません。両方を見ないと、いま何が動いているかは分かりません。</p>
    </div>` : ""}

    <div class="section-title">進行中 / 担当あり (${focus.length})</div>
    <div class="rows" id="g-focus">${focus.length ? "" :
      `<p class="empty">進行中の対象はありません。</p>`}</div>

    ${docs.length ? `<details class="group" data-group="docs"${
      openGroups.has("docs") ? " open" : ""}>
      <summary>ドキュメント (${docs.length})</summary>
      <div class="rows" id="g-docs"></div>
    </details>` : ""}

    ${rels.length ? `<details class="group" data-group="rels"${
      openGroups.has("rels") ? " open" : ""}>
      <summary>直近の出荷 (${rels.length})</summary>
      <div class="rows">${rels.slice().reverse().map(r => `<div class="row"
          style="cursor:default">
          <div class="id">${esc(r.version)}</div>
          <div class="label" title="${esc(r.description)}">${esc(r.description)}</div>
          <div class="count">${esc((r.date || "").slice(0, 10))}</div>
          <div></div>
        </div>`).join("")}</div>
    </details>` : ""}

    ${deps.length ? `<details class="group" data-group="deps"${
      openGroups.has("deps") ? " open" : ""}>
      <summary>直近の配置 (${deps.length})</summary>
      <div class="rows">${deps.slice().reverse().map(d => `<div class="row"
          style="cursor:default">
          <div class="id">${esc(d.environment)}</div>
          <div class="label" title="${esc(d.description)}">${esc(d.description)}</div>
          <div class="count">${esc((d.date || "").slice(0, 10))}</div>
          <div></div>
        </div>`).join("")}</div>
    </details>` : ""}

    ${group("todo", "未着手", todo)}
    ${group("closed", "完了・観察中", closed)}
  `;
  wireRows();
  document.getElementById("switch").onclick = openPicker;

  // 進行中の組は既定で開いているので、その場で描く (多ければ分割して足す)。
  if (focus.length) fillGroup("focus", focus, owners, rosterKnown, guessed);

  // 畳んだ組は、開かれたときに初めて中身を描く。
  const docsEl = document.querySelector('[data-group="docs"]');
  if (docsEl) {
    const fillDocs = () => {
      const box = document.getElementById("g-docs");
      if (!box || box.dataset.filled) return;
      let shown = 0;
      const more = () => {
        const slice = docs.slice(shown, shown + PAGE_SIZE);
        shown += slice.length;
        const btn = box.querySelector(".more");
        if (btn) btn.remove();
        box.insertAdjacentHTML("beforeend", slice.map(d => `<div class="row"
            style="grid-template-columns:74px 1fr 128px 96px; cursor:default">
            <div class="id">${esc(d.scope)}</div>
            <div class="label" title="${esc(d.title)}">${esc(d.title)}</div>
            <div class="count">${esc((d.updated_at || "").slice(0, 10))}</div>
            <div class="count">${esc(d.target || "")}</div>
          </div>`).join(""));
        if (shown < docs.length) {
          box.insertAdjacentHTML("beforeend",
            `<button class="more linkish" style="margin:10px 0;">
               のこり ${docs.length - shown} 件を表示</button>`);
          box.querySelector(".more").onclick = more;
        }
      };
      more();
      box.dataset.filled = "1";
    };
    docsEl.ontoggle = () => {
      if (docsEl.open) { openGroups.add("docs"); fillDocs(); }
      else openGroups.delete("docs");
    };
    if (docsEl.open) fillDocs();
  }

  // 出荷・配置は件数が少ないので、その場で描いてある。開閉だけ覚える。
  for (const key of ["rels", "deps"]) {
    const el = document.querySelector(`[data-group="${key}"]`);
    if (!el) continue;
    el.ontoggle = () => {
      if (el.open) openGroups.add(key); else openGroups.delete(key);
    };
  }

  for (const [key, rows] of [["todo", todo], ["closed", closed]]) {
    const el = document.querySelector(`[data-group="${key}"]`);
    if (!el) continue;
    el.ontoggle = () => {
      if (el.open) { openGroups.add(key); fillGroup(key, rows, owners, rosterKnown, guessed); }
      else openGroups.delete(key);
    };
    if (el.open) fillGroup(key, rows, owners, rosterKnown, guessed);
  }
}

// --- プロジェクトがまだ決まっていないとき ---------------------------------
// 「見つかりません」で終わらせず、その場で選べるようにする。実行ファイルを配って
// もらった人にとって、起動場所に .beacon が無いのは異常ではなく普通のこと。
function renderPicker(state) {
  const cloud = !state.cloud_available
    ? `<p class="empty">${esc(state.cloud_reason || "クラウドはまだ使えません")}</p>`
    : state.cloud_signed_in
      ? `<p class="empty">${esc(state.cloud_signed_in)} でログイン中。</p>
         <div id="projects" class="loading">プロジェクトを読み込んでいます…</div>`
      : `<p class="empty">ログインすると、参加しているプロジェクトを選べます。
           他のマシンで動いているセッションも見えるようになります。</p>
         <button id="login" style="margin-top:8px; padding:7px 16px; font:inherit;
           cursor:pointer; border:1px solid var(--line); border-radius:6px;
           background:transparent; color:inherit;">ログインする</button>
         <p id="loginmsg" class="empty"></p>`;
  // 既に何かを開いているなら、やめて戻れるようにする。切り替えるつもりで押した人を
  // 行き止まりにしない。
  const back = state.has_project
    ? `<button id="back" class="linkish">やめて戻る</button>`
    : "";
  const where = state.has_project
    ? `いま開いているのは ${esc(state.path || "")} です。`
    : `探した場所: ${esc(state.cwd || "")} — ここと、その上のフォルダに
       Beacon のデータがありませんでした。`;
  document.getElementById("app").innerHTML = `
    <header>
      <h1>Beacon 盤</h1>
      <div class="objective">見るプロジェクトを選んでください。 ${back}</div>
      <div class="meta">${where}</div>
    </header>
    <div class="band">
      <div class="band-title">フォルダから開く</div>
      <p class="empty">Beacon プロジェクトの場所 (.beacon があるフォルダ、
        またはそれを含むフォルダ) を選ぶか、貼り付けてください。</p>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <input id="path" type="text" style="flex:1; padding:7px 10px; font:inherit;
          border:1px solid var(--line); border-radius:6px; background:transparent;
          color:inherit;" placeholder="C:\\Users\\… \\my-project">
        ${state.picker_available !== false ? `<button id="browse"
          style="padding:7px 14px; font:inherit; cursor:pointer;
          border:1px solid var(--line); border-radius:6px; background:transparent;
          color:inherit;">選ぶ…</button>` : ""}
        <button id="open" style="padding:7px 16px; font:inherit; cursor:pointer;
          border:1px solid var(--line); border-radius:6px; background:transparent;
          color:inherit;">開く</button>
      </div>
      <p id="msg" class="err" style="margin-top:8px;"></p>
    </div>
    <div class="band">
      <div class="band-title">クラウドから開く</div>
      ${cloud}
    </div>`;

  const input = document.getElementById("path");
  const msg = document.getElementById("msg");
  const submit = async () => {
    const path = input.value.trim();
    if (!path) return;
    msg.textContent = "開いています…";
    try {
      const r = await fetch("/api/open", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({path}),
      });
      const d = await r.json();
      if (!r.ok || d.error) { msg.textContent = d.error || "開けませんでした"; return; }
      // 開けたら盤へ。以後は通常の更新に乗る。
      pickerOpen = false;
      lastBoardJSON = "";
      detailCache.clear();
      opened.clear();
      refresh();
    } catch (e) {
      msg.textContent = "開けませんでした: " + e;
    }
  };
  // --- クラウド ---
  const projectsBox = document.getElementById("projects");
  if (projectsBox) loadCloudProjects(projectsBox);

  const loginBtn = document.getElementById("login");
  if (loginBtn) loginBtn.onclick = async () => {
    const lm = document.getElementById("loginmsg");
    loginBtn.disabled = true;
    try {
      const st = await (await fetch("/api/cloud/login-start", {method: "POST"})).json();
      if (st.error) { lm.textContent = st.error; loginBtn.disabled = false; return; }
      // 承認の画面はこの機械のブラウザで開く。開けなかった人のために住所も出す。
      lm.innerHTML = `ブラウザで承認してください。合図の符号: <b>${esc(st.code)}</b>
        <br><a href="${esc(st.url)}" target="_blank">${esc(st.url)}</a>
        <br>承認を待っています…`;
      // 承認されるまで確認し続ける。有効期限が切れたらその旨を伝える。
      const until = Date.now() + (st.expires_in || 300) * 1000;
      const tick = async () => {
        if (Date.now() > until) {
          lm.textContent = "承認されないまま期限が切れました。もう一度お試しください。";
          loginBtn.disabled = false;
          return;
        }
        try {
          const d = await (await fetch("/api/cloud/login-poll")).json();
          if (d.error) { lm.textContent = d.error; loginBtn.disabled = false; return; }
          if (d.status === "approved") { openPicker(); return; }
        } catch (e) { /* 一時的に取れなくても待ち続ける */ }
        setTimeout(tick, 2000);
      };
      setTimeout(tick, 2000);
    } catch (e) {
      lm.textContent = "ログインを始められませんでした: " + e;
      loginBtn.disabled = false;
    }
  };

  const browse = document.getElementById("browse");
  if (browse) browse.onclick = async () => {
    msg.textContent = "選択ダイアログを開いています…";
    try {
      const r = await fetch("/api/pick-folder");
      const d = await r.json();
      if (d.error) { msg.textContent = d.error; return; }
      msg.textContent = "";
      // 選ばずに閉じた場合は空。何も起きなかったことにする。
      if (d.path) { input.value = d.path; submit(); }
    } catch (e) {
      msg.textContent = "選択ダイアログを開けませんでした: " + e;
    }
  };
  document.getElementById("open").onclick = submit;
  input.onkeydown = e => { if (e.key === "Enter") submit(); };
  if (state.has_project) input.value = state.path || "";
  input.focus();

  const backBtn = document.getElementById("back");
  if (backBtn) backBtn.onclick = () => {
    pickerOpen = false; lastBoardJSON = ""; refresh();
  };
}

async function loadCloudProjects(box) {
  try {
    const r = await fetch("/api/cloud/projects");
    const list = await r.json();
    if (list.error) { box.innerHTML = `<p class="empty">${esc(list.error)}</p>`; return; }
    if (!list.length) {
      box.innerHTML = `<p class="empty">参加しているプロジェクトがありません。</p>`;
      return;
    }
    box.className = "sessions";
    box.innerHTML = list.map(p => `<div class="session" style="cursor:pointer"
        data-pid="${esc(p.id)}">
        <div class="who">${esc(p.name)}</div>
        <div class="sub">${esc(p.id)} · ${esc(p.role)}</div>
      </div>`).join("");
    for (const card of box.querySelectorAll("[data-pid]")) {
      card.onclick = async () => {
        box.innerHTML = `<p class="loading">開いています…</p>`;
        box.className = "loading";
        try {
          const res = await fetch("/api/cloud/open", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({project_id: card.dataset.pid}),
          });
          const d = await res.json();
          if (!res.ok || d.error) {
            box.innerHTML = `<p class="err">${esc(d.error || "開けませんでした")}</p>`;
            return;
          }
          pickerOpen = false;
          lastBoardJSON = "";
          detailCache.clear();
          opened.clear();
          refresh();
        } catch (e) {
          box.innerHTML = `<p class="err">開けませんでした: ${esc(e)}</p>`;
        }
      };
    }
  } catch (e) {
    box.innerHTML = `<p class="empty">プロジェクトを読めませんでした: ${esc(e)}</p>`;
  }
}

// 盤を見ている状態から、選ぶ画面へ移る。
async function openPicker() {
  pickerOpen = true;
  try {
    viewerState = await (await fetch("/api/state")).json();
  } catch (e) { /* 取れなくても選ぶ画面自体は出す */ }
  renderPicker(viewerState);
}

async function refresh() {
  // 選んでいる最中は触らない。
  if (pickerOpen) return;
  try {
    const r = await fetch("/api/board");
    const b = await r.json();
    if (r.status === 404 || (b.error && !lastBoard)) {
      // まだプロジェクトが決まっていない。選ぶ画面を出す (一度だけ組み立てる)。
      if (!document.getElementById("path")) {
        viewerState = await (await fetch("/api/state")).json();
        pickerOpen = true;
        renderPicker(viewerState);
      }
      return;
    }
    if (b.error) {
      document.getElementById("app").innerHTML =
        `<p class="err">盤を読めませんでした: ${esc(b.error)}</p>`;
      return;
    }
    // 中身が前と同じなら画面に触らない。ここが点滅を止める要。
    //
    // 判定からは「刻々と変わる時刻」を外す。最終活動時刻は数秒ごとに変わるので、
    // これを含めると **中身が何も変わっていなくても毎回作り直す** ことになり、
    // 読んでいる最中に開いた組が閉じたり、表示位置が飛んだりする。
    // 時刻の表示だけは、下の updateTimes が作り直さずに書き換える。
    const json = JSON.stringify(b, (k, v) => k === "last_active" ? undefined : v);
    if (json === lastBoardJSON) return;
    // 内容が変わった対象だけ、詳細の覚えを捨てる (次に開いたとき取り直す)。
    if (lastBoard) {
      const before = {};
      for (const t of lastBoard.targets || []) before[t.id] = JSON.stringify(t);
      for (const t of b.targets || []) {
        if (before[t.id] !== JSON.stringify(t)) detailCache.delete(t.id);
      }
    }
    lastBoardJSON = json;
    render(b);
  } catch (e) {
    // 一時的に取れなくても、前の盤は消さない (読んでいる最中に消えると困る)。
    if (!lastBoard) {
      document.getElementById("app").innerHTML =
        `<p class="err">盤を読めませんでした: ${esc(e)}</p>`;
    }
  }
}

refresh();
setInterval(refresh, 5000);
// 経過時間の表示だけは、盤が変わらなくても進める (作り直しは伴わない)。
setInterval(updateTimes, 10000);
</script>
